    if (info && doctrine.weeklyTemplates[info.phase.id]) {
      const items = doctrine.weeklyTemplates[info.phase.id];
      return items.filter(item => !item.requiresDiscipline || userDiscipline());
    }
  }
  const phase = currentPhase();
  const prog = p ? findProgram(p.programId) : null;
  let items;
  if (prog && prog.weeklyTemplate && prog.weeklyTemplate[phase]) {
    items = prog.weeklyTemplate[phase];
  } else {
    items = DEFAULT_TEMPLATE;
  }
  // Filtre les items qui requièrent une discipline si l'utilisateur n'en a pas
  return items.filter(item => !item.requiresDiscipline || userDiscipline());
}

function buildFreshWeek(now) {
  now = now || new Date();
  const template = currentWeeklyTemplate();
  const w = {
    id: getWeekId(now),
    monday: getMondayOfWeek(now).toISOString().slice(0, 10),
    sessions: template.map(item => ({
      key: item.key,
      slot: item.slot,
      subtype: item.subtype || null,
      label: item.label,
      optional: !!item.optional,
      done: false,
      data: {},
      validations: []
    })),
    bonusCount: 0
  };
  return attachLegacyAccessors(w);
}

// Récupère toutes les sessions d'un slot donné dans une semaine
function sessionsOfSlot(w, slot) {
  if (!w || !w.sessions) return [];
  return w.sessions.filter(s => s.slot === slot);
}

// Première session d'un slot donné dans la semaine
function firstSessionOfSlot(w, slot) {
  return sessionsOfSlot(w, slot)[0] || null;
}

// Trouve une session par sa key
function sessionByKey(w, key) {
  if (!w || !w.sessions) return null;
  return w.sessions.find(s => s.key === key) || null;
}

// Migration : convertit l'ancien format (boxe, cardio, renfo) vers sessions[]
function migrateOldWeek(oldW) {
  if (!oldW) return buildFreshWeek();
  if (oldW.sessions && Array.isArray(oldW.sessions)) return attachLegacyAccessors(oldW); // déjà nouveau format, juste attacher
  const w = {
    id: oldW.id || getWeekId(),
    monday: oldW.monday || getMondayOfWeek(new Date()).toISOString().slice(0, 10),
    sessions: [],
    bonusCount: oldW.bonusCount || 0
  };
  // Convertit chaque ancien champ en session
  if (oldW.cardio) {
    w.sessions.push({
      key: 'cardio', slot: 'cardio', subtype: null, label: 'Cardio',
      done: !!oldW.cardio.done,
      data: oldW.cardio.done ? {
        type: oldW.cardio.type,
        duration: oldW.cardio.duration,
        km: oldW.cardio.km,
        deniv: oldW.cardio.deniv
      } : {}
    });
  } else {
    w.sessions.push({ key: 'cardio', slot: 'cardio', subtype: null, label: 'Cardio', done: false, data: {} });
  }
  if (oldW.renfo) {
    w.sessions.push({
      key: 'renfo', slot: 'renfo', subtype: null, label: 'Renfo',
      done: !!oldW.renfo.done,
      data: oldW.renfo.done ? { variantId: oldW.renfo.variantId } : {}
    });
  } else {
    w.sessions.push({ key: 'renfo', slot: 'renfo', subtype: null, label: 'Renfo', done: false, data: {} });
  }
  if (oldW.boxe) {
    w.sessions.push({
      key: 'discipline', slot: 'discipline', subtype: null, label: 'Discipline',
      done: !!oldW.boxe.done,
      data: oldW.boxe.done ? { note: oldW.boxe.note, score: oldW.boxe.score } : {}
    });
  } else {
    w.sessions.push({ key: 'discipline', slot: 'discipline', subtype: null, label: 'Discipline', done: false, data: {} });
  }
  return attachLegacyAccessors(w);
}

function freshWeek(now) { return buildFreshWeek(now); }

// Attache des accessors legacy sur w.cardio, w.renfo, w.boxe qui redirigent vers sessions[]
// Permet aux callers existants de continuer à faire state.week.cardio.done sans réécriture
function attachLegacyAccessors(w) {
  if (!w || w.__legacyAttached) return w;
  const legacyMap = { cardio: 'cardio', renfo: 'renfo', boxe: 'discipline' };
  Object.entries(legacyMap).forEach(([field, slot]) => {
    Object.defineProperty(w, field, {
      configurable: true,
      enumerable: false, // pas sérialisé, évite duplication dans JSON
      get() {
        const s = firstSessionOfSlot(this, slot);
        if (!s) return { done: false };
        // Proxy qui expose done + data.* comme s'il s'agissait d'un objet plat
        return new Proxy({}, {
          get(_, prop) {
            if (prop === 'done') return s.done;
            return s.data ? s.data[prop] : undefined;
          },
          set(_, prop, val) {
            if (prop === 'done') { s.done = val; return true; }
            if (!s.data) s.data = {};
            s.data[prop] = val;
            return true;
          },
          has(_, prop) { return prop === 'done' || (s.data && prop in s.data); }
        });
      },
      set(v) {
        const s = firstSessionOfSlot(this, slot);
        if (!s) return;
        s.done = !!v.done;
        s.data = {};
        Object.entries(v).forEach(([k, val]) => {
          if (k !== 'done') s.data[k] = val;
        });
      }
    });
  });
  Object.defineProperty(w, '__legacyAttached', { value: true, enumerable: false });
  return w;
}

function archiveIfNewWeek() {
  const nowId = getWeekId();
  if (state.week.id !== nowId) {
    state.weekHistory.push({ ...state.week });
    state.week = buildFreshWeek();
    saveState();
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // Pas de state persisté : construction propre depuis buildFreshWeek maintenant que tout est défini
      state.week = buildFreshWeek();
      return;
    }
    const saved = JSON.parse(raw);

    if (saved.week) {
      state.week = migrateOldWeek(saved.week);
    } else {
      state.week = buildFreshWeek();
    }
    state.weekHistory = (saved.weekHistory || []).map(w => migrateOldWeek(w));
    state.cardioHistory = saved.cardioHistory || [];
    if (saved.settings) state.settings = { ...state.settings, ...saved.settings };

    // Migration validations : chaque session done sans validations reçoit une entrée legacy
    const migrateSessionValidations = (w) => {
      if (!w || !w.sessions) return;
      w.sessions.forEach(s => {
        if (!Array.isArray(s.validations)) s.validations = [];
        if (s.done && s.data && Object.keys(s.data).length && s.validations.length === 0) {
          s.validations.push({ data: s.data, completedAt: 'legacy', score: null });
        }
      });
    };
    migrateSessionValidations(state.week);
    state.weekHistory.forEach(migrateSessionValidations);
    state.freestyleSessions = saved.freestyleSessions || [];
    state.customBonusSessions = saved.customBonusSessions || [];
    // v72 · compétences user persistées globalement
    state.userSkills = saved.userSkills || {};
    // Migration structure customBonus : anciens .exerciseIds → nouveaux .blocks
    state.customBonusSessions.forEach(cbs => {
      if (Array.isArray(cbs.exerciseIds) && !Array.isArray(cbs.blocks)) {
        cbs.blocks = cbs.exerciseIds.map(exId => {
          const ex = EXERCISE_LIBRARY.find(e => e.id === exId);
          // Devine reps/duration selon le format duration de l'exo
          const dur = ex && ex.duration || '';
          const isTimeBased = /\d+\s*s|\d+\s*min/.test(dur); // ex "3×45s", "5 min"
          return {
            exerciseId: exId,
            sets: 3,
            reps: isTimeBased ? null : 12,
            duration: isTimeBased ? 45 : null,
            restAfter: 60
          };
        });
        delete cbs.exerciseIds;
      }
      if (!Array.isArray(cbs.blocks)) cbs.blocks = [];
    });
    if (saved.substitutionCycle) {
      state.substitutionCycle = { ...state.substitutionCycle, ...saved.substitutionCycle };
    }

    // Si le state a un profil qui définit un weeklyTemplate différent, on rebuild la semaine
    // avec le template correct (sinon l'ancien template Cervin peut rester si l'utilisateur a switché programme)
    if (state.week.id !== getWeekId()) {
      // Ce n'est plus la semaine courante — on archive et on rebuild proprement
      state.weekHistory.push(state.week);
      state.week = buildFreshWeek();
    }
  } catch (e) {
    console.warn('loadState error', e);
    state.week = buildFreshWeek();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory,
      freestyleSessions: state.freestyleSessions,
      customBonusSessions: state.customBonusSessions,
      substitutionCycle: state.substitutionCycle,
      settings: state.settings,
      userSkills: state.userSkills || {}
    }));
  } catch (e) {}
  // Also push to Supabase (fire-and-forget)
  if (sb && state.user) {
    pushCurrentWeekToRemote();
  }
}

async function pushCurrentWeekToRemote() {
  if (!sb || !state.user) return;
  try {
    state.syncStatus = 'syncing';
    const { error } = await sb.from('week_state').upsert({
      user_id: state.user.id,
      week_id: state.week.id,
      data: state.week,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,week_id' });
    if (error) throw error;
    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync push failed:', e.message);
    state.syncStatus = 'error';
  }
}

async function pushCardioHistoryEntry(entry) {
  if (!sb || !state.user) return;
  try {
    await sb.from('cardio_history').insert({
      user_id: state.user.id,
      date: entry.date,
      week_id: entry.weekId,
      type: entry.type,
      duration: entry.duration,
      km: entry.km,
      deniv: entry.deniv,
      phase: entry.phase
    });
  } catch (e) { console.warn('Cardio history push failed:', e.message); }
}

async function syncPull() {
  if (!sb || !state.user) return;
  state.syncStatus = 'syncing';
  try {
    // Fetch all week_state rows
    const { data: weeks, error: weeksErr } = await sb.from('week_state')
      .select('week_id, data, updated_at')
      .order('week_id', { ascending: true });
    if (weeksErr) throw weeksErr;

    // Fetch cardio history
    const { data: cardio, error: cardioErr } = await sb.from('cardio_history')
      .select('*')
      .order('date', { ascending: true });
    if (cardioErr) throw cardioErr;

    // Merge weeks: for current week, use most recent; for past weeks, prefer remote
    const currentId = state.week.id;
    const remoteMap = new Map(weeks.map(w => [w.week_id, w]));

    // Update current week if remote is newer or if local is empty
    const remoteCurrent = remoteMap.get(currentId);
    if (remoteCurrent) {
      const merged = { ...state.week, ...remoteCurrent.data, id: currentId };
      state.week = attachLegacyAccessors(migrateOldWeek(merged));
    }

    // Rebuild weekHistory from remote (past weeks only)
    const history = [];
    for (const w of weeks) {
      if (w.week_id !== currentId) {
        history.push({ ...w.data, id: w.week_id });
      }
    }
    // Also keep any local-only history not on remote (edge case)
    for (const localWeek of state.weekHistory) {
      if (localWeek.id !== currentId && !remoteMap.has(localWeek.id)) {
        history.push(localWeek);
        // Push it to remote
        try {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: localWeek.id,
            data: localWeek,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        } catch (e) { console.warn('Backfill push failed:', e.message); }
      }
    }
    state.weekHistory = history.sort((a, b) => a.id.localeCompare(b.id));

    // Cardio history: use remote as source of truth
    state.cardioHistory = (cardio || []).map(c => ({
      date: c.date, weekId: c.week_id, type: c.type,
      duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
    }));

    // Persist merged state locally
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory
    }));

    // If local week has changes not on remote (updated more recently), push it
    if (!remoteCurrent) await pushCurrentWeekToRemote();

    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync pull failed:', e.message);
    state.syncStatus = 'error';
  }
}

function countDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done).length;
}

// Compte uniquement les sessions obligatoires effectuées (pour statut "semaine pleine")
function countRequiredDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done && !s.optional).length;
}

// Compte les sessions optionnelles effectuées (bonus)
function countOptionalDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done && s.optional).length;
}

function countDone() { return countDoneInWeek(state.week); }

// ============================================================
//  REWARDS / BADGES
// ============================================================
// Retourne l'ensemble des semaines (historique + courante), filtrées par startDate
function allValidWeeks() {
  const startDate = state.settings && state.settings.startDate ? new Date(state.settings.startDate) : null;
  const weeks = [...(state.weekHistory || [])];
  if (state.week && state.week.id) weeks.push(state.week);
  if (!startDate) return weeks;
  return weeks.filter(w => {
    if (!w.monday) return true;
    return new Date(w.monday) >= startDate;
  });
}

// Compte les semaines "pleines" (sessions obligatoires toutes faites)
function countFullWeeks() {
  return allValidWeeks().filter(w => {
    const required = (w.sessions || []).filter(s => !s.optional).length;
    const doneRequired = countRequiredDoneInWeek(w);
    return required > 0 && doneRequired >= required;
  }).length;
}

// Compte le total de bonus effectués
function countTotalBonus() {
  return allValidWeeks().reduce((sum, w) => sum + (w.bonusCount || 0), 0);
}

// Paliers pour les semaines pleines (points de constance)
const CONSTANCE_TIERS = [
  { threshold: 1, label: 'Première', icon: '◆', desc: 'Ta première semaine bouclée' },
  { threshold: 3, label: 'Régularité', icon: '◆◆', desc: '3 semaines pleines cumulées' },
  { threshold: 5, label: 'Constance', icon: '◆◆◆', desc: '5 semaines pleines' },
  { threshold: 10, label: 'Discipline', icon: '❖', desc: '10 semaines pleines · le rythme installé' },
  { threshold: 20, label: 'Dévotion', icon: '❖❖', desc: '20 semaines pleines · la moitié du chemin' },
  { threshold: 40, label: 'Maître', icon: '❖❖❖', desc: '40 semaines · prêt pour le Cervin' }
];

// Paliers pour les séances complémentaires
const BONUS_TIERS = [
  { threshold: 1, label: 'Premier complément', icon: '✦', desc: 'Tu es allé chercher un extra' },
  { threshold: 5, label: 'Assidu', icon: '✦✦', desc: '5 compléments effectués' },
  { threshold: 10, label: 'Passionné', icon: '✦✦✦', desc: '10 compléments dans les jambes' },
  { threshold: 25, label: 'Marathonien', icon: '✧', desc: '25 compléments cumulés' },
  { threshold: 50, label: 'Athlète', icon: '✧✧', desc: '50 compléments · niveau engagement rare' },
  { threshold: 100, label: 'Centurion', icon: '✧✧✧', desc: '100 compléments · tu as changé ton corps' }
];

function computeRewards() {
  const fullWeeks = countFullWeeks();
  const totalBonus = countTotalBonus();
  const constanceBadges = CONSTANCE_TIERS.map(t => ({ ...t, unlocked: fullWeeks >= t.threshold }));
  const bonusBadges = BONUS_TIERS.map(t => ({ ...t, unlocked: totalBonus >= t.threshold }));
  return { fullWeeks, totalBonus, constanceBadges, bonusBadges };
}

// Retourne le palier maximum atteint (ou null si aucun)
function currentTier(badges) {
  const unlocked = badges.filter(b => b.unlocked);
  return unlocked.length ? unlocked[unlocked.length - 1] : null;
}

// Retourne le prochain palier à débloquer (ou null si tout est fait)
function nextTier(badges) {
  return badges.find(b => !b.unlocked) || null;
}

function toggleRewards(which) {
  state.expandedRewards = (state.expandedRewards === which) ? null : which;
  render();
}

// ============================================================
//  ONBOARDING
// ============================================================
function startOnboarding(prefill) {
  state.onboarding = { step: 0.3, disciplineId: null, programId: null, duration: null, medicalAck: false, cardioObjective: null, marathonObjective: null, favoriteDisciplineCategories: [], terrain: null, hasObjective: null, profileForm: {}, isEditing: !!prefill };
  if (prefill && state.settings.profile) {
    const p = state.settings.profile;
    state.onboarding.disciplineId = p.disciplineId || null;
    state.onboarding.programId = p.programId || null;
    state.onboarding.duration = p.duration || null;
    state.onboarding.medicalAck = !!p.medicalAcknowledged;
    state.onboarding.cardioObjective = (p.programOptions && (p.programOptions.cardioObjective || p.programOptions.marathonObjective)) || null;
    state.onboarding.marathonObjective = state.onboarding.cardioObjective;
    state.onboarding.terrain = p.terrain || null;
    state.onboarding.hasObjective = p.hasObjective !== false; // legacy = true par défaut
    state.onboarding.profileForm = {
      age: p.age || '', weight: p.weight || '', height: p.height || '',
      sportStatus: p.sportStatus || '', limitations: p.limitations || '',
      discipline: p.discipline || '', disciplineFreq: p.disciplineFreq || ''
    };
    // Reconstruit les catégories cochées depuis les IDs favoris existants
    if (p.favoriteDisciplineIds && p.favoriteDisciplineIds.length > 0) {
      const cats = new Set();
      p.favoriteDisciplineIds.forEach(id => {
        const item = LEXIQUE.find(l => l.id === id);
        if (item) cats.add(item.cat);
      });
      state.onboarding.favoriteDisciplineCategories = Array.from(cats);
    }
    // Si édition d'un profile existant qui a déjà un objectif, on skip la question et attaque direct à discipline
    if (state.onboarding.hasObjective && p.programId) {
      state.onboarding.step = 1;
    }
  }
  state.view = 'onboarding';
  render();
}

// Bouton "Définir un objectif" — relance l'onboarding depuis la question objectif
function askDefineObjective() {
  // Garde le profile perso existant, redémarre depuis 0.7
  const p = state.settings.profile;
  if (!p) return startOnboarding();
  state.onboarding = {
    step: 0.7,
    disciplineId: null, programId: null, duration: null, medicalAck: false,
    cardioObjective: null, marathonObjective: null, favoriteDisciplineCategories: [],
    terrain: p.terrain || null, hasObjective: null, isEditing: true,
    profileForm: {
      age: p.age || '', weight: p.weight || '', height: p.height || '',
      sportStatus: p.sportStatus || '', limitations: p.limitations || '',
      discipline: p.discipline || '', disciplineFreq: p.disciplineFreq || ''
    }
  };
  state.view = 'onboarding';
  render();
}

// v63 · Retire le programme actif et bascule en pratique libre.
// Conserve le profil (âge/poids/level/discipline) et l'historique des séances validées.
function clearProgram() {
  if (!state.settings || !state.settings.profile) return;
  if (!confirm('Retirer ton programme actif ? Tu passeras en pratique libre. Ton historique est conservé et sera récupéré si tu lances un nouveau programme.')) return;
  const p = state.settings.profile;
  // Bascule en mode "pas d'objectif" : on garde le profile mais on nettoie les champs programme
  p.hasObjective = false;
  p.disciplineId = null;
  p.programId = null;
  p.duration = null;
  p.durationUnit = null;
  p.cardioObjective = null;
  p.marathonObjective = null;
  // Efface la date de départ pour ne plus compter d'objectif hebdo
  if (state.settings.startDate) state.settings.startDate = null;
  // La week courante devient une coquille vide (pas de sessions template)
  if (state.week) {
    state.week.sessions = [];
  }
  saveState();
  state.view = 'training';
  state.tab = 'training';
  render();
}

function onbSelectDiscipline(id) {
  state.onboarding.disciplineId = id;
  // Reset downstream si on change de discipline
  if (state.onboarding.programId) {
    const p = findProgram(state.onboarding.programId);
    if (!p || p.disciplineId !== id) {
      state.onboarding.programId = null;
      state.onboarding.duration = null;
    }
  }
  render();
}

function onbSelectProgram(id) {
  state.onboarding.programId = id;
  // Auto-select première durée si non déjà choisie ou incompatible
  const p = findProgram(id);
  if (p && p.durations.length) {
    if (!state.onboarding.duration || !p.durations.includes(state.onboarding.duration)) {
      state.onboarding.duration = p.durations[0];
    }
  }
  render();
}

function onbSelectDuration(d) {
  state.onboarding.duration = d;
  render();
}

function onbToggleMedicalAck() {
  state.onboarding.medicalAck = !state.onboarding.medicalAck;
  render();
}

function onbUpdateProfileField(field, value) {
  state.onboarding.profileForm[field] = value;
}

function onbSelectSportStatus(status) {
  state.onboarding.profileForm.sportStatus = status;
  render();
}

function onbNext() {
  const s = state.onboarding.step;
  const disc = findDiscipline(state.onboarding.disciplineId);
  const isMedical = disc && disc.warning;
  const needsObj = ['course-5km', 'course-10km', 'course-semi', 'course-marathon', 'trail-court', 'ultra-trail'].includes(state.onboarding.programId);

  // Validations bloquantes
  if (s === 0.3) {
    const f = state.onboarding.profileForm;
    if (!f.age || !f.sportStatus) return;
  }
  if (s === 0.7 && state.onboarding.hasObjective === null) return;
  if (s === 1 && !state.onboarding.disciplineId) return;
  if (s === 2 && !state.onboarding.programId) return;
  if (s === 3 && !state.onboarding.duration) return;
  if (s === 3.5 && !state.onboarding.medicalAck) return;
  if (s === 3.7 && !state.onboarding.cardioObjective) return;
  if (s === 4) {
    const f = state.onboarding.profileForm;
    if (!f.age || !f.sportStatus) return;
  }

  // Transitions
  if (s === 0.3) state.onboarding.step = 0.7;
  else if (s === 0.7) {
    if (state.onboarding.hasObjective) state.onboarding.step = 1;
    else onbFinish(); // pas d'objectif → sauvegarde profil perso seul, direct home
    return;
  }
  else if (s === 3) {
    if (isMedical) state.onboarding.step = 3.5;
    else if (needsObj) state.onboarding.step = 3.7;
    else state.onboarding.step = 4;
  }
  else if (s === 3.5) {
    if (needsObj) state.onboarding.step = 3.7;
    else state.onboarding.step = 4;
  }
  else if (s === 3.7) state.onboarding.step = 4;
  else if (s === 4) state.onboarding.step = 4.5;
  else if (s === 4.5) state.onboarding.step = 4.7;
  else if (s === 4.7) state.onboarding.step = 4.8;
  else if (s === 4.8) state.onboarding.step = 4.9;
  else if (s === 4.9) {
    // v76 · Validation identité obligatoire
    const f = state.onboarding.profileForm || {};
    if (!f.firstName || !f.firstName.trim()) return;
    if (!f.email || !isValidEmail(f.email)) return;
    state.onboarding.step = 5;
  }
  else state.onboarding.step = s + 1;
  window.scrollTo({ top: 0 });
  render();
}

function onbBack() {
  const s = state.onboarding.step;
  const disc = findDiscipline(state.onboarding.disciplineId);
  const isMedical = disc && disc.warning;
  const needsObj = ['course-5km', 'course-10km', 'course-semi', 'course-marathon', 'trail-court', 'ultra-trail'].includes(state.onboarding.programId);

  if (s === 0.3) return; // début du flow, pas de retour
  if (s === 0.7) state.onboarding.step = 0.3;
  else if (s === 1) state.onboarding.step = 0.7;
  else if (s === 4) {
    if (needsObj) state.onboarding.step = 3.7;
    else if (isMedical) state.onboarding.step = 3.5;
    else state.onboarding.step = 3;
  }
  else if (s === 3.7) {
    if (isMedical) state.onboarding.step = 3.5;
    else state.onboarding.step = 3;
  }
  else if (s === 3.5) state.onboarding.step = 3;
  else if (s === 4.5) state.onboarding.step = 4;
  else if (s === 4.7) state.onboarding.step = 4.5;
  else if (s === 4.8) state.onboarding.step = 4.7;
  else if (s === 4.9) state.onboarding.step = 4.8;
  else if (s === 5) state.onboarding.step = 4.9;
  else state.onboarding.step = s - 1;
  window.scrollTo({ top: 0 });
  render();
}

function onbToggleDisciplineCategory(cat) {
  if (!state.onboarding.favoriteDisciplineCategories) state.onboarding.favoriteDisciplineCategories = [];
  const idx = state.onboarding.favoriteDisciplineCategories.indexOf(cat);

async function onbFinish() {
  try {
    return await onbFinishInternal();
  } catch (e) {
    console.error('onbFinish error:', e);
    // Force affichage via safety net
    window.__bootErrors = window.__bootErrors || [];
    window.__bootErrors.push({
      type: 'onbFinish',
      message: (e && e.message) ? e.message : String(e),
      stack: e && e.stack ? e.stack : ''
    });
    if (typeof showBootError === 'function') showBootError();
    else alert('Erreur onbFinish : ' + ((e && e.message) ? e.message : String(e)));
  }
}

async function onbFinishInternal() {
  const o = state.onboarding;
  const hasObj = o.hasObjective !== false;

  // Mode SANS objectif : sauvegarde uniquement les données personnelles
  if (!hasObj) {
    const prevProfile = state.settings.profile;
    const profile = {
      disciplineId: null,
      programId: null,
      duration: null,
      durationUnit: null,
      hasObjective: false,
      firstName: (o.profileForm.firstName || '').trim() || null,
      email: (o.profileForm.email || '').trim() || null,
      sportReference: o.profileForm.sportReference || 'course',
      ftp: parseInt(o.profileForm.ftp) || null,
      age: parseInt(o.profileForm.age) || null,
      weight: parseFloat(o.profileForm.weight) || null,
      height: parseFloat(o.profileForm.height) || null,
      sportStatus: o.profileForm.sportStatus || 'occasionnel',
      limitations: o.profileForm.limitations || '',
      terrain: o.terrain || (prevProfile && prevProfile.terrain) || 'vallonne',
      favoriteDisciplineIds: (prevProfile && prevProfile.favoriteDisciplineIds) || [],
      medicalAcknowledged: false,
      programOptions: {},
      createdAt: (prevProfile && prevProfile.createdAt) || new Date().toISOString().slice(0, 10),
      programImplemented: false
    };
    state.settings.profile = profile;
    // Semaine vide sans template
    state.week = buildFreshWeek();
    saveState();
    // Sync Supabase
    if (sb && state.user) {
      try {
        await sb.auth.updateUser({ data: {
          startDate: state.settings.startDate,
          manualPhase: state.settings.manualPhase,
          profile
        }});
      } catch (e) { console.warn('Failed to sync profile no-obj:', e.message); }
    }
    state.onboarding = null;
    state.view = 'training';
    state.tab = 'training';
    render();
    return;
  }

  // Mode AVEC objectif (flow classique)
  const disc = findDiscipline(o.disciplineId);
  const prog = findProgram(o.programId);
  if (!disc || !prog) return;

  const prevProfile = state.settings.profile;
  const profile = {
    disciplineId: o.disciplineId,
    programId: o.programId,
    duration: o.duration,
    durationUnit: prog.durationUnit,
    hasObjective: true,
    firstName: (state.onboarding.profileForm.firstName || '').trim() || null,
    email: (state.onboarding.profileForm.email || '').trim() || null,
    sportReference: state.onboarding.profileForm.sportReference || 'course',
    ftp: parseInt(state.onboarding.profileForm.ftp) || null,
    age: parseInt(state.onboarding.profileForm.age) || null,
    weight: parseFloat(state.onboarding.profileForm.weight) || null,
    height: parseFloat(state.onboarding.profileForm.height) || null,
    sportStatus: state.onboarding.profileForm.sportStatus || null,
    limitations: state.onboarding.profileForm.limitations || '',
    discipline: (state.onboarding.profileForm.discipline || '').trim(),
    disciplineFreq: state.onboarding.profileForm.disciplineFreq || 'jamais',
    medicalAcknowledged: disc.warning ? o.medicalAck : false,
    programOptions: o.cardioObjective ? { cardioObjective: o.cardioObjective, marathonObjective: o.cardioObjective } : {},
    terrain: o.terrain || (prevProfile && prevProfile.terrain) || 'vallonne',
    // Convertit les catégories cochées en IDs individuels
    favoriteDisciplineIds: (o.favoriteDisciplineCategories && o.favoriteDisciplineCategories.length > 0)
      ? LEXIQUE.filter(l => o.favoriteDisciplineCategories.includes(l.cat)).map(l => l.id)
      : ((state.settings.profile && state.settings.profile.favoriteDisciplineIds) || []),
    createdAt: (prevProfile && prevProfile.createdAt) || new Date().toISOString().slice(0, 10),
    programImplemented: !!prog.implemented
  };

  state.settings.profile = profile;

  // Rebuild la semaine si le programme a changé — sinon les sessions restent celles de l'ancien programme
  const programChanged = !prevProfile
    || prevProfile.programId !== profile.programId
    || prevProfile.disciplineId !== profile.disciplineId
    || prevProfile.duration !== profile.duration;
  if (programChanged) {
    state.week = buildFreshWeek();
  }

  saveState();

  if (sb && state.user) {
    try {
      await sb.auth.updateUser({ data: {
        startDate: state.settings.startDate,
        manualPhase: state.settings.manualPhase,
        profile
      } });
    } catch (e) { console.warn('Failed to sync profile:', e.message); }
  }

  state.view = 'training';
  state.tab = 'training';
  render();
}

function renderOnboarding() {
  const s = state.onboarding.step;
  // v76 · Fondu progressif de l'image splash par étape
  const opacity = getOnbFadeOpacity(s);
  const lightTextClass = opacity < 0.4 ? 'v76-light-text' : '';
  let inner;
  if (s === 0.3) inner = renderOnbProfileFirst();
  else if (s === 0.7) inner = renderOnbObjectiveQuestion();
  else if (s === 1) inner = renderOnbStep1();
  else if (s === 2) inner = renderOnbStep2();
  else if (s === 3) inner = renderOnbStep3();
  else if (s === 3.5) inner = renderOnbMedical();
  else if (s === 3.7) inner = renderOnbMarathon();
  else if (s === 4) inner = renderOnbStep4();
  else if (s === 4.5) inner = renderOnbFavorites();
  else if (s === 4.7) inner = renderOnbTerrain();
  else if (s === 4.8) inner = renderOnbSport();
  else if (s === 4.9) inner = renderOnbIdentity();
  else if (s === 5) inner = renderOnbRecap();
  else inner = renderOnbStep1();
  // Applique la classe de couleur texte au wrapper .onb-view interne
  if (lightTextClass) inner = inner.replace('class="onb-view"', `class="onb-view ${lightTextClass}"`);
  return `
    <div class="v76-onb-bg"></div>
    <div class="v76-onb-overlay" style="opacity: ${opacity};"></div>
    ${inner}
  `;
}

// v76 · Opacité du voile blanc par étape (0 = image visible plein, 1 = fond neutre)
function getOnbFadeOpacity(step) {
  // Table de fondu progressif : ambiance immersive → fond neutre au moment du récap
  if (step === 0.3) return 0.25;
  if (step === 0.7) return 0.30;
  if (step === 1)   return 0.55;
  if (step === 2)   return 0.70;
  if (step === 3)   return 0.80;
  if (step === 3.5) return 0.82;
  if (step === 3.7) return 0.82;
  if (step === 4)   return 0.82;
  if (step === 4.5) return 0.85;
  if (step === 4.7) return 0.88;
  if (step === 4.8) return 0.90;
  if (step === 4.9) return 0.92;
  if (step === 5)   return 0.97;
  return 0.85;
}

// v76 · Validation email basique (contient @ + point + longueur mini)
function isValidEmail(e) {
  if (!e || typeof e !== 'string') return false;
  const trimmed = e.trim();
  if (trimmed.length < 5) return false;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed);
}

];

function findTerrain(id) {
  return TERRAINS.find(t => t.id === id) || null;
}

  const p = state.settings && state.settings.profile;
  return (p && p.terrain) || 'vallonne';

// Change le terrain de l'utilisateur (depuis le cockpit) — recalcule les objectifs D+ des séances non-faites
function setUserTerrain(id) {
  if (!state.settings.profile) return;
  state.settings.profile.terrain = id;
  saveState();
  // Sync Supabase
  if (sb && state.user) {
    sb.auth.updateUser({ data: {
      startDate: state.settings.startDate,
      manualPhase: state.settings.manualPhase,
      profile: state.settings.profile
    }}).catch(e => console.warn('Failed to sync terrain:', e.message));
  }
  render();
}

// Applique le multiplicateur terrain à une cible D+ canonique
// Retourne la cible ajustée selon le terrain de l'utilisateur
function resolveDenivelForTerrain(canonicalDeniv) {
  if (!canonicalDeniv) return canonicalDeniv;
  const terrain = findTerrain(getUserTerrain());
  if (!terrain) return canonicalDeniv;
  return Math.round(canonicalDeniv * terrain.denivMultiplier);
}

  const cancelBtn = state.onboarding.isEditing ? `

// ============================================================
//  AUDIO + WAKE
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) state.audioCtx = new AC(); } catch (e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}
function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) {}
}
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
// Signal au démarrage d'un chrono : deux notes montantes (attaque)
function signalStart() { beep(660, 0.12); setTimeout(() => beep(880, 0.15), 130); vibrate([100, 40, 140]); }
// Signal 10 sec avant la fin : double bip aigu (warning)
function signalWarning() { beep(920, 0.10); setTimeout(() => beep(920, 0.10), 180); vibrate([80, 40, 80]); }
// Signal petit bip pour countdown 3/2/1
function signalCountdown() { beep(440, 0.08); vibrate(60); }
// Signal à la fin d'un chrono : deux notes descendantes (expiration)
function signalEnd() { beep(500, 0.25); setTimeout(() => beep(360, 0.35), 250); vibrate([180, 80, 240]); }
// Signal fin de séance complète : mélodie triomphale
function signalComplete() { beep(660, 0.15); setTimeout(() => beep(880, 0.15), 180); setTimeout(() => beep(1100, 0.3), 360); vibrate([200, 80, 200, 80, 400]); }
// Legacy alias
function signalTransition() { signalStart(); }
async function requestWakeLock() { if ('wakeLock' in navigator) { try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } }
function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release().catch(()=>{}); state.wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.timer.running) requestWakeLock(); });

// Construit une session au format player à partir d'une customBonus (blocks structure)
function buildCustomBonusSessionDef(cbs) {
  if (!cbs) return null;
  const blocks = cbs.blocks || [];
  const totalSec = estimateCustomBonusDuration(cbs);
  const totalMin = Math.max(1, Math.round(totalSec / 60));

  const steps = [];
  // Échauffement court
  steps.push({ type: 'time', name: 'Mobilité + activation', duration: 90, label: 'échauffement', cues: ['Rotations articulaires', 'Prépare le corps'] });

  blocks.forEach((b, bIdx) => {
    const ex = EXERCISE_LIBRARY.find(e => e.id === b.exerciseId);
    if (!ex) return;
    // Utilise illuKey si dispo (permet à renderIllustration + getExerciseDesc de matcher le catalogue EXERCISES)
    const stepName = ex.illuKey || ex.name;
    const sets = b.sets || 1;
    for (let i = 1; i <= sets; i++) {
      const label = sets > 1 ? `${ex.name.toLowerCase()} · série ${i}/${sets}` : ex.name.toLowerCase();
      if (b.duration != null) {
        steps.push({
          type: 'time',
          name: stepName,
          duration: b.duration,
          label,
          cues: [ex.description.split('.')[0]]
        });
      } else {
        steps.push({
          type: 'reps',
          name: stepName,
          reps: `${b.reps} reps`,
          label,
          cues: [ex.description.split('.')[0]]
        });
      }
      // Repos entre séries (sauf après la dernière du bloc)
      if (i < sets) {
        steps.push({ type: 'rest', duration: 15 });
      }
    }
    // Repos entre blocs (sauf après le dernier)
    if (bIdx < blocks.length - 1 && b.restAfter > 0) {
      steps.push({ type: 'rest', duration: b.restAfter });
    }
  });

  // Plan sommaire pour le renderPreview
  const plan = [{
    head: `Corps · ${totalMin} min`,
    items: blocks.map(b => {
      const ex = EXERCISE_LIBRARY.find(e => e.id === b.exerciseId);
      const t = b.duration != null ? `${b.sets || 1} × ${b.duration}s` : `${b.sets || 1} × ${b.reps} reps`;
      return { n: ex ? ex.name : '?', t };
    })
  }];

  return {
    id: 'custom-' + cbs.id,
    focus: 'Séance complémentaire sur mesure',
    focusClass: 'bonus',
    title: cbs.name,
    duration: `${totalMin} min`,
    durationMin: totalMin,
    intro: `${blocks.length} blocs personnalisés. Suit le chrono comme n'importe quelle séance complémentaire.`,
    plan,
    steps
  };
}

function getCurrentSession() {
  let s = null;
  if (state.sessionKind === 'stretching') s = STRETCHING;
  else if (state.sessionKind === 'bonus') {
    // Séance bonus custom
    if (typeof state.sessionId === 'string' && state.sessionId.startsWith('custom-')) {

    }
    // Séance renfo générique (mode sans objectif)
    else if (typeof state.sessionId === 'string' && state.sessionId.startsWith('renfo-generic-')) {

    }

  else if (state.sessionKind === 'renfo') {

    const RENFO_MAP = {
      'renfo-marathon': RENFO_MARATHON,
      'renfo-marathon-leger': RENFO_MARATHON_LEGER,
      'renfo-fondation': RENFO_FONDATION,
      'renfo-hypertrophie': RENFO_HYPERTROPHIE,
      'renfo-force-max': RENFO_FORCE_MAX,
      'renfo-mobilite-posture': RENFO_MOBILITE_POSTURE,
      'renfo-medical-leger': RENFO_MEDICAL_LEGER,
      'renfo-wellness': RENFO_WELLNESS,
      'renfo-post-covid': RENFO_POST_COVID,
      'renfo-apres-cancer': RENFO_APRES_CANCER,
      'renfo-cardio-readapt': RENFO_CARDIO_READAPT,
      'renfo-ortho': RENFO_ORTHO,
      'renfo-chronic': RENFO_CHRONIC,
      'renfo-reprise': RENFO_REPRISE,
      'renfo-perte-poids': RENFO_PERTE_POIDS,
      'renfo-maintenance': RENFO_MAINTENANCE,
      'renfo-combat-competition': RENFO_COMBAT_COMPETITION,
      'renfo-combat-controle': RENFO_COMBAT_CONTROLE,
      'renfo-tennis-padel': RENFO_TENNIS_PADEL,
      'renfo-surf': RENFO_SURF,
      'renfo-escalade': RENFO_ESCALADE,
      'renfo-yoga': RENFO_YOGA,
      'renfo-pilates': RENFO_PILATES,
      'renfo-calisthenie': RENFO_CALISTHENIE
    };
    if (RENFO_MAP[state.sessionId]) s = RENFO_MAP[state.sessionId];
    else s = RENFO_ROTATION.find(r => r.id === state.sessionId);
  }
  if (!s) return null;
  // Modulation profil pour renfo et bonus
  if (state.sessionKind === 'renfo' || state.sessionKind === 'bonus') {
    const modSteps = moduleSessionSteps(s.steps);
    const modPlan = (s.plan || []).map(section => ({
      ...section,
      items: (section.items || []).map(it => ({ ...it, t: moduleSetsLabel(it.t) }))
    }));
    return { ...s, steps: modSteps, plan: modPlan };
  }

}
function activeSteps() { const s = getCurrentSession(); return s ? s.steps : []; }
function currentStep() { return activeSteps()[state.timer.stepIdx]; }

function startTimer() {
  ensureAudio(); requestWakeLock();
  state.timer.running = true; state.timer.paused = false;
  state.timer.stepIdx = 0; state.timer.stepElapsed = 0; state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  // Signal de départ si la première étape a un chrono
  const firstStep = currentStep();
  if (firstStep && (firstStep.type === 'time' || firstStep.type === 'rest')) {
    setTimeout(() => signalStart(), 200);
  }
  render();
}
function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    // Warning à 10 sec restantes (une seule fois, pas continu)
    if (remaining === 10) signalWarning();
    // Countdown 3, 2, 1
    if (remaining <= 3 && remaining > 0) signalCountdown();
    // Fin de chrono → son distinct puis on avance
    if (state.timer.stepElapsed >= step.duration) {
      signalEnd();
      advance();
      return;
    }
  }
  updateTimerUI();
}
function togglePause() { state.timer.paused = !state.timer.paused; render(); }
function advance() {
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  // Signal de démarrage uniquement si le nouveau step a un chrono qui tourne
  const newStep = currentStep();
  if (newStep && (newStep.type === 'time' || newStep.type === 'rest')) {
    signalStart();
  }
  render();
}
function skipStep() {
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false;
  releaseWakeLock(); signalComplete();
  if (state.sessionKind === 'cardio') { state.view = 'cardio-stats'; render(); return; }
  if (state.sessionKind === 'renfo') {
    // Push validation dans la session renfo du template
    const renfoSession = state.week.sessions ? state.week.sessions.find(s => s.slot === 'renfo') : null;
    if (renfoSession) {
      pushSessionValidation(renfoSession, { variantId: state.sessionId });
    } else {
      state.week.renfo.done = true;
      state.week.renfo.variantId = state.sessionId;
    }
    saveState();
  }
  if (state.sessionKind === 'bonus') {
    state.week.bonusCount = (state.week.bonusCount || 0) + 1;
    saveState();
  }
  state.view = 'complete';
  render();
}
function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false; state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home'; render();
}

// ============================================================
// v66 · GPS TRACKING + MAP LEAFLET + COLORATION VITESSE
// ============================================================

// Module GPSTracker : encapsule watchPosition et gère l'état de tracking
// Interface abstraite pour permettre swap vers Capacitor plus tard.
const GPSTracker = {
  watchId: null,
  points: [],           // [{lat, lng, alt, ts, accuracy, speed}]
  startTs: null,
  pausedMs: 0,
  isPaused: false,
  pauseStartTs: null,
  isWeakSignal: false,
  weakSince: null,
  onPointCallback: null,
  onWeakCallback: null,
  onErrorCallback: null,

  start(opts) {
    if (!navigator.geolocation) {
      if (opts && opts.onError) opts.onError({ code: 'NO_GPS', message: 'GPS non disponible sur ce device' });
      return false;
    }
    this.points = [];
    this.gaps = [];
    this.startTs = Date.now();
    this.pausedMs = 0;
    this.isPaused = false;
    this.pauseStartTs = null;
    this.pauseReason = null;         // v68 · 'manual' | 'auto' | null
    this.isWeakSignal = false;
    this.weakSince = null;
    // v68 · Config auto-pause
    this.autoPauseEnabled = !!(opts && opts.autoPause);
    this.slowSince = null;
    this._speedBuf = [];
    this.SLOW_THRESHOLD_KMH   = 0.5;   // en dessous → candidat auto-pause
    this.SLOW_DURATION_MS     = 5000;  // durée en dessous du seuil avant déclenchement
    this.RESUME_THRESHOLD_KMH = 1.8;   // au-dessus → auto-resume (hysteresis)
    this.onPointCallback = opts && opts.onPoint;
    this.onWeakCallback  = opts && opts.onWeak;
    this.onErrorCallback = opts && opts.onError;
    this.onAutoPauseCallback = opts && opts.onAutoPause;

    this.watchId = navigator.geolocation.watchPosition(
      (pos) => this._handlePosition(pos),
      (err) => { if (this.onErrorCallback) this.onErrorCallback(err); },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 30000 }
    );
    return true;
  },

  _handlePosition(pos) {
    const acc = pos.coords.accuracy || 999;
    // Détection GPS faible : accuracy > 50m persistante 15s (actif même en pause pour ne pas manquer la reprise du signal)
    if (acc > 50) {
      if (!this.weakSince) this.weakSince = Date.now();
      if (!this.isWeakSignal && (Date.now() - this.weakSince) > 15000) {
        this.isWeakSignal = true;
        if (this.onWeakCallback) this.onWeakCallback(true);
      }
    } else {
      this.weakSince = null;
      if (this.isWeakSignal) {
        this.isWeakSignal = false;
        if (this.onWeakCallback) this.onWeakCallback(false);
      }
    }
    const point = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      alt: pos.coords.altitude,
      ts: Date.now(),
      accuracy: acc,
      speed: pos.coords.speed
    };
    // v68 · Auto-pause / auto-resume (uniquement si feature activée)
    if (this.autoPauseEnabled) {
      const recentKmh = this._estimateRecentSpeedKmh(point);
      if (this.isPaused && this.pauseReason === 'auto') {
        // On est en auto-pause, on watch pour reprise
        if (recentKmh !== null && recentKmh > this.RESUME_THRESHOLD_KMH) {
          this.pauseReason = null;
          this._speedBuf = [];
          this.slowSince = null;
          this._doResume();
          if (this.onAutoPauseCallback) this.onAutoPauseCallback(false);
        }
      } else if (!this.isPaused) {
        // On tourne, on watch pour auto-pause
        if (recentKmh !== null && recentKmh < this.SLOW_THRESHOLD_KMH) {
          if (!this.slowSince) this.slowSince = Date.now();
          if (Date.now() - this.slowSince > this.SLOW_DURATION_MS) {
            this.pauseReason = 'auto';
            this._doPause();
            if (this.onAutoPauseCallback) this.onAutoPauseCallback(true);
          }
        } else {
          this.slowSince = null;
        }
      }
    }
    // Si pause (auto ou manuelle), le point courant sert la détection auto-resume mais n'est PAS ajouté à la trace
    if (this.isPaused) return;
    // v67 · Détection d'un trou de signal
    if (this.points.length > 0) {
      const last = this.points[this.points.length - 1];
      const gapMs = point.ts - last.ts;
      const apparentKm = haversineKm(last, point);
      const apparentKmh = gapMs > 0 ? (apparentKm / (gapMs / 3600000)) : 0;
      const isGap = (gapMs > 5000 && apparentKm > 0.03)
                 || (apparentKm > 0.1 && gapMs < 3000)
                 || (apparentKmh > 200);
      if (isGap) {
        point.newSegment = true;
        this.gaps = this.gaps || [];
        this.gaps.push({ fromTs: last.ts, toTs: point.ts, gapMs, apparentKm });
      }
    }
    this.points.push(point);
    if (this.onPointCallback) this.onPointCallback(point);
  },

  // v68 · Estime la vitesse récente en km/h via moyenne glissante sur 5 points
  // Basé sur le point courant vs le dernier point trace ou vs le dernier point observé
  _estimateRecentSpeedKmh(newPoint) {
    // On garde une trace du "dernier point vu" même en pause pour ne pas rater la reprise
    if (!this._lastSeenPoint) {
      this._lastSeenPoint = newPoint;
      return null;
    }
    const gapMs = newPoint.ts - this._lastSeenPoint.ts;
    if (gapMs <= 0) return null;
    const km = haversineKm(this._lastSeenPoint, newPoint);
    const kmh = km / (gapMs / 3600000);
    this._lastSeenPoint = newPoint;
    // Filtre les jumps aberrants (> 200 km/h = probable jump GPS, on ne les compte pas dans le buffer)
    if (kmh > 200) return null;
    this._speedBuf.push(kmh);
    if (this._speedBuf.length > 5) this._speedBuf.shift();
    if (this._speedBuf.length < 2) return null;
    return this._speedBuf.reduce((s, v) => s + v, 0) / this._speedBuf.length;
  },

  pause(reason) {
    // Pause explicite manuelle (bouton user) — écrase toute pause auto pour ne pas auto-resume ensuite
    this.pauseReason = reason || 'manual';
    this._doPause();
  },

  resume() {
    // Resume explicite manuel (bouton user) — clear la raison, reset le buffer
    this.pauseReason = null;
    this.slowSince = null;
    this._speedBuf = [];
    this._doResume();
  },

  _doPause() {
    if (this.isPaused) return;
    this.isPaused = true;
    this.pauseStartTs = Date.now();
  },

  _doResume() {
    if (!this.isPaused) return;
    if (this.pauseStartTs) this.pausedMs += Date.now() - this.pauseStartTs;
    this.pauseStartTs = null;
    this.isPaused = false;
  },

  stop() {
    if (this.watchId !== null) {
      navigator.geolocation.clearWatch(this.watchId);
      this.watchId = null;
    }
    // Si on stoppe en pause, ajoute la pause en cours au total
    if (this.isPaused && this.pauseStartTs) {
      this.pausedMs += Date.now() - this.pauseStartTs;
      this.pauseStartTs = null;
      this.isPaused = false;
    }
  },

  getElapsedMs() {
    if (!this.startTs) return 0;
    let elapsed = Date.now() - this.startTs - this.pausedMs;
    if (this.isPaused && this.pauseStartTs) elapsed -= (Date.now() - this.pauseStartTs);
    return Math.max(0, elapsed);
  },

  getTrack() { return this.points.slice(); }
};

// Formule Haversine · distance en km entre 2 points GPS
function haversineKm(p1, p2) {
  const R = 6371;
  const dLat = (p2.lat - p1.lat) * Math.PI / 180;
  const dLng = (p2.lng - p1.lng) * Math.PI / 180;
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
            Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// v67 · Split une trace en segments continus (chaque gap crée un nouveau segment)
function splitTrackIntoSegments(points) {
  if (!points || points.length === 0) return [];
  const segments = [];
  let current = [];
  for (const p of points) {
    if (p.newSegment && current.length > 0) {
      segments.push(current);
      current = [];
    }
    current.push(p);
  }
  if (current.length > 0) segments.push(current);
  return segments;
}

// Distance totale d'une trace en km (skip les gaps entre segments)
function computeTrackDistance(points) {
  if (!points || points.length < 2) return 0;
  let d = 0;
  for (let i = 1; i < points.length; i++) {
    if (points[i].newSegment) continue; // saut de gap, on ne compte pas la distance apparente
    d += haversineKm(points[i-1], points[i]);
  }
  return d;
}

// v67 · Durée active = somme des durées de segments continus (exclut les gaps)
function computeActiveDurationMs(points) {
  if (!points || points.length < 2) return 0;
  const segments = splitTrackIntoSegments(points);
  let total = 0;
  for (const seg of segments) {
    if (seg.length < 2) continue;
    total += seg[seg.length - 1].ts - seg[0].ts;
  }
  return total;
}

// v67 · D+ cumulé avec filtre médian + passe-bas exponentiel, calculé segment par segment
// pour ne pas compter les variations d'altitude à travers un gap de signal.
function computeDenivelPositif(points, opts) {
  opts = opts || {};
  const window = opts.window || 7;
  const alpha  = opts.alpha  || 0.20;   // filtre passe-bas exponentiel
  const threshold = opts.threshold || 0.15; // seuil variation min (m) après lissage
  const maxAccuracy = opts.maxAccuracy || 30; // ignore points d'altitude imprécis
  if (!points || points.length < 3) return 0;
  const segments = splitTrackIntoSegments(points);
  let totalDPlus = 0;
  for (const seg of segments) {
    totalDPlus += _computeSegmentDPlus(seg, window, alpha, threshold, maxAccuracy);
  }
  return Math.round(totalDPlus);
}

function _computeSegmentDPlus(seg, window, alpha, threshold, maxAccuracy) {
  // Filtre les points invalides (altitude nulle, imprécise)
  const valid = seg.filter(p => p.alt != null && !isNaN(p.alt) && (!p.accuracy || p.accuracy <= maxAccuracy));
  if (valid.length < 5) return 0;
  const alts = valid.map(p => p.alt);
  // 1. Filtre médian sur fenêtre glissante pour retirer les spikes GPS
  const half = Math.floor(window / 2);
  const median = alts.map((_, i) => {
    const lo = Math.max(0, i - half);
    const hi = Math.min(alts.length, i + half + 1);
    const slice = alts.slice(lo, hi).slice().sort((a, b) => a - b);
    return slice[Math.floor(slice.length / 2)];
  });
  // 2. Filtre passe-bas exponentiel (lissage temporel)
  const smoothed = [median[0]];
  for (let i = 1; i < median.length; i++) {
    smoothed.push(alpha * median[i] + (1 - alpha) * smoothed[i - 1]);
  }
  // 3. Cumul D+ avec seuil pour ignorer le bruit résiduel
  let dPlus = 0;
  for (let i = 1; i < smoothed.length; i++) {
    const delta = smoothed[i] - smoothed[i - 1];
    if (delta > threshold) dPlus += delta;
  }
  return dPlus;
}

// Vitesses instantanées (m/s puis conversion selon usage). Les points post-gap ont vitesse 0.
function computeSpeeds(points) {
  if (!points || points.length < 2) return [];
  const speeds = [0];
  for (let i = 1; i < points.length; i++) {
    if (points[i].newSegment) {
      speeds.push(0);
      continue;
    }
    const dKm = haversineKm(points[i-1], points[i]);
    const dMs = (points[i].ts - points[i-1].ts) / 1000;
    speeds.push(dMs > 0 ? (dKm * 1000 / dMs) : 0);
  }
  return speeds;
}

// Vitesse max (km/h)
function computeMaxSpeed(points) {
  const speeds = computeSpeeds(points);
  if (!speeds.length) return 0;
  return Math.round(Math.max(...speeds) * 3.6 * 10) / 10;
}

// Allure moyenne (min/km) sur toute la trace
function computeAveragePace(distanceKm, durationMs) {
  if (!distanceKm || distanceKm < 0.05) return null;
  const paceMinPerKm = (durationMs / 1000 / 60) / distanceKm;
  return paceMinPerKm;
}

// Format allure "5:52"
function formatPace(paceMinPerKm) {
  if (!paceMinPerKm || !isFinite(paceMinPerKm)) return '–:–';
  const m = Math.floor(paceMinPerKm);
  const s = Math.round((paceMinPerKm - m) * 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// Format vitesse (km/h)
function formatSpeedKmh(speedMs) {
  if (!speedMs) return '0';
  return (speedMs * 3.6).toFixed(1);
}

// Format temps mm:ss ou h:mm:ss
function formatDurationHMS(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

// Interpolation HSL vert (120°) → rouge (0°) pour t ∈ [0,1]
function speedToHslColor(t) {
  const H = 120 - (120 * t);
  const S = 78 + (t * 12);
  return `hsl(${H.toFixed(1)}, ${S.toFixed(0)}%, 48%)`;
}

// Lissage moving average sur les vitesses (pour coloration smooth)
function smoothSpeeds(speeds, window = 5) {
  return speeds.map((_, i) => {
    const lo = Math.max(0, i - window);
    const hi = Math.min(speeds.length, i + window + 1);
    let sum = 0;
    for (let j = lo; j < hi; j++) sum += speeds[j];
    return sum / (hi - lo);
  });
}

// ============ LEAFLET MAP ============
// Refs des maps en cours (pour cleanup)
const _mapRefs = {};
const _mapPolylines = {};
const _mapMarkers = {};

// Initialise une map Leaflet dans un container id
// mode = 'live' | 'replay' | 'mini'
function initMap(containerId, opts) {
  const el = document.getElementById(containerId);
  if (!el || typeof L === 'undefined') return null;
  // Cleanup si déjà instancié
  if (_mapRefs[containerId]) {
    try { _mapRefs[containerId].remove(); } catch (e) {}
    delete _mapRefs[containerId];
    delete _mapPolylines[containerId];
    delete _mapMarkers[containerId];
  }
  const center = (opts && opts.center) || [48.8566, 2.3522]; // Paris fallback
  const zoom = (opts && opts.zoom) || 15;
  const map = L.map(el, {
    zoomControl: (opts && opts.controls) || false,
    attributionControl: true,
    dragging: (opts && opts.interactive !== false),
    scrollWheelZoom: (opts && opts.interactive !== false),
    doubleClickZoom: (opts && opts.interactive !== false),
    touchZoom: (opts && opts.interactive !== false),
    boxZoom: false,
    keyboard: false,
    tap: (opts && opts.interactive !== false)
  }).setView(center, zoom);
  // CartoDB Voyager tiles (gratuit, sans API key, style neutre proche de Nike/Strava)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);
  _mapRefs[containerId] = map;
  return map;
}

// Trace live monochrome jaune, avec marker mobile. v67 · une polyline par segment continu.
function drawLiveTrack(containerId, points) {
  const map = _mapRefs[containerId];
  if (!map || !points || points.length === 0) return;
  const segments = splitTrackIntoSegments(points);
  // Cleanup ancien layerGroup
  if (_mapPolylines[containerId]) {
    try { map.removeLayer(_mapPolylines[containerId]); } catch (e) {}
  }
  const group = L.layerGroup();
  for (const seg of segments) {
    if (seg.length < 2) continue;
    L.polyline(seg.map(p => [p.lat, p.lng]), {
      color: '#F5C518', weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round'
    }).addTo(group);
  }
  group.addTo(map);
  _mapPolylines[containerId] = group;
  // Marker position actuelle
  const last = points[points.length - 1];
  const lastLatLng = [last.lat, last.lng];
  if (!_mapMarkers[containerId]) {
    const icon = L.divIcon({
      className: 'v66-live-marker',
      html: '<div style="width:16px;height:16px;background:#0A0806;border:3px solid #FFFFFF;border-radius:50%;box-shadow:0 0 0 8px rgba(245,197,24,0.35);"></div>',
      iconSize: [16, 16], iconAnchor: [8, 8]
    });
    _mapMarkers[containerId] = L.marker(lastLatLng, { icon }).addTo(map);
  } else {
    _mapMarkers[containerId].setLatLng(lastLatLng);
  }
  // Recentre la map sur la position courante (mode suivi)
  map.setView(lastLatLng, map.getZoom(), { animate: true });
}

// Trace replay colorée par vitesse (segments avec interpolation HSL). v67 · skip les paires cross-gap.
function drawColoredTrack(containerId, points) {
  const map = _mapRefs[containerId];
  if (!map || !points || points.length < 2) return;
  const speeds = smoothSpeeds(computeSpeeds(points), 5);
  const positiveSpeeds = speeds.filter(s => s > 0);
  if (positiveSpeeds.length < 2) return null;
  const minS = Math.min(...positiveSpeeds);
  const maxS = Math.max(...positiveSpeeds);
  const range = (maxS - minS) || 1;
  // Segments avec couleur HSL selon vitesse — mais on skip les paires qui traversent un gap
  const segments = L.layerGroup();
  for (let i = 0; i < points.length - 1; i++) {
    if (points[i+1].newSegment) continue; // saut de gap, on ne dessine pas
    const p1 = [points[i].lat, points[i].lng];
    const p2 = [points[i+1].lat, points[i+1].lng];
    const speedAvg = (speeds[i] + speeds[i+1]) / 2;
    const t = (speedAvg - minS) / range;
    const color = speedToHslColor(Math.max(0, Math.min(1, t)));
    L.polyline([p1, p2], { color, weight: 5.5, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(segments);
  }
  segments.addTo(map);
  // Marker départ (petit gris)
  L.circleMarker([points[0].lat, points[0].lng], {
    radius: 5, fillColor: '#5A5245', color: '#FFFFFF', weight: 2, fillOpacity: 1
  }).addTo(map);
  // Marker arrivée (gros noir)
  const last = points[points.length - 1];
  L.circleMarker([last.lat, last.lng], {
    radius: 7, fillColor: '#0A0806', color: '#FFFFFF', weight: 2.5, fillOpacity: 1
  }).addTo(map);
  // Auto-fit bounds
  const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
  map.fitBounds(bounds, { padding: [20, 20] });
  return { minS, maxS };
}

// Cleanup une map (à appeler quand on quitte la vue)
function destroyMap(containerId) {
  if (_mapRefs[containerId]) {
    try { _mapRefs[containerId].remove(); } catch (e) {}
    delete _mapRefs[containerId];
    delete _mapPolylines[containerId];
    delete _mapMarkers[containerId];
  }
}

// Détermine si une séance cardio est éligible au tracking outdoor
function isCardioOutdoor(sessionId) {
  if (!sessionId) return false;
  // Vélo intérieur, natation, cardio-machine = non éligibles
  if (sessionId === 'velo-int' || sessionId === 'natation' || sessionId === 'cardio-machine') return false;
  // Course, vélo (route) = éligibles
  if (sessionId === 'course' || sessionId === 'velo') return true;
  // Par défaut, les autres cardio sont considérés outdoor
  return true;
}

// Démarre une séance GPS (route running-gps)
async function startGPSSession() {
  state.currentTracking = {
    sessionId: state.sessionId,
    sessionKind: state.sessionKind,
    startTs: Date.now(),
    weakDismissed: false,
    weakVisible: false
  };
  state.view = 'running-gps';
  await requestWakeLock();
  render();
  // Init map après render (le DOM doit être en place)
  setTimeout(() => {
    initMap('v66-live-map', { interactive: false, zoom: 16 });
    GPSTracker.start({
      autoPause: !!(state.settings && state.settings.gpsAutoPause),
      onPoint: (point) => {
        drawLiveTrack('v66-live-map', GPSTracker.getTrack());
        _updateGPSStats();
      },
      onWeak: (isWeak) => {
        if (state.currentTracking) {
          state.currentTracking.weakVisible = isWeak && !state.currentTracking.weakDismissed;
          _updateGPSWeakAlert();
        }
      },
      onAutoPause: (isAutoPaused) => {
        _refreshGPSPauseUI();
      },
      onError: (err) => {
        console.warn('GPS error', err);
      }
    });
    // Timer d'update UI toutes les secondes
    if (state._gpsTimerInterval) clearInterval(state._gpsTimerInterval);
    state._gpsTimerInterval = setInterval(() => _updateGPSTimer(), 1000);
  }, 50);
}

function _updateGPSTimer() {
  const el = document.getElementById('v66-timer-val');
  if (!el) return;
  el.textContent = formatDurationHMS(GPSTracker.getElapsedMs());
}

function _updateGPSStats() {
  const points = GPSTracker.getTrack();
  const distKm = computeTrackDistance(points);
  const dPlus = computeDenivelPositif(points);
  const elapsedMs = GPSTracker.getElapsedMs();
  const pace = computeAveragePace(distKm, elapsedMs);
  const elDist = document.getElementById('v66-stat-dist');
  const elPace = document.getElementById('v66-stat-pace');
  const elDeniv = document.getElementById('v66-stat-deniv');
  if (elDist) elDist.innerHTML = `${distKm.toFixed(2)}<span class="u">km</span>`;
  if (elPace) elPace.innerHTML = `${formatPace(pace)}<span class="u">/km</span>`;
  if (elDeniv) elDeniv.innerHTML = `${dPlus}<span class="u">m</span>`;
  // Update barres objectifs si séance programme
  _updateGPSObjectives(distKm, dPlus, elapsedMs);
}

function _updateGPSObjectives(distKm, dPlus, elapsedMs) {
  const objBlock = document.getElementById('v66-obj-block');
  if (!objBlock) return;
  const durMin = elapsedMs / 60000;
  const targets = objBlock.dataset;
  const pKm  = Math.min(150, (distKm / (parseFloat(targets.km)  || 1)) * 100);
  const pDen = Math.min(150, (dPlus / (parseFloat(targets.deniv)|| 1)) * 100);
  const pDur = Math.min(150, (durMin / (parseFloat(targets.dur) || 1)) * 100);
  const upd = (id, pct, val, tgt) => {
    const f = document.getElementById(id);
    if (f) {
      f.style.width = Math.min(100, pct) + '%';
      f.classList.toggle('over', pct > 100);
    }
    const v = document.getElementById(id + '-val');
    if (v) v.innerHTML = `${val}<span class="tgt"> / ${tgt}</span>`;
  };
  upd('v66-obj-fill-km',  pKm,  distKm.toFixed(1),        targets.km);
  upd('v66-obj-fill-den', pDen, dPlus,                    targets.deniv);
  upd('v66-obj-fill-dur', pDur, Math.round(durMin),       targets.dur + ' min');
}

function _updateGPSWeakAlert() {
  const alert = document.getElementById('v66-gps-alert');
  if (!alert) return;
  alert.style.display = state.currentTracking && state.currentTracking.weakVisible ? 'flex' : 'none';
}

function dismissWeakAlert() {
  if (state.currentTracking) {
    state.currentTracking.weakDismissed = true;
    state.currentTracking.weakVisible = false;
  }
  _updateGPSWeakAlert();
}

function switchToManualFromGPS() {
  // Arrête le GPS, jette la trace, bascule sur cardio-stats classique
  GPSTracker.stop();
  if (state._gpsTimerInterval) { clearInterval(state._gpsTimerInterval); state._gpsTimerInterval = null; }
  destroyMap('v66-live-map');
  releaseWakeLock();
  state.currentTracking = null;
  state.view = 'cardio-stats';
  render();
}

function pauseGPSSession() {
  GPSTracker.pause();
  _refreshGPSPauseUI();
}

function resumeGPSSession() {
  GPSTracker.resume();
  _refreshGPSPauseUI();
}

function _refreshGPSPauseUI() {
  const timer = document.getElementById('v66-timer-wrap');
  const actions = document.getElementById('v66-gps-actions');
  const timerLab = timer ? timer.querySelector('.lab') : null;
  if (!timer || !actions) return;
  if (GPSTracker.isPaused) {
    timer.classList.add('paused');
    const isAuto = GPSTracker.pauseReason === 'auto';
    if (timerLab) timerLab.textContent = isAuto ? 'PAUSE AUTO' : 'PAUSE';
    actions.innerHTML = `<button class="v66-gps-btn resume" onclick="resumeGPSSession()">▶ Reprendre</button>`;
    actions.classList.add('resume');
  } else {
    timer.classList.remove('paused');
    if (timerLab) timerLab.textContent = 'TEMPS';
    actions.classList.remove('resume');
    actions.innerHTML = `<button class="v66-gps-btn pause" onclick="pauseGPSSession()">Pause</button>
                         <button class="v66-gps-btn end" onclick="endGPSSession()">Terminer la séance</button>`;
  }
}

function endGPSSession() {
  GPSTracker.stop();
  if (state._gpsTimerInterval) { clearInterval(state._gpsTimerInterval); state._gpsTimerInterval = null; }
  const track = GPSTracker.getTrack();
  const gaps = (GPSTracker.gaps || []).slice();
  const elapsedMs = GPSTracker.getElapsedMs();
  const activeMs  = computeActiveDurationMs(track);
  const distKm = computeTrackDistance(track);
  const dPlus  = computeDenivelPositif(track);
  const pace   = computeAveragePace(distKm, activeMs || elapsedMs);
  const maxSpeed = computeMaxSpeed(track);

  // Prépare data pour pushSessionValidation
  const data = {
    type: state.currentTracking && state.currentTracking.sessionId || state.sessionId || 'course',
    duration: Math.round(elapsedMs / 60000),
    km: Math.round(distKm * 100) / 100,
    deniv: dPlus,
    track: {
      points: track.map(p => ({
        lat: p.lat, lng: p.lng, alt: p.alt, ts: p.ts,
        ...(p.newSegment ? { newSegment: true } : {})
      })),
      pace,
      maxSpeed,
      elapsedMs,
      activeMs,
      gaps: gaps.map(g => ({ fromTs: g.fromTs, toTs: g.toTs, gapMs: g.gapMs })),
      source: 'live'
    }
  };

  // Trouve la session cardio du template
  const cardioSession = state.week.sessions ? state.week.sessions.find(s => s.slot === 'cardio' && (s.subtype === data.type || !s.subtype)) : null;
  let validationRef = null;
  if (cardioSession) {
    pushSessionValidation(cardioSession, data);
    // Récupère la validation qu'on vient de créer pour pouvoir l'enrichir dans le report
    const vals = cardioSession.validations || [];
    validationRef = vals[vals.length - 1];
  } else {
    // Fallback : freestyle session
    const fs = {
      id: 'fs-' + Date.now(),
      type: 'cardio',
      name: 'Cardio GPS',
      duration: data.duration,
      km: data.km,
      deniv: data.deniv,
      weekId: state.week.id,
      completedAt: new Date().toISOString(),
      track: data.track
    };
    state.freestyleSessions = state.freestyleSessions || [];
    state.freestyleSessions.push(fs);
    validationRef = fs;
  }
  const entry = { date: new Date().toISOString().slice(0,10), weekId: state.week.id, type: data.type, duration: data.duration, km: data.km, deniv: data.deniv, phase: currentPhase(), extraData: null };
  state.cardioHistory = state.cardioHistory || [];
  state.cardioHistory.push(entry);
  destroyMap('v66-live-map');
  releaseWakeLock();
  state.currentTracking = null;

  // Redirige vers le report post-séance
  state.currentReportValidationRef = validationRef;
  state.view = 'session-report';
  saveState();
  render();
}

function backFromGPSSession() {
  // Retour arrière sans valider : confirm avant d'annuler
  if (!confirm('Quitter la séance en cours ? La trace GPS sera perdue.')) return;
  GPSTracker.stop();
  if (state._gpsTimerInterval) { clearInterval(state._gpsTimerInterval); state._gpsTimerInterval = null; }
  destroyMap('v66-live-map');
  releaseWakeLock();
  state.currentTracking = null;
  state.view = 'training';
  state.tab = 'training';
  render();
}

// Photo picker via input file (caméra ou galerie sur iOS)
function pickReportPhoto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) { document.body.removeChild(input); return; }
    // Compresse à max 800×800 base64
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 800;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        state._pendingReportPhoto = dataUrl;
        // Re-render pour afficher le thumbnail
        render();
        document.body.removeChild(input);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removeReportPhoto() {
  state._pendingReportPhoto = null;
  render();
}

function useReportSuggestion(txt) {
  const el = document.getElementById('v66-report-title-input');
  if (el) el.value = txt;
}

// Génère 2-3 suggestions de titre selon le contexte
function getReportTitleSuggestions(ref) {
  const sug = [];
  const now = new Date();
  const jourNoms = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const moisNoms = ['jan','fév','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  const dateStr = `${jourNoms[now.getDay()]} ${now.getDate()} ${moisNoms[now.getMonth()]}`;
  const type = (ref && ref.data && ref.data.type) || (ref && ref.type) || 'cardio';
  const km = (ref && ref.data && ref.data.km) || (ref && ref.km);
  const hour = now.getHours();
  const moment = hour < 12 ? 'matinal' : hour < 17 ? 'de l\'après-midi' : 'du soir';
  if (type === 'course' || type === 'cardio') {
    sug.push(`Course ${moment} · ${dateStr}`);
    if (km) sug.push(`Course ${km.toFixed(1)} km`);
    sug.push(`Sortie ${dateStr}`);
  } else if (type === 'velo') {
    sug.push(`Vélo ${moment} · ${dateStr}`);
    if (km) sug.push(`${km.toFixed(0)} km vélo`);
    sug.push(`Sortie vélo ${dateStr}`);
  } else {
    sug.push(`Séance ${dateStr}`);
    if (km) sug.push(`${km.toFixed(1)} km`);
  }
  return sug;
}

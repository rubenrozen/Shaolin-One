// Retourne la table d'allures selon le programme
function pacesForProgram(programId) {
  if (programId === 'course-marathon') return MARATHON_PACES;
  if (programId === 'course-5km') return KM5_PACES;
  if (programId === 'course-10km') return KM10_PACES;
  if (programId === 'course-semi') return SEMI_PACES;
  if (programId === 'trail-court' || programId === 'ultra-trail') return TRAIL_PACES;
  if (programId && (programId.startsWith('alpinisme-') || programId === 'ski-rando-trail' || programId === 'expedition')) return ALPI_PACES;
  return MARATHON_PACES; // fallback
}

// Default objective par programme
function defaultObjective(programId) {
  if (programId === 'course-5km') return '25';
  if (programId === 'course-10km') return '50';
  if (programId === 'course-semi') return '2h';
  if (programId === 'course-marathon') return '4h';
  if (programId === 'trail-court' || programId === 'ultra-trail') return 'intermediaire';
  if (programId === 'alpinisme-decouverte') return 'debutant';
  if (programId === 'alpinisme-confirme') return 'confirme';
  if (programId === 'alpinisme-expert') return 'expert';
  if (programId === 'ski-rando-trail') return 'confirme';
  if (programId === 'expedition') return 'confirme';
  return '4h';
}

// Retourne l'objectif temps pour le programme courant (générique, remplace marathonObjective)
function cardioObjective() {
  const p = state.settings && state.settings.profile;
  if (!p || !p.programOptions) return defaultObjective(p ? p.programId : null);
  return p.programOptions.cardioObjective || p.programOptions.marathonObjective || defaultObjective(p.programId);
}

// Legacy alias marathonObjective
function marathonObjective() { return cardioObjective(); }

// Résout la cible d'une session cardio d'après son subtype et la phase
function resolveMarathonTarget(subtype, phase) {
  const p = state.settings && state.settings.profile;
  if (!p) return null;
  const prog = findProgram(p.programId);
  if (!prog || !prog.cardioTargets) return null;
  const base = prog.cardioTargets[phase] && prog.cardioTargets[phase][subtype];
  if (!base) return null;
  const paces = pacesForProgram(p.programId);
  const obj = cardioObjective();
  const paceTable = paces[obj] || Object.values(paces)[0];
  const pace = paceTable[base.paceType] || paceTable.EF;
  return {
    ...base,
    pace,
    paceTargetName: base.paceType,
    paceLabel: paceStr(pace)
  };
}

// Formate une allure décimale en "min:sec/km"
function paceStr(pace) {
  if (!pace) return '–';
  const m = Math.floor(pace);
  const s = Math.round((pace - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}/km`;
}

// Coefficients de modulation par profil
const SPORT_STATUS_COEFF = {
  sedentaire: 0.60,
  occasionnel: 0.80,
  regulier: 1.00,
  entraine: 1.15
};

function ageCoeff(age) {
  if (!age) return 1.0;
  if (age < 30) return 1.0;
  if (age < 40) return 0.98;
  if (age < 50) return 0.92;
  if (age < 60) return 0.85;
  return 0.75;
}

// Fréquence hebdo cible selon statut sportif
const FREQ_TARGET = {
  sedentaire: 2,
  occasionnel: 2,
  regulier: 3,
  entraine: 4
};

// Retourne le coefficient combiné âge + statut du profil
function profileCoeff() {
  const p = state.settings && state.settings.profile;
  if (!p) return 1.0;
  const status = p.sportStatus || 'regulier';
  return (SPORT_STATUS_COEFF[status] || 1.0) * ageCoeff(p.age);
}

// Cibles cardio calculées dynamiquement à partir du baseline × coefficient profil
// Les métriques d'intensité (pace, kmh, watts, rpe) ne sont PAS modulées : elles reflètent
// une qualité d'effort physiologique (allure Zone 2, etc.) attendue à toute condition.
const CARDIO_TARGETS = new Proxy({}, {
  get(_, type) {
    if (!CARDIO_TARGETS_BASE[type]) return undefined;
    return new Proxy({}, {
      get(_, phase) {
        const base = CARDIO_TARGETS_BASE[type][phase];
        if (!base) return undefined;
        const c = profileCoeff();
        return {
          duration: Math.round(base.duration * c),
          km: Math.round(base.km * c * 10) / 10,
          deniv: Math.round(base.deniv * c),
          pace: base.pace,     // min/km course, non modulé
          kmh: base.kmh,       // km/h vélo, non modulé
          watts: base.watts,   // W cible vélo int, non modulé
          rpe: base.rpe        // RPE cible vélo int, non modulé
        };
      }
    });
  }
});

// Fréquence hebdo cible = nombre de sessions OBLIGATOIRES du template hebdo.
// Les sessions optionnelles (comme la discipline libre) ne comptent pas dans la cible mais peuvent être faites en bonus.
function weeklyTarget() {
  try {
    const template = currentWeeklyTemplate();
    if (template && template.length) {
      return template.filter(item => !item.optional).length;
    }
  } catch (e) {}
  const p = state.settings && state.settings.profile;
  if (!p) return 3;
  return FREQ_TARGET[p.sportStatus] || 3;
}

// Nombre total de sessions dans le template (obligatoires + optionnelles)
function weeklyTotalSlots() {
  try {
    const template = currentWeeklyTemplate();
    if (template && template.length) return template.length;
  } catch (e) {}
  return 3;
}

// Nom de la discipline pratiquée (ou null si aucune)
function userDiscipline() {
  const p = state.settings && state.settings.profile;
  return (p && p.discipline && p.disciplineFreq && p.disciplineFreq !== 'jamais') ? p.discipline : null;
}

// Modulation renfo : ajuste séries × reps + durée gainage selon le statut
function moduleSets(baseSets) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseSets;
  const s = p.sportStatus || 'regulier';
  if (s === 'sedentaire') return Math.max(2, baseSets - 1);
  if (s === 'occasionnel') return baseSets;
  if (s === 'regulier') return baseSets;
  if (s === 'entraine') return baseSets + 1;
  return baseSets;
}
function moduleReps(baseReps) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseReps;
  const s = p.sportStatus || 'regulier';
  const factor = { sedentaire: 0.65, occasionnel: 0.85, regulier: 1.0, entraine: 1.25 }[s] || 1.0;
  return Math.max(4, Math.round(baseReps * factor));
}
function moduleTime(baseSec) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseSec;
  const s = p.sportStatus || 'regulier';
  const factor = { sedentaire: 0.65, occasionnel: 0.85, regulier: 1.0, entraine: 1.2 }[s] || 1.0;
  return Math.max(10, Math.round(baseSec * factor / 5) * 5);
}

// Applique la modulation profil aux steps d'une séance (reps + gainage time)
// Retourne une copie modifiée
function moduleSessionSteps(steps) {
  const p = state.settings && state.settings.profile;
  if (!p || !steps) return steps;
  const s = p.sportStatus || 'regulier';
  if (s === 'regulier') return steps; // baseline, pas de modulation
  return steps.map(step => {
    if (step.type === 'rest' || !step.label) return step;
    // Ne module que les steps qui font partie du "corps de séance" (label = circuit/série/…)
    // pas l'échauffement, les étirements etc.
    const isCore = /circuit|série|round|corps/i.test(step.label);
    if (!isCore) return step;
    const copy = { ...step };
    // Reps : format "X reps" ou "X / jambe" ou "X / côté" — on module le premier nombre
    if (step.type === 'reps' && typeof step.reps === 'string') {
      copy.reps = step.reps.replace(/^(\d+)/, (m, n) => moduleReps(parseInt(n)));
    }
    // Time : gainage/wall sit/planche — on module la durée
    if (step.type === 'time' && step.duration) {
      copy.duration = moduleTime(step.duration);
    }
    return copy;
  });
}

// Applique la modulation au nombre de tours/séries à l'affichage du plan (Renfo A: 4×12 → 5×15 ou 3×10)
function moduleSetsLabel(label) {
  const p = state.settings && state.settings.profile;
  if (!p) return label;
  const s = p.sportStatus || 'regulier';
  if (s === 'regulier') return label;
  return label.replace(/(\d+)\s*[×x]\s*(\d+)/g, (m, sets, reps) => {
    const modSets = moduleSets(parseInt(sets));
    const modReps = moduleReps(parseInt(reps));
    return `${modSets} × ${modReps}`;
  });
}

// ============================================================
//  CARDIO MÉDICAL — Séances Zone 1 / Zone 2 avec RPE cible
// ============================================================
// Cible : durée + km cibles depuis cardioTargets du programme + RPE cible dans la note
function buildMedicalCardio(subtype) {
  const p = state.settings && state.settings.profile;
  const prog = p ? findProgram(p.programId) : null;
  const phase = currentPhase();
  const t = (prog && prog.cardioTargets && prog.cardioTargets[phase] && prog.cardioTargets[phase][subtype]) || null;
  if (!t) return null;

  const duration = t.duration || 20;
  const km = t.km || 2;
  const isZone1 = subtype === 'zone1';
  const rpeLabel = isZone1 ? 'RPE 3-4' : 'RPE 4-5';
  const zoneLabel = isZone1 ? 'Zone 1' : 'Zone 2';
  const note = t.note || '';

  return {
    id: 'cardio-medical-' + subtype,
    focus: `Cardio · ${zoneLabel}`,
    focusClass: 'cardio',
    title: `Cardio ${zoneLabel} · ${rpeLabel}`,
    duration: `${duration + 5} min`,
    durationMin: duration + 5,
    target: { duration, km, deniv: t.deniv || 0 },
    type: 'course',
    subtype,
    intro: `${duration} min à ${rpeLabel}. Objectif : ${km} km${t.deniv ? ' avec ' + t.deniv + 'm D+' : ''}. ${note}`,
    plan: [
      { head: 'Échauffement', items: [{ n: 'Marche/vélo progressif', t: '3 min' }] },
      { head: 'Corps', items: [{ n: `${km} km à ${rpeLabel}`, t: `${duration} min` }] },
      { head: 'Retour', items: [{ n: 'Marche lente + respiration', t: '2 min' }] }
    ],
    steps: [
      { type: 'time', name: 'Échauffement doux', duration: 180, label: 'échauffement',
        cues: ['Marche lente 1 min', 'Rythme progressif', 'Prépare le corps sans forcer', 'Respiration nasale possible'] },
      { type: 'time', name: `${zoneLabel} · ${rpeLabel}`, duration: duration * 60, label: 'endurance',
        cues: [
          `Cible : ${km} km${t.deniv ? ' avec ' + t.deniv + 'm D+' : ''}`,
          isZone1 ? 'Respiration nasale ou légère' : 'Respiration profonde, conversation possible',
          note || 'Reste sous ton seuil de fatigue',
          isZone1 ? 'Stop si essoufflement anormal' : 'Adapte au ressenti'
        ] },
      { type: 'time', name: 'Retour au calme', duration: 120, label: 'récup',
        cues: ['Décélère progressivement', 'Marche 1 min', 'Respiration profonde 4-6', 'Ramène FC à la normale'] }
    ]
  };
}

function buildCardioSession(type, subtype) {
  // Route marathon et similaires vers les builders spécifiques si subtype fourni
  if (subtype) {
    if (subtype === 'ef') return buildMarathonEF('ef');
    if (subtype === 'seuil') return buildMarathonSeuil();
    if (subtype === 'vma') return buildMarathonVMA();
    if (subtype === 'sl' || subtype === 'sl-am') return buildMarathonSL(subtype);
    if (subtype === 'zone1' || subtype === 'zone2') return buildMedicalCardio(subtype);
    if (subtype === 'course') return buildWellnessCardio(subtype);
  }
  const t = cardioTarget(type);
  const isVelo = type === 'velo' || type === 'velo-int';
  const durationSec = t.duration * 60;
  const warmup = { type: 'time', name: 'Échauffement', duration: 300, label: 'échauffement',
    cues: isVelo ? ['Résistance très faible', 'Cadence 80-90 tr/min', 'Monte progressivement le cardiaque']
                 : ['Marche rapide 2 min', 'Rotations chevilles + hanches', 'Montées de genoux légères'] };
  const body = { type: 'time', name: isVelo ? 'Vélo zone 2' : 'Course zone 2', duration: durationSec, label: 'endurance',
    cues: isVelo ? ['Résistance moyenne', 'Cadence 80-90 tr/min', 'Conversation possible']
                 : ['Nez qui respire, conversation possible', 'Cadence ~170-180 pas/min', 'Trop lent = c\'est bien'] };
  const cooldown = { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
    cues: isVelo ? ['Résistance très faible', 'Cadence libre', 'Descente cardiaque progressive']
                 : ['Décélération progressive', 'Respiration profonde', 'Marche pas courue'] };
  return {
    id: type,
    focus: isVelo ? 'Cardio · Vélo' : 'Cardio · Course',
    focusClass: 'cardio',
    title: isVelo ? 'Vélo zone 2' : 'Course zone 2',
    duration: `${t.duration + 8} min`,
    durationMin: t.duration + 8,
    target: t,
    type: type,
    intro: isVelo ? 'Moteur aérobie sans casser les articulations.' : 'Le moteur qu\'on construit lentement.',
    plan: [
      { head: 'Échauffement', items: [{ n: warmup.name, t: '5 min' }] },
      { head: 'Corps', items: [{ n: body.name, t: `${t.duration} min` }] },
      { head: 'Récup', items: [{ n: cooldown.name, t: '3 min' }] }
    ],
    steps: [warmup, body, cooldown]
  };
}

function getWeekRenfoIdx() {
  const ref = new Date(2026, 6, 27);
  const now = new Date();
  const diffDays = Math.floor((now - ref) / (1000 * 60 * 60 * 24));
  const weekNum = Math.floor(diffDays / 7);
  return ((weekNum % RENFO_ROTATION.length) + RENFO_ROTATION.length) % RENFO_ROTATION.length;
}
function getCurrentRenfo() { return RENFO_ROTATION[getWeekRenfoIdx()]; }

// ============================================================
// Template par défaut si le programme n'en définit pas (rétro-compat)
const DEFAULT_TEMPLATE = [
  { key: 'cardio', slot: 'cardio', label: 'Cardio' },
  { key: 'renfo', slot: 'renfo', label: 'Renfo' },
  { key: 'discipline', slot: 'discipline', label: 'Discipline', requiresDiscipline: true, optional: true }

// Retourne le template hebdo pour la phase courante, résolu depuis le profil
function currentWeeklyTemplate() {
  const p = state.settings && state.settings.profile;
  const phase = currentPhase();
  const prog = p ? findProgram(p.programId) : null;
  let items;
  if (prog && prog.weeklyTemplate && prog.weeklyTemplate[phase]) {
    items = prog.weeklyTemplate[phase];
  } else {
    items = DEFAULT_TEMPLATE;
  }
  // Filtre les items qui requièrent une discipline si l'utilisateur n'en a pas
  return items.filter(item => !item.requiresDiscipline || userDiscipline());
}

function buildFreshWeek(now) {
  now = now || new Date();
  const template = currentWeeklyTemplate();
  const w = {
    id: getWeekId(now),
    monday: getMondayOfWeek(now).toISOString().slice(0, 10),
    sessions: template.map(item => ({
      key: item.key,
      slot: item.slot,
      subtype: item.subtype || null,
      label: item.label,
      optional: !!item.optional,
      done: false,
      data: {}
    })),
    bonusCount: 0
  };
  return attachLegacyAccessors(w);
}

// Récupère toutes les sessions d'un slot donné dans une semaine
function sessionsOfSlot(w, slot) {
  if (!w || !w.sessions) return [];
  return w.sessions.filter(s => s.slot === slot);
}

// Première session d'un slot donné dans la semaine
function firstSessionOfSlot(w, slot) {
  return sessionsOfSlot(w, slot)[0] || null;
}

// Trouve une session par sa key
function sessionByKey(w, key) {
  if (!w || !w.sessions) return null;
  return w.sessions.find(s => s.key === key) || null;
}

// Migration : convertit l'ancien format (boxe, cardio, renfo) vers sessions[]
function migrateOldWeek(oldW) {
  if (!oldW) return buildFreshWeek();
  if (oldW.sessions && Array.isArray(oldW.sessions)) return attachLegacyAccessors(oldW); // déjà nouveau format, juste attacher
  const w = {
    id: oldW.id || getWeekId(),
    monday: oldW.monday || getMondayOfWeek(new Date()).toISOString().slice(0, 10),
    sessions: [],
    bonusCount: oldW.bonusCount || 0
  };
  // Convertit chaque ancien champ en session
  if (oldW.cardio) {
    w.sessions.push({
      key: 'cardio', slot: 'cardio', subtype: null, label: 'Cardio',
      done: !!oldW.cardio.done,
      data: oldW.cardio.done ? {
        type: oldW.cardio.type,
        duration: oldW.cardio.duration,
        km: oldW.cardio.km,
        deniv: oldW.cardio.deniv
      } : {}
    });
  } else {
    w.sessions.push({ key: 'cardio', slot: 'cardio', subtype: null, label: 'Cardio', done: false, data: {} });
  }
  if (oldW.renfo) {
    w.sessions.push({
      key: 'renfo', slot: 'renfo', subtype: null, label: 'Renfo',
      done: !!oldW.renfo.done,
      data: oldW.renfo.done ? { variantId: oldW.renfo.variantId } : {}
    });
  } else {
    w.sessions.push({ key: 'renfo', slot: 'renfo', subtype: null, label: 'Renfo', done: false, data: {} });
  }
  if (oldW.boxe) {
    w.sessions.push({
      key: 'discipline', slot: 'discipline', subtype: null, label: 'Discipline',
      done: !!oldW.boxe.done,
      data: oldW.boxe.done ? { note: oldW.boxe.note, score: oldW.boxe.score } : {}
    });
  } else {
    w.sessions.push({ key: 'discipline', slot: 'discipline', subtype: null, label: 'Discipline', done: false, data: {} });
  }
  return attachLegacyAccessors(w);
}

function freshWeek(now) { return buildFreshWeek(now); }

// Attache des accessors legacy sur w.cardio, w.renfo, w.boxe qui redirigent vers sessions[]
// Permet aux callers existants de continuer à faire state.week.cardio.done sans réécriture
function attachLegacyAccessors(w) {
  if (!w || w.__legacyAttached) return w;
  const legacyMap = { cardio: 'cardio', renfo: 'renfo', boxe: 'discipline' };
  Object.entries(legacyMap).forEach(([field, slot]) => {
    Object.defineProperty(w, field, {
      configurable: true,
      enumerable: false, // pas sérialisé, évite duplication dans JSON
      get() {
        const s = firstSessionOfSlot(this, slot);
        if (!s) return { done: false };
        // Proxy qui expose done + data.* comme s'il s'agissait d'un objet plat
        return new Proxy({}, {
          get(_, prop) {
            if (prop === 'done') return s.done;
            return s.data ? s.data[prop] : undefined;
          },
          set(_, prop, val) {
            if (prop === 'done') { s.done = val; return true; }
            if (!s.data) s.data = {};
            s.data[prop] = val;
            return true;
          },
          has(_, prop) { return prop === 'done' || (s.data && prop in s.data); }
        });
      },
      set(v) {
        const s = firstSessionOfSlot(this, slot);
        if (!s) return;
        s.done = !!v.done;
        s.data = {};
        Object.entries(v).forEach(([k, val]) => {
          if (k !== 'done') s.data[k] = val;
        });
      }
    });
  });
  Object.defineProperty(w, '__legacyAttached', { value: true, enumerable: false });
  return w;
}

function archiveIfNewWeek() {
  const nowId = getWeekId();
  if (state.week.id !== nowId) {
    state.weekHistory.push({ ...state.week });
    state.week = buildFreshWeek();
    saveState();
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // Pas de state persisté : construction propre depuis buildFreshWeek maintenant que tout est défini
      state.week = buildFreshWeek();
      return;
    }
    const saved = JSON.parse(raw);

    if (saved.week) {
      state.week = migrateOldWeek(saved.week);
    } else {
      state.week = buildFreshWeek();
    }
    state.weekHistory = (saved.weekHistory || []).map(w => migrateOldWeek(w));
    state.cardioHistory = saved.cardioHistory || [];
    if (saved.settings) state.settings = { ...state.settings, ...saved.settings };

    // Si le state a un profil qui définit un weeklyTemplate différent, on rebuild la semaine
    // avec le template correct (sinon l'ancien template Cervin peut rester si l'utilisateur a switché programme)
    if (state.week.id !== getWeekId()) {
      // Ce n'est plus la semaine courante — on archive et on rebuild proprement
      state.weekHistory.push(state.week);
      state.week = buildFreshWeek();
    }
  } catch (e) {
    console.warn('loadState error', e);
    state.week = buildFreshWeek();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory,
      settings: state.settings
    }));
  } catch (e) {}
  // Also push to Supabase (fire-and-forget)
  if (sb && state.user) {
    pushCurrentWeekToRemote();
  }
}

async function pushCurrentWeekToRemote() {
  if (!sb || !state.user) return;
  try {
    state.syncStatus = 'syncing';
    const { error } = await sb.from('week_state').upsert({
      user_id: state.user.id,
      week_id: state.week.id,
      data: state.week,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,week_id' });
    if (error) throw error;
    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync push failed:', e.message);
    state.syncStatus = 'error';
  }
}

async function pushCardioHistoryEntry(entry) {
  if (!sb || !state.user) return;
  try {
    await sb.from('cardio_history').insert({
      user_id: state.user.id,
      date: entry.date,
      week_id: entry.weekId,
      type: entry.type,
      duration: entry.duration,
      km: entry.km,
      deniv: entry.deniv,
      phase: entry.phase
    });
  } catch (e) { console.warn('Cardio history push failed:', e.message); }
}

async function syncPull() {
  if (!sb || !state.user) return;
  state.syncStatus = 'syncing';
  try {
    // Fetch all week_state rows
    const { data: weeks, error: weeksErr } = await sb.from('week_state')
      .select('week_id, data, updated_at')
      .order('week_id', { ascending: true });
    if (weeksErr) throw weeksErr;

    // Fetch cardio history
    const { data: cardio, error: cardioErr } = await sb.from('cardio_history')
      .select('*')
      .order('date', { ascending: true });
    if (cardioErr) throw cardioErr;

    // Merge weeks: for current week, use most recent; for past weeks, prefer remote
    const currentId = state.week.id;
    const remoteMap = new Map(weeks.map(w => [w.week_id, w]));

    // Update current week if remote is newer or if local is empty
    const remoteCurrent = remoteMap.get(currentId);
    if (remoteCurrent) {
      const merged = { ...state.week, ...remoteCurrent.data, id: currentId };
      state.week = attachLegacyAccessors(migrateOldWeek(merged));
    }

    // Rebuild weekHistory from remote (past weeks only)
    const history = [];
    for (const w of weeks) {
      if (w.week_id !== currentId) {
        history.push({ ...w.data, id: w.week_id });
      }
    }
    // Also keep any local-only history not on remote (edge case)
    for (const localWeek of state.weekHistory) {
      if (localWeek.id !== currentId && !remoteMap.has(localWeek.id)) {
        history.push(localWeek);
        // Push it to remote
        try {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: localWeek.id,
            data: localWeek,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        } catch (e) { console.warn('Backfill push failed:', e.message); }
      }
    }
    state.weekHistory = history.sort((a, b) => a.id.localeCompare(b.id));

    // Cardio history: use remote as source of truth
    state.cardioHistory = (cardio || []).map(c => ({
      date: c.date, weekId: c.week_id, type: c.type,
      duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
    }));

    // Persist merged state locally
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory
    }));

    // If local week has changes not on remote (updated more recently), push it
    if (!remoteCurrent) await pushCurrentWeekToRemote();

    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync pull failed:', e.message);
    state.syncStatus = 'error';
  }
}

function countDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done).length;
}

// Compte uniquement les sessions obligatoires effectuées (pour statut "semaine pleine")
function countRequiredDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done && !s.optional).length;
}

// Compte les sessions optionnelles effectuées (bonus)
function countOptionalDoneInWeek(w) {
  if (!w) return 0;
  if (!w.sessions) w = migrateOldWeek(w);
  return (w.sessions || []).filter(s => s.done && s.optional).length;
}

function countDone() { return countDoneInWeek(state.week); }

// ============================================================
//  REWARDS / BADGES
// ============================================================
// Retourne l'ensemble des semaines (historique + courante), filtrées par startDate
function allValidWeeks() {
  const startDate = state.settings && state.settings.startDate ? new Date(state.settings.startDate) : null;
  const weeks = [...(state.weekHistory || [])];
  if (state.week && state.week.id) weeks.push(state.week);
  if (!startDate) return weeks;
  return weeks.filter(w => {
    if (!w.monday) return true;
    return new Date(w.monday) >= startDate;
  });
}

// Compte les semaines "pleines" (sessions obligatoires toutes faites)
function countFullWeeks() {
  return allValidWeeks().filter(w => {
    const required = (w.sessions || []).filter(s => !s.optional).length;
    const doneRequired = countRequiredDoneInWeek(w);
    return required > 0 && doneRequired >= required;
  }).length;
}

// Compte le total de bonus effectués
function countTotalBonus() {
  return allValidWeeks().reduce((sum, w) => sum + (w.bonusCount || 0), 0);
}

// Paliers pour les semaines pleines (points de constance)
const CONSTANCE_TIERS = [
  { threshold: 1, label: 'Première', icon: '◆', desc: 'Ta première semaine bouclée' },
  { threshold: 3, label: 'Régularité', icon: '◆◆', desc: '3 semaines pleines cumulées' },
  { threshold: 5, label: 'Constance', icon: '◆◆◆', desc: '5 semaines pleines' },
  { threshold: 10, label: 'Discipline', icon: '❖', desc: '10 semaines pleines · le rythme installé' },
  { threshold: 20, label: 'Dévotion', icon: '❖❖', desc: '20 semaines pleines · la moitié du chemin' },
  { threshold: 40, label: 'Maître', icon: '❖❖❖', desc: '40 semaines · prêt pour le Cervin' }
];

// Paliers pour les bonus
const BONUS_TIERS = [
  { threshold: 1, label: 'Premier bonus', icon: '✦', desc: 'Tu es allé chercher un extra' },
  { threshold: 5, label: 'Assidu', icon: '✦✦', desc: '5 bonus effectués' },
  { threshold: 10, label: 'Passionné', icon: '✦✦✦', desc: '10 bonus dans les jambes' },
  { threshold: 25, label: 'Marathonien', icon: '✧', desc: '25 bonus cumulés' },
  { threshold: 50, label: 'Athlète', icon: '✧✧', desc: '50 bonus · niveau engagement rare' },
  { threshold: 100, label: 'Centurion', icon: '✧✧✧', desc: '100 bonus · tu as changé ton corps' }
];

function computeRewards() {
  const fullWeeks = countFullWeeks();
  const totalBonus = countTotalBonus();
  const constanceBadges = CONSTANCE_TIERS.map(t => ({ ...t, unlocked: fullWeeks >= t.threshold }));
  const bonusBadges = BONUS_TIERS.map(t => ({ ...t, unlocked: totalBonus >= t.threshold }));
  return { fullWeeks, totalBonus, constanceBadges, bonusBadges };
}

// Retourne le palier maximum atteint (ou null si aucun)
function currentTier(badges) {
  const unlocked = badges.filter(b => b.unlocked);
  return unlocked.length ? unlocked[unlocked.length - 1] : null;
}

// Retourne le prochain palier à débloquer (ou null si tout est fait)
function nextTier(badges) {
  return badges.find(b => !b.unlocked) || null;
}

function toggleRewards(which) {
  state.expandedRewards = (state.expandedRewards === which) ? null : which;
  render();
}

function startOnboarding(prefill) {
  state.onboarding = { step: 1, disciplineId: null, programId: null, duration: null, medicalAck: false, cardioObjective: null, marathonObjective: null, favoriteDisciplineCategories: [], profileForm: {}, isEditing: !!prefill };
  if (prefill && state.settings.profile) {
    const p = state.settings.profile;
    state.onboarding.disciplineId = p.disciplineId || null;
    state.onboarding.programId = p.programId || null;
    state.onboarding.duration = p.duration || null;
    state.onboarding.medicalAck = !!p.medicalAcknowledged;
    state.onboarding.cardioObjective = (p.programOptions && (p.programOptions.cardioObjective || p.programOptions.marathonObjective)) || null;
    state.onboarding.marathonObjective = state.onboarding.cardioObjective;
    // Reconstruit les catégories cochées depuis les IDs favoris existants
    if (p.favoriteDisciplineIds && p.favoriteDisciplineIds.length > 0) {
      const cats = new Set();
      p.favoriteDisciplineIds.forEach(id => {
        const item = LEXIQUE.find(l => l.id === id);
        if (item) cats.add(item.cat);
      });
      state.onboarding.favoriteDisciplineCategories = Array.from(cats);
    }
    state.onboarding.profileForm = {
      age: p.age || '',
      weight: p.weight || '',
      height: p.height || '',
      sportStatus: p.sportStatus || '',
      limitations: p.limitations || '',
      discipline: p.discipline || '',
      disciplineFreq: p.disciplineFreq || ''
    };
  }
  state.view = 'onboarding';
  render();
}

function onbSelectDiscipline(id) {
  state.onboarding.disciplineId = id;
  // Reset downstream si on change de discipline
  if (state.onboarding.programId) {
    const p = findProgram(state.onboarding.programId);
    if (!p || p.disciplineId !== id) {
      state.onboarding.programId = null;
      state.onboarding.duration = null;
    }
  }
  render();
}

function onbSelectProgram(id) {
  state.onboarding.programId = id;
  // Auto-select première durée si non déjà choisie ou incompatible
  const p = findProgram(id);
  if (p && p.durations.length) {
    if (!state.onboarding.duration || !p.durations.includes(state.onboarding.duration)) {
      state.onboarding.duration = p.durations[0];
    }
  }
  render();
}

function onbSelectDuration(d) {
  state.onboarding.duration = d;
  render();
}

function onbToggleMedicalAck() {
  state.onboarding.medicalAck = !state.onboarding.medicalAck;
  render();
}

function onbUpdateProfileField(field, value) {
  state.onboarding.profileForm[field] = value;
}

function onbSelectSportStatus(status) {
  state.onboarding.profileForm.sportStatus = status;
  render();
}

function onbNext() {
  const s = state.onboarding.step;
  const disc = findDiscipline(state.onboarding.disciplineId);
  const isMedical = disc && disc.warning;
  const needsObj = ['course-5km', 'course-10km', 'course-semi', 'course-marathon', 'trail-court', 'ultra-trail'].includes(state.onboarding.programId);

  if (s === 1 && !state.onboarding.disciplineId) return;
  if (s === 2 && !state.onboarding.programId) return;
  if (s === 3 && !state.onboarding.duration) return;
  if (s === 3.5 && !state.onboarding.medicalAck) return;
  if (s === 3.7 && !state.onboarding.cardioObjective) return;
  if (s === 4) {
    const f = state.onboarding.profileForm;
    if (!f.age || !f.sportStatus) return;
  }
  // Step 4.5 : disciplines préférées — optionnelle, jamais bloquante

  // Prochain step
  if (s === 3) {
    if (isMedical) state.onboarding.step = 3.5;
    else if (needsObj) state.onboarding.step = 3.7;
    else state.onboarding.step = 4;
  }
  else if (s === 3.5) {
    if (needsObj) state.onboarding.step = 3.7;
    else state.onboarding.step = 4;
  }
  else if (s === 3.7) state.onboarding.step = 4;
  else if (s === 4) state.onboarding.step = 4.5;
  else if (s === 4.5) state.onboarding.step = 5;
  else state.onboarding.step = s + 1;
  window.scrollTo({ top: 0 });
  render();
}

function onbBack() {
  const s = state.onboarding.step;
  const disc = findDiscipline(state.onboarding.disciplineId);
  const isMedical = disc && disc.warning;
  const needsObj = ['course-5km', 'course-10km', 'course-semi', 'course-marathon', 'trail-court', 'ultra-trail'].includes(state.onboarding.programId);

  if (s === 1) return;
  if (s === 4) {
    if (needsObj) state.onboarding.step = 3.7;
    else if (isMedical) state.onboarding.step = 3.5;
    else state.onboarding.step = 3;
  }
  else if (s === 3.7) {
    if (isMedical) state.onboarding.step = 3.5;
    else state.onboarding.step = 3;
  }
  else if (s === 3.5) state.onboarding.step = 3;
  else if (s === 4.5) state.onboarding.step = 4;
  else if (s === 5) state.onboarding.step = 4.5;
  else state.onboarding.step = s - 1;
  window.scrollTo({ top: 0 });
  render();
}

function onbToggleDisciplineCategory(cat) {
  if (!state.onboarding.favoriteDisciplineCategories) state.onboarding.favoriteDisciplineCategories = [];
  const idx = state.onboarding.favoriteDisciplineCategories.indexOf(cat);
  if (idx >= 0) state.onboarding.favoriteDisciplineCategories.splice(idx, 1);
  else state.onboarding.favoriteDisciplineCategories.push(cat);
  render();
}

// Sélection générique de l'objectif cardio
function onbSelectCardioObjective(obj) {

  state.onboarding.marathonObjective = obj;

}
// Legacy alias
function onbSelectMarathonObjective(obj) { onbSelectCardioObjective(obj); }

async function onbFinish() {
  const o = state.onboarding;
  const disc = findDiscipline(o.disciplineId);
  const prog = findProgram(o.programId);
  if (!disc || !prog) return;

  const profile = {
    disciplineId: o.disciplineId,
    programId: o.programId,
    duration: o.duration,
    durationUnit: prog.durationUnit,
    age: parseInt(state.onboarding.profileForm.age) || null,
    weight: parseFloat(state.onboarding.profileForm.weight) || null,
    height: parseFloat(state.onboarding.profileForm.height) || null,
    sportStatus: state.onboarding.profileForm.sportStatus || null,
    limitations: state.onboarding.profileForm.limitations || '',
    discipline: (state.onboarding.profileForm.discipline || '').trim(),
    disciplineFreq: state.onboarding.profileForm.disciplineFreq || 'jamais',
    medicalAcknowledged: disc.warning ? o.medicalAck : false,
    programOptions: o.cardioObjective ? { cardioObjective: o.cardioObjective, marathonObjective: o.cardioObjective } : {},
    // Convertit les catégories cochées en IDs individuels
    favoriteDisciplineIds: (o.favoriteDisciplineCategories && o.favoriteDisciplineCategories.length > 0)
      ? LEXIQUE.filter(l => o.favoriteDisciplineCategories.includes(l.cat)).map(l => l.id)
      : ((state.settings.profile && state.settings.profile.favoriteDisciplineIds) || []),
    createdAt: new Date().toISOString().slice(0, 10),
    programImplemented: !!prog.implemented
  };

  state.settings.profile = profile;
  saveState();

  if (sb && state.user) {
    try {
      await sb.auth.updateUser({ data: {
        startDate: state.settings.startDate,
        manualPhase: state.settings.manualPhase,
        profile
      } });
    } catch (e) { console.warn('Failed to sync profile:', e.message); }
  }

  state.view = 'training';
  state.tab = 'training';
  render();
}

function renderOnboarding() {

  if (s === 4.5) return renderOnbFavorites();

function renderOnbMarathon() {

function renderOnbProgress(current) {
  // 5 puces : Discipline · Programme · Durée · Profil · Récap
  const steps = [1, 2, 3, 4, 5];
  const marker = current === 3.5 ? 3 : Math.floor(current);
  const cancelBtn = state.onboarding.isEditing ? `
    <button class="onb-cancel-btn" onclick="cancelOnboarding()" aria-label="Annuler la modification">
      <span class="onb-cancel-icon">×</span>
      <span class="onb-cancel-label">Annuler</span>
    </button>` : '';
  return `
    <div class="onb-progress-wrap">
      <div class="onb-progress">
        ${steps.map(n => {
          let cls = '';
          if (n < marker) cls = 'done';
          else if (n === marker) cls = 'active';
          return `<div class="onb-progress-dot ${cls}"></div>`;
        }).join('')}
      </div>
      ${cancelBtn}
    </div>`;
}

// ============================================================
//  AUDIO + WAKE
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) state.audioCtx = new AC(); } catch (e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}
function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) {}
}
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
// Signal au démarrage d'un chrono : deux notes montantes (attaque)
function signalStart() { beep(660, 0.12); setTimeout(() => beep(880, 0.15), 130); vibrate([100, 40, 140]); }
// Signal 10 sec avant la fin : double bip aigu (warning)
function signalWarning() { beep(920, 0.10); setTimeout(() => beep(920, 0.10), 180); vibrate([80, 40, 80]); }
// Signal petit bip pour countdown 3/2/1
function signalCountdown() { beep(440, 0.08); vibrate(60); }
// Signal à la fin d'un chrono : deux notes descendantes (expiration)
function signalEnd() { beep(500, 0.25); setTimeout(() => beep(360, 0.35), 250); vibrate([180, 80, 240]); }
// Signal fin de séance complète : mélodie triomphale
function signalComplete() { beep(660, 0.15); setTimeout(() => beep(880, 0.15), 180); setTimeout(() => beep(1100, 0.3), 360); vibrate([200, 80, 200, 80, 400]); }
// Legacy alias
function signalTransition() { signalStart(); }
async function requestWakeLock() { if ('wakeLock' in navigator) { try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } }
function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release().catch(()=>{}); state.wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.timer.running) requestWakeLock(); });

// ============================================================
//  TIMER
// ============================================================
function getCurrentSession() {
  let s = null;
  if (state.sessionKind === 'stretching') s = STRETCHING;
  else if (state.sessionKind === 'bonus') s = BONUS.find(b => b.id === state.sessionId);
  else if (state.sessionKind === 'cardio') s = buildCardioSession(state.sessionId, state.sessionSubtype);
  else if (state.sessionKind === 'renfo') {
    // Route selon subtype (nouveaux programmes)
    const RENFO_MAP = {
      'renfo-marathon': RENFO_MARATHON,
      'renfo-marathon-leger': RENFO_MARATHON_LEGER,
      'renfo-fondation': RENFO_FONDATION,
      'renfo-hypertrophie': RENFO_HYPERTROPHIE,
      'renfo-force-max': RENFO_FORCE_MAX,
      'renfo-mobilite-posture': RENFO_MOBILITE_POSTURE,
      'renfo-medical-leger': RENFO_MEDICAL_LEGER,
      'renfo-wellness': RENFO_WELLNESS,
      'renfo-post-covid': RENFO_POST_COVID,
      'renfo-apres-cancer': RENFO_APRES_CANCER,
      'renfo-cardio-readapt': RENFO_CARDIO_READAPT,
      'renfo-ortho': RENFO_ORTHO,
      'renfo-chronic': RENFO_CHRONIC,
      'renfo-reprise': RENFO_REPRISE,
      'renfo-perte-poids': RENFO_PERTE_POIDS,
      'renfo-maintenance': RENFO_MAINTENANCE,
      'renfo-combat-competition': RENFO_COMBAT_COMPETITION,
      'renfo-combat-controle': RENFO_COMBAT_CONTROLE,
      'renfo-tennis-padel': RENFO_TENNIS_PADEL,
      'renfo-surf': RENFO_SURF,
      'renfo-escalade': RENFO_ESCALADE,
      'renfo-yoga': RENFO_YOGA,
      'renfo-pilates': RENFO_PILATES,
      'renfo-calisthenie': RENFO_CALISTHENIE
    };
    if (RENFO_MAP[state.sessionId]) s = RENFO_MAP[state.sessionId];
    else s = RENFO_ROTATION.find(r => r.id === state.sessionId);
  }
  if (!s) return null;
  // Modulation profil pour renfo et bonus
  if (state.sessionKind === 'renfo' || state.sessionKind === 'bonus') {
    const modSteps = moduleSessionSteps(s.steps);
    const modPlan = (s.plan || []).map(section => ({
      ...section,
      items: (section.items || []).map(it => ({ ...it, t: moduleSetsLabel(it.t) }))
    }));
    return { ...s, steps: modSteps, plan: modPlan };
  }
  return s;
}
function activeSteps() { const s = getCurrentSession(); return s ? s.steps : []; }
function currentStep() { return activeSteps()[state.timer.stepIdx]; }

function startTimer() {
  ensureAudio(); requestWakeLock();
  state.timer.running = true; state.timer.paused = false;
  state.timer.stepIdx = 0; state.timer.stepElapsed = 0; state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  // Signal de départ si la première étape a un chrono
  const firstStep = currentStep();
  if (firstStep && (firstStep.type === 'time' || firstStep.type === 'rest')) {
    setTimeout(() => signalStart(), 200);
  }
  render();
}
function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    // Warning à 10 sec restantes (une seule fois, pas continu)
    if (remaining === 10) signalWarning();
    // Countdown 3, 2, 1
    if (remaining <= 3 && remaining > 0) signalCountdown();
    // Fin de chrono → son distinct puis on avance
    if (state.timer.stepElapsed >= step.duration) {
      signalEnd();
      advance();
      return;
    }
  }
  updateTimerUI();
}
function togglePause() { state.timer.paused = !state.timer.paused; render(); }
function advance() {
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  // Signal de démarrage uniquement si le nouveau step a un chrono qui tourne
  const newStep = currentStep();
  if (newStep && (newStep.type === 'time' || newStep.type === 'rest')) {
    signalStart();
  }
  render();
}
function skipStep() {
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false;
  releaseWakeLock(); signalComplete();
  if (state.sessionKind === 'cardio') { state.view = 'cardio-stats'; render(); return; }
  if (state.sessionKind === 'renfo') {
    state.week.renfo.done = true;
    state.week.renfo.variantId = state.sessionId;
    saveState();
  }
  if (state.sessionKind === 'bonus') {
    state.week.bonusCount = (state.week.bonusCount || 0) + 1;
    saveState();
  }
  state.view = 'complete';
  render();
}
function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false; state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home'; render();
}

function submitCardioStats() {

      const weight = (state.settings.profile && state.settings.profile.weight) || 75;
      const durH = duration / 60;
      km = Math.round(((watts * durH * 3.6) / (weight * 0.9)) * 10) / 10;

    } else if (mode === 'vitesse-resistance') {

      const resistance = parseFloat(document.getElementById('vi-resistance').value) || 5;

      deniv = parseFloat(document.getElementById('vi-deniv-sim').value) || 0;

// Calcule le score qualité d'allure d'une séance cardio (0-100)
// Compare l'allure/vitesse/watts/rpe réalisée à la cible de la phase.
// paceReal, paceTarget : plus PETIT = mieux (min/km) pour course
// speedReal, speedTarget : plus GRAND = mieux (km/h) pour vélo
// wattsReal, wattsTarget : plus GRAND = mieux pour vélo intérieur mode watts
// rpeReal, rpeTarget : proche de la cible = mieux (Borg)
function computePaceScore(type, data, target) {
  // Course : allure min/km, plus rapide = mieux
  if (type === 'course') {
    if (!data.duration || !data.km) return null;
    const paceReal = data.duration / data.km;
    const paceTarget = target.pace;
    if (!paceTarget) return null;
    // Plus rapide ou pile : 100%. Puis dégradation progressive.
    const ratio = paceReal / paceTarget; // 1.0 = pile, >1 = plus lent
    if (ratio <= 1.0) return 100;
    if (ratio <= 1.10) return Math.round(100 - (ratio - 1.0) * 150); // 100 → 85 à 1.10
    if (ratio <= 1.25) return Math.round(85 - (ratio - 1.10) * 167); // 85 → 60 à 1.25
    return Math.max(30, Math.round(60 - (ratio - 1.25) * 80));
  }
  // Vélo extérieur : moyenne km/h, plus rapide = mieux
  if (type === 'velo') {
    if (!data.duration || !data.km) return null;
    const kmhReal = data.km / (data.duration / 60);
    const kmhTarget = target.kmh;
    if (!kmhTarget) return null;
    const ratio = kmhReal / kmhTarget; // 1.0 = pile, >1 = plus rapide
    if (ratio >= 1.0) return 100;
    if (ratio >= 0.90) return Math.round(100 - (1.0 - ratio) * 150);
    if (ratio >= 0.75) return Math.round(85 - (0.90 - ratio) * 167);
    return Math.max(30, Math.round(60 - (0.75 - ratio) * 80));
  }
  // Vélo intérieur : dépend du mode saisi
  if (type === 'velo-int') {
    if (data.mode === 'watts' && data.watts && target.watts) {
      const ratio = data.watts / target.watts;
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.90) return Math.round(100 - (1.0 - ratio) * 150);
      if (ratio >= 0.75) return Math.round(85 - (0.90 - ratio) * 167);
      return Math.max(30, Math.round(60 - (0.75 - ratio) * 80));
    }
    if (data.mode === 'rpe' && data.rpe && target.rpe) {
      // RPE : proche de la cible = 100%, écart de ±2 = dégradation
      const diff = Math.abs(data.rpe - target.rpe);
      if (diff <= 0.5) return 100;
      if (diff <= 1.5) return Math.round(100 - (diff - 0.5) * 15);
      return Math.max(50, Math.round(85 - (diff - 1.5) * 20));
    }
    if (data.mode === 'vitesse-resistance' && data.km && data.duration) {
      // Résistance × cadence estimée. On juge par la vitesse virtuelle rapportée à la durée.
      const kmhReal = data.km / (data.duration / 60);
      const ratio = kmhReal / 22; // baseline arbitraire 22 km/h
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.85) return Math.round(100 - (1.0 - ratio) * 150);
      return Math.max(40, Math.round(75 - (0.85 - ratio) * 100));
    }
    if (data.mode === 'simule' && data.km && data.duration) {
      // Vitesse simulée : compare km/h à la cible de la phase (baseline vélo)
      const kmhReal = data.km / (data.duration / 60);
      const kmhTarget = target.kmh || 22;
      const ratio = kmhReal / kmhTarget;
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.85) return Math.round(100 - (1.0 - ratio) * 150);
      return Math.max(40, Math.round(75 - (0.85 - ratio) * 100));
    }
    return null;
  }
  return null;
}

function computeCardioScore(type, duration, km, deniv, extraData) {
  const phase = currentPhase();
  const t = CARDIO_TARGETS[type][phase];
  const w = PHASE_WEIGHTS[phase];

  // Sous-scores km et D+, cap à 120%
  const sKm = t.km > 0 ? Math.min(120, (km / t.km) * 100) : 100;
  const sVert = t.deniv > 0 ? Math.min(120, (deniv / t.deniv) * 100) : 100;

  // Score allure. extraData permet de passer mode/watts/rpe pour vélo intérieur.
  const paceData = { duration, km, ...(extraData || {}) };
  const pace = computePaceScore(type, paceData, t);
  const sPace = pace !== null ? pace : 100; // fallback neutre si allure non calculable

  // Score composite
  const score = (sKm * w.km) + (sVert * w.vertical) + (sPace * w.pace);

  // Allure numérique pour affichage (min/km course, km/h vélo, watts/RPE vélo int)
  const paceMinKm = (type === 'course' && km > 0 && duration > 0) ? duration / km : null;
  const speedKmh = ((type === 'velo' || type === 'velo-int') && km > 0 && duration > 0) ? km / (duration / 60) : null;

  // NET conservé pour compat legacy
  const net = Math.round((duration || 0) + (deniv / 10));

  let cls, title;
  if (score >= 100) { cls = 'above'; title = 'Au-dessus'; }
  else if (score >= 85) { cls = 'on-target'; title = 'Dans la cible'; }
  else { cls = 'below'; title = 'En-dessous'; }

  return {
    score: Math.round(score),
    net,
    sVol: Math.round(sKm),
    sVert: Math.round(sVert),
    sPace: Math.round(sPace),
    sEnd: null,
    pace: paceMinKm,
    speedKmh,
    weights: w,
    target: t,
    cls,
    title
  };
}

// Legacy alias kept for backward compat with any leftover callsites
function computeVerdict(type, duration, km, deniv) {
  const r = computeCardioScore(type, duration, km, deniv);
  return {
    cls: r.cls,
    title: r.title,
    desc: `${r.score}% de la cible pondérée · NET ${r.net} min équivalent plat`,
    score: r.score,
    net: r.net,
    sEnd: r.sEnd,
    sVol: r.sVol,
    sVert: r.sVert
  };
}

function getRecentWeeks(n = 8) {
  // Returns last N weeks with current week last, filling in empty weeks
  const now = new Date();
  const currentMonday = getMondayOfWeek(now);
  const startDate = state.settings.startDate ? new Date(state.settings.startDate) : null;
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) {
    const monday = new Date(currentMonday);
    monday.setDate(monday.getDate() - i * 7);
    const wkId = getWeekId(monday);
    const beforeStart = startDate ? (monday < startDate) : false;
    let wk;
    if (wkId === state.week.id) {
      wk = state.week;
    } else {
      wk = state.weekHistory.find(w => w.id === wkId);
    }
    if (!wk) {
      wk = { id: wkId, monday: monday.toISOString().slice(0, 10), boxe: {done: false, score: 0}, cardio: {done: false}, renfo: {done: false}, bonusCount: 0, empty: true };
    }
    wk.beforeStart = beforeStart;
    weeks.push(wk);
  }
  return weeks;
}

function filterActiveWeeks(weeks) {
  return weeks.filter(w => !w.beforeStart);
}

function computeBoxeStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const scores = activeWeeks.map(w => w.boxe && w.boxe.done ? (w.boxe.score || 3) : 0);
  const target = activeWeeks.map(() => 4);
  const total = scores.filter(s => s > 0).length;
  const withScores = scores.filter(s => s > 0);
  const avgScore = withScores.length ? (withScores.reduce((a, b) => a + b, 0) / withScores.length).toFixed(1) : '–';
  return { scores, target, total, avgScore, n: activeWeeks.length };
}

function computeCardioStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const pcts = activeWeeks.map(w => {
    if (!w.cardio || !w.cardio.done) return 0;
    const r = computeCardioScore(w.cardio.type, w.cardio.duration, w.cardio.km, w.cardio.deniv || 0);
    return r.score;
  });
  const target = activeWeeks.map(() => 100);
  const totalDone = pcts.filter(p => p > 0).length;
  const totalMin = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.duration || 0) : 0), 0);
  const totalKm = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.km || 0) : 0), 0);
  const totalNET = activeWeeks.reduce((sum, w) => {
    if (!w.cardio || !w.cardio.done) return sum;
    return sum + (w.cardio.duration || 0) + ((w.cardio.deniv || 0) / 10);
  }, 0);
  return { pcts, target, totalDone, totalMin, totalKm, totalNET, n: activeWeeks.length };
}

function computeRenfoStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const counts = activeWeeks.map(w => (w.renfo && w.renfo.done ? 1 : 0) + (w.bonusCount || 0));
  const target = activeWeeks.map(() => 1);
  const totalRenfo = activeWeeks.filter(w => w.renfo && w.renfo.done).length;
  const totalBonus = activeWeeks.reduce((sum, w) => sum + (w.bonusCount || 0), 0);
  return { counts, target, totalRenfo, totalBonus, n: activeWeeks.length };
}

// ============================================================
//  SVG LINE CHART
// ============================================================
function drawLineChart(actualData, targetData, opts = {}) {
  const { width = 400, height = 100, minY = 0 } = opts;
  let maxY = opts.maxY;
  if (maxY === undefined) {
    const allVals = [...actualData, ...targetData];
    maxY = Math.max(...allVals, 1) * 1.15;
  }
  const padding = 6;
  const chartW = width - padding * 2;
  const chartH = height - padding * 2;
  const range = maxY - minY;
  const n = actualData.length;
  if (n === 0) return '';

  const xScale = (i) => padding + (n === 1 ? chartW/2 : (i / (n - 1)) * chartW);
  const yScale = (v) => padding + chartH - ((v - minY) / range) * chartH;

  const targetPath = targetData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const actualPath = actualData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const areaPath = `${actualPath} L ${xScale(n - 1)} ${yScale(minY)} L ${xScale(0)} ${yScale(minY)} Z`;

  const points = actualData.map((v, i) => {
    if (v === 0 && i < n - 1) return ''; // skip zero points except last (current) week
    return `<circle cx="${xScale(i)}" cy="${yScale(v)}" r="3" fill="#C9A44E"/>`;
  }).join('');

  return `
    <svg class="stat-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gold-grad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#C9A44E" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#C9A44E" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#gold-grad)"/>
      <path d="${targetPath}" stroke="#A19E97" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
      <path d="${actualPath}" stroke="#C9A44E" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      ${points}
    </svg>`;
}

// Parse "3 × 12" ou "3 × 12/j" ou "10" en total de reps
function parseReps(str) {
  if (!str) return 0;
  const clean = String(str).replace(/,/g, '.');
  const perSide = /\/j|\/côté|\/side/i.test(clean);
  const setsReps = clean.match(/(\d+)\s*[×x]\s*(\d+)/);
  if (setsReps) {
    const total = parseInt(setsReps[1]) * parseInt(setsReps[2]);
    return perSide ? total * 2 : total;
  }
  const single = clean.match(/^(\d+)/);
  if (single) {
    const n = parseInt(single[1]);
    return perSide ? n * 2 : n;
  }
  return 0;
}

// Regarde le nom d'un step et retourne la catégorie d'exo (ou null)
function categorizeExercise(name) {
  if (!name) return null;
  const n = name.toLowerCase();
  if (/(pomp[eé]|push[- ]?up|dips)/.test(n)) return 'pompes';
  if (/squat/.test(n)) return 'squats';
  if (/fente|lunge/.test(n)) return 'fentes';
  if (/(bridge|hip thrust|glute)/.test(n)) return 'bridges';
  if (/rowing|rameur|tirage|row/.test(n)) return 'rows';
  if (/(burpee|burpe)/.test(n)) return 'burpees';
  if (/mountain climber/.test(n)) return 'mountain';
  if (/(pallof|dead ?bug|bird ?dog|superman)/.test(n)) return 'core';
  return null;
}

// Résout le template complet d'une session renfo terminée
function resolveRenfoTemplate(session) {
  if (!session || session.slot !== 'renfo' || !session.done) return null;
  const RENFO_MAP = {
    'marathon': RENFO_MARATHON, 'marathon-leger': RENFO_MARATHON_LEGER,
    'fondation': RENFO_FONDATION, 'hypertrophie': RENFO_HYPERTROPHIE,
    'force-max': RENFO_FORCE_MAX, 'mobilite-posture': RENFO_MOBILITE_POSTURE,
    'medical-leger': RENFO_MEDICAL_LEGER, 'wellness': RENFO_WELLNESS,
    'post-covid': RENFO_POST_COVID, 'apres-cancer': RENFO_APRES_CANCER,
    'cardio-readapt': RENFO_CARDIO_READAPT, 'ortho': RENFO_ORTHO,
    'chronic': RENFO_CHRONIC, 'reprise': RENFO_REPRISE,
    'perte-poids': RENFO_PERTE_POIDS, 'maintenance': RENFO_MAINTENANCE,
    'combat-competition': RENFO_COMBAT_COMPETITION
  };
  if (session.subtype && RENFO_MAP[session.subtype]) return RENFO_MAP[session.subtype];
  // Fallback rotation Cervin
  const variantId = (session.data && session.data.variantId) || null;
  if (variantId) return RENFO_ROTATION.find(r => r.id === variantId);
  return null;
}

// Extrait les compteurs d'exos d'une séance renfo terminée
function countExercisesInSession(session) {
  const template = resolveRenfoTemplate(session);
  if (!template || !template.steps) return {};
  const counts = {};
  let gainageSec = 0;
  template.steps.forEach(step => {
    if (step.type === 'reps' && step.reps) {
      const cat = categorizeExercise(step.name);
      if (cat) {
        counts[cat] = (counts[cat] || 0) + parseReps(step.reps);
      }
    } else if (step.type === 'time' && step.label && /gainage/i.test(step.label)) {
      gainageSec += (step.duration || 0);
    }
  });
  if (gainageSec > 0) counts.gainageSec = gainageSec;
  return counts;
}

// Détermine si le programme actuel a du cardio dans son template
function programHasCardio() {
  const p = state.settings && state.settings.profile;
  if (!p) return true;
  const prog = findProgram(p.programId);
  if (!prog || !prog.weeklyTemplate) return true;
  return Object.values(prog.weeklyTemplate).some(phase =>
    Array.isArray(phase) && phase.some(item => item.slot === 'cardio')
  );
}

// Détermine si le programme actuel a du renfo dans son template
function programHasRenfo() {
  const p = state.settings && state.settings.profile;
  if (!p) return true;
  const prog = findProgram(p.programId);
  if (!prog || !prog.weeklyTemplate) return true;

// Détecte si le programme actuel est un programme médical
function isMedicalProgram() {
  const p = state.settings && state.settings.profile;

}

// Retourne les milestones temporels depuis le démarrage du programme
function getProgramMilestones() {
  const p = state.settings && state.settings.profile;
  if (!p || !p.createdAt) return null;
  const start = new Date(p.createdAt);
  const now = new Date();
  const daysSince = Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
  const weeksSince = Math.floor(daysSince / 7);
  const milestones = [
    { week: 1, label: 'Première semaine', desc: 'Le plus dur, c\'est de commencer.' },
    { week: 3, label: 'Trois semaines', desc: 'L\'habitude commence à s\'installer.' },
    { week: 6, label: 'Six semaines', desc: 'Le corps s\'adapte, l\'énergie revient.' },
    { week: 12, label: 'Trois mois', desc: 'Une transformation profonde s\'opère.' },
    { week: 24, label: 'Six mois', desc: 'Tu ne fais plus semblant. C\'est ta vie.' },
    { week: 52, label: 'Un an', desc: 'Une année de discipline. Une nouvelle version de toi.' }
  ];
  const achieved = milestones.filter(m => weeksSince >= m.week);
  const next = milestones.find(m => weeksSince < m.week);
  const lastAchieved = achieved.length > 0 ? achieved[achieved.length - 1] : null;
  return { daysSince, weeksSince, achieved, next, lastAchieved, milestones };
}

// Fonction principale : agrège toutes les stats de l'utilisateur
function aggregateUniversStats() {
  const weeks = allValidWeeks();
  const historyByWeek = {};
  (state.cardioHistory || []).forEach(e => {
    if (!e.weekId) return;
    if (!historyByWeek[e.weekId]) historyByWeek[e.weekId] = [];
    historyByWeek[e.weekId].push(e);
  });

  const allCardio = [];
  weeks.forEach(w => {
    const wid = w.id;
    const wMonday = w.monday || null;
    const hist = historyByWeek[wid] || [];
    let histIdx = 0;
    (w.sessions || []).forEach(s => {
      if (s.slot !== 'cardio' || !s.done) return;
      const data = s.data || {};
      // Cherche entry cardioHistory correspondant (par type si possible)
      const matchByType = hist.find(h => h.type === data.type && !h.__matched);
      const match = matchByType || hist[histIdx];
      if (match) { match.__matched = true; histIdx++; }
      allCardio.push({
        date: (match && match.date) || wMonday,
        weekId: wid,
        type: data.type || (match && match.type) || 'course',
        duration: parseFloat(data.duration) || (match ? parseFloat(match.duration) : 0) || 0,
        km: parseFloat(data.km) || (match ? parseFloat(match.km) : 0) || 0,
        deniv: parseFloat(data.deniv) || (match ? parseFloat(match.deniv) : 0) || 0,
        extraData: data.extraData || (match ? match.extraData : null),
        phase: match ? match.phase : null
      });
    });
  });
  // Nettoyage flag temporaire
  (state.cardioHistory || []).forEach(e => delete e.__matched);

  // Totaux cardio globaux
  const totalKm = allCardio.reduce((a, e) => a + (e.km || 0), 0);
  const totalDeniv = allCardio.reduce((a, e) => a + (e.deniv || 0), 0);
  const totalCardioMin = allCardio.reduce((a, e) => a + (e.duration || 0), 0);

  // Ségrégation par type
  const byType = {
    course:     { km: 0, deniv: 0, duration: 0, count: 0, label: 'Course', emoji: '🏃', color: 'var(--ink)' },
    velo:       { km: 0, deniv: 0, duration: 0, count: 0, label: 'Vélo ext.', emoji: '🚴', color: 'var(--gold-deep)' },
    'velo-int': { km: 0, deniv: 0, duration: 0, count: 0, label: 'Vélo int.', emoji: '🚲', color: 'var(--rust, #a04530)' }
  };
  allCardio.forEach(e => {
    const t = byType[e.type] || byType.course;
    t.km += e.km || 0;
    t.deniv += e.deniv || 0;
    t.duration += e.duration || 0;
    t.count++;
  });

  // Km parcourus par mois × type (pour courbes)
  const now = new Date();
  const monthLabels = [];
  const monthKeys = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    monthKeys.push(ym);
    monthLabels.push(['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()]);
  }
  const kmByMonthType = { course: [], velo: [], 'velo-int': [] };
  monthKeys.forEach(k => {
    Object.keys(kmByMonthType).forEach(t => kmByMonthType[t].push(0));
  });
  allCardio.forEach(e => {
    if (!e.date) return;
    const ym = e.date.slice(0, 7);
    const idx = monthKeys.indexOf(ym);
    if (idx < 0) return;
    const t = e.type in kmByMonthType ? e.type : 'course';
    kmByMonthType[t][idx] += e.km || 0;
  });

  // Totaux sessions
  let totalSessions = 0;
  const bySlot = { cardio: 0, renfo: 0, discipline: 0 };
  weeks.forEach(w => {
    (w.sessions || []).forEach(s => {
      if (s.done) {
        totalSessions++;
        bySlot[s.slot] = (bySlot[s.slot] || 0) + 1;
      }
    });
  });

  // Répartition jours de la semaine (Lun-Dim)
  const byDay = [0, 0, 0, 0, 0, 0, 0];
  const dayLabels = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  allCardio.forEach(e => {
    if (e.date) {
      const d = new Date(e.date);
      const js = d.getDay();
      const idx = js === 0 ? 6 : js - 1;
      byDay[idx]++;
    }
  });
  const maxByDay = Math.max(...byDay, 1);
  const bestDayIdx = byDay.indexOf(Math.max(...byDay));

  // Activité par mois (12 derniers mois)
  const monthValues = new Array(12).fill(0);
  allCardio.forEach(e => {
    if (!e.date) return;
    const idx = monthKeys.indexOf(e.date.slice(0, 7));
    if (idx >= 0) monthValues[idx]++;
  });
  const maxByMonth = Math.max(...monthValues, 1);

  // Records
  const maxDuration = Math.max(0, ...allCardio.map(e => e.duration || 0));
  const maxKm = Math.max(0, ...allCardio.map(e => e.km || 0));
  const maxDeniv = Math.max(0, ...allCardio.map(e => e.deniv || 0));

  // Streak actuel
  const orderedWeeks = [...weeks].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
  let currentStreak = 0;
  for (let i = orderedWeeks.length - 1; i >= 0; i--) {
    const w = orderedWeeks[i];
    const requiredDone = countRequiredDoneInWeek(w);
    const requiredCount = (w.sessions || []).filter(s => !s.optional).length;
    if (requiredCount > 0 && requiredDone >= requiredCount) currentStreak++;
    else break;
  }

  // Compteurs d'exos
  const exos = {};
  weeks.forEach(w => {
    (w.sessions || []).forEach(s => {
      if (s.slot === 'renfo' && s.done) {
        const counts = countExercisesInSession(s);
        for (const key in counts) {
          exos[key] = (exos[key] || 0) + counts[key];
        }
      }
    });
  });

  return {
    totalSessions, totalKm, totalDeniv, totalCardioMin,
    byType, kmByMonthType, monthKeys, monthLabels,
    bySlot, byDay, dayLabels, maxByDay, bestDayIdx,
    monthValues, maxByMonth,
    maxDuration, maxKm, maxDeniv, currentStreak,
    exos, allCardio
  };
}

// Formatage helpers
function fmtNum(n) {
  n = Math.round(n);
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
  return String(n);
}
function fmtHours(min) {
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  if (h === 0) return `${m}min`;
  return `${h}h${m > 0 ? String(m).padStart(2,'0') : ''}`;
}
function fmtSec(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  if (m === 0) return `${s}s`;
  return `${m}min${s > 0 ? String(s).padStart(2,'0') : ''}`;
}

function renderKmProgressionChart(s) {
  const series = [
    { key: 'course', label: 'Course', emoji: '🏃', color: 'var(--ink)', stroke: '#1a1a1a' },
    { key: 'velo', label: 'Vélo ext.', emoji: '🚴', color: 'var(--gold-deep)', stroke: '#8B6D2F' },
    { key: 'velo-int', label: 'Vélo int.', emoji: '🚲', color: 'var(--rust)', stroke: '#a04530' }
  ];
  // Max Y sur toutes séries confondues
  const allValues = series.flatMap(sr => s.kmByMonthType[sr.key] || []);
  const maxY = Math.max(1, ...allValues);
  const anyData = allValues.some(v => v > 0);
  if (!anyData) return '';

  const W = 320, H = 140, padL = 24, padR = 8, padT = 8, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = s.monthLabels.length;
  const stepX = n > 1 ? chartW / (n - 1) : 0;
  const scaleY = (v) => padT + chartH - (v / maxY) * chartH;

  // Grille horizontale (3 lignes)
  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + chartH * (1 - f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${f === 0 ? '0' : '3 3'}"/>`;
  }).join('');

  // Axe Y labels
  const yLabels = [maxY, maxY/2, 0].map((v, i) => {
    const y = padT + chartH * (i * 0.5);
    return `<text x="${padL - 6}" y="${y + 3}" font-family="var(--font-mono)" font-size="9" fill="var(--ink-soft)" text-anchor="end">${Math.round(v)}</text>`;
  }).join('');

  // X labels (mois)
  const xLabels = s.monthLabels.map((lbl, i) => {
    const x = padL + i * stepX;
    return `<text x="${x}" y="${H - 6}" font-family="var(--font-mono)" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${lbl}</text>`;
  }).join('');

  // Une ligne par série
  const lines = series.map(sr => {
    const values = s.kmByMonthType[sr.key] || [];
    if (values.every(v => v === 0)) return '';
    const pts = values.map((v, i) => `${padL + i * stepX},${scaleY(v)}`).join(' ');
    const dots = values.map((v, i) => v > 0 ? `<circle cx="${padL + i * stepX}" cy="${scaleY(v)}" r="3" fill="${sr.stroke}"/>` : '').join('');
    return `<polyline points="${pts}" fill="none" stroke="${sr.stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  const legend = series.map(sr => {
    const total = (s.kmByMonthType[sr.key] || []).reduce((a, b) => a + b, 0);
    if (total === 0) return '';
    return `<div class="chart-legend-item"><span class="chart-legend-dot" style="background: ${sr.stroke}"></span><span>${sr.emoji} ${sr.label}</span></div>`;
  }).join('');

  return `
    <div class="univers-card">
      <div class="uni-card-title">Kilomètres par mois</div>
      <div class="km-chart-wrap">
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="km-chart-svg">
          ${gridLines}
          ${yLabels}
          ${lines}
          ${xLabels}
        </svg>
      </div>
      <div class="chart-legend">${legend}</div>
    </div>`;
}

      <div class="milestone-achieved">
        <div class="milestone-achieved-label">${lastLabel}</div>
        <div class="milestone-achieved-desc">${lastDesc}</div>
      </div>` : ''}
      <div class="milestone-next">${nextLabel}</div>
      <div class="milestones-track">
        ${m.milestones.map(mile => {
          const done = m.weeksSince >= mile.week;
          const isNext = m.next && m.next.week === mile.week;
          return `<div class="milestone-dot ${done ? 'done' : ''} ${isNext ? 'next' : ''}" title="${mile.label}">
            <div class="milestone-dot-week">${mile.week}s</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderCockpit() {
  const N = 8;
  const weeks = getRecentWeeks(N);
  const boxe = computeBoxeStats(weeks);
  const cardio = computeCardioStats(weeks);
  const renfo = computeRenfoStats(weeks);
  const hasAnyData = boxe.total > 0 || cardio.totalDone > 0 || renfo.totalRenfo > 0 || renfo.totalBonus > 0;

  const boxeChart = drawLineChart(boxe.scores, boxe.target, { maxY: 5.5 });
  const cardioChart = drawLineChart(cardio.pcts, cardio.target, { maxY: 130 });
  const renfoChart = drawLineChart(renfo.counts, renfo.target, { maxY: Math.max(3, Math.max(...renfo.counts, 0) + 1) });

  // Semainier — dots des sessions du template
  const currentId = state.week.id;
  const target = weeklyTarget();
  const weekCellsHTML = weeks.map(w => {
    if (!w.sessions) w = migrateOldWeek(w);
    const requiredDone = countRequiredDoneInWeek(w);
    const requiredCount = (w.sessions || []).filter(s => !s.optional).length;
    const isFull = requiredCount > 0 && requiredDone >= requiredCount && !w.beforeStart;
    const isCurrent = w.id === currentId;
    const beforeStart = !!w.beforeStart;
    const sessions = w.sessions || [];
    // Ordonne : obligatoires d'abord, optionnelles après
    const sorted = [...sessions].sort((a, b) => (a.optional ? 1 : 0) - (b.optional ? 1 : 0));
    const dots = sorted.map(s => {
      const doneSlot = !beforeStart && s.done;
      const optCls = s.optional ? 'optional' : '';
      return `<div class="week-dot ${doneSlot ? 'done' : ''} ${optCls}"></div>`;
    }).join('');
    return `
      <div class="week-cell ${isFull ? 'full' : ''} ${isCurrent ? 'current' : ''} ${beforeStart ? 'before-start' : ''}">
        <div class="week-cell-dots">${dots}</div>
        <div class="week-label">S${shortWeekLabel(w.id)}</div>

function fmtDuration(sec) {
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return s > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${m} min`;
  }
  return `${sec}s`;
}

function renderStepsDetail(session) {
  if (!session.steps || !session.steps.length) return '';
  const nbActive = session.steps.filter(s => s.type !== 'rest').length;
  let stepNum = 0;
  const linesHTML = session.steps.map(s => {
    if (s.type === 'rest') {
      return `<div class="step-line rest">↓ repos ${s.duration}s</div>`;
    }
    stepNum++;
    let info = '';
    if (s.type === 'reps') info = s.reps || '';
    else if (s.type === 'time') info = fmtDuration(s.duration);
    return `
      <div class="step-line">
        <div class="step-line-num">${String(stepNum).padStart(2,'0')}</div>
        <div class="step-line-name">${s.name}</div>
        <div class="step-line-info">${info}</div>
      </div>`;
  }).join('');
  return `
    <div class="steps-detail">
      <div class="steps-detail-head">
        <div class="steps-detail-title">Toutes les étapes</div>
        <div class="steps-detail-count">${nbActive} exercices</div>
      </div>
      <div class="steps-detail-list">
        ${linesHTML}
      </div>
    </div>`;
}

  const totalSec = state.timer.totalElapsed % 60;

  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  let viewClass = 'exercise';
  if (step.type === 'rest') viewClass = 'rest';
  else if (step.label === 'échauffement' || step.label === 'préparation') viewClass = 'warmup';

  let timerHTML = '', actionHTML = '', stepNameHTML = '', stepSubHTML = '', contextHTML = '', illuHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);

    // Trouve le prochain step non-rest pour l'aperçu
    let next = null;
    for (let i = state.timer.stepIdx + 1; i < steps.length; i++) {
      if (steps[i].type !== 'rest') { next = steps[i]; break; }
    }

    // Rendu spécifique complet pour la vue rest (bypass le layout standard)
    const nextIllu = next ? renderIllustration(next.name, 'large') : '';
    const nextDesc = next ? getExerciseDesc(next.name) : '';
    const nextInfo = next
      ? (next.type === 'reps' ? next.reps : (next.type === 'time' ? `${next.duration} s` : ''))
      : '';
    const nextLabel = next && next.label ? next.label : '';

    const restContent = `
      <div class="rest-screen">
        <div class="rest-timer-wrap">
          <div class="rest-timer-label">Repos</div>
          <div class="rest-timer-value run-timer-value">${timeStr}</div>
          <div class="rest-timer-bar"><div class="rest-timer-bar-fill run-timer-bar-fill" style="width:${pct}%"></div></div>
        </div>
        ${next ? `
          <div class="rest-next-header">Prochain exercice</div>
          ${nextIllu}
          <div class="rest-next-name">${next.name}</div>
          ${nextInfo || nextLabel ? `<div class="rest-next-info">${nextInfo}${nextInfo && nextLabel ? ' · ' : ''}${nextLabel}</div>` : ''}
          ${nextDesc ? `<div class="rest-next-desc">${nextDesc}</div>` : ''}
        ` : `<div class="rest-next-final">Séance presque bouclée.</div>`}
      </div>`;

    return `
      <div class="view running-view rest">
        <div class="run-top">
          <button class="run-quit" onclick="askQuit()">← Quitter</button>
          <div class="run-total">${totalStr}</div>
          <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
            ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
          </button>
        </div>
        <div class="run-progress">${progressHTML}</div>
        <div class="run-content">
          ${restContent}
        </div>
        <button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>
      </div>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    illuHTML = renderIllustration(step.name);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    timerHTML = `
      <div class="run-timer ${viewClass}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    illuHTML = renderIllustration(step.name);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}</div>`;
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `<div class="run-cues"><ul class="run-cues-list">${step.cues.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
  }
  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running-view ${viewClass}">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>
      <div class="run-progress">${progressHTML}</div>
      <div class="run-content">
        ${contextHTML}${illuHTML}${stepNameHTML}${stepSubHTML}${timerHTML}${cuesHTML}${nextPreview}
      </div>
      ${actionHTML}
    </div>`;
}
function askQuit() { confirmDialog('Quitter la séance ?', 'La séance ne sera pas validée.', quitSession, 'Quitter', true); }
function updateTimerUI() {
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-timer-bar-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

function submitCardioStats() {
  const type = state.sessionId;
  const duration = parseFloat(document.getElementById('stats-duration').value) || 0;
  let km = 0, deniv = 0, extraData = null;

  if (type === 'course' || type === 'velo') {
    km = parseFloat(document.getElementById('stats-km').value) || 0;
    deniv = parseFloat(document.getElementById('stats-deniv').value) || 0;
  } else if (type === 'velo-int') {
    const mode = state.veloIntMode || 'rpe';
    if (mode === 'watts') {
      const watts = parseFloat(document.getElementById('vi-watts').value) || 0;
      // Estimation km eq et D+ eq à partir des watts × durée (kJ) et du poids
      const weight = (state.settings.profile && state.settings.profile.weight) || 75;
      const durH = duration / 60;
      km = Math.round(((watts * durH * 3.6) / (weight * 0.9)) * 10) / 10;
      deniv = Math.round(watts * duration / 300);
      extraData = { mode: 'watts', watts };
    } else if (mode === 'vitesse-resistance') {
      km = parseFloat(document.getElementById('vi-km').value) || 0;
      const resistance = parseFloat(document.getElementById('vi-resistance').value) || 5;
      deniv = Math.round(resistance * duration * 2);
      extraData = { mode: 'vitesse-resistance', resistance };
    } else if (mode === 'simule') {
      km = parseFloat(document.getElementById('vi-km-sim').value) || 0;
      deniv = parseFloat(document.getElementById('vi-deniv-sim').value) || 0;
      extraData = { mode: 'simule' };
    } else if (mode === 'rpe') {
      km = parseFloat(document.getElementById('vi-km-rpe').value) || 0;
      const rpe = parseFloat(document.getElementById('vi-rpe').value) || 6;
      deniv = Math.round(rpe * duration * 1.5);
      extraData = { mode: 'rpe', rpe };
    }
  }

  const data = { type, duration, km, deniv, extraData };
  // Trouve la session cardio du template et pousse la validation
  const cardioSession = state.week.sessions ? state.week.sessions.find(s => s.slot === 'cardio' && (s.subtype === type || !s.subtype)) : null;
  if (cardioSession) {
    pushSessionValidation(cardioSession, data);
  } else {
    // Fallback si pas de session dans le template (ne devrait pas arriver)
    state.week.cardio = { done: true, ...data };
  }
  const entry = { date: new Date().toISOString().slice(0,10), weekId: state.week.id, type, duration, km, deniv, phase: currentPhase(), extraData };
  state.cardioHistory.push(entry);
  saveState();
  pushCardioHistoryEntry(entry);
  // v66 · redirige vers session-report pour titre/photo/commentaire
  if (cardioSession) {
    const vals = cardioSession.validations || [];
    state.currentReportValidationRef = vals[vals.length - 1];
    state.view = 'session-report';
  } else {
    state.view = 'complete';
  }
  render();
}
// ============================================================
//  MOTEUR DE SUBSTITUTION AUTOMATIQUE (Sprint 3)
// ============================================================
// Doctrine :
// - 1 substitution max par semaine
// - Cycle glissant de N semaines (N = nombre séances obligatoires au démarrage du cycle)
// - Chaque catégorie substituée devient "obligatoire" jusqu'à la fin du cycle
// - Reset quand : toutes les catégories du cycle sont utilisées OU N semaines écoulées

// Convertit un weekId (ex "2026-W32") en index numérique (nb semaines depuis W1 2020)
function weekIdToIndex(weekId) {
  if (!weekId) return 0;
  const m = weekId.match(/^(\d{4})-W(\d+)$/);
  if (!m) return 0;
  return parseInt(m[1]) * 53 + parseInt(m[2]);
}

// Nombre de semaines entre deux weekIds
function weeksBetween(fromWeekId, toWeekId) {
  return Math.max(0, weekIdToIndex(toWeekId) - weekIdToIndex(fromWeekId));
}

// Compte les séances obligatoires (non-optionnelles) du template actuel
function countRequiredSessions() {
  if (!state.week || !state.week.sessions) return 0;
  return state.week.sessions.filter(s => !s.optional).length;
}

// Initialise ou reset le cycle si nécessaire (nouvelle semaine, cycle terminé, etc.)
function ensureCycleFresh() {
  const cycle = state.substitutionCycle;
  if (!cycle) return;
  const currentWeekId = state.week && state.week.id;
  if (!currentWeekId) return;

  // Reset compteur hebdo si nouvelle semaine
  if (cycle.lastWeekIdSeen !== currentWeekId) {
    cycle.substitutionsThisWeek = 0;
    cycle.lastWeekIdSeen = currentWeekId;
  }

  // Si pas de cycle actif, on n'initialise pas encore (attend la première substitution)
  if (!cycle.cycleStartWeekId) return;

  // Reset cycle si terminé (toutes catégories utilisées OU N semaines écoulées)
  const weeksElapsed = weeksBetween(cycle.cycleStartWeekId, currentWeekId);
  const cycleFullyUsed = cycle.substitutedKeys.length >= cycle.cycleLength;
  const cycleExpired = weeksElapsed >= cycle.cycleLength;
  if (cycleFullyUsed || cycleExpired) {
    cycle.cycleStartWeekId = null;
    cycle.cycleLength = 0;
    cycle.substitutedKeys = [];
  }
}

// Retourne la liste des session.key marquées "obligatoires ce cycle"
function mandatoryKeysThisCycle() {
  ensureCycleFresh();
  const cycle = state.substitutionCycle;
  return (cycle && cycle.substitutedKeys) || [];
}

// Vérifie si une session est marquée obligatoire ce cycle
function isSessionMandatoryThisCycle(session) {
  if (!session) return false;
  return mandatoryKeysThisCycle().includes(session.key);
}

// Tente une substitution automatique quand l'utilisateur valide une discipline.
// Retourne la session substituée, ou null si aucune substitution appliquée.
function tryAutoSubstitute(disciplineData) {
  ensureCycleFresh();
  const cycle = state.substitutionCycle;
  if (!cycle) return null;

  // Condition 1 : max 1 substitution par semaine
  if (cycle.substitutionsThisWeek >= 1) return null;

  // Condition 2 : il faut au moins une catégorie encore substituable
  // Si pas de cycle actif, on peut démarrer un nouveau cycle
  if (!cycle.cycleStartWeekId) {
    // Démarrer un nouveau cycle
    cycle.cycleStartWeekId = state.week.id;
    cycle.cycleLength = countRequiredSessions();
    cycle.substitutedKeys = [];
  }
  const templateRequired = state.week.sessions.filter(s => !s.optional);
  const availableSessions = templateRequired.filter(s => !cycle.substitutedKeys.includes(s.key));
  if (availableSessions.length === 0) return null;

  // Condition 3 : il faut au moins une séance obligatoire non-faite disponible
  const unfinishedAvailable = availableSessions.filter(s => !s.validations || s.validations.length === 0);
  if (unfinishedAvailable.length === 0) return null;

  // Cible : la séance obligatoire non-faite la plus proche de la fin de semaine
  // = la dernière dans l'ordre du template (les premières sont "au début de semaine")
  const targetSession = unfinishedAvailable[unfinishedAvailable.length - 1];

  // Applique la substitution : push une validation avec flag substitutedBy
  pushSessionValidation(targetSession, {
    substitutedBy: 'discipline',
    substitutionData: { ...disciplineData }
  });
  cycle.substitutedKeys.push(targetSession.key);
  cycle.substitutionsThisWeek = 1;

  return targetSession;
}


// Retourne un pourcentage (0 = rien, 100 = objectif atteint, >100 = objectif dépassé)
function calculateCardioScore3D(data, target) {
  if (!target || !data) return null;
  const kmR = (target.km && target.km > 0) ? (data.km || 0) / target.km : 0;
  const denivR = (target.deniv && target.deniv > 0) ? (data.deniv || 0) / target.deniv : 0;
  const durR = (target.duration && target.duration > 0) ? (data.duration || 0) / target.duration : 0;
  // Si aucune cible n'est définie, on ne peut pas scorer
  if (!target.km && !target.deniv && !target.duration) return null;
  // v82.1 · Pondération par sport (normalisation pour comparer course/vélo/vélo intérieur)
  // Défaut course : km 40%, D+ 40%, durée 20%
  // Vélo route : km 20%, D+ 40%, durée 40% (les km sont ×3, moins discriminants)
  // Vélo intérieur : durée 100% (pas de km ni D+)
  const sport = (data && data.sport) || (target && target.sport) || 'course';
  const conv = SPORT_CONVERSIONS[sport] || SPORT_CONVERSIONS['course'];
  const w = conv.scoreWeights;
  const score = kmR * w.km + denivR * w.deniv + durR * w.duration;
  return Math.round(score * 100);
}

// Récupère la cible d'une session (km/deniv/duration) selon son slot et son type
function getSessionTarget(session) {
  if (!session) return null;
  if (session.slot === 'cardio') {
    const type = session.subtype || (session.data && session.data.type) || 'course';
    const targets = CARDIO_TARGETS && CARDIO_TARGETS[type];
    if (targets) {
      const phase = currentPhase();
      return targets[phase] || targets['phase-1'] || null;
    }
  }
  return null;
}

// Ajoute une validation à une session et calcule son score.
// La séance devient immuable une fois validée.
function pushSessionValidation(session, data) {
  if (!session) return null;
  if (!Array.isArray(session.validations)) session.validations = [];
  // v82.1 · Attache le sport à la data (défaut : sport de référence du profil)
  if (session.slot === 'cardio' && !data.sport) {
    data.sport = state.sessionSport || session.sport || currentSportReference();
  }
  let score = null;
  if (session.slot === 'cardio') {
    const target = getSessionTarget(session);
    score = calculateCardioScore3D(data, target);
  }
  const validation = {
    data: { ...data },
    completedAt: new Date().toISOString(),
    score
  };
  session.validations.push(validation);
  session.done = true;
  session.data = { ...data }; // rétro-compat pour code qui lit session.data
  return validation;
}

// Calcule le score qualité d'allure d'une séance cardio (0-100)
// Compare l'allure/vitesse/watts/rpe réalisée à la cible de la phase.
// paceReal, paceTarget : plus PETIT = mieux (min/km) pour course
// speedReal, speedTarget : plus GRAND = mieux (km/h) pour vélo
// wattsReal, wattsTarget : plus GRAND = mieux pour vélo intérieur mode watts
// rpeReal, rpeTarget : proche de la cible = mieux (Borg)
function computePaceScore(type, data, target) {
  // Course : allure min/km, plus rapide = mieux
  if (type === 'course') {
    if (!data.duration || !data.km) return null;
    const paceReal = data.duration / data.km;
    const paceTarget = target.pace;
    if (!paceTarget) return null;
    // Plus rapide ou pile : 100%. Puis dégradation progressive.
    const ratio = paceReal / paceTarget; // 1.0 = pile, >1 = plus lent
    if (ratio <= 1.0) return 100;
    if (ratio <= 1.10) return Math.round(100 - (ratio - 1.0) * 150); // 100 → 85 à 1.10
    if (ratio <= 1.25) return Math.round(85 - (ratio - 1.10) * 167); // 85 → 60 à 1.25
    return Math.max(30, Math.round(60 - (ratio - 1.25) * 80));
  }
  // Vélo extérieur : moyenne km/h, plus rapide = mieux
  if (type === 'velo') {
    if (!data.duration || !data.km) return null;
    const kmhReal = data.km / (data.duration / 60);
    const kmhTarget = target.kmh;
    if (!kmhTarget) return null;
    const ratio = kmhReal / kmhTarget; // 1.0 = pile, >1 = plus rapide
    if (ratio >= 1.0) return 100;
    if (ratio >= 0.90) return Math.round(100 - (1.0 - ratio) * 150);
    if (ratio >= 0.75) return Math.round(85 - (0.90 - ratio) * 167);
    return Math.max(30, Math.round(60 - (0.75 - ratio) * 80));
  }
  // Vélo intérieur : dépend du mode saisi
  if (type === 'velo-int') {
    if (data.mode === 'watts' && data.watts && target.watts) {
      const ratio = data.watts / target.watts;
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.90) return Math.round(100 - (1.0 - ratio) * 150);
      if (ratio >= 0.75) return Math.round(85 - (0.90 - ratio) * 167);
      return Math.max(30, Math.round(60 - (0.75 - ratio) * 80));
    }
    if (data.mode === 'rpe' && data.rpe && target.rpe) {
      // RPE : proche de la cible = 100%, écart de ±2 = dégradation
      const diff = Math.abs(data.rpe - target.rpe);
      if (diff <= 0.5) return 100;
      if (diff <= 1.5) return Math.round(100 - (diff - 0.5) * 15);
      return Math.max(50, Math.round(85 - (diff - 1.5) * 20));
    }
    if (data.mode === 'vitesse-resistance' && data.km && data.duration) {
      // Résistance × cadence estimée. On juge par la vitesse virtuelle rapportée à la durée.
      const kmhReal = data.km / (data.duration / 60);
      const ratio = kmhReal / 22; // baseline arbitraire 22 km/h
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.85) return Math.round(100 - (1.0 - ratio) * 150);
      return Math.max(40, Math.round(75 - (0.85 - ratio) * 100));
    }
    if (data.mode === 'simule' && data.km && data.duration) {
      // Vitesse simulée : compare km/h à la cible de la phase (baseline vélo)
      const kmhReal = data.km / (data.duration / 60);
      const kmhTarget = target.kmh || 22;
      const ratio = kmhReal / kmhTarget;
      if (ratio >= 1.0) return 100;
      if (ratio >= 0.85) return Math.round(100 - (1.0 - ratio) * 150);
      return Math.max(40, Math.round(75 - (0.85 - ratio) * 100));
    }
    return null;
  }
  return null;
}

function computeCardioScore(type, duration, km, deniv, extraData) {
  const phase = currentPhase();
  const t = CARDIO_TARGETS[type][phase];
  const w = PHASE_WEIGHTS[phase];

  // Sous-scores km et D+, cap à 120%
  const sKm = t.km > 0 ? Math.min(120, (km / t.km) * 100) : 100;
  const sVert = t.deniv > 0 ? Math.min(120, (deniv / t.deniv) * 100) : 100;

  // Score allure. extraData permet de passer mode/watts/rpe pour vélo intérieur.
  const paceData = { duration, km, ...(extraData || {}) };
  const pace = computePaceScore(type, paceData, t);
  const sPace = pace !== null ? pace : 100; // fallback neutre si allure non calculable

  // Score composite
  const score = (sKm * w.km) + (sVert * w.vertical) + (sPace * w.pace);

  // Allure numérique pour affichage (min/km course, km/h vélo, watts/RPE vélo int)
  const paceMinKm = (type === 'course' && km > 0 && duration > 0) ? duration / km : null;
  const speedKmh = ((type === 'velo' || type === 'velo-int') && km > 0 && duration > 0) ? km / (duration / 60) : null;

  // NET conservé pour compat legacy
  const net = Math.round((duration || 0) + (deniv / 10));

  let cls, title;
  if (score >= 100) { cls = 'above'; title = 'Au-dessus'; }
  else if (score >= 85) { cls = 'on-target'; title = 'Dans la cible'; }
  else { cls = 'below'; title = 'En-dessous'; }

  return {
    score: Math.round(score),
    net,
    sVol: Math.round(sKm),
    sVert: Math.round(sVert),
    sPace: Math.round(sPace),
    sEnd: null,
    pace: paceMinKm,
    speedKmh,
    weights: w,
    target: t,
    cls,
    title
  };
}

// Legacy alias kept for backward compat with any leftover callsites
function computeVerdict(type, duration, km, deniv) {
  const r = computeCardioScore(type, duration, km, deniv);
  return {
    cls: r.cls,
    title: r.title,
    desc: `${r.score}% de la cible pondérée · NET ${r.net} min équivalent plat`,
    score: r.score,
    net: r.net,
    sEnd: r.sEnd,
    sVol: r.sVol,
    sVert: r.sVert
  };
}

// ============================================================
function getRecentWeeks(n = 8) {
  // Returns last N weeks with current week last, filling in empty weeks
  const now = new Date();
  const currentMonday = getMondayOfWeek(now);
  const startDate = state.settings.startDate ? new Date(state.settings.startDate) : null;
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) {
    const monday = new Date(currentMonday);
    monday.setDate(monday.getDate() - i * 7);
    const wkId = getWeekId(monday);
    const beforeStart = startDate ? (monday < startDate) : false;
    let wk;
    if (wkId === state.week.id) {
      wk = state.week;
    } else {
      wk = state.weekHistory.find(w => w.id === wkId);
    }
    if (!wk) {
      wk = { id: wkId, monday: monday.toISOString().slice(0, 10), boxe: {done: false, score: 0}, cardio: {done: false}, renfo: {done: false}, bonusCount: 0, empty: true };
    }
    wk.beforeStart = beforeStart;
    weeks.push(wk);
  }
  return weeks;
}

async function saveStartDate() {
  const input = document.getElementById('start-date-input');
  const date = input && input.value || null;
  const oldDate = state.settings.startDate;
  state.settings.startDate = date;

  // v63 · Backfill temporel : si on définit une date antérieure à l'ancienne (ou depuis rien),
  // on tente de générer les weeks manquantes du programme et de matcher les séances libres.
  const shouldBackfill = date && state.settings.profile && state.settings.profile.hasObjective !== false
    && (!oldDate || new Date(date) < new Date(oldDate));
  let backfillReport = null;
  if (shouldBackfill) {
    backfillReport = backfillProgramFromDate(date);
  }

  saveState();
  if (sb && state.user) {
    try {
      await sb.auth.updateUser({ data: { startDate: date, manualPhase: state.settings.manualPhase } });
    } catch (e) { console.warn('Failed to sync startDate:', e.message); }
  }
  if (backfillReport && (backfillReport.weeksCreated > 0 || backfillReport.sessionsMatched > 0)) {
    alert(`Backfill effectué : ${backfillReport.weeksCreated} semaine${backfillReport.weeksCreated > 1 ? 's' : ''} générée${backfillReport.weeksCreated > 1 ? 's' : ''}, ${backfillReport.sessionsMatched} séance${backfillReport.sessionsMatched > 1 ? 's' : ''} libre${backfillReport.sessionsMatched > 1 ? 's' : ''} associée${backfillReport.sessionsMatched > 1 ? 's' : ''} au programme.`);
  }
  render();
}

// v63 · Génère les weeks manquantes depuis startDate et rattache les freestyleSessions
// en tant que validations des slots template du programme actif.
// Retourne { weeksCreated, sessionsMatched }
function backfillProgramFromDate(startDateStr) {
  const startDate = new Date(startDateStr);
  const now = new Date();
  const currentMonday = getMondayOfWeek(now);
  const currentWeekId = state.week && state.week.id;

  let weeksCreated = 0;
  let sessionsMatched = 0;

  // Itère chaque lundi depuis startDate jusqu'à aujourd'hui
  const iterMonday = getMondayOfWeek(startDate);
  while (iterMonday <= currentMonday) {
    const wkId = getWeekId(iterMonday);
    // Ignore la week courante
    if (wkId !== currentWeekId) {
      let wk = (state.weekHistory || []).find(w => w.id === wkId);
      if (!wk) {
        // Crée la week avec le template du programme actif à ce moment (approximation : template courant)
        wk = buildFreshWeek(new Date(iterMonday));
        state.weekHistory = state.weekHistory || [];
        state.weekHistory.push(wk);
        weeksCreated++;
      }
      // Matche les freestyle sessions de cette semaine avec les slots vides
      const fsCandidates = (state.freestyleSessions || []).filter(fs => {
        const fsWkId = fs.weekId || (fs.completedAt && fs.completedAt !== 'legacy' ? getWeekId(new Date(fs.completedAt)) : null);
        return fsWkId === wkId && !fs.archived && !fs.converted;
      });
      fsCandidates.forEach(fs => {
        // Cherche un slot du bon type sans validation
        const targetSlot = (wk.sessions || []).find(s => {
          if (s.validations && s.validations.length > 0) return false;
          if (s.optional) return false;
          // Match : fs.type peut être 'cardio', 'renfo', 'discipline' ou autre
          if (fs.type === 'cardio' && s.slot === 'cardio') return true;
          if (fs.type === 'renfo' && s.slot === 'renfo') return true;
          if (fs.type === 'discipline' && s.slot === 'discipline') return true;
          return false;
        });
        if (targetSlot) {
          targetSlot.validations = targetSlot.validations || [];
          targetSlot.validations.push({
            completedAt: fs.completedAt,
            data: { duration: fs.duration || 0, km: fs.km || 0, deniv: fs.deniv || 0 },
            score: null,
            backfilled: true,
            originalFreestyleId: fs.id
          });
          targetSlot.done = true;
          fs.converted = true;
          fs.archived = true; // les retire de l'affichage direct freestyle
          sessionsMatched++;
        }
      });
    }
    iterMonday.setDate(iterMonday.getDate() + 7);
  }

  // Ré-trier weekHistory
  if (state.weekHistory) state.weekHistory.sort((a, b) => a.id.localeCompare(b.id));

  return { weeksCreated, sessionsMatched };
}

function filterActiveWeeks(weeks) {
  return weeks.filter(w => !w.beforeStart);
}

function computeBoxeStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const scores = activeWeeks.map(w => w.boxe && w.boxe.done ? (w.boxe.score || 3) : 0);
  const target = activeWeeks.map(() => 4);
  const total = scores.filter(s => s > 0).length;
  const withScores = scores.filter(s => s > 0);
  const avgScore = withScores.length ? (withScores.reduce((a, b) => a + b, 0) / withScores.length).toFixed(1) : '–';
  return { scores, target, total, avgScore, n: activeWeeks.length };
}

function computeCardioStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const pcts = activeWeeks.map(w => {
    if (!w.cardio || !w.cardio.done) return 0;
    const r = computeCardioScore(w.cardio.type, w.cardio.duration, w.cardio.km, w.cardio.deniv || 0);
    return r.score;
  });
  const target = activeWeeks.map(() => 100);
  const totalDone = pcts.filter(p => p > 0).length;
  const totalMin = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.duration || 0) : 0), 0);
  const totalKm = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.km || 0) : 0), 0);
  const totalNET = activeWeeks.reduce((sum, w) => {
    if (!w.cardio || !w.cardio.done) return sum;
    return sum + (w.cardio.duration || 0) + ((w.cardio.deniv || 0) / 10);
  }, 0);
  return { pcts, target, totalDone, totalMin, totalKm, totalNET, n: activeWeeks.length };
}

function computeRenfoStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const counts = activeWeeks.map(w => (w.renfo && w.renfo.done ? 1 : 0) + (w.bonusCount || 0));
  const target = activeWeeks.map(() => 1);
  const totalRenfo = activeWeeks.filter(w => w.renfo && w.renfo.done).length;
  const totalBonus = activeWeeks.reduce((sum, w) => sum + (w.bonusCount || 0), 0);
  return { counts, target, totalRenfo, totalBonus, n: activeWeeks.length };
}

// ============================================================
//  SVG LINE CHART
// ============================================================
function drawLineChart(actualData, targetData, opts = {}) {
  const { width = 400, height = 100, minY = 0 } = opts;
  let maxY = opts.maxY;
  if (maxY === undefined) {
    const allVals = [...actualData, ...targetData];
    maxY = Math.max(...allVals, 1) * 1.15;
  }
  const padding = 6;
  const chartW = width - padding * 2;
  const chartH = height - padding * 2;
  const range = maxY - minY;
  const n = actualData.length;
  if (n === 0) return '';

  const xScale = (i) => padding + (n === 1 ? chartW/2 : (i / (n - 1)) * chartW);
  const yScale = (v) => padding + chartH - ((v - minY) / range) * chartH;

  const targetPath = targetData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const actualPath = actualData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const areaPath = `${actualPath} L ${xScale(n - 1)} ${yScale(minY)} L ${xScale(0)} ${yScale(minY)} Z`;

  const points = actualData.map((v, i) => {
    if (v === 0 && i < n - 1) return ''; // skip zero points except last (current) week
    return `<circle cx="${xScale(i)}" cy="${yScale(v)}" r="3" fill="#C9A44E"/>`;
  }).join('');

  return `
    <svg class="stat-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gold-grad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#C9A44E" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#C9A44E" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#gold-grad)"/>
      <path d="${targetPath}" stroke="#A19E97" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
      <path d="${actualPath}" stroke="#C9A44E" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      ${points}
    </svg>`;
}

// ============================================================
//  ONGLET SÉANCES (Sprint 4)
// ============================================================
// Agrège toutes les séances (validations depuis toutes semaines + séances libres)
// Retourne un tableau d'entrées uniformes { id, type, slot, label, weekId, completedAt, data, score, archived, source }
function aggregateAllSessions() {
  const all = [];
  const weeks = [state.week, ...(state.weekHistory || [])].filter(Boolean);

  weeks.forEach(w => {
    if (!w.sessions) return;
    w.sessions.forEach(s => {
      if (!s.validations || s.validations.length === 0) return;
      s.validations.forEach((v, idx) => {
        all.push({
          id: `${w.id}::${s.key}::${idx}`,
          type: s.slot, // 'cardio' | 'renfo' | 'discipline'
          slot: s.slot,
          subtype: s.subtype || null,
          label: s.label || s.key,
          weekId: w.id,
          completedAt: v.completedAt,
          data: v.data || {},
          score: v.score,
          archived: !!v.archived,
          source: 'template',
          sessionKey: s.key,
          weekRef: w.id
        });
      });
    });
  });

  // Séances libres
  (state.freestyleSessions || []).forEach(fs => {
    all.push({
      id: fs.id,
      type: 'freestyle',
      slot: fs.type, // le sub-type du sport libre (cardio/renfo/discipline)
      subtype: null,
      label: fs.name,
      weekId: fs.weekId,
      completedAt: fs.completedAt,
      data: { duration: fs.duration, km: fs.km, deniv: fs.deniv },
      score: null,
      archived: !!fs.archived,
      source: 'freestyle'
    });
  });

  // Tri : plus récent en haut. Les "legacy" (pas de vraie date) vont en bas.
  all.sort((a, b) => {
    const da = a.completedAt && a.completedAt !== 'legacy' ? new Date(a.completedAt).getTime() : 0;
    const db = b.completedAt && b.completedAt !== 'legacy' ? new Date(b.completedAt).getTime() : 0;
    return db - da;
  });
  return all;
}

// Filtre par type ('all', 'cardio', 'renfo', 'discipline', 'freestyle') et période ('week', 'month', 'all')
function filterSessions(sessions, filters) {
  return sessions.filter(s => {
    if (filters.archived && !s.archived) return false;
    if (!filters.archived && s.archived) return false;
    if (filters.type !== 'all') {
      if (filters.type === 'freestyle' && s.source !== 'freestyle') return false;
      if (filters.type !== 'freestyle' && s.slot !== filters.type) return false;
    }
    // Filtre granulaire par période
    if (s.completedAt && s.completedAt !== 'legacy') {
      const d = new Date(s.completedAt);
      if (filters.granularity === 'month') {
        const [year, month] = (filters.selectedMonth || currentYearMonth()).split('-').map(Number);
        if (d.getFullYear() !== year || (d.getMonth() + 1) !== month) return false;
      } else if (filters.granularity === 'week') {
        const wid = filters.selectedWeek || (state.week && state.week.id);
        if (isoWeekId(d) !== wid) return false;
      }
    } else if (filters.granularity !== 'all') {
      // Séance legacy sans date : afficher seulement en mode "tout"
      return false;
    }
    return true;
  });
}

function currentYearMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function isoWeekId(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + (firstThursday.getUTCDay() + 6) % 7) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2, '0')}`;
}

function setSessionsFilter(key, value) {
  if (!state.sessionsFilters) state.sessionsFilters = defaultSessionsFilters();
  state.sessionsFilters[key] = value;

function defaultSessionsFilters() {
  return {
    type: 'all',
    granularity: 'all', // 'all' | 'month' | 'week'
    selectedMonth: currentYearMonth(),
    selectedWeek: state.week && state.week.id,
    view: 'list', // 'list' | 'bars'

// Décale le mois sélectionné de +/- 1
function shiftSelectedMonth(delta) {
  if (!state.sessionsFilters) state.sessionsFilters = defaultSessionsFilters();
  const [y, m] = state.sessionsFilters.selectedMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  state.sessionsFilters.selectedMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  render();
}

// Décale la semaine sélectionnée de +/- 1
function shiftSelectedWeek(delta) {
  if (!state.sessionsFilters) state.sessionsFilters = defaultSessionsFilters();
  const wid = state.sessionsFilters.selectedWeek || (state.week && state.week.id);
  const m = wid.match(/^(\d{4})-W(\d+)$/);
  if (!m) return;
  let y = parseInt(m[1]), w = parseInt(m[2]) + delta;
  while (w < 1) { y--; w += 52; }
  while (w > 52) { y++; w -= 52; }
  state.sessionsFilters.selectedWeek = `${y}-W${String(w).padStart(2, '0')}`;
  render();
}

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  const names = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  return `${names[m - 1]} ${y}`;
}

function weekLabel(wid) {
  const m = wid.match(/^(\d{4})-W(\d+)$/);
  if (!m) return wid;
  return `S${m[2]} · ${m[1]}`;
}

// Vue graphique à barres : compte par jour (semaine) ou par jour (mois)
function renderSessionsBarChart(sessions, filters) {
  const bars = {};
  let labels = [];

  if (filters.granularity === 'week') {
    const wid = filters.selectedWeek || (state.week && state.week.id);
    const m = wid.match(/^(\d{4})-W(\d+)$/);
    if (m) {
      const y = parseInt(m[1]), wnum = parseInt(m[2]);
      const jan4 = new Date(y, 0, 4);
      const monday = new Date(jan4);
      monday.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (wnum - 1) * 7);
      const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const key = d.toISOString().slice(0, 10);
        bars[key] = { count: 0, label: dayNames[i] + ' ' + d.getDate(), sessions: [] };
        labels.push(key);
      }
    }
  } else if (filters.granularity === 'month') {
    const [y, mo] = (filters.selectedMonth || currentYearMonth()).split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    for (let i = 1; i <= daysInMonth; i++) {
      const d = new Date(y, mo - 1, i);
      const key = d.toISOString().slice(0, 10);
      bars[key] = { count: 0, label: String(i), sessions: [] };
      labels.push(key);
    }
  } else {
    // Mode "Tout" : bars par semaine sur les 12 dernières semaines
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i * 7);
      const wid = isoWeekId(d);
      if (!bars[wid]) { bars[wid] = { count: 0, label: 'S' + wid.split('-W')[1], sessions: [] }; labels.push(wid); }
    }
  }

  sessions.forEach(s => {
    if (!s.completedAt || s.completedAt === 'legacy') return;
    const d = new Date(s.completedAt);
    let key;
    if (filters.granularity === 'week' || filters.granularity === 'month') {
      key = d.toISOString().slice(0, 10);
    } else {
      key = isoWeekId(d);
    }
    if (bars[key]) {
      bars[key].count++;
      bars[key].sessions.push(s);
    }
  });

  const maxCount = Math.max(1, ...Object.values(bars).map(b => b.count));
  const activeKey = state.hoveredBarKey;

  const barsHTML = labels.map(k => {
    const b = bars[k];
    const heightPct = (b.count / maxCount) * 100;
    const isActive = activeKey === k;
    const tooltip = isActive && b.sessions.length > 0
      ? `<div class="bar-tooltip">${b.sessions.map(s => `<div>• ${s.label} <span style="opacity:0.6">${s.data.duration ? s.data.duration + 'min' : ''}</span></div>`).join('')}</div>`
      : '';
    return `
      <div class="bar-col ${isActive ? 'active' : ''}" onclick="toggleBarDetail('${k.replace(/'/g,'&apos;')}')">
        ${tooltip}
        <div class="bar-fill" style="height: ${heightPct}%; ${b.count === 0 ? 'opacity: 0.15;' : ''}"></div>
        <div class="bar-count">${b.count || ''}</div>
        <div class="bar-label">${b.label}</div>
      </div>`;
  }).join('');

  return `
    <div class="sessions-bar-chart">
      <div class="bar-chart-row">${barsHTML}</div>
      <div class="bar-chart-note">Clique une barre pour voir le détail</div>
    </div>`;
}

function toggleBarDetail(key) {
  state.hoveredBarKey = state.hoveredBarKey === key ? null : key;
  render();
}

// v62 · Retourne la plage de dates ISO d'un weekId "YYYY-Www" → { start, end }
function weekIdToDateRange(wid) {
  const m = String(wid || '').match(/^(\d{4})-W(\d+)$/);
  if (!m) return null;
  const y = parseInt(m[1]);
  const w = parseInt(m[2]);
  const jan4 = new Date(y, 0, 4);
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (w - 1) * 7);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: monday, end: sunday };
}

// v62 · "4 août — 10 août" à partir d'un weekId
function formatWeekDates(wid) {
  const r = weekIdToDateRange(wid);
  if (!r) return '';
  const fmt = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  return `${fmt(r.start)} — ${fmt(r.end)}`;
}

// v62 · Groupement des séances par weekId (plus récent en premier)
// Chaque groupe : { weekId, sessions, done, required, pct }
function groupSessionsByWeek(sessions) {
  const map = new Map();
  sessions.forEach(s => {
    const wid = s.weekId || 'unknown';
    if (!map.has(wid)) map.set(wid, []);
    map.get(wid).push(s);
  });
  // Trier weekId decreasing (plus récent d'abord)
  const sorted = Array.from(map.keys()).sort((a, b) => b.localeCompare(a));
  return sorted.map(wid => {
    const sess = map.get(wid);
    // Trouver la week correspondante dans le state pour done/target
    const weekObj = [state.week, ...(state.weekHistory || [])].find(w => w && w.id === wid);
    let done = 0, required = 0;
    if (weekObj && weekObj.sessions) {
      required = weekObj.sessions.filter(s => !s.optional).length;
      done = countRequiredDoneInWeek(weekObj);
    }
    return { weekId: wid, sessions: sess, done, required };
  });
}

// v62 · Monogramme et classe couleur pour un session record
function sessionTypeMonogram(s) {
  if (s.source === 'freestyle') return { mono: 'LIB', cls: 'freestyle' };
  if (s.slot === 'cardio') return { mono: 'CAR', cls: 'cardio' };
  if (s.slot === 'renfo') return { mono: 'REN', cls: 'renfo' };
  if (s.slot === 'discipline') return { mono: 'DIS', cls: 'discipline' };
  return { mono: '···', cls: 'freestyle' };
}

// v62 · Compte les séances validées du mois courant (pour le status-bar)
function countSessionsThisMonth() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const all = aggregateAllSessions();
  return all.filter(s => {
    if (!s.completedAt || s.completedAt === 'legacy') return false;
    if (s.archived) return false;
    const d = new Date(s.completedAt);
    return d.getFullYear() === y && d.getMonth() === m;
  }).length;
}

// v62 · Nombre attendu de séances requises sur les semaines du mois courant
function targetSessionsThisMonth() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const weeks = [state.week, ...(state.weekHistory || [])].filter(Boolean);
  const target = weeklyTarget ? weeklyTarget() : 3;
  // Nb weeks with any day in current month
  let count = 0;
  weeks.forEach(w => {
    const r = weekIdToDateRange(w.id);
    if (!r) return;
    // Overlap avec le mois courant
    const monthStart = new Date(y, m, 1);
    const monthEnd = new Date(y, m + 1, 0);
    if (r.end >= monthStart && r.start <= monthEnd) count++;
  });
  return Math.max(target, count * target);
}

// v62 · Session row avec type-badge monogramme
function renderSessionRowV62(s) {
  const { mono, cls } = sessionTypeMonogram(s);
  const date = s.completedAt && s.completedAt !== 'legacy'
    ? new Date(s.completedAt).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })
    : `${s.weekId || '?'} · legacy`;
  const stats = [];
  if (s.data.duration) stats.push(`${s.data.duration} min`);
  if (s.data.km) stats.push(`${s.data.km} km`);
  if (s.data.deniv) stats.push(`${s.data.deniv} m D+`);
  const statsStr = stats.length ? stats.join(' · ') : (s.source === 'freestyle' ? 'Séance libre' : 'Validée');
  const isSubstituted = s.data && s.data.substitutedBy;
  const subCls = isSubstituted ? 'substituted' : '';

  // Score badge
  let scoreHTML;
  if (typeof s.score === 'number') {
    const scoreCls = s.score >= 90 ? 'high' : '';
    scoreHTML = `<div class="v62-session-score ${scoreCls}">${s.score}%</div>`;
  } else {
    scoreHTML = `<div class="v62-session-score done">OK</div>`;
  }

  return `
    <button class="v62-session-row ${subCls}" onclick="openSessionDetail('${s.id}')">
      <div class="v62-type-badge ${cls}">${mono}</div>
      <div class="v62-session-body">
        <div class="v62-session-day">${date}${isSubstituted ? ' · substituée' : ''}</div>
        <div class="v62-session-title">${s.label}</div>
        <div class="v62-session-meta">${statsStr}</div>
      </div>

}

    : `Semaine ${s.weekId || '?'} (date approximative)`;

    statsRows.push(['Trous GPS', `${s.data.track.gaps.length} · total ${totalGapSec}s`]);

    if (speeds.length >= 2) {
      const isVelo = s.data.type === 'velo';
      if (isVelo) {
        legendUnit = 'km/h'; legendTitle = 'Vitesse';
        legendMinTxt = (Math.min(...speeds) * 3.6).toFixed(1);
        legendMaxTxt = (Math.max(...speeds) * 3.6).toFixed(1);
      } else {
        // Course : allure min/km
        const minMs = Math.min(...speeds), maxMs = Math.max(...speeds);
        legendMinTxt = formatPace(1000 / 60 / maxMs); // vitesse max → allure la plus rapide
        legendMaxTxt = formatPace(1000 / 60 / minMs); // vitesse min → allure la plus lente

  const photoHTML = userPhoto ? `<div class="v66-detail-photo"><img src="${userPhoto}" alt="Photo séance"/></div>` : '';
  const noteHTML  = userNote  ? `<div class="v66-detail-note">${userNote.replace(/</g,'&lt;')}</div>` : '';

  return `
    <div class="view">
      ${renderTopBar({ back: "goto('seances')" })}

        <div class="hero-label">Détail de séance</div>
        <div class="detail-header">
          <div class="detail-icon">${icon}</div>
          <div>
            <div class="detail-title">${userTitle || s.label}</div>
            <div class="detail-date">${date}</div>

      ${photoHTML}

        }

}

// Marque une séance comme archivée (retire de la vue principale, garde dans Archives)
function archiveSession(id) {
  applyArchivedFlag(id, true);
}
function unarchiveSession(id) {
  applyArchivedFlag(id, false);
}
function applyArchivedFlag(id, archived) {
  // id format : "weekId::sessionKey::idx" ou fs-timestamp
  const weeks = [state.week, ...(state.weekHistory || [])].filter(Boolean);
  const parts = id.split('::');
  if (parts.length === 3) {
    const [weekId, sessionKey, idxStr] = parts;
    const idx = parseInt(idxStr);
    const w = weeks.find(w => w.id === weekId);
    if (w && w.sessions) {
      const s = w.sessions.find(s => s.key === sessionKey);
      if (s && s.validations && s.validations[idx]) {
        s.validations[idx].archived = archived;
      }
    }
  } else {
    // Séance libre
    const fs = (state.freestyleSessions || []).find(f => f.id === id);
    if (fs) fs.archived = archived;
  }
  saveState();
  goto('seances');
}

// Retourne les N derniers noms uniques utilisés en séance libre, plus récent en premier
function getRecentFreestyleNames(n) {
  const seen = new Set();
  const out = [];
  const sorted = [...(state.freestyleSessions || [])].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
  for (const fs of sorted) {
    if (fs.name && !seen.has(fs.name.toLowerCase())) {
      seen.add(fs.name.toLowerCase());
      out.push(fs.name);
      if (out.length >= n) break;
    }
  }
  return out;
}

function setSportLibreName(name) {
  state.sportLibreDraft = { ...(state.sportLibreDraft || {}), name };
  render();
}

function setSportLibreType(type) {
  state.sportLibreDraft = { ...(state.sportLibreDraft || {}), type };
  render();
}

function saveSportLibre() {
  const d = state.sportLibreDraft;
  if (!d || !d.name || !d.duration) {
    alert('Renseigne au moins le nom et la durée.');
    return;
  }
  if (!state.freestyleSessions) state.freestyleSessions = [];
  const entry = {
    id: 'fs-' + Date.now(),
    type: 'discipline', // toutes les séances libres comptent comme discipline pour la substitution
    name: d.name.trim(),
    duration: parseFloat(d.duration) || 0,
    km: parseFloat(d.km) || 0,
    deniv: parseFloat(d.deniv) || 0,
    weekId: state.week.id,
    completedAt: new Date().toISOString()
  };
  state.freestyleSessions.push(entry);
  // Tenter substitution automatique — toute séance libre est une "discipline"
  const substituted = tryAutoSubstitute({ name: entry.name, duration: entry.duration });
  if (substituted) state.lastSubstitutedSessionLabel = substituted.label || substituted.key;
  state.sportLibreDraft = null;
  saveState();
  goto('training');
}

  { key: 'renfo', label: 'Renforcement', emoji: '💪' },

  { key: 'discipline', label: 'Discipline', emoji: '☰' }

// ============================================================
//  ONGLET EXERCICES + SÉANCES BONUS SUR MESURE
// ============================================================

// state.customBonusSessions = [ { id, name, exerciseIds: [], createdAt } ]  (max 3, persistant)
// state.exerciseBuilderDraft = { name, selectedIds: [] }  temporaire pendant construction

function renderExercices() {
  // v62 · Approche B : grille 2 colonnes + custom sessions en focus-cards en tête
  if (!state.exercicesCatFilter) state.exercicesCatFilter = 'all';
  const catFilter = state.exercicesCatFilter;
  const custom = state.customBonusSessions || [];
  const slotsAvailable = Math.max(0, 3 - custom.length);

  // Compteurs par catégorie
  const catCounts = EXERCISE_CATS.reduce((acc, c) => {
    acc[c.key] = EXERCISE_LIBRARY.filter(e => e.cat === c.key).length;
    return acc;
  }, {});
  const totalCount = EXERCISE_LIBRARY.length;

  // Custom sessions HTML : focus-cards noires avec thumbnail (1re image d'exo si dispo, sinon fond uni)
  const customHTML = custom.map(cbs => {
    const nbEx = (cbs.blocks || []).reduce((sum, b) => sum + (b.exerciseIds || []).length, 0)
      || (cbs.exerciseIds || []).length;
    const totalSec = estimateCustomBonusDuration ? estimateCustomBonusDuration(cbs) : 0;
    const durMin = Math.max(1, Math.round(totalSec / 60));
    // Prend le 1er exercice de la séance pour illustrer la carte
    const firstExId = (cbs.exerciseIds && cbs.exerciseIds[0]) ||
      (cbs.blocks && cbs.blocks[0] && cbs.blocks[0].exerciseIds && cbs.blocks[0].exerciseIds[0]);
    const firstEx = firstExId ? EXERCISE_LIBRARY.find(e => e.id === firstExId) : null;
    const firstIllu = firstEx && firstEx.illuKey ? (EXERCISES[firstEx.illuKey] || {}).illu : null;
    const thumbInner = firstIllu
      ? `<img src="./illustrations/${firstIllu}.webp" class="v62-exo-thumb-img" alt="" onerror="this.style.display='none'; this.parentElement.classList.add('empty');" />`
      : '';
    return `
      <button class="v62-custom-focus-card" onclick="openCustomBonusDetail('${cbs.id}')">
        <div class="v62-custom-thumb ${firstIllu ? '' : 'empty'}">${thumbInner}</div>
        <div class="v62-custom-body">
          <div class="v62-custom-tag">COMPLÉMENTAIRE · ${durMin} MIN</div>
          <div class="v62-custom-name">${cbs.name}</div>
          <div class="v62-custom-meta">${nbEx} exercice${nbEx > 1 ? 's' : ''} · créée le ${new Date(cbs.createdAt).toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}</div>
        </div>
        <div class="v62-custom-arrow">→</div>
      </button>`;
  }).join('');

  const addButtonHTML = slotsAvailable > 0 ? `
    <button class="v62-custom-add" onclick="startCustomBonusBuilder()">
      <div class="v62-custom-add-plus">+</div>
      <div class="v62-custom-add-text">Composer une <b>nouvelle séance complémentaire</b></div>
    </button>` : '';

  // Cat tabs
  const catTabs = [
    { key: 'all', label: 'Tout', count: totalCount },
    { key: 'renfo', label: 'Renfo', count: catCounts.renfo || 0 },
    { key: 'etirement', label: 'Étirement', count: catCounts.etirement || 0 },
    { key: 'discipline', label: 'Discipline', count: catCounts.discipline || 0 }
  ];
  const catTabsHTML = catTabs.map(t => `
    <button class="v62-cat-tab ${catFilter === t.key ? 'active' : ''}" onclick="setExercicesCatFilter('${t.key}')">
      <span class="v62-type-dot ${t.key === 'all' ? 'all' : t.key === 'etirement' ? 'etirement' : t.key === 'renfo' ? 'renfo' : 'discipline'}"></span>
      ${t.label}
      <span class="v62-cat-tab-count">${t.count}</span>
    </button>`).join('');

  // Exercices grid selon filtre
  const filteredExos = catFilter === 'all'
    ? EXERCISE_LIBRARY
    : EXERCISE_LIBRARY.filter(e => e.cat === catFilter);

  const catLabelMap = { renfo: 'Renfo', etirement: 'Étirement', discipline: 'Discipline' };
  const gridHTML = filteredExos.map(ex => {
    // v64 · Vraie image via illuKey (mappe sur ./illustrations/*.webp)
    // Si illuKey absent OU fichier absent (onerror), la tuile reste blanche pure
    const illuData = ex.illuKey ? EXERCISES[ex.illuKey] : null;
    const illuFile = illuData && illuData.illu ? illuData.illu : null;
    const thumbHTML = illuFile
      ? `<div class="v62-exo-grid-thumb"><img src="./illustrations/${illuFile}.webp" class="v62-exo-thumb-img" alt="" onerror="this.style.display='none'; this.parentElement.classList.add('empty');" /></div>`
      : `<div class="v62-exo-grid-thumb empty"></div>`;
    return `
      <button class="v62-exo-grid-tile" onclick="toggleExerciseInfo('${ex.id}')">
        ${thumbHTML}
        <div class="v62-exo-grid-body">
          <div class="v62-exo-grid-cat-lab ${ex.cat}">${catLabelMap[ex.cat] || ex.cat}</div>
          <div class="v62-exo-grid-name">${ex.name}</div>
          <div class="v62-exo-grid-duration">${ex.duration}</div>
        </div>
      </button>`;
  }).join('');

  // Expand : si un exo est sélectionné, on affiche la desc en bloc pleine largeur juste après la grille
  let expandedHTML = '';
  if (state.expandedExerciseId) {
    const ex = EXERCISE_LIBRARY.find(e => e.id === state.expandedExerciseId);
    if (ex) {
      expandedHTML = `
        <div style="margin: 12px 22px 0; padding: 16px; background: var(--paper-alt); border: 1.5px solid var(--ink); border-radius: 10px;">
          <div class="v62-exo-grid-cat-lab ${ex.cat}" style="margin-bottom: 6px;">${catLabelMap[ex.cat] || ex.cat}</div>
          <div style="font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 4px;">${ex.name}</div>
          <div style="font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 10px;">${ex.duration}</div>
          <div style="font-family: var(--font-body); font-size: 13px; color: var(--text-body); line-height: 1.55;">${ex.description}</div>
          <button onclick="toggleExerciseInfo('${ex.id}')" style="margin-top: 12px; padding: 8px 12px; background: transparent; border: 1.5px solid var(--muted); color: var(--muted); font-family: var(--font-body); font-weight: 600; font-size: 12px; border-radius: 5px; cursor: pointer;">Fermer</button>
        </div>`;
    }
  }

  return `
    <div class="view has-tabbar">
      ${renderTopBar()}

      <div class="v62-hero">
        <div class="v62-hero-eyebrow">Ton catalogue</div>
        <div class="v62-hero-title">Exercices &<br>séances sur mesure</div>
        <div class="v62-hero-sub">Compose une séance complémentaire à partir d'exercices unitaires, ou consulte-en un directement.</div>
      </div>

      <div class="v62-section-title">
        <div class="v62-section-title-main">Sur mesure</div>
        <div class="v62-section-title-sub">${custom.length} / 3 max</div>
      </div>

      <div class="v62-custom-list">
        ${customHTML}
        ${addButtonHTML}
      </div>

      <div class="v62-cat-tabs">${catTabsHTML}</div>

      <div class="v62-section-title">
        <div class="v62-section-title-main">Exercices</div>
        <div class="v62-section-title-sub">${filteredExos.length} · ${catFilter === 'all' ? 'toutes cats.' : (catLabelMap[catFilter] || catFilter)}</div>
      </div>

      <div class="v62-exo-grid">${gridHTML}</div>

      ${expandedHTML}

      ${renderTabBar()}
    </div>`;
}

function setExercicesCatFilter(key) {
  state.exercicesCatFilter = key;
  state.expandedExerciseId = null;
  render();
}

function renderExerciseItem(ex, isBuilder) {
  const isSelected = isBuilder && state.exerciseBuilderDraft && (state.exerciseBuilderDraft.selectedIds || []).includes(ex.id);
  const clickHandler = isBuilder ? `toggleBuilderExercise('${ex.id}')` : `toggleExerciseInfo('${ex.id}')`;
  const showInfo = !isBuilder && state.expandedExerciseId === ex.id;
  const illuHTML = ex.illuKey ? renderIllustration(ex.illuKey, 'small') : '';
  const emojiOrIllu = illuHTML || `<div class="exercice-item-emoji">${ex.emoji}</div>`;
  return `
    <div class="exercice-item ${isSelected ? 'selected' : ''} ${showInfo ? 'info-open' : ''}">
      <button class="exercice-item-head" onclick="${clickHandler}">
        ${illuHTML ? `<div class="exercice-item-illu-wrap">${illuHTML}</div>` : `<div class="exercice-item-emoji">${ex.emoji}</div>`}
        <div class="exercice-item-body">
          <div class="exercice-item-name">${ex.name}</div>
          <div class="exercice-item-meta">${ex.duration}</div>
        </div>
        ${isBuilder ? `<div class="exercice-item-check ${isSelected ? 'checked' : ''}">${isSelected ? '✓' : ''}</div>` : `<div class="exercice-item-info">${showInfo ? '−' : '+'}</div>`}
      </button>
      ${showInfo ? `<div class="exercice-item-desc">${ex.description}</div>` : ''}
    </div>`;
}

function toggleExerciceCat(cat) {
  if (!state.exercicesExpanded) state.exercicesExpanded = {};
  state.exercicesExpanded[cat] = !state.exercicesExpanded[cat];
  render();
}

function toggleExerciseInfo(id) {
  state.expandedExerciseId = state.expandedExerciseId === id ? null : id;
  render();
}

function startCustomBonusBuilder() {
  if ((state.customBonusSessions || []).length >= 3) {
    alert('Limite de 3 séances bonus atteinte. Supprime-en une pour en créer une nouvelle.');
    return;
  }
  state.exerciseBuilderDraft = { name: '', blocks: [] };
  state.builderPickerOpen = false;
  state.view = 'custom-bonus-builder';
  render();
}

// Ajoute un bloc au draft (nouveau exercice avec paramètres par défaut)
function addBuilderBlock(exerciseId) {
  const draft = state.exerciseBuilderDraft || { name: '', blocks: [] };
  const ex = EXERCISE_LIBRARY.find(e => e.id === exerciseId);
  const isTimeBased = ex && /\d+\s*s/.test(ex.duration);
  const newBlock = {
    exerciseId,
    sets: 3,
    reps: isTimeBased ? null : 12,
    duration: isTimeBased ? 45 : null, // secondes
    restAfter: 60 // secondes
  };
  draft.blocks = [...(draft.blocks || []), newBlock];
  state.exerciseBuilderDraft = draft;
  state.builderPickerOpen = false;
  render();
}

// Retire un bloc
function removeBuilderBlock(idx) {
  const draft = state.exerciseBuilderDraft;
  if (!draft || !draft.blocks) return;
  draft.blocks.splice(idx, 1);
  state.exerciseBuilderDraft = { ...draft };
  render();
}

// Modifie un champ d'un bloc
function updateBuilderBlock(idx, field, value) {
  const draft = state.exerciseBuilderDraft;
  if (!draft || !draft.blocks || !draft.blocks[idx]) return;
  const val = value === '' ? null : parseFloat(value);
  draft.blocks[idx] = { ...draft.blocks[idx], [field]: val };
  state.exerciseBuilderDraft = { ...draft };
}

// Bascule bloc entre mode "reps" et mode "durée"
function toggleBuilderBlockMode(idx) {
  const draft = state.exerciseBuilderDraft;
  if (!draft || !draft.blocks || !draft.blocks[idx]) return;
  const b = draft.blocks[idx];
  if (b.duration != null) {
    b.duration = null; b.reps = 12;
  } else {
    b.reps = null; b.duration = 45;
  }
  draft.blocks[idx] = b;
  state.exerciseBuilderDraft = { ...draft };
  render();
}

function toggleBuilderPicker() {
  state.builderPickerOpen = !state.builderPickerOpen;
  render();
}

function renderCustomBonusBuilder() {
  const draft = state.exerciseBuilderDraft || { name: '', blocks: [] };
  const blocks = draft.blocks || [];

  const blocksHTML = blocks.length === 0
    ? `<div class="empty-state"><p>Aucun bloc pour l'instant. Ajoute des exercices ci-dessous.</p></div>`
    : blocks.map((b, idx) => renderBuilderBlock(b, idx)).join('');

  const pickerOpen = state.builderPickerOpen;
  const pickerHTML = !pickerOpen ? '' : `
    <div class="exercices-list" style="margin-top: 10px;">
      ${EXERCISE_CATS.map(cat => {
        const exos = EXERCISE_LIBRARY.filter(e => e.cat === cat.key);
        return `
          <div class="exercice-cat open">
            <div class="exercice-cat-header" style="cursor: default; pointer-events: none;">
              <div class="exercice-cat-emoji">${cat.emoji}</div>
              <div class="exercice-cat-label">${cat.label}</div>
              <div class="exercice-cat-count">${exos.length}</div>
            </div>
            <div class="exercice-cat-body">
              ${exos.map(e => {
                const illuHTML = e.illuKey ? renderIllustration(e.illuKey, 'small') : '';
                return `
                <div class="exercice-item">
                  <button class="exercice-item-head" onclick="addBuilderBlock('${e.id}')">
                    ${illuHTML ? `<div class="exercice-item-illu-wrap">${illuHTML}</div>` : `<div class="exercice-item-emoji">${e.emoji}</div>`}
                    <div class="exercice-item-body">
                      <div class="exercice-item-name">${e.name}</div>
                      <div class="exercice-item-meta">${e.duration}</div>
                    </div>
                    <div class="exercice-item-info">+</div>
                  </button>
                </div>`;}).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>`;

  return `
    <div class="view">
      ${renderTopBar({ back: "goto('exercices')" })}
      <section class="hero" style="padding: 20px 0 8px;">
        <div class="hero-label">Composer une séance complémentaire</div>
        <p class="discipline-intro" style="margin-top: 6px;">Ajoute des exercices, règle reps/durée/repos. Un même exercice peut être ajouté plusieurs fois avec des paramètres différents.</p>
      </section>

      <div class="form-block">
        <div class="form-label">Nom de la séance</div>
        <input type="text" class="form-input" placeholder="ex : Mobilité matin, Gainage chalet…" value="${draft.name || ''}" oninput="state.exerciseBuilderDraft = {...(state.exerciseBuilderDraft||{}), name: this.value}">
      </div>

      <section class="hero" style="padding: 20px 0 6px;">
        <div class="hero-label">Blocs de la séance (${blocks.length})</div>
      </section>

      <div class="builder-blocks">${blocksHTML}</div>

      <div class="builder-add-row">
        <button class="onb-btn ${pickerOpen ? 'secondary' : 'primary'}" onclick="toggleBuilderPicker()">
          ${pickerOpen ? '× Fermer la bibliothèque' : '+ Ajouter un exercice'}
        </button>
      </div>

      ${pickerHTML}

      <div class="form-footer">
        <button class="onb-btn secondary" onclick="goto('exercices')">Annuler</button>
        <button class="onb-btn primary" onclick="saveCustomBonus()">Enregistrer</button>
      </div>
    </div>`;
}

function renderBuilderBlock(b, idx) {
  const ex = EXERCISE_LIBRARY.find(e => e.id === b.exerciseId);
  if (!ex) return '';
  const isDuration = b.duration != null;
  return `
    <div class="builder-block">
      <div class="builder-block-head">
        <div class="builder-block-emoji">${ex.emoji}</div>
        <div class="builder-block-title">${ex.name}</div>
        <button class="builder-block-remove" onclick="removeBuilderBlock(${idx})" title="Retirer">×</button>
      </div>
      <div class="builder-block-params">
        <div class="param-group">
          <label class="param-label">Séries</label>
          <input type="number" min="1" class="param-input" value="${b.sets || 1}" oninput="updateBuilderBlock(${idx}, 'sets', this.value)">
        </div>
        <div class="param-group">
          <button class="param-mode-toggle" onclick="toggleBuilderBlockMode(${idx})">${isDuration ? '⏱ durée' : '# reps'}</button>
          ${isDuration ? `
            <input type="number" min="1" class="param-input" placeholder="45" value="${b.duration || ''}" oninput="updateBuilderBlock(${idx}, 'duration', this.value)">
            <span class="param-unit">sec</span>` : `
            <input type="number" min="1" class="param-input" placeholder="12" value="${b.reps || ''}" oninput="updateBuilderBlock(${idx}, 'reps', this.value)">
            <span class="param-unit">reps</span>`}
        </div>
        <div class="param-group">
          <label class="param-label">Repos</label>
          <input type="number" min="0" class="param-input" value="${b.restAfter != null ? b.restAfter : 60}" oninput="updateBuilderBlock(${idx}, 'restAfter', this.value)">
          <span class="param-unit">sec</span>
        </div>
      </div>
    </div>`;
}

function saveCustomBonus() {
  const draft = state.exerciseBuilderDraft || {};
  const name = (draft.name || '').trim();
  const blocks = draft.blocks || [];
  if (!name) { alert('Donne un nom à ta séance.'); return; }
  if (blocks.length === 0) { alert('Ajoute au moins un exercice.'); return; }
  if (!state.customBonusSessions) state.customBonusSessions = [];
  if (state.customBonusSessions.length >= 3) { alert('Limite de 3 séances atteinte.'); return; }
  state.customBonusSessions.push({
    id: 'cbs-' + Date.now(),
    name,
    blocks,
    createdAt: new Date().toISOString()
  });
  state.exerciseBuilderDraft = null;
  state.builderPickerOpen = false;
  saveState();
  goto('exercices');
}

function openCustomBonusDetail(id) {
  state.currentCustomBonusId = id;
  state.view = 'custom-bonus-detail';
  render();
}

function renderCustomBonusDetail() {
  const cbs = (state.customBonusSessions || []).find(c => c.id === state.currentCustomBonusId);

// Estime la durée totale d'une séance bonus custom (en secondes)
function estimateCustomBonusDuration(cbs) {
  const blocks = cbs.blocks || [];
  return blocks.reduce((sum, b) => {
    const sets = b.sets || 1;
    const setDur = b.duration != null ? b.duration : (b.reps ? Math.max(15, b.reps * 3) : 30); // 3s par rep environ
    const rest = b.restAfter != null ? b.restAfter : 60;
    return sum + sets * setDur + Math.max(0, sets - 1) * 15 + rest; // 15s repos inter-séries
  }, 0);
}

function startCustomBonusSession(id) {
  const cbs = (state.customBonusSessions || []).find(c => c.id === id);
  if (!cbs) return;
  // Lancement séance custom : on utilise le flow bonus existant avec un session id spécial
  state.sessionKind = 'bonus';
  state.sessionId = 'custom-' + cbs.id;
  state.currentCustomBonusRun = cbs;
  state.view = 'preview';
  render();
}

function deleteCustomBonus(id) {
  if (!confirm('Supprimer cette séance bonus ? Cette action est irréversible.')) return;
  state.customBonusSessions = (state.customBonusSessions || []).filter(c => c.id !== id);
  saveState();
  goto('exercices');
}

// Rend les lignes de progression empilées d'une session (max 7 lignes visibles)
// Chaque validation est une ligne dont la largeur reflète le score (ou 100% par défaut si pas de score)
function renderProgressLines(session) {
  const validations = (session && session.validations) || [];
  if (validations.length === 0) return '';
  const shown = validations.slice(-7); // max 7 lignes récentes
  const linesHTML = shown.map(v => {
    const pct = (typeof v.score === 'number') ? v.score : 100;
    const width = Math.min(140, Math.max(4, pct)); // clamp entre 4% et 140%
    const isOver = pct > 100;
    return `<div class="progress-line ${isOver ? 'over' : ''}" style="width: ${width}%"></div>`;
  }).join('');
  return `<div class="progress-lines">${linesHTML}</div>`;
}

// Calcule le % de séances faites cardio + renfo par semaine sur les N dernières semaines
function computeProgressData(nWeeks) {
  const all = [...(state.weekHistory || []), state.week].filter(Boolean);
  const recent = all.slice(-Math.max(1, nWeeks || 12));
  return recent.map(w => {
    const cardioSessions = (w.sessions || []).filter(s => s.slot === 'cardio' && !s.optional);
    const renfoSessions = (w.sessions || []).filter(s => s.slot === 'renfo' && !s.optional);
    const cardioDone = cardioSessions.filter(s => s.validations && s.validations.length > 0).length;
    const renfoDone = renfoSessions.filter(s => s.validations && s.validations.length > 0).length;
    return {
      weekId: w.id,
      cardioPct: cardioSessions.length ? Math.round((cardioDone / cardioSessions.length) * 100) : null,
      renfoPct: renfoSessions.length ? Math.round((renfoDone / renfoSessions.length) * 100) : null
    };
  });
}

// SVG courbe de progression cardio/renfo sur les 12 dernières semaines
function renderProgressChart() {
  const data = computeProgressData(12);
  if (data.length === 0) return '';
  const hasAnyDone = data.some(d => (d.cardioPct !== null && d.cardioPct > 0) || (d.renfoPct !== null && d.renfoPct > 0));
  if (!hasAnyDone) return '';

  const w = 320, h = 130, pad = 24;
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const y = pct => pct === null ? null : h - pad - (pct / 100) * innerH;

  const buildPoints = key => data.map((d, i) => {
    const v = y(d[key]);
    return v === null ? null : `${pad + i * stepX},${v}`;
  }).filter(Boolean).join(' ');

  const cardioPoints = buildPoints('cardioPct');
  const renfoPoints = buildPoints('renfoPct');

  const gridLines = [0, 25, 50, 75, 100].map(pct => {
    const yy = h - pad - (pct / 100) * innerH;
    return `<line x1="${pad}" y1="${yy}" x2="${w - pad}" y2="${yy}" stroke="var(--line)" stroke-width="0.5" ${pct === 100 ? 'stroke-dasharray="2 2"' : ''} />`;
  }).join('');

  const yLabels = [0, 50, 100].map(pct => {
    const yy = h - pad - (pct / 100) * innerH;
    return `<text x="${pad - 4}" y="${yy + 3}" font-size="8" fill="var(--ink-faint)" text-anchor="end" font-family="monospace">${pct}</text>`;
  }).join('');

  return `
    <div class="progress-chart">
      <div class="progress-chart-title">Progression · ${data.length} dernières semaines</div>
      <svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">
        ${gridLines}
        ${yLabels}
        ${cardioPoints ? `<polyline fill="none" stroke="#C9A44E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${cardioPoints}" />` : ''}
        ${renfoPoints ? `<polyline fill="none" stroke="#1F5234" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round" points="${renfoPoints}" />` : ''}
        ${data.map((d, i) => {
          const x = pad + i * stepX;
          const yc = y(d.cardioPct);
          const yr = y(d.renfoPct);
          return `
            ${yc !== null ? `<circle cx="${x}" cy="${yc}" r="2.5" fill="#C9A44E" />` : ''}
            ${yr !== null ? `<circle cx="${x}" cy="${yr}" r="2.5" fill="#1F5234" />` : ''}
          `;
        }).join('')}
      </svg>
      <div class="progress-chart-legend">
        <span><span class="legend-swatch" style="background:#C9A44E"></span> Cardio</span>
        <span><span class="legend-swatch" style="background:#1F5234; height:2px; align-self:center"></span> Renfo</span>
      </div>
    </div>`;
}

function renderV72PhaseCard() {
  const info = getExpertV72PhaseInfo();

  const familyLabel = doctrine ? doctrine.label : 'Expert';
  const { phase, phaseIndex1, totalPhases, weekInPhase, totalWeeksInPhase, subPhase } = info;
  const isTaper = subPhase === 'taper' || subPhase === 'course';
  const cardCls = isTaper ? 'v72-phase-card taper' : 'v72-phase-card';
  let subBadge = '';
  if (subPhase === 'taper') {
    const daysToEnd = (totalWeeksInPhase - weekInPhase + 1) * 7;
    subBadge = `<span class="v72-subphase-badge taper">Taper · J-${daysToEnd}</span>`;
  } else if (subPhase === 'course') {

  } else if (subPhase === 'pic') {
    subBadge = `<span class="v72-subphase-badge pic">Pic</span>`;
  }
  const bars = [];
  for (let w = 1; w <= totalWeeksInPhase; w++) {

    else if (w === weekInPhase) bars.push('<div class="v72-phase-bar-week current"></div>');

function renderV72SkillsCard() {
  const doctrine = getCurrentDoctrine();
  if (!doctrine) return '';
  const skills = doctrine.skills;
  ensureUserSkills();
  refreshStaleSkills();
  // Compteur done/total pour la famille active uniquement
  let done = 0, staleCount = 0;
  skills.forEach(s => {
    const st = state.userSkills[s.id] && state.userSkills[s.id].status;
    if (st === 'done') done++;
    else if (st === 'stale') { done++; staleCount++; }
  });
  const total = skills.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const info = getExpertV72PhaseInfo();
  const accessibleIds = info ? (doctrine.phaseSkillsAccessible[info.phase.id] || []) : [];

  const priorityOrder = [
    ...accessibleIds,
    ...skills.filter(s => !accessibleIds.includes(s.id)).map(s => s.id)
  ];
  const orderedSkills = priorityOrder
    .map(id => skills.find(s => s.id === id))
    .filter(Boolean);

  const preview = [];
  for (const s of orderedSkills) {
    const status = getUserSkillStatus(s.id);
    if (status === 'done') continue;
    preview.push(s);
    if (preview.length >= 3) break;
  }
  if (preview.length === 0) {
    for (const s of orderedSkills.slice(0, 3)) preview.push(s);
  }
  const remaining = total - preview.length;

  const staleWarn = staleCount > 0
    ? `<div class="v72-skills-stale-warn">${staleCount} compétence${staleCount > 1 ? 's' : ''} à rafraîchir</div>`
    : '';

  const rows = preview.map(s => renderV72SkillRow(s)).join('');
  const moreLink = remaining > 0
    ? `<button class="v72-skills-more" onclick="goto('programme')">+ ${remaining} autre${remaining > 1 ? 's' : ''} →</button>`
    : '';

  return `
    <div class="v72-skills-card">
      <div class="v72-skills-head">
        <div class="v72-skills-title">Compétences à valider</div>
        <div class="v72-skills-count">${done}<span class="total">/${total}</span></div>
      </div>
      <div class="v72-skills-bar">
        <div class="v72-skills-bar-fill" style="width: ${pct}%;"></div>
      </div>
      ${staleWarn}
      <div class="v72-skills-list">${rows}</div>
      ${moreLink}
    </div>
  `;
}

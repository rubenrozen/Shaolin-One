<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0908">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Cervin 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght,YOPQ@0..100,0..1,9..144,600..900,25..208&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Dark athletic base */
    --bg: #0A0908;
    --bg-elev: #17140F;
    --bg-elev2: #1E1B15;
    --paper: #F5F1EA;
    --ink: #F5F1EA;
    --ink-soft: #B0A79A;
    --ink-faint: #6B655D;
    --line: rgba(245, 241, 234, 0.08);
    --line-strong: rgba(245, 241, 234, 0.16);

    /* Rich tile colors */
    --rust: #E85A2C;
    --rust-tile: #C13E1B;
    --rust-deep: #7A2812;
    --rust-glow: rgba(232, 90, 44, 0.4);

    --pine: #4EAF6F;
    --pine-tile: #2A6844;
    --pine-deep: #163D24;
    --pine-glow: rgba(78, 175, 111, 0.35);

    --indigo: #7896D8;
    --indigo-tile: #384F80;
    --indigo-deep: #1A2740;
    --indigo-glow: rgba(120, 150, 216, 0.35);

    --amber: #E8B04A;
    --amber-tile: #A87720;
    --amber-deep: #4A2D08;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --display-max: "opsz" 144, "SOFT" 0, "WONK" 0, "YOPQ" 208;
    --display-strong: "opsz" 100, "SOFT" 0, "WONK" 0, "YOPQ" 180;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  html { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(20px + var(--safe-bottom));
    position: relative;
  }

  /* Subtle grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }
  .app, .dialog-overlay { position: relative; z-index: 2; }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    -webkit-appearance: none;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ============ TOP BAR ============ */
  .top-bar {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.04em;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .brand-dot { color: var(--rust); }

  .phase-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: var(--bg-elev);
    border-radius: 100px;
    border: 1px solid var(--line);
  }
  .phase-chip-dot {
    width: 6px; height: 6px;
    background: var(--rust);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--rust-glow);
    animation: pulse-dot 2.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.1); }
  }
  .phase-chip-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .back-btn {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn:active { color: var(--rust); }

  /* ============ HERO POSTER ============ */
  .hero {
    padding: 30px 0 40px;
    position: relative;
  }
  .hero-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .hero-counter {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 20px;
  }
  .hero-num {
    font-family: var(--font-display);
    font-size: 180px;
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.08em;
    line-height: 0.82;
    color: var(--ink);
  }
  .hero-num.complete { color: var(--rust); }
  .hero-denom {
    font-family: var(--font-display);
    font-size: 60px;
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.06em;
    line-height: 0.82;
    color: var(--ink-faint);
  }
  .hero-caption {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .hero-dots {
    display: flex;
    gap: 10px;
  }
  .hero-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid var(--line-strong);
    transition: all 0.3s;
  }
  .hero-dot.done {
    background: var(--rust);
    border-color: var(--rust);
    box-shadow: 0 0 12px var(--rust-glow);
  }

  /* ============ SESSION TILES (COLORED POSTERS) ============ */
  .tile-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 30px;
  }

  .tile {
    position: relative;
    border-radius: 20px;
    padding: 22px 22px 24px;
    width: 100%;
    text-align: left;
    overflow: hidden;
    transition: transform 0.12s ease;
    border: none;
    color: var(--paper);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .tile:active { transform: scale(0.985); }

  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255,255,255,0.08) 0%, transparent 40%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
  }

  .tile.cardio {
    background: var(--rust-tile);
    box-shadow: 0 12px 40px -12px var(--rust-glow);
  }
  .tile.renfo {
    background: var(--pine-tile);
    box-shadow: 0 12px 40px -12px var(--pine-glow);
  }
  .tile.boxe {
    background: var(--indigo-tile);
    box-shadow: 0 12px 40px -12px var(--indigo-glow);
  }
  .tile.done {
    opacity: 0.85;
  }

  .tile-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    position: relative;
  }
  .tile-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--paper);
    opacity: 0.75;
  }
  .tile-status {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    background: rgba(0,0,0,0.25);
    border-radius: 100px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tile-status.done {
    background: var(--paper);
    color: var(--bg);
  }

  .tile-body {
    position: relative;
  }
  .tile-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 34px;
    line-height: 0.95;
    letter-spacing: -0.04em;
    font-variation-settings: var(--display-max);
    margin-bottom: 8px;
  }
  .tile-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tile-meta-dot {
    width: 3px; height: 3px;
    background: currentColor;
    border-radius: 50%;
    opacity: 0.6;
  }

  .tile-badge {
    position: absolute;
    top: 0;
    right: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 90px;
    line-height: 0.85;
    letter-spacing: -0.05em;
    font-variation-settings: var(--display-max);
    color: rgba(255,255,255,0.10);
    pointer-events: none;
  }

  /* ============ LIBRARY (small tiles at bottom) ============ */
  .library-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 30px;
  }
  .lib-tile {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: left;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100px;
  }
  .lib-tile:active { background: var(--bg-elev2); }
  .lib-tile-count {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    color: var(--rust);
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
    margin-bottom: 10px;
  }
  .lib-tile-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink);
  }

  /* ============ JOURNEY INDICATOR ============ */
  .journey {
    margin-top: 12px;
    padding: 16px 4px 20px;
    border-top: 1px solid var(--line);
  }
  .journey-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }
  .journey-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    margin: 0 8px;
  }
  .journey-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
  }
  .journey-dot {
    width: 8px; height: 8px;
    background: var(--line-strong);
    border-radius: 50%;
    transition: all 0.3s;
  }
  .journey-node.active .journey-dot {
    width: 12px; height: 12px;
    background: var(--rust);
    box-shadow: 0 0 12px var(--rust-glow);
  }
  .journey-node.summit .journey-dot {
    width: 0; height: 0;
    background: transparent;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid var(--ink-faint);
    border-radius: 0;
  }
  .journey-node.summit.active .journey-dot {
    border-bottom-color: var(--rust);
  }
  .journey-node-label {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .journey-node.active .journey-node-label { color: var(--rust); }
  .journey-track {
    position: absolute;
    top: 4px;
    left: 4px;
    right: 4px;
    height: 1px;
    background: var(--line-strong);
    z-index: 1;
  }
  .journey-track-fill {
    height: 100%;
    background: var(--rust);
    opacity: 0.5;
  }

  /* ============ PREVIEW ============ */
  .preview-hero {
    padding: 20px 0 24px;
  }
  .preview-focus-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .preview-focus-tag.cardio { background: var(--rust-deep); color: var(--rust); }
  .preview-focus-tag.renfo { background: var(--pine-deep); color: var(--pine); }
  .preview-focus-tag.bonus { background: var(--amber-deep); color: var(--amber); }
  .preview-focus-tag.stretching { background: var(--indigo-deep); color: var(--indigo); }

  .preview-title {
    font-family: var(--font-display);
    font-size: 58px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -0.055em;
    margin-bottom: 16px;
    font-variation-settings: var(--display-max);
  }
  .preview-intro-short {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 22px;
    max-width: 480px;
  }

  .preview-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .preview-metric {
    background: var(--bg-elev);
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .preview-metric-val {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .preview-metric-val .unit {
    font-size: 14px;
    color: var(--ink-faint);
  }
  .preview-metric-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }

  /* Target box for cardio (highlighted) */
  .target-box {
    background: linear-gradient(155deg, var(--rust-deep) 0%, #4A1608 100%);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .target-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255,255,255,0.08) 0%, transparent 50%);
    pointer-events: none;
  }
  .target-box-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--rust);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .target-box-metrics {
    display: flex;
    gap: 16px;
  }
  .target-box-metric {
    flex: 1;
  }
  .target-box-val {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 900;
    color: var(--paper);
    letter-spacing: -0.035em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .target-box-val .unit {
    font-size: 12px;
    opacity: 0.7;
  }
  .target-box-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--paper);
    opacity: 0.7;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 4px;
  }

  /* Plan (timeline visual) */
  .plan-block {
    margin-bottom: 30px;
  }
  .plan-section {
    margin-bottom: 12px;
  }
  .plan-section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .plan-section-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .plan-section-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .plan-items {
    background: var(--bg-elev);
    border-radius: 10px;
    padding: 4px 0;
  }
  .plan-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-name { color: var(--ink); }
  .plan-item-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Big CTA button */
  .cta-btn {
    width: 100%;
    padding: 22px;
    background: var(--rust);
    color: var(--paper);
    border-radius: 16px;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 12px;
    font-variation-settings: var(--display-strong);
    box-shadow: 0 12px 40px -12px var(--rust-glow);
    transition: transform 0.1s;
  }
  .cta-btn:active { transform: scale(0.98); background: var(--rust-tile); }

  .cta-btn.secondary {
    background: var(--bg-elev);
    color: var(--ink);
    box-shadow: none;
    border: 1px solid var(--line-strong);
  }

  /* ============ CARDIO CHOICE ============ */
  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .choice-card {
    padding: 28px 24px;
    border-radius: 20px;
    text-align: left;
    width: 100%;
    color: var(--paper);
    position: relative;
    overflow: hidden;
    transition: transform 0.12s;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .choice-card:active { transform: scale(0.985); }
  .choice-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255,255,255,0.08) 0%, transparent 40%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
  }
  .choice-card.velo {
    background: var(--indigo-tile);
    box-shadow: 0 12px 40px -12px var(--indigo-glow);
  }
  .choice-card.course {
    background: var(--rust-tile);
    box-shadow: 0 12px 40px -12px var(--rust-glow);
  }
  .choice-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .choice-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.75;
  }
  .choice-name {
    font-family: var(--font-display);
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 0.9;
    font-variation-settings: var(--display-max);
    margin-bottom: 4px;
  }
  .choice-target {
    display: flex;
    gap: 18px;
    margin-top: 20px;
  }
  .choice-target-item {
    display: flex;
    flex-direction: column;
  }
  .choice-target-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .choice-target-val .unit { font-size: 11px; opacity: 0.7; }
  .choice-target-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.7;
    margin-top: 3px;
  }

  /* ============ RUNNING VIEW ============ */
  .running-view {
    padding-top: calc(12px + var(--safe-top));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .running-view.warmup { background: linear-gradient(180deg, var(--amber-deep) 0%, var(--bg) 40%); }

<div class="app" id="app"></div>
<div class="dialog-overlay" id="dialog"></div>

<script>
// ============================================================
//  PHASE DETECTION
// ============================================================
function currentPhase() {
  const now = new Date();
  if (now < new Date(2026, 9, 1)) return 'phase-0';
  if (now < new Date(2027, 1, 1)) return 'phase-1';
  if (now < new Date(2027, 4, 1)) return 'phase-2';
  return 'phase-3';
}
function phaseLabel(p) {
  return { 'phase-0': 'Phase 0 · Reprise', 'phase-1': 'Phase 1 · Développement', 'phase-2': 'Phase 2 · Spécifique', 'phase-3': 'Phase 3 · Terrain' }[p] || p;
}
function phaseShort(p) {
  return { 'phase-0': 'Ph.0', 'phase-1': 'Ph.1', 'phase-2': 'Ph.2', 'phase-3': 'Ph.3' }[p] || p;
}

// ============================================================
//  CARDIO TARGETS
// ============================================================
const CARDIO_TARGETS = {
  course: {
    'phase-0': { duration: 45, km: 5.0, deniv: 50 },
    'phase-1': { duration: 60, km: 7.5, deniv: 100 },
    'phase-2': { duration: 90, km: 11.0, deniv: 200 },
    'phase-3': { duration: 60, km: 8.0, deniv: 300 }
  },
  velo: {
    'phase-0': { duration: 60, km: 18.0, deniv: 0 },
    'phase-1': { duration: 90, km: 28.0, deniv: 0 },
    'phase-2': { duration: 120, km: 40.0, deniv: 0 },
    'phase-3': { duration: 45, km: 15.0, deniv: 0 }
  }
};

function cardioTarget(type) { return CARDIO_TARGETS[type][currentPhase()]; }

function buildCardioSession(type) {
  const t = cardioTarget(type);
  const isVelo = type === 'velo';
  const durationSec = t.duration * 60;

  const warmup = isVelo
    ? { type: 'time', name: 'Échauffement', duration: 300, label: 'préparation',
        cues: ['Résistance très faible', 'Cadence 80-90 tr/min', 'Monte progressivement le cardiaque'] }
    : { type: 'time', name: 'Échauffement', duration: 300, label: 'échauffement',
        cues: ['Marche rapide 2 min', 'Rotations chevilles + hanches', 'Montées de genoux légères'] };

  const body = isVelo
    ? { type: 'time', name: 'Vélo zone 2', duration: durationSec, label: 'endurance',
        cues: ['Résistance moyenne', 'Cadence 80-90 tr/min', 'Conversation possible'] }
    : { type: 'time', name: 'Course zone 2', duration: durationSec, label: 'endurance',
        cues: ['Nez qui respire, conversation possible', 'Cadence ~170-180 pas/min', 'Trop lent = c\'est bien'] };

  const cooldown = isVelo
    ? { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
        cues: ['Résistance très faible', 'Cadence libre', 'Descente cardiaque progressive'] }
    : { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
        cues: ['Décélération progressive', 'Respiration profonde', 'Marche pas courue'] };

  return {
    id: type,
    focus: isVelo ? 'Cardio · Vélo' : 'Cardio · Course',
    focusClass: 'cardio',
    title: isVelo ? 'Vélo zone 2' : 'Course zone 2',
    duration: `${t.duration + 8} min`,
    durationMin: t.duration + 8,
    target: t,
    type: type,
    intro: isVelo
      ? 'Moteur aérobie sans casser les articulations. Zone 2 = tenable, conversation possible.'
      : 'Le moteur qu\'on construit lentement. Zone 2 = conversation possible.',
    plan: [
      { head: 'Échauffement', items: [{ n: warmup.name, t: '5 min' }] },
      { head: 'Corps', items: [{ n: body.name, t: `${t.duration} min` }] },
      { head: 'Récup', items: [{ n: cooldown.name, t: '3 min' }] }
    ],
    steps: [warmup, body, cooldown]
  };
}

// ============================================================
//  RENFO ROTATION (unchanged data, focusClass added)
// ============================================================
const RENFO_ROTATION = [
  {
    id: 'renfo-fondation', variant: 'A',
    focus: 'Renfo · Force fondation', focusClass: 'renfo',
    title: 'Force fondation',
    duration: '45 min', durationMin: 45,
    intro: 'Bases classiques : squats, pompes, tirages, planche. La séance de référence.',
    plan: [
      { head: 'Échauffement', items: [{ n: 'Mobilité + activation', t: '5 min' }] },
      { head: 'Circuit 3 tours', items: [{ n: 'Squats', t: '15' }, { n: 'Pompes', t: '10' }, { n: 'Rowing', t: '12' }, { n: 'Planche', t: '45 s' }] },
      { head: 'Finisher', items: [{ n: 'Step-ups', t: '3 × 10/jambe' }] }
    ],
    steps: [
      { type: 'time', name: 'Mobilité générale', duration: 180, label: 'échauffement',
        cues: ['Rotations cervicales, épaules, hanches', 'Cercles chevilles', 'Cat-cow 5 cycles'] },
      { type: 'time', name: 'Activation', duration: 120, label: 'échauffement',
        cues: ['10 squats à vide', '10 fentes alternées', '10 rotations bras'] },
      { type: 'reps', name: 'Squats', reps: '15 reps', label: 'circuit — tour 1/3',
        cues: ['Fesses vers l\'arrière', 'Sous parallèles', 'Dos droit'] },
      { type: 'rest', duration: 15 },
      { type: 'reps', name: 'Pompes', reps: '10 reps', label: 'circuit — tour 1/3',
        cues: ['Corps en ligne', 'Descente 2 sec', 'Sur les genoux si besoin'] },
      { type: 'rest', duration: 15 },
      { type: 'reps', name: 'Rowing', reps: '12 reps', label: 'circuit — tour 1/3',

function getWeekRenfoIdx() {
  const ref = new Date(2026, 6, 27);
  const now = new Date();
  const diffDays = Math.floor((now - ref) / (1000 * 60 * 60 * 24));
  const weekNum = Math.floor(diffDays / 7);
  return ((weekNum % RENFO_ROTATION.length) + RENFO_ROTATION.length) % RENFO_ROTATION.length;
}
function getCurrentRenfo() { return RENFO_ROTATION[getWeekRenfoIdx()]; }

const STORAGE_KEY = 'shaolin-one-state-v2';

const state = {
  view: 'home',
  sessionId: null,
  sessionKind: null,
  lexiqueId: null,
  timer: { running: false, paused: false, stepIdx: 0, stepElapsed: 0, totalElapsed: 0, intervalId: null },
  week: {
    id: getWeekId(),
    boxe: { done: false, note: '' },
    cardio: { done: false, type: null, duration: null, km: null, deniv: null },
    renfo: { done: false, variantId: null }
  },
  cardioHistory: [],
  wakeLock: null,
  audioCtx: null
};

function getWeekId() {
  const d = new Date();
  const year = d.getFullYear();
  const start = new Date(year, 0, 1);
  const diff = (d - start) / (1000 * 60 * 60 * 24);
  const week = Math.ceil((diff + start.getDay() + 1) / 7);
  return `${year}-W${week}`;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.week && saved.week.id === state.week.id) Object.assign(state.week, saved.week);
    state.cardioHistory = saved.cardioHistory || [];
  } catch (e) {}
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ week: state.week, cardioHistory: state.cardioHistory }));
  } catch (e) {}
}
function countDone() {
  let c = 0;
  if (state.week.boxe.done) c++;
  if (state.week.cardio.done) c++;
  if (state.week.renfo.done) c++;
  return c;
}

// ============================================================
//  AUDIO + VIBRATION + WAKE LOCK
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) state.audioCtx = new AC(); } catch (e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}
function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) {}
}
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
function signalTransition() { beep(660, 0.15); setTimeout(() => beep(880, 0.2), 180); vibrate([120, 60, 180]); }
function signalCountdown() { beep(440, 0.08); vibrate(60); }
function signalComplete() { beep(660, 0.15); setTimeout(() => beep(880, 0.15), 180); setTimeout(() => beep(1100, 0.3), 360); vibrate([200, 80, 200, 80, 400]); }
async function requestWakeLock() {
  if ('wakeLock' in navigator) { try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
}
function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release().catch(()=>{}); state.wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.timer.running) requestWakeLock(); });

// ============================================================
//  TIMER
// ============================================================
function getCurrentSession() {
  if (state.sessionKind === 'stretching') return STRETCHING;
  if (state.sessionKind === 'bonus') return BONUS.find(b => b.id === state.sessionId);
  if (state.sessionKind === 'cardio') return buildCardioSession(state.sessionId);
  if (state.sessionKind === 'renfo') return RENFO_ROTATION.find(r => r.id === state.sessionId);
  return null;
}
function activeSteps() { const s = getCurrentSession(); return s ? s.steps : []; }
function currentStep() { return activeSteps()[state.timer.stepIdx]; }

function startTimer() {
  ensureAudio(); requestWakeLock();
  state.timer.running = true; state.timer.paused = false;
  state.timer.stepIdx = 0; state.timer.stepElapsed = 0; state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  render();
}
function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    if (remaining <= 3 && remaining > 0) signalCountdown();
    if (state.timer.stepElapsed >= step.duration) { advance(); return; }
  }
  updateTimerUI();
}
function togglePause() { state.timer.paused = !state.timer.paused; render(); }
function advance() {
  signalTransition();
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function skipStep() {
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false;
  releaseWakeLock(); signalComplete();
  if (state.sessionKind === 'cardio') { state.view = 'cardio-stats'; render(); return; }
  if (state.sessionKind === 'renfo') {
    state.week.renfo.done = true;
    state.week.renfo.variantId = state.sessionId;
    saveState();
  }
  state.view = 'complete';
  render();
}
function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false; state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home'; render();
}

function goto(view, opts = {}) {
  if (state.timer.running && view !== 'running') {
    confirmDialog('Séance en cours', 'Quitter la séance ? Elle ne sera pas validée.', () => {
      quitSession();
      Object.assign(state, opts);
      state.view = view; render();

    return;
  }
  Object.assign(state, opts);
  state.view = view;
  window.scrollTo({ top: 0 });
  render();
}

  const deniv = parseFloat(document.getElementById('stats-deniv').value) || 0;

  state.cardioHistory.push({ date: new Date().toISOString().slice(0,10), weekId: state.week.id, type, duration, km, deniv, phase: currentPhase() });
  saveState();

  render();

function computeVerdict(type, duration, km, deniv) {
  const t = CARDIO_TARGETS[type][currentPhase()];
  const durPct = (duration / t.duration) * 100;
  const kmPct = (km / t.km) * 100;
  const overall = (durPct + kmPct) / 2;
  let cls, title, desc;
  if (overall >= 100) { cls = 'above'; title = 'Au-dessus'; desc = `${Math.round(overall)}% de la cible · continue`; }
  else if (overall >= 85) { cls = 'on-target'; title = 'Dans la cible'; desc = `${Math.round(overall)}% de la cible · tu progresses`; }
  else { cls = 'below'; title = 'En-dessous'; desc = `${Math.round(overall)}% de la cible · c'est le début, ça vient`; }
  return { cls, title, desc };
}

// ============================================================
//  RENDER — RUNNING
// ============================================================
function renderRunning() {
  const steps = activeSteps();
  const step = currentStep();
  if (!step) return renderComplete();

  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalStr = `${totalMin}:${String(totalSec).padStart(2, '0')}`;

  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  // Determine tint based on step
  let viewClass = 'exercise';
  if (step.type === 'rest') viewClass = 'rest';
  else if (step.label === 'échauffement' || step.label === 'préparation') viewClass = 'warmup';
  else if (step.label === 'endurance') viewClass = 'endurance';

  let timerHTML = '';
  let actionHTML = '';
  let stepNameHTML = '';
  let stepSubHTML = '';
  let contextHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    contextHTML = `<div class="run-step-context">Repos</div>`;
    stepNameHTML = `<div class="run-step-name">Récup</div>`;
    const next = steps[state.timer.stepIdx + 1];
    const nextName = next ? (next.name || 'Fin') : 'Fin';
    stepSubHTML = `<div class="run-step-sub">Prochain · ${nextName}</div>`;
    timerHTML = `
      <div class="run-timer rest">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    const cls = viewClass === 'warmup' ? 'warmup' : (viewClass === 'endurance' ? '' : '');
    timerHTML = `
      <div class="run-timer ${cls}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}</div>`;
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `
      <div class="run-cues">
        <ul class="run-cues-list">
          ${step.cues.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>`;
  }

  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running-view ${viewClass}">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>

      <div class="run-progress">${progressHTML}</div>

      <div class="run-content">
        ${contextHTML}
        ${stepNameHTML}
        ${stepSubHTML}
        ${timerHTML}
        ${cuesHTML}
        ${nextPreview}
      </div>

      ${actionHTML}
    </div>`;
}

function askQuit() {
  confirmDialog('Quitter la séance ?', 'La séance ne sera pas validée.', quitSession, 'Quitter', true);
}

function updateTimerUI() {
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-timer-bar-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

// ============================================================
//  RENDER — CARDIO RECAP
// ============================================================
function renderCardioRecap() {
  const c = state.week.cardio;
  const target = CARDIO_TARGETS[c.type][currentPhase()];
  const v = computeVerdict(c.type, c.duration, c.km, c.deniv);
  const label = c.type === 'velo' ? 'Vélo maison' : 'Course à pied';

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <div class="preview-hero">
        <div class="preview-focus-tag cardio">Validée · ${label}</div>
        <h1 class="preview-title">Cette semaine.</h1>
      </div>

      <div class="preview-metrics">
        <div class="preview-metric">
          <div class="preview-metric-val">${c.duration}<span class="unit"> min</span></div>
          <div class="preview-metric-lbl">Durée · cible ${target.duration}</div>
        </div>
        <div class="preview-metric">
          <div class="preview-metric-val">${c.km}<span class="unit"> km</span></div>
          <div class="preview-metric-lbl">Km · cible ${target.km}</div>
        </div>
        ${c.type === 'course' ? `
        <div class="preview-metric">
          <div class="preview-metric-val">${c.deniv}<span class="unit"> m</span></div>
          <div class="preview-metric-lbl">D+ · cible ${target.deniv}</div>
        </div>` : `<div class="preview-metric"><div class="preview-metric-val">–</div><div class="preview-metric-lbl">D+</div></div>`}
      </div>

      <div class="stats-verdict ${v.cls}">
        <div class="stats-verdict-title">${v.title}</div>
        <div class="stats-verdict-desc">${v.desc}</div>
      </div>

      <button class="cta-btn secondary" onclick="editCardioStats()">Corriger les chiffres</button>
    </div>`;
}

function editCardioStats() {
  state.sessionId = state.week.cardio.type;
  state.sessionKind = 'cardio';
  state.view = 'cardio-stats';
  state.week.cardio.done = false;
  saveState();
  render();
  setTimeout(() => {
    const dur = document.getElementById('stats-duration');
    const km = document.getElementById('stats-km');
    const den = document.getElementById('stats-deniv');
    if (dur) dur.value = state.week.cardio.duration || '';
    if (km) km.value = state.week.cardio.km || '';
    if (den) den.value = state.week.cardio.deniv || '';
  }, 30);
}

// ============================================================
//  RENDER — COMPLETE
// ============================================================
function renderComplete() {
  const kind = state.sessionKind;
  const done = countDone();
  const showCounter = kind === 'cardio' || kind === 'renfo';

  let stats = '';
  if (kind === 'cardio' && state.week.cardio.done) {
    const c = state.week.cardio;
    const v = computeVerdict(c.type, c.duration, c.km, c.deniv);
    stats = `
      <div class="stats-verdict ${v.cls}" style="margin: 0 8px 30px">
        <div class="stats-verdict-title">${v.title}</div>
        <div class="stats-verdict-desc">${v.desc}</div>
      </div>`;
  }

  let progressHTML = '';
  if (showCounter) {
    progressHTML = `<div class="complete-progress">${done}<span class="complete-arrow">/</span>3</div>`;
  }

  return `
    <div class="view complete-view">
      <div class="complete-mark">Séance validée</div>
      <div class="complete-title">Bien joué.</div>
      ${progressHTML}
      ${stats}
      <div class="complete-actions">
        ${kind !== 'stretching' ? `<button class="primary" onclick="openStretching()">Étirements post-séance</button>` : ''}
        <button class="secondary" onclick="goto('home')">Retour à l'accueil</button>
      </div>
    </div>`;
}

// ============================================================
//  RENDER — BONUS + LEXIQUE
// ============================================================
function renderBonusList() {

    <button class="list-card" onclick="openBonus('${b.id}')">
      <div class="list-card-body">
        <div class="list-card-title">${b.title}</div>
        <div class="list-card-sub">${b.focus} · ${b.duration}</div>
      </div>
      <div class="list-card-arrow">→</div>
    </button>`).join('');

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <h1 class="list-title">Bonus.</h1>
      <p class="list-intro">Séances 20 min quand tu as la pêche. En plus du tronc principal.</p>
      <div class="list-items">${itemsHTML}</div>
    </div>`;
}

function renderLexiqueList() {
  const itemsHTML = LEXIQUE.map(l => `
    <button class="list-card" onclick="goto('lexique-detail', {lexiqueId: '${l.id}'})">
      <div class="list-card-body">
        <div class="list-card-title">${l.title}</div>
        <div class="list-card-sub">${l.cat}</div>
      </div>
      <div class="list-card-arrow">→</div>
    </button>`).join('');

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <h1 class="list-title">Parasportif.</h1>

      <div class="list-items">${itemsHTML}</div>
    </div>`;
}

function renderLexiqueDetail() {
  const item = LEXIQUE.find(l => l.id === state.lexiqueId);
  if (!item) return renderLexiqueList();

  const whenHTML = item.when ? `
    <div class="lex-section">
      <div class="lex-section-head">Quand</div>
      <ul>${item.when.map(w => `<li>${w}</li>`).join('')}</ul>
    </div>` : '';

  const protocolHTML = item.protocol ? `
    <div class="lex-protocol">
      <div class="lex-section-head">Protocole</div>
      <div class="lex-protocol-title">${item.protocol.title}</div>
      <p>${item.protocol.body}</p>
      ${item.protocol.details ? `<ul>${item.protocol.details.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}
    </div>` : '';

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('lexique-list')">← Retour</button>
      <div class="lex-cat">${item.cat}</div>
      <h1 class="lex-title">${item.title}</h1>
      <p class="lex-intro">${item.intro}</p>
      ${whenHTML}
      ${protocolHTML}
    </div>`;
}

// ============================================================
//  DISPATCH
// ============================================================
function render() {
  const app = document.getElementById('app');
  let html;
  switch (state.view) {
    case 'home': html = renderHome(); break;
    case 'cardio-choice': html = renderCardioChoice(); break;
    case 'cardio-stats': html = renderCardioStats(); break;
    case 'cardio-recap': html = renderCardioRecap(); break;
    case 'preview': html = renderPreview(); break;
    case 'running': html = renderRunning(); break;
    case 'complete': html = renderComplete(); break;
    case 'bonus-list': html = renderBonusList(); break;
    case 'lexique-list': html = renderLexiqueList(); break;
    case 'lexique-detail': html = renderLexiqueDetail(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadState();
  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>

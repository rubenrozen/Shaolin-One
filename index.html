<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0908">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Cervin 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght,YOPQ@0..100,0..1,9..144,600..900,25..208&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #FFFFFF;
    --paper-deep: #F4F4F2;
    --paper-card: #FFFFFF;
    --ink: #0A0908;
    --ink-soft: #4A4845;
    --ink-faint: #8C8985;
    --line: rgba(10, 9, 8, 0.14);
    --line-soft: rgba(10, 9, 8, 0.07);

    --rust: #B23A1F;
    --rust-deep: #6E1F0E;
    --rust-bg: #FBEAE3;

    --pine: #1F5234;
    --pine-deep: #133320;
    --pine-bg: #E5F0E5;

    --indigo: #243757;
    --indigo-deep: #131F36;
    --indigo-bg: #E2E6EE;

    --amber: #7A4A0A;
    --amber-bg: #F8EAD0;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    /* Fraunces pushed to absolute maximum boldness */
    --display-max: "opsz" 144, "SOFT" 0, "WONK" 0, "YOPQ" 208;
    --display-strong: "opsz" 100, "SOFT" 0, "WONK" 0, "YOPQ" 180;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  html { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(20px + var(--safe-bottom));
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    -webkit-appearance: none;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  /* ============ HEAVY DISPLAY ============ */
  .display-max {
    font-family: var(--font-display);
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.045em;
    line-height: 0.9;
  }
  .display-strong {
    font-family: var(--font-display);
    font-weight: 900;
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.03em;
    line-height: 0.95;
  }

  /* ============ TOP BAR ============ */
  .top-bar {
    padding-top: calc(18px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line-soft);
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.04em;
    font-variation-settings: var(--display-max);
  }
  .brand-dot { color: var(--rust); }
  .brand-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .back-btn {
    padding-top: calc(18px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn:active { color: var(--rust); }

  /* ============ HERO / WEEK COUNTER ============ */
  .hero { padding: 22px 0 24px; }
  .hero-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: 62px;
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.05em;
    line-height: 0.85;
    margin-bottom: 16px;
  }
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .progress-slot {
    flex: 1;
    height: 8px;
    background: var(--paper-deep);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-slot.done { background: var(--rust); }
  .progress-caption {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ============ SECTION LABEL ============ */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin: 26px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }

  /* ============ SESSION CARDS ============ */
  .session-list { display: flex; flex-direction: column; gap: 8px; }

  .session-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    transition: transform 0.1s ease;
    width: 100%;
    position: relative;
  }
  .session-card:active { transform: scale(0.98); }
  .session-card.done {
    background: var(--pine-bg);
    border-color: var(--pine);
  }
  .session-card.done::after {
    content: "✓";
    position: absolute;
    top: 12px;
    right: 14px;
    color: var(--pine-deep);
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
  }
  .session-body { flex: 1; min-width: 0; }
  .session-focus {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--rust);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .session-card.done .session-focus { color: var(--pine-deep); }
  .session-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 4px;
    font-variation-settings: var(--display-strong);
  }
  .session-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .session-arrow {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink-faint);
    font-weight: 900;
    margin-left: 12px;
    font-variation-settings: var(--display-strong);
  }
  .session-card.done .session-arrow { display: none; }

  /* ============ NAV BUTTONS ============ */
  .nav-tile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: var(--paper-deep);
    border-radius: 12px;
    width: 100%;
    text-align: left;
    margin-bottom: 6px;
  }
  .nav-tile:active { background: var(--line-soft); }
  .nav-tile-body { flex: 1; }
  .nav-tile-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 17px;
    letter-spacing: -0.02em;
    margin-bottom: 3px;
    font-variation-settings: var(--display-strong);
  }
  .nav-tile-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .nav-tile-arrow {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-faint);
    font-weight: 900;
    font-variation-settings: var(--display-strong);
  }

  /* ============ PREVIEW ============ */
  .preview-title {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.045em;
    margin: 22px 0 6px;
    font-variation-settings: var(--display-max);
  }
  .preview-focus {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--rust);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .preview-meta {
    display: flex;
    gap: 24px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .preview-meta-item .preview-meta-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .preview-meta-item .preview-meta-value {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
    font-weight: 700;
  }
  .preview-intro {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin-bottom: 22px;
  }
  .preview-plan {
    margin-bottom: 24px;
  }
  .preview-plan-section {
    margin-bottom: 14px;
  }
  .preview-plan-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .preview-plan-list {
    list-style: none;
    padding: 0;
  }
  .preview-plan-list li {
    font-size: 14px;
    padding: 4px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--ink);
  }
  .preview-plan-list li .step-t {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  .start-btn {
    width: 100%;
    padding: 20px;
    background: var(--rust);
    color: white;
    border-radius: 12px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    font-variation-settings: var(--display-strong);
  }
  .start-btn:active { background: var(--rust-deep); }

  /* ============ CARDIO CHOICE ============ */
  .cardio-choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .cardio-choice {
    padding: 22px 20px;
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    text-align: left;
    width: 100%;
    transition: all 0.15s ease;
  }
  .cardio-choice:active {
    background: var(--paper-deep);
    transform: scale(0.98);
  }
  .cardio-choice-name {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.035em;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
  }
  .cardio-choice-target {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ============ RUNNING VIEW ============ */
  .running {
    padding-top: calc(12px + var(--safe-top));
  }
  .run-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .run-quit, .run-pause {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .run-pause {
    background: var(--paper-deep);
    color: var(--ink);
  }
  .run-pause.paused {
    background: var(--amber-bg);
    color: var(--amber);
  }
  .run-total {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .run-progress {
    display: flex;
    gap: 2px;
    margin-bottom: 30px;
    height: 4px;
  }
  .run-progress-slot {
    flex: 1;
    background: var(--paper-deep);
    border-radius: 2px;
  }
  .run-progress-slot.done { background: var(--rust); }
  .run-progress-slot.current { background: var(--ink); }

  .run-step-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .run-step-name {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.045em;
    text-align: center;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
  }
  .run-step-sub {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
  }

  .run-timer {
    text-align: center;
    margin-bottom: 26px;
  }
  .run-timer-value {
    font-family: var(--font-display);
    font-size: 110px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.06em;
    font-variation-settings: var(--display-max);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .run-timer.rest .run-timer-value { color: var(--pine); }
  .run-timer.warmup .run-timer-value { color: var(--amber); }

  .run-progress-ring {
    width: 100%;
    max-width: 220px;
    height: 4px;
    background: var(--paper-deep);
    border-radius: 2px;
    margin: 12px auto 0;
    overflow: hidden;
  }
  .run-progress-ring-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.3s linear;
  }
  .run-timer.rest .run-progress-ring-fill { background: var(--pine); }
  .run-timer.warmup .run-progress-ring-fill { background: var(--amber); }

  .run-cues {
    background: var(--paper-deep);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 26px;
  }
  .run-cues-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .run-cues-list {
    list-style: none;
    padding: 0;
  }
  .run-cues-list li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 14px;
    position: relative;
    margin-bottom: 3px;
    font-weight: 500;
  }
  .run-cues-list li::before {
    content: "·";
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--rust);
    font-weight: 900;
  }

  .run-next {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .run-next span { color: var(--ink-soft); }

  .run-action-btn {
    width: 100%;
    padding: 22px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
  }
  .run-action-btn:active { background: var(--rust); }
  .run-action-btn.done { background: var(--rust); }
  .run-action-btn.skip {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 12px;
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-variation-settings: normal;
  }

  /* ============ CARDIO STATS INPUT ============ */
  .stats-title {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.045em;
    margin: 20px 0 8px;
    font-variation-settings: var(--display-max);
  }
  .stats-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 24px;
  }

  .stats-target-box {
    background: var(--paper-deep);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .stats-target-head {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .stats-target-values {
    display: flex;
    gap: 16px;
  }
  .stats-target-value {
    flex: 1;
  }
  .stats-target-value .val {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .stats-target-value .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 4px;
  }

  .stats-input-group {
    margin-bottom: 16px;
  }
  .stats-input-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .stats-input-label .target {
    color: var(--rust);
  }
  .stats-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .stats-input:focus {
    outline: none;
    border-color: var(--rust);
  }

  .stats-verdict {
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
  }
  .stats-verdict.above { background: var(--pine-bg); color: var(--pine-deep); }
  .stats-verdict.on-target { background: var(--amber-bg); color: var(--amber); }
  .stats-verdict.below { background: var(--rust-bg); color: var(--rust-deep); }
  .stats-verdict-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 4px;
    font-variation-settings: var(--display-strong);
  }
  .stats-verdict-desc {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
  }

  /* ============ BOXE CHECK DIALOG ============ */
  .boxe-dialog textarea {
    width: 100%;
    padding: 14px 16px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    min-height: 100px;
    resize: vertical;
    margin-bottom: 12px;
  }
  .boxe-dialog textarea:focus {
    outline: none;
    border-color: var(--rust);
  }

  /* ============ CARDIO LAST SESSION ============ */
  .last-session {
    background: var(--pine-bg);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .last-session-head {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--pine-deep);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .last-session-body {
    display: flex;
    gap: 14px;
  }
  .last-session-stat {
    flex: 1;
  }
  .last-session-stat .val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.03em;

// ============================================================
//  PHASE DETECTION
// ============================================================
function currentPhase() {
  const now = new Date();
  if (now < new Date(2026, 9, 1)) return 'phase-0';   // < Oct 1 2026
  if (now < new Date(2027, 1, 1)) return 'phase-1';   // < Feb 1 2027
  if (now < new Date(2027, 4, 1)) return 'phase-2';   // < May 1 2027
  return 'phase-3';
}
function phaseLabel(p) {
  return { 'phase-0': 'Phase 0 · Reprise', 'phase-1': 'Phase 1 · Développement', 'phase-2': 'Phase 2 · Spécifique', 'phase-3': 'Phase 3 · Terrain' }[p] || p;
}

// ============================================================
//  CARDIO TARGETS (progression curve)
// ============================================================
const CARDIO_TARGETS = {

    'phase-3': { duration: 60, km: 8.0, deniv: 300, cadence: 'Affûtage · sortie montagne prioritaire' }

  velo: {
    'phase-0': { duration: 60, km: 18.0, deniv: 0, cadence: 'Zone 2 · résistance faible-moyenne' },
    'phase-1': { duration: 90, km: 28.0, deniv: 0, cadence: 'Zone 2 + 3×12 min seuil' },

  }
};

// ============================================================
//  CARDIO SESSION DATA (velo + course)
// ============================================================
function cardioTarget(type) {
  return CARDIO_TARGETS[type][currentPhase()];
}

function buildCardioSession(type) {
  const t = cardioTarget(type);
  const isVelo = type === 'velo';
  const durationSec = t.duration * 60;

  const warmup = isVelo
    ? { name: 'Vélo échauffement', duration: 300, label: 'préparation',
        cues: ['Résistance très faible', 'Cadence 80-90 tr/min', 'Monte progressivement le rythme cardiaque'] }
    : { name: 'Marche + mobilité', duration: 300, label: 'échauffement',
        cues: ['Marche rapide 2 min', 'Rotations chevilles + hanches', 'Montées de genoux légères sur les 2 dernières min'] };

  const body = isVelo
    ? { name: 'Vélo zone 2', duration: durationSec, label: 'endurance',
        cues: ['Résistance moyenne', 'Cadence 80-90 tr/min', 'Tu peux tenir une conversation', 'Nez qui respire si possible'] }
    : { name: 'Course zone 2', duration: durationSec, label: 'endurance',
        cues: ['Nez qui respire, conversation possible', 'Cadence ~170-180 pas/min si tu peux', 'C\'est trop lent = c\'est bien'] };

  const cooldown = isVelo
    ? { name: 'Retour au calme', duration: 180, label: 'récup',
        cues: ['Résistance très faible', 'Cadence libre', 'Descente cardiaque progressive'] }
    : { name: 'Marche retour au calme', duration: 180, label: 'récup',
        cues: ['Décélération progressive', 'Respiration profonde', 'Bras dessus la tête'] };

  return {
    id: type,
    focus: isVelo ? 'Cardio · Vélo maison' : 'Cardio · Course à pied',
    title: isVelo ? 'Vélo zone 2' : 'Course zone 2',
    duration: `${t.duration + 8} min`,

    type: type,
    intro: isVelo

    plan: [
      { head: 'Échauffement', items: [{ n: warmup.name, t: '5 min' }] },
      { head: 'Corps', items: [{ n: body.name, t: `${t.duration} min` }] },
      { head: 'Retour au calme', items: [{ n: cooldown.name, t: '3 min' }] }
    ],
    steps: [warmup, body, cooldown]
  };
}

function getWeekRenfoIdx() {
  // Compute a stable index based on weeks since a reference date
  const ref = new Date(2026, 6, 27); // Monday 27 July 2026
  const now = new Date();
  const diffDays = Math.floor((now - ref) / (1000 * 60 * 60 * 24));
  const weekNum = Math.floor(diffDays / 7);
  return ((weekNum % RENFO_ROTATION.length) + RENFO_ROTATION.length) % RENFO_ROTATION.length;
}

function getCurrentRenfo() {
  return RENFO_ROTATION[getWeekRenfoIdx()];
}

// ============================================================

// ============================================================
const STORAGE_KEY = 'shaolin-one-state-v2';

const state = {
  view: 'home',
  sessionId: null,
  sessionKind: null,  // 'cardio', 'renfo', 'bonus', 'stretching'
  lexiqueId: null,

  timer: {
    running: false,
    paused: false,
    stepIdx: 0,
    stepElapsed: 0,
    totalElapsed: 0,
    intervalId: null
  },

  week: {
    id: getWeekId(),
    boxe: { done: false, note: '' },
    cardio: { done: false, type: null, duration: null, km: null, deniv: null },
    renfo: { done: false, variantId: null }
  },

  cardioHistory: [],
  wakeLock: null,
  audioCtx: null
};

function getWeekId() {
  const d = new Date();
  const year = d.getFullYear();
  const start = new Date(year, 0, 1);
  const diff = (d - start) / (1000 * 60 * 60 * 24);
  const week = Math.ceil((diff + start.getDay() + 1) / 7);
  return `${year}-W${week}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.week && saved.week.id === state.week.id) {
      Object.assign(state.week, saved.week);
    }
    state.cardioHistory = saved.cardioHistory || [];
  } catch (e) { /* ignore */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      cardioHistory: state.cardioHistory
    }));
  } catch (e) { /* ignore */ }
}

function countDone() {
  let c = 0;
  if (state.week.boxe.done) c++;
  if (state.week.cardio.done) c++;
  if (state.week.renfo.done) c++;
  return c;
}

// ============================================================
//  AUDIO + VIBRATION (unchanged)
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) state.audioCtx = new AC();
    } catch (e) { /* no audio */ }
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
}
function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) { /* ignore */ }
}
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}
function signalTransition() { beep(660, 0.15); setTimeout(() => beep(880, 0.2), 180); vibrate([120, 60, 180]); }
function signalCountdown() { beep(440, 0.08); vibrate(60); }
function signalComplete() { beep(660, 0.15); setTimeout(() => beep(880, 0.15), 180); setTimeout(() => beep(1100, 0.3), 360); vibrate([200, 80, 200, 80, 400]); }

// ============================================================
//  WAKE LOCK
// ============================================================
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
}
function releaseWakeLock() {
  if (state.wakeLock) { state.wakeLock.release().catch(()=>{}); state.wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.timer.running) requestWakeLock();
});

// ============================================================
//  TIMER LOGIC
// ============================================================
function getCurrentSession() {
  if (state.sessionKind === 'stretching') return STRETCHING;
  if (state.sessionKind === 'bonus') return BONUS.find(b => b.id === state.sessionId);
  if (state.sessionKind === 'cardio') return buildCardioSession(state.sessionId);
  if (state.sessionKind === 'renfo') return RENFO_ROTATION.find(r => r.id === state.sessionId);
  return null;
}

function activeSteps() {
  const session = getCurrentSession();
  return session ? session.steps : [];
}
function currentStep() {
  return activeSteps()[state.timer.stepIdx];
}

function startTimer() {
  ensureAudio();
  requestWakeLock();
  state.timer.running = true;
  state.timer.paused = false;
  state.timer.stepIdx = 0;
  state.timer.stepElapsed = 0;
  state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  render();
}

function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    if (remaining <= 3 && remaining > 0) signalCountdown();
    if (state.timer.stepElapsed >= step.duration) { advance(); return; }
  }
  updateTimerUI();
}

function togglePause() { state.timer.paused = !state.timer.paused; render(); }
function advance() {
  signalTransition();
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function skipStep() {
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}

function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  state.timer.running = false;
  releaseWakeLock();
  signalComplete();

  // Cardio: don't mark done yet, ask for stats first
  if (state.sessionKind === 'cardio') {
    state.view = 'cardio-stats';
    render();
    return;
  }

  // Renfo: mark done
  if (state.sessionKind === 'renfo') {
    state.week.renfo.done = true;
    state.week.renfo.variantId = state.sessionId;
    saveState();
  }

  state.view = 'complete';
  render();
}

function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  state.timer.running = false;
  state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home';
  render();
}

function submitCardioStats() {
  const type = state.sessionId;
  const durEl = document.getElementById('stats-duration');
  const kmEl = document.getElementById('stats-km');
  const denEl = document.getElementById('stats-deniv');

  const duration = parseFloat(durEl.value) || 0;
  const km = parseFloat(kmEl.value) || 0;
  const deniv = parseFloat(denEl.value) || 0;

  state.week.cardio.done = true;
  state.week.cardio.type = type;
  state.week.cardio.duration = duration;
  state.week.cardio.km = km;
  state.week.cardio.deniv = deniv;

  // Add to history
  state.cardioHistory.push({
    date: new Date().toISOString().slice(0, 10),
    weekId: state.week.id,
    type,
    duration,
    km,
    deniv,
    phase: currentPhase()
  });

  saveState();
  state.view = 'complete';
  render();
}

function computeVerdict(type, duration, km, deniv) {
  const t = CARDIO_TARGETS[type][currentPhase()];
  const durPct = (duration / t.duration) * 100;
  const kmPct = (km / t.km) * 100;
  // Overall verdict: average of duration and km percentages
  const overall = (durPct + kmPct) / 2;
  let cls, title, desc;
  if (overall >= 100) {
    cls = 'above';
    title = 'Au-dessus de la courbe';
    desc = `Tu es à ${Math.round(overall)}% de la cible Phase 0 · continue comme ça`;
  } else if (overall >= 85) {
    cls = 'on-target';
    title = 'Dans la cible';
    desc = `Tu es à ${Math.round(overall)}% de la cible · tu progresses`;
  } else {
    cls = 'below';
    title = 'En-dessous de la courbe';
    desc = `Tu es à ${Math.round(overall)}% de la cible · c\'est le début, pas grave`;
  }
  return { cls, title, desc, durPct, kmPct };
}

// ============================================================
//  RENDER — RUNNING
// ============================================================
function renderRunning() {
  const steps = activeSteps();
  const step = currentStep();
  if (!step) return renderComplete();

  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalStr = `${totalMin}:${String(totalSec).padStart(2, '0')}`;

  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  const isWarmup = step.label === 'échauffement' || step.label === 'préparation';

  let timerHTML = '';
  let actionHTML = '';
  let stepNameHTML = '';
  let stepSubHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    stepNameHTML = `<div class="run-step-name">Repos</div>`;
    const next = steps[state.timer.stepIdx + 1];
    const nextName = next ? (next.name || 'Fin de séance') : 'Fin de séance';
    stepSubHTML = `<div class="run-step-sub">Prochain · ${nextName}</div>`;
    timerHTML = `
      <div class="run-timer rest">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-progress-ring"><div class="run-progress-ring-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    if (step.label) stepSubHTML = `<div class="run-step-sub">${step.label}</div>`;
    const cls = isWarmup ? 'warmup' : '';
    timerHTML = `
      <div class="run-timer ${cls}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-progress-ring"><div class="run-progress-ring-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}${step.label ? ' · ' + step.label : ''}</div>`;
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `
      <div class="run-cues">
        <div class="run-cues-head">Cues</div>
        <ul class="run-cues-list">
          ${step.cues.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>`;
  }

  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>

      <div class="run-progress">${progressHTML}</div>

      ${stepNameHTML}
      ${stepSubHTML}
      ${timerHTML}
      ${cuesHTML}
      ${nextPreview}
      ${actionHTML}
    </div>`;
}

function askQuit() {
  confirmDialog('Quitter la séance ?', 'La séance ne sera pas validée. Tu peux reprendre depuis le début plus tard.', quitSession, 'Quitter', true);
}

function updateTimerUI() {
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-progress-ring-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

        <div class="stats-verdict-desc">${v.desc}</div>
      </div>

      <button class="run-action-btn skip" onclick="editCardioStats()" style="width:100%">Corriger les chiffres</button>
    </div>`;
}

function editCardioStats() {
  state.sessionId = state.week.cardio.type;
  state.sessionKind = 'cardio';
  state.view = 'cardio-stats';
  // Reset done flag so we can re-submit
  state.week.cardio.done = false;
  saveState();
  render();
  // Prefill inputs
  setTimeout(() => {
    const dur = document.getElementById('stats-duration');
    const km = document.getElementById('stats-km');
    const den = document.getElementById('stats-deniv');
    if (dur) dur.value = state.week.cardio.duration || '';
    if (km) km.value = state.week.cardio.km || '';
    if (den) den.value = state.week.cardio.deniv || '';
  }, 30);
}

// ============================================================
//  RENDER — COMPLETE
// ============================================================
function renderComplete() {
  const kind = state.sessionKind;
  const done = countDone();
  const target = 3;
  const showCounter = kind === 'cardio' || kind === 'renfo';

  let stats = '';
  if (kind === 'cardio' && state.week.cardio.done) {
    const c = state.week.cardio;
    const v = computeVerdict(c.type, c.duration, c.km, c.deniv);
    stats = `
      <div class="stats-verdict ${v.cls}" style="margin: 0 20px 30px">
        <div class="stats-verdict-title">${v.title}</div>
        <div class="stats-verdict-desc">${v.desc}</div>
      </div>`;
  }

  let progressHTML = '';
  if (showCounter) {
    progressHTML = `<div class="complete-progress">${done}<span class="complete-arrow">/</span>${target}</div>`;
  }

  return `
    <div class="view complete">
      <div class="complete-mark">Séance validée</div>
      <div class="complete-title">Bien joué.</div>
      ${progressHTML}
      ${stats}
      <div class="complete-actions">
        ${kind !== 'stretching' ? `<button class="primary" onclick="openStretching()">Étirements post-séance →</button>` : ''}
        <button class="secondary" onclick="goto('home')">Retour à l'accueil</button>
      </div>
    </div>`;
}

// ============================================================
//  RENDER — DISPATCHER
// ============================================================
function render() {
  const app = document.getElementById('app');
  let html;
  switch (state.view) {
    case 'home': html = renderHome(); break;
    case 'cardio-choice': html = renderCardioChoice(); break;
    case 'cardio-stats': html = renderCardioStats(); break;
    case 'cardio-recap': html = renderCardioRecap(); break;
    case 'preview': html = renderPreview(); break;
    case 'running': html = renderRunning(); break;
    case 'complete': html = renderComplete(); break;
    case 'bonus-list': html = renderBonusList(); break;
    case 'lexique-list': html = renderLexiqueList(); break;
    case 'lexique-detail': html = renderLexiqueDetail(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
}

  loadState();
  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', init);

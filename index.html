<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0908">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Cervin 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #FFFFFF;
    --paper-deep: #F4F4F2;
    --paper-card: #FFFFFF;
    --ink: #0A0908;
    --ink-soft: #4A4845;
    --ink-faint: #8C8985;
    --line: rgba(10, 9, 8, 0.14);
    --line-soft: rgba(10, 9, 8, 0.07);

    --rust: #B23A1F;
    --rust-deep: #6E1F0E;
    --rust-bg: #FBEAE3;

    --pine: #1F5234;
    --pine-deep: #133320;
    --pine-bg: #E5F0E5;

    --indigo: #243757;
    --indigo-deep: #131F36;
    --indigo-bg: #E2E6EE;

    --amber: #7A4A0A;
    --amber-bg: #F8EAD0;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  html { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(20px + var(--safe-bottom));
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  /* ============ TOP BAR ============ */
  .top-bar {
    padding-top: calc(18px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line-soft);
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144;
  }
  .brand-dot { color: var(--rust); }
  .brand-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .back-btn {
    padding-top: calc(18px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .back-btn:active { color: var(--rust); }

  /* ============ HERO / WEEK COUNTER ============ */
  .hero {
    padding: 22px 0 24px;
  }
  .hero-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variation-settings: "opsz" 144;
    margin-bottom: 14px;
  }
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .progress-slot {
    flex: 1;
    height: 8px;
    background: var(--paper-deep);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-slot.done { background: var(--rust); }
  .progress-caption {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* ============ SECTION LABEL ============ */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin: 26px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }

  /* ============ SESSION CARDS ============ */
  .session-list { display: flex; flex-direction: column; gap: 8px; }

  .session-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    transition: transform 0.1s ease;
    width: 100%;
    position: relative;
  }
  .session-card:active { transform: scale(0.98); }
  .session-card.done {
    background: var(--pine-bg);
    border-color: var(--pine);
  }
  .session-card.done::after {
    content: "✓";
    position: absolute;
    top: 12px;
    right: 14px;
    color: var(--pine-deep);
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
  }
  .session-body { flex: 1; min-width: 0; }
  .session-focus {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--rust);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .session-card.done .session-focus { color: var(--pine-deep); }
  .session-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 4px;
    font-variation-settings: "opsz" 100;
  }
  .session-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .session-arrow {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 12px;
  }
  .session-card.done .session-arrow { display: none; }

  /* Direct-check card (boxe style) */
  .direct-check-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    text-align: left;
  }
  .check-btn {
    padding: 8px 14px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .direct-check-card.done { background: var(--pine-bg); border-color: var(--pine); }
  .direct-check-card.done .check-btn { background: var(--pine); }
  .direct-check-card.done .session-focus { color: var(--pine-deep); }

  /* ============ NAV BUTTONS (bonus, lexique, etirements) ============ */
  .nav-tile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: var(--paper-deep);
    border-radius: 12px;
    width: 100%;
    text-align: left;
    margin-bottom: 6px;
  }
  .nav-tile:active { background: var(--line-soft); }
  .nav-tile-body { flex: 1; }
  .nav-tile-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .nav-tile-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .nav-tile-arrow {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-faint);
  }

  /* ============ SESSION PREVIEW ============ */
  .preview-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin: 22px 0 6px;
    font-variation-settings: "opsz" 144;
  }
  .preview-focus {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--rust);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .preview-meta {
    display: flex;
    gap: 24px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .preview-meta-item .preview-meta-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .preview-meta-item .preview-meta-value {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .preview-intro {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin-bottom: 22px;
  }
  .preview-plan {
    margin-bottom: 24px;
  }
  .preview-plan-section {
    margin-bottom: 14px;
  }
  .preview-plan-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .preview-plan-list {
    list-style: none;
    padding: 0;
  }
  .preview-plan-list li {
    font-size: 14px;
    padding: 4px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--ink);
  }
  .preview-plan-list li .step-t {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
    white-space: nowrap;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    background: var(--rust);
    color: white;
    border-radius: 12px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }
  .start-btn:active { background: var(--rust-deep); }

  /* ============ RUNNING VIEW ============ */
  .running {
    padding-top: calc(12px + var(--safe-top));
  }
  .run-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .run-quit, .run-pause {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .run-pause {
    background: var(--paper-deep);
    color: var(--ink);
  }
  .run-pause.paused {
    background: var(--amber-bg);
    color: var(--amber);
  }
  .run-total {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .run-progress {
    display: flex;
    gap: 2px;
    margin-bottom: 30px;
    height: 4px;
  }
  .run-progress-slot {
    flex: 1;
    background: var(--paper-deep);
    border-radius: 2px;
  }
  .run-progress-slot.done { background: var(--rust); }
  .run-progress-slot.current { background: var(--ink); }

  .run-step-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .run-step-name {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.035em;
    text-align: center;
    margin-bottom: 6px;
    font-variation-settings: "opsz" 144;
  }
  .run-step-sub {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 600;
    text-align: center;
    margin-bottom: 30px;
  }

  .run-timer {
    text-align: center;
    margin-bottom: 26px;
  }
  .run-timer-value {
    font-family: var(--font-display);
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    font-variation-settings: "opsz" 144, "wdth" 100;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .run-timer.rest .run-timer-value { color: var(--pine); }
  .run-timer.warmup .run-timer-value { color: var(--amber); }

  .run-progress-ring {
    width: 100%;
    max-width: 220px;
    height: 4px;
    background: var(--paper-deep);
    border-radius: 2px;
    margin: 12px auto 0;
    overflow: hidden;
    position: relative;
  }
  .run-progress-ring-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.3s linear;
  }
  .run-timer.rest .run-progress-ring-fill { background: var(--pine); }
  .run-timer.warmup .run-progress-ring-fill { background: var(--amber); }

  .run-cues {
    background: var(--paper-deep);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 26px;
  }
  .run-cues-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .run-cues-list {
    list-style: none;
    padding: 0;
  }
  .run-cues-list li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 14px;
    position: relative;
    margin-bottom: 3px;
  }
  .run-cues-list li::before {
    content: "·";
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--rust);
    font-weight: 700;
  }

  .run-next {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .run-next span { color: var(--ink-soft); }

  .run-action-btn {
    width: 100%;
    padding: 20px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .run-action-btn:active { background: var(--rust); }
  .run-action-btn.done { background: var(--rust); }
  .run-action-btn.skip {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 12px;
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ============ COMPLETE VIEW ============ */
  .complete {
    padding-top: 60px;
    text-align: center;
  }
  .complete-mark {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--rust);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .complete-title {
    font-family: var(--font-display);
    font-size: 54px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variation-settings: "opsz" 144;
    margin-bottom: 20px;
  }
  .complete-progress {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 600;
    color: var(--rust);
    margin-bottom: 40px;
    font-variant-numeric: tabular-nums;
  }
  .complete-arrow { color: var(--ink-faint); margin: 0 12px; }
  .complete-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 20px;
  }
  .complete-actions button {
    padding: 16px;
    border-radius: 12px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .complete-actions .primary { background: var(--pine); color: white; }
  .complete-actions .secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }

  /* ============ LIST VIEW (bonus, lexique) ============ */
  .list-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin: 22px 0 6px;
    font-variation-settings: "opsz" 144;
  }
  .list-intro {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 22px;
    line-height: 1.55;
  }
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--line-soft);
    width: 100%;
    text-align: left;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item:active { background: var(--paper-deep); }
  .list-item-body { flex: 1; padding-right: 12px; }
  .list-item-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.015em;
    margin-bottom: 3px;
  }
  .list-item-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .list-item-arrow {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--ink-faint);
  }

  /* ============ LEXIQUE ITEM DETAIL ============ */
  .lex-detail-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin: 22px 0 8px;
    font-variation-settings: "opsz" 144;
  }
  .lex-detail-cat {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--indigo);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .lex-section {
    margin-bottom: 22px;
  }
  .lex-section-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .lex-section p {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .lex-section ul {
    list-style: none;
    padding: 0;
  }
  .lex-section ul li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 16px;
    position: relative;
    margin-bottom: 4px;
  }
  .lex-section ul li::before {
    content: "·";
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--indigo);
    font-weight: 700;
  }
  .lex-protocol {
    background: var(--indigo-bg);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .lex-protocol .lex-section-head { color: var(--indigo-deep); border: none; margin-bottom: 8px; }
  .lex-protocol p, .lex-protocol li { color: var(--indigo-deep); }

  /* ============ FOOTER ============ */
  .footer {
    margin-top: 40px;
    padding: 20px 0;
    border-top: 1px solid var(--line-soft);
    text-align: center;
  }
  .footer-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  /* ============ ANIMATIONS ============ */
  .view {
    animation: fade-in 0.2s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .run-pause.paused .run-timer-value { animation: pulse 1s ease-in-out infinite; }

  /* ============ DIALOG ============ */
  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 8, 0.5);
    display: none;

// ============================================================
//  STATE + PERSISTENCE
// ============================================================
const STORAGE_KEY = 'shaolin-one-state-v1';

const state = {
  view: 'home',
  sessionId: null,
  isBonus: false,
  isStretching: false,
  lexiqueId: null,

  timer: {
    running: false,
    paused: false,
    stepIdx: 0,
    stepElapsed: 0,
    totalElapsed: 0,
    intervalId: null
  },

  week: {
    id: getWeekId(),
    completed: []
  },

  wakeLock: null,
  audioCtx: null
};

function getWeekId() {
  const d = new Date();
  const year = d.getFullYear();
  // Simple week identifier: year + week number
  const start = new Date(year, 0, 1);
  const diff = (d - start) / (1000 * 60 * 60 * 24);
  const week = Math.ceil((diff + start.getDay() + 1) / 7);
  return `${year}-W${week}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.week && saved.week.id === state.week.id) {
      state.week.completed = saved.week.completed || [];
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week
    }));
  } catch (e) { /* ignore */ }
}

// ============================================================
//  AUDIO + VIBRATION
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) state.audioCtx = new AC();
    } catch (e) { /* no audio */ }
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
}

function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) { /* ignore */ }
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function signalTransition() {
  beep(660, 0.15);
  setTimeout(() => beep(880, 0.2), 180);
  vibrate([120, 60, 180]);
}
function signalCountdown() {
  beep(440, 0.08);
  vibrate(60);
}
function signalComplete() {
  beep(660, 0.15);
  setTimeout(() => beep(880, 0.15), 180);
  setTimeout(() => beep(1100, 0.3), 360);
  vibrate([200, 80, 200, 80, 400]);
}

// ============================================================
//  WAKE LOCK
// ============================================================
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      state.wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* ignore */ }
  }
}
function releaseWakeLock() {
  if (state.wakeLock) {
    state.wakeLock.release().catch(()=>{});
    state.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.timer.running) {
    requestWakeLock();
  }
});

// ============================================================
//  TIMER LOGIC
// ============================================================
function getCurrentSession() {
  if (state.isStretching) return STRETCHING;
  if (state.isBonus) return BONUS.find(b => b.id === state.sessionId);
  return SESSIONS[state.sessionId];
}

function activeSteps() {
  const session = getCurrentSession();
  return session ? session.steps : [];
}

function currentStep() {
  return activeSteps()[state.timer.stepIdx];
}

function startTimer() {
  ensureAudio();
  requestWakeLock();
  state.timer.running = true;
  state.timer.paused = false;
  state.timer.stepIdx = 0;
  state.timer.stepElapsed = 0;
  state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  render();
}

function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;

  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    if (remaining <= 3 && remaining > 0) {
      signalCountdown();
    }
    if (state.timer.stepElapsed >= step.duration) {
      advance();
      return;
    }
  }
  updateTimerUI();
}

function togglePause() {
  state.timer.paused = !state.timer.paused;
  render();
}

function advance() {
  signalTransition();
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) {
    completeSession();
    return;
  }
  render();
}

function skipStep() {
  state.timer.stepIdx += 1;
  state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) {
    completeSession();
    return;
  }
  render();
}

function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  state.timer.running = false;
  releaseWakeLock();
  signalComplete();

  // Register the session if it's a tronc session (not bonus, not stretching)
  if (!state.isBonus && !state.isStretching && state.sessionId) {
    if (!state.week.completed.includes(state.sessionId)) {
      state.week.completed.push(state.sessionId);
      saveState();
    }
  }

  state.view = 'complete';
  render();
}

function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  state.timer.running = false;
  state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home';
  render();
}

// ============================================================
//  DIALOG
// ============================================================
function showDialog(title, text, onConfirm, confirmLabel = 'Quitter') {
  const el = document.getElementById('dialog');
  el.innerHTML = `
    <div class="dialog">
      <div class="dialog-title">${title}</div>
      <div class="dialog-text">${text}</div>
      <div class="dialog-actions">
        <button class="cancel" onclick="hideDialog()">Annuler</button>
        <button class="primary" id="dialog-confirm">${confirmLabel}</button>
      </div>
    </div>`;
  el.classList.add('show');
  document.getElementById('dialog-confirm').addEventListener('click', () => {
    hideDialog();
    onConfirm();
  });
}
function hideDialog() {
  document.getElementById('dialog').classList.remove('show');
}

// ============================================================
//  NAVIGATION
// ============================================================
function goto(view, opts = {}) {
  if (state.timer.running && view !== 'running') {
    showDialog('Séance en cours', 'Quitter la séance ? Elle ne sera pas validée.', () => {
      quitSession();
      Object.assign(state, opts);
      state.view = view;
      render();
    });
    return;
  }
  Object.assign(state, opts);
  state.view = view;
  window.scrollTo({ top: 0 });
  render();
}

function openSession(sessionId, isBonus = false) {
  state.sessionId = sessionId;
  state.isBonus = isBonus;
  state.isStretching = false;
  state.view = 'preview';
  window.scrollTo({ top: 0 });
  render();
}

function openStretching() {
  state.isStretching = true;
  state.isBonus = false;
  state.sessionId = null;
  state.view = 'preview';
  window.scrollTo({ top: 0 });
  render();
}

function startCurrentSession() {
  state.view = 'running';
  startTimer();
}

function checkBoxe() {
  const boxeId = 'boxe';
  if (state.week.completed.includes(boxeId)) {
    // toggle off
    state.week.completed = state.week.completed.filter(x => x !== boxeId);
  } else {
    state.week.completed.push(boxeId);
  }
  saveState();
  render();
}

// ============================================================
//  RENDER — HOME
// ============================================================
function renderHome() {
  const completed = state.week.completed.length;
  const target = WEEK_PLAN.target;

  const progressSlots = Array.from({ length: target }, (_, i) => {
    const done = i < completed;
    return `<div class="progress-slot ${done ? 'done' : ''}"></div>`;
  }).join('');

  const sessionsHTML = WEEK_PLAN.sessions.map(id => {
    const s = SESSIONS[id];
    const done = state.week.completed.includes(id);
    return `
      <button class="session-card ${done ? 'done' : ''}" onclick="openSession('${id}')">
        <div class="session-body">
          <div class="session-focus">${s.focus}</div>
          <div class="session-title">${s.title}</div>
          <div class="session-meta">${s.duration}</div>
        </div>
        <div class="session-arrow">→</div>
      </button>`;
  }).join('');

  // Boxe direct-check tile (shown but noted as "à partir de la prochaine semaine")
  // Currently we don't include it in week plan, but keep the structure for later

  return `
    <div class="view">
      <header class="top-bar">
        <div class="brand">Shaolin One<span class="brand-dot">.</span></div>
        <div class="brand-meta">Cervin · Phase 0</div>
      </header>

      <section class="hero">
        <div class="hero-tag">Cette semaine</div>
        <h1 class="hero-title">${completed}<span style="color:var(--ink-faint)">/${target}</span></h1>
        <div class="progress-bar">${progressSlots}</div>
        <div class="progress-caption">${completed === target ? 'Semaine bouclée · bien joué' : `${target - completed} séance${target - completed > 1 ? 's' : ''} restante${target - completed > 1 ? 's' : ''}`}</div>
      </section>

      <div class="section-label">Tronc principal · au choix</div>
      <div class="session-list">${sessionsHTML}</div>

      <div class="section-label">Bibliothèque</div>
      <button class="nav-tile" onclick="goto('bonus-list')">
        <div class="nav-tile-body">
          <div class="nav-tile-title">Séances bonus</div>
          <div class="nav-tile-sub">${BONUS.length} séances · 20 min chacune · en complément</div>
        </div>
        <div class="nav-tile-arrow">→</div>
      </button>
      <button class="nav-tile" onclick="openStretching()">
        <div class="nav-tile-body">
          <div class="nav-tile-title">Étirements complets</div>
          <div class="nav-tile-sub">10 min · post-séance</div>
        </div>
        <div class="nav-tile-arrow">→</div>
      </button>
      <button class="nav-tile" onclick="goto('lexique-list')">
        <div class="nav-tile-body">
          <div class="nav-tile-title">Lexique parasportif</div>
          <div class="nav-tile-sub">${LEXIQUE.length} techniques · respiration, apnée, froid, mental</div>
        </div>
        <div class="nav-tile-arrow">→</div>
      </button>

      <footer class="footer">
        <p class="footer-text">Objectif Cervin · été 2027<br>3 séances/semaine · Phase 0</p>
      </footer>
    </div>`;
}

// ============================================================
//  RENDER — SESSION PREVIEW
// ============================================================
function renderPreview() {
  const s = getCurrentSession();
  const planHTML = (s.plan || []).map(section => `
    <div class="preview-plan-section">
      <div class="preview-plan-head">${section.head}</div>
      <ul class="preview-plan-list">
        ${section.items.map(i => `<li><span>${i.n}</span><span class="step-t">${i.t}</span></li>`).join('')}
      </ul>
    </div>`).join('');

  const nbTimeSteps = s.steps.filter(x => x.type !== 'section').length;

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <div class="preview-focus">${s.focus || 'Bonus'}</div>
      <h1 class="preview-title">${s.title}</h1>

      <div class="preview-meta">
        <div class="preview-meta-item">
          <div class="preview-meta-label">Durée</div>
          <div class="preview-meta-value">${s.duration}</div>
        </div>
        <div class="preview-meta-item">
          <div class="preview-meta-label">Étapes</div>
          <div class="preview-meta-value">${nbTimeSteps}</div>
        </div>
      </div>

      ${s.intro ? `<p class="preview-intro">${s.intro}</p>` : ''}

      ${planHTML ? `<div class="preview-plan">${planHTML}</div>` : ''}

      <button class="start-btn" onclick="startCurrentSession()">Démarrer la séance</button>
    </div>`;
}

// ============================================================
//  RENDER — RUNNING
// ============================================================
function renderRunning() {
  const steps = activeSteps();
  const step = currentStep();
  if (!step) return renderComplete();

  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalStr = `${totalMin}:${String(totalSec).padStart(2, '0')}`;

  // Progress slots
  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  const isRest = step.type === 'rest';
  const isWarmup = step.label === 'échauffement' || step.label === 'préparation';

  // Timer display
  let timerHTML = '';
  let actionHTML = '';
  let stepNameHTML = '';
  let stepSubHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    stepNameHTML = `<div class="run-step-name">Repos</div>`;
    // Show next step
    const next = steps[state.timer.stepIdx + 1];
    const nextName = next ? (next.name || 'Fin de séance') : 'Fin de séance';
    stepSubHTML = `<div class="run-step-sub">Prochain · ${nextName}</div>`;
    timerHTML = `
      <div class="run-timer rest">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-progress-ring"><div class="run-progress-ring-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    if (step.label) stepSubHTML = `<div class="run-step-sub">${step.label}</div>`;
    const cls = isWarmup ? 'warmup' : '';
    timerHTML = `
      <div class="run-timer ${cls}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-progress-ring"><div class="run-progress-ring-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}${step.label ? ' · ' + step.label : ''}</div>`;
    timerHTML = '';
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  // Cues
  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `
      <div class="run-cues">
        <div class="run-cues-head">Cues</div>
        <ul class="run-cues-list">
          ${step.cues.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>`;
  }

  // Next preview (for reps steps)
  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>

      <div class="run-progress">${progressHTML}</div>

      ${stepNameHTML}
      ${stepSubHTML}
      ${timerHTML}
      ${cuesHTML}
      ${nextPreview}
      ${actionHTML}
    </div>`;
}

function askQuit() {
  showDialog(
    'Quitter la séance ?',
    'La séance ne sera pas validée. Tu peux reprendre depuis le début plus tard.',
    quitSession
  );
}

function updateTimerUI() {
  // Instead of full re-render (which would break animations), just update the timer text
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-progress-ring-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  // update total
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

// ============================================================
//  RENDER — COMPLETE
// ============================================================
function renderComplete() {
  const isBonus = state.isBonus;
  const isStretching = state.isStretching;
  const before = state.week.completed.length - (!isBonus && !isStretching ? 1 : 0);
  const after = state.week.completed.length;
  const target = WEEK_PLAN.target;

  let progressHTML = '';
  if (!isBonus && !isStretching) {
    progressHTML = `<div class="complete-progress">${before}<span class="complete-arrow">→</span>${after}<span style="color:var(--ink-faint);font-size:20px"> / ${target}</span></div>`;
  }

  return `
    <div class="view complete">
      <div class="complete-mark">Séance validée</div>
      <div class="complete-title">Bien joué.</div>
      ${progressHTML}
      <div class="complete-actions">
        ${!isStretching ? `<button class="primary" onclick="openStretching()">Étirements post-séance →</button>` : ''}
        <button class="secondary" onclick="goto('home')">Retour à l'accueil</button>
      </div>
    </div>`;
}

// ============================================================
//  RENDER — BONUS LIST
// ============================================================
function renderBonusList() {
  const itemsHTML = BONUS.map(b => `
    <button class="list-item" onclick="openSession('${b.id}', true)">
      <div class="list-item-body">
        <div class="list-item-title">${b.title}</div>
        <div class="list-item-sub">${b.focus} · ${b.duration}</div>
      </div>
      <div class="list-item-arrow">→</div>
    </button>`).join('');

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <h1 class="list-title">Bonus</h1>
      <p class="list-intro">Séances de 20 min à démarrer quand tu as la pêche, en complément du tronc principal. Ne comptent pas dans le compteur 3/3.</p>
      <div>${itemsHTML}</div>
    </div>`;
}

// ============================================================
//  RENDER — LEXIQUE
// ============================================================
function renderLexiqueList() {
  const itemsHTML = LEXIQUE.map(l => `
    <button class="list-item" onclick="goto('lexique-detail', {lexiqueId: '${l.id}'})">
      <div class="list-item-body">
        <div class="list-item-title">${l.title}</div>
        <div class="list-item-sub">${l.cat}</div>
      </div>
      <div class="list-item-arrow">→</div>
    </button>`).join('');

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('home')">← Retour</button>
      <h1 class="list-title">Parasportif</h1>
      <p class="list-intro">Les outils qui complètent l'entraînement physique. Respiration, apnée, exposition au froid, mental — le carburant qui fait tenir sur la longueur.</p>
      <div>${itemsHTML}</div>
    </div>`;
}

function renderLexiqueDetail() {
  const item = LEXIQUE.find(l => l.id === state.lexiqueId);
  if (!item) return renderLexiqueList();

  const whenHTML = item.when ? `
    <div class="lex-section">
      <div class="lex-section-head">Quand</div>
      <ul>${item.when.map(w => `<li>${w}</li>`).join('')}</ul>
    </div>` : '';

  const protocolHTML = item.protocol ? `
    <div class="lex-protocol">
      <div class="lex-section-head">Protocole · ${item.protocol.title}</div>
      <p>${item.protocol.body}</p>
      ${item.protocol.details ? `<ul>${item.protocol.details.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}
    </div>` : '';

  return `
    <div class="view">
      <button class="back-btn" onclick="goto('lexique-list')">← Retour</button>
      <div class="lex-detail-cat">${item.cat}</div>
      <h1 class="lex-detail-title">${item.title}</h1>
      <p class="preview-intro">${item.intro}</p>
      ${whenHTML}
      ${protocolHTML}
    </div>`;
}

// ============================================================
//  RENDER — DISPATCHER
// ============================================================
function render() {
  const app = document.getElementById('app');
  switch (state.view) {
    case 'home': app.innerHTML = renderHome(); break;
    case 'preview': app.innerHTML = renderPreview(); break;
    case 'running': app.innerHTML = renderRunning(); break;
    case 'complete': app.innerHTML = renderComplete(); break;
    case 'bonus-list': app.innerHTML = renderBonusList(); break;
    case 'lexique-list': app.innerHTML = renderLexiqueList(); break;
    case 'lexique-detail': app.innerHTML = renderLexiqueDetail(); break;
    default: app.innerHTML = renderHome();
  }
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadState();
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>

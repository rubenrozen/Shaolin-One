function renderCardioScoreCard(c) {
  const r = computeCardioScore(c.type, c.duration, c.km, c.deniv, c.extraData);
  const phase = currentPhase();
  // Label intensité selon type et mode
  let paceLabel = 'Allure', paceValue = '–';
  if (c.type === 'course' && r.pace) {
    paceValue = `${Math.floor(r.pace)}:${String(Math.round((r.pace % 1) * 60)).padStart(2,'0')}/km`;
  } else if (c.type === 'velo' && r.speedKmh) {
    paceValue = `${r.speedKmh.toFixed(1)} km/h`;
  } else if (c.type === 'velo-int' && c.extraData) {
    const m = c.extraData.mode;
    if (m === 'watts' && c.extraData.watts) { paceLabel = 'Puissance'; paceValue = `${c.extraData.watts} W`; }
    else if (m === 'rpe' && c.extraData.rpe) { paceLabel = 'Ressenti'; paceValue = `${c.extraData.rpe}/10 RPE`; }
    else if (r.speedKmh) paceValue = `${r.speedKmh.toFixed(1)} km/h`;
  }
  return `
    <div class="cardio-score">
      <div class="cardio-score-head">
        <div class="cardio-score-title">Score composite pondéré</div>
        <div class="cardio-score-phase">${phaseShort(phase)}</div>
      </div>
      <div class="cardio-score-main">
        <div class="cardio-score-num ${r.cls}">${r.score}</div>
        <div class="cardio-score-unit">%</div>
        <div class="cardio-score-verdict ${r.cls}">${r.title}</div>
      </div>
      <div class="cardio-score-breakdown">
        <div class="cardio-sub">
          <div class="cardio-sub-label">Distance<span class="cardio-sub-weight">${Math.round(r.weights.km*100)}%</span></div>
          <div class="cardio-sub-val">${r.sVol}<span>%</span></div>
        </div>
        <div class="cardio-sub">
          <div class="cardio-sub-label">Vertical<span class="cardio-sub-weight">${Math.round(r.weights.vertical*100)}%</span></div>
          <div class="cardio-sub-val">${r.sVert}<span>%</span></div>
        </div>
        <div class="cardio-sub">
          <div class="cardio-sub-label">Allure<span class="cardio-sub-weight">${Math.round(r.weights.pace*100)}%</span></div>
          <div class="cardio-sub-val">${r.sPace}<span>%</span></div>
        </div>
      </div>
    </div>
    <div class="cardio-net">
      <div>
        <div class="cardio-net-label">${paceLabel} réalisée</div>
        <div class="cardio-net-hint">Info · déjà intégrée au score allure</div>
      </div>
      <div class="cardio-net-val">${paceValue}</div>
    </div>`;
}

function getFavoriteDisciplineIds() {
  const p = state.settings && state.settings.profile;
  return (p && p.favoriteDisciplineIds) || [];
}

function isDisciplineFavorite(id) {
  return getFavoriteDisciplineIds().includes(id);
}

function toggleDisciplineFavorite(id, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const p = state.settings && state.settings.profile;
  if (!p) return;
  const favs = p.favoriteDisciplineIds || [];
  const idx = favs.indexOf(id);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push(id);
  p.favoriteDisciplineIds = favs;
  saveState();
  render();
}

function renderDiscipline() {
  // Group items by category
  const cats = {};
  LEXIQUE.forEach(l => {
    if (!cats[l.cat]) cats[l.cat] = [];
    cats[l.cat].push(l);
  });
  const catOrder = ['Respiration', 'Apnée', 'Froid', 'Mental'];

  const favIds = getFavoriteDisciplineIds();
  const hasFavorites = favIds.length > 0;

  // Séparer favoris et non-favoris
  const favorites = [];
  const others = {};
  catOrder.forEach(cat => {
    if (!cats[cat]) return;
    others[cat] = [];
    cats[cat].forEach(l => {
      if (favIds.includes(l.id)) favorites.push(l);
      else others[cat].push(l);
    });
  });

  const cardHTML = (l, isFav, isMuted) => `
    <div class="discipline-card ${isMuted ? 'muted' : ''}">
      <button class="discipline-star ${isFav ? 'active' : ''}" onclick="toggleDisciplineFavorite('${l.id}', event)" aria-label="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
        ${isFav ? '★' : '☆'}
      </button>
      <button class="discipline-card-btn" onclick="goto('discipline-detail', {lexiqueId: '${l.id}'})">
        <div class="discipline-card-icon">${l.icon || '·'}</div>
        <div class="discipline-card-title">${l.title}</div>
        <div class="discipline-card-cat">${l.cat}</div>
      </button>
    </div>`;

  // Section favoris
  const favSection = hasFavorites ? `
    <div class="discipline-section">
      <div class="discipline-section-header">
        <span class="discipline-section-badge">★</span>
        <span class="discipline-section-title">Mes favoris</span>
        <span class="discipline-section-count">${favorites.length}</span>
      </div>
      <div class="discipline-grid">${favorites.map(l => cardHTML(l, true, false)).join('')}</div>
    </div>` : `
    <div class="discipline-hint">
      <span class="discipline-hint-icon">★</span>
      <span>Marque tes pratiques favorites en cliquant sur l'étoile pour les remonter ici.</span>
    </div>`;

  // Section autres catégories
  const otherSections = catOrder
    .filter(cat => others[cat] && others[cat].length)
    .map(cat => {
      const cardsHTML = others[cat].map(l => cardHTML(l, false, true)).join('');
      return `
        <div class="discipline-section discipline-section-muted">
          <div class="discipline-section-header">
            <span class="discipline-section-title">${cat}</span>
            <span class="discipline-section-count">${others[cat].length}</span>
          </div>
          <div class="discipline-grid">${cardsHTML}</div>
        </div>`;
    }).join('');

  const othersHeader = hasFavorites ? `
    <div class="discipline-others-header">Autres pratiques disponibles</div>` : '';

  return `
    <div class="view has-tabbar">
      ${renderTopBar()}
      <h1 class="stats-page-title" style="margin-top: 20px;">Discipline.</h1>
      <p class="discipline-intro">Souffle · apnée · froid · mental. Les pratiques qui te préparent à ce que le physique seul ne suffit pas à faire.</p>
      ${favSection}
      ${othersHeader}
      ${otherSections}
    </div>
    ${renderTabBar()}`;
}

function renderDisciplineDetail() {
  const item = LEXIQUE.find(l => l.id === state.lexiqueId);
  if (!item) return renderDiscipline();
  const whenHTML = item.when ? `<div class="lex-section"><div class="lex-section-head">Quand</div><ul>${item.when.map(w => `<li>${w}</li>`).join('')}</ul></div>` : '';
  const protocolHTML = item.protocol ? `
    <div class="lex-protocol">
      <div class="lex-section-head">Protocole</div>

// ============================================================
//  AUTH
// ============================================================
async function initAuth() {
  if (!sb) { state.authChecked = true; return; }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      state.user = session.user;
      state.syncStatus = 'syncing';
      // Sync settings from user_metadata if present
      if (session.user.user_metadata) {
        if (session.user.user_metadata.startDate) state.settings.startDate = session.user.user_metadata.startDate;
        if (session.user.user_metadata.manualPhase) state.settings.manualPhase = session.user.user_metadata.manualPhase;
        if (session.user.user_metadata.profile) state.settings.profile = session.user.user_metadata.profile;
      }
    }
  } catch (e) { console.warn('Auth check failed:', e.message); }
  state.authChecked = true;

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Arriving via reset password email link
      state.view = 'reset-password-form';
      state.loginMessage = null;
      render();
      return;
    }
    if (event === 'SIGNED_IN' && session) {
      state.user = session.user;
      state.loginMessage = null;
      // Sync settings from user_metadata
      if (session.user.user_metadata) {
        if (session.user.user_metadata.startDate) state.settings.startDate = session.user.user_metadata.startDate;
        if (session.user.user_metadata.manualPhase) state.settings.manualPhase = session.user.user_metadata.manualPhase;
        if (session.user.user_metadata.profile) state.settings.profile = session.user.user_metadata.profile;
      }
      // Don't auto-navigate if user is in the middle of a password reset flow
      if (state.view === 'reset-password-form' || state.view === 'reset-password-done') return;
      await syncPull();
      state.view = state.settings.profile ? 'training' : 'onboarding';
      render();
    }
    if (event === 'SIGNED_OUT') {
      state.user = null;
      state.syncStatus = 'offline';
      state.view = 'login';
      render();
    }
  });
}

async function signInPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Connexion…' };
  render();
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    // onAuthStateChange handles navigation to home
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function signUpPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  if (password.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Création du compte…' };
  render();
  try {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      // Instant sign-in (email confirmation disabled in Supabase)
      // onAuthStateChange handles it
    } else {
      state.loginMessage = { type: 'success', text: 'Compte créé. Confirme ton email dans ta boîte, puis reviens te connecter. Ou désactive "Confirm email" dans Supabase Auth.' };
      render();
    }
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function toggleAuthMode() {
  state.authMode = state.authMode === 'signin' ? 'signup' : 'signin';
  state.loginMessage = null;
  render();
}

async function sendResetLink() {
  const emailEl = document.getElementById('reset-email');
  const email = (emailEl && emailEl.value || '').trim();
  if (!email) {
    state.loginMessage = { type: 'error', text: 'Entre ton email' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Envoi du lien…' };
  render();
  try {
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) throw error;
    state.loginMessage = {
      type: 'success',
      text: 'Lien envoyé à ' + email + '. Clique-le depuis ta boîte mail — ça ouvrira ton navigateur pour définir un nouveau mot de passe, puis reviens dans cette app.'
    };
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function updatePasswordAndFinish() {
  const pwdEl = document.getElementById('new-password');
  const newPassword = pwdEl && pwdEl.value || '';
  if (!newPassword || newPassword.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Mise à jour…' };
  render();
  try {
    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) throw error;
    // Clean URL hash so refreshing doesn't retrigger recovery flow
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    state.loginMessage = null;
    state.view = 'reset-password-done';
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function openResetPassword() {
  state.view = 'reset-request';
  state.loginMessage = null;
  render();
}

async function signOut() {
  if (!sb) return;
  try { await sb.auth.signOut(); } catch (e) {}
}

function skipAuth() {
  // Continue in local-only mode
  state.user = null;
  state.view = 'home';
  render();
}

async function manualSync() {
  if (!sb || !state.user) return;
  await syncPull();
  render();
}

function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    week: state.week,
    weekHistory: state.weekHistory,
    cardioHistory: state.cardioHistory
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shaolin-one-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport() { document.getElementById('import-file').click(); }

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.week) state.week = attachLegacyAccessors(migrateOldWeek(data.week));
      if (data.weekHistory) state.weekHistory = data.weekHistory.map(w => migrateOldWeek(w));
      if (data.cardioHistory) state.cardioHistory = data.cardioHistory;
      saveState();
      if (sb && state.user) {
        // Backfill all weeks to remote
        for (const w of [...state.weekHistory, state.week]) {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: w.id,
            data: w,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        }
        for (const c of state.cardioHistory) {
          await sb.from('cardio_history').insert({
            user_id: state.user.id,
            date: c.date, week_id: c.weekId, type: c.type,
            duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
          }).select().maybeSingle().catch(()=>{});
        }
      }
      alert('Import terminé.');
      render();
    } catch (err) { alert('Import raté : ' + err.message); }
  };
  reader.readAsText(file);
}

// ============================================================
//  DISPATCH
// ============================================================
function render() {
  const app = document.getElementById('app');
  let html;
  switch (state.view) {
    case 'login': html = renderLogin(); break;
    case 'reset-request': html = renderResetRequest(); break;
    case 'reset-password-form': html = renderResetPasswordForm(); break;
    case 'reset-password-done': html = renderResetPasswordDone(); break;
    case 'account': html = renderAccount(); break;
    case 'onboarding': html = renderOnboarding(); break;
    case 'home':
    case 'training': html = renderTraining(); break;
    case 'stats':
    case 'cockpit': html = renderCockpit(); break;
    case 'univers': html = renderUnivers(); break;
    case 'cardio-choice': html = renderCardioChoice(); break;
    case 'cardio-stats': html = renderCardioStats(); break;
    case 'cardio-recap': html = renderCardioRecap(); break;
    case 'preview': html = renderPreview(); break;
    case 'running': html = renderRunning(); break;
    case 'complete': html = renderComplete(); break;
    case 'bonus-list': html = renderBonusList(); break;
    case 'lexique-list':
    case 'discipline': html = renderDiscipline(); break;
    case 'lexique-detail':
    case 'discipline-detail': html = renderDisciplineDetail(); break;
    default: html = renderTraining();
  }
  app.innerHTML = html;
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  loadState();
  archiveIfNewWeek();

  // Check if we're arriving via password recovery link BEFORE anything else
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const isRecoveryLink = hash.includes('type=recovery') || search.includes('type=recovery');

  if (SUPABASE_ENABLED && sb) {
    await initAuth();

    if (isRecoveryLink) {
      // Force reset password form regardless of session state
      state.view = 'reset-password-form';
      render();
    } else if (state.user) {
      // Show training or onboarding depending on profile presence
      state.view = state.settings.profile ? 'training' : 'onboarding';
      render();
      await syncPull();
      // After syncPull, profile might have been loaded from remote — re-check
      if (state.view === 'onboarding' && state.settings.profile) state.view = 'training';
      render();
    } else {
      // Not signed in — show login
      state.view = 'login';
      render();
    }
  } else {
    // Supabase not configured, local-only mode
    state.view = state.settings.profile ? 'training' : 'onboarding';
    render();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', init);

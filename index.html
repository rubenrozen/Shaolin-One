  .uni-day-chart, .uni-month-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 100px;
    padding: 0 4px;
    gap: 6px;
  }
  .uni-day-col, .uni-month-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .uni-day-bar-wrap, .uni-month-bar-wrap {
    width: 100%;
    height: 70%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .uni-day-bar, .uni-month-bar {
    width: 100%;
    background: var(--line-strong);
    border-radius: 3px 3px 0 0;
    transition: height 0.4s ease-out;
    min-height: 2px;
  }
  .uni-day-col.best .uni-day-bar { background: var(--gold); }
  .uni-day-label, .uni-month-label {
    font-family: var(--font-body);
    font-size: 9px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .uni-day-col.best .uni-day-label { color: var(--gold-deep); }
  .uni-day-val {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    margin-top: 2px;
    font-variation-settings: var(--display-strong);
  }

  .records-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .record-item {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .record-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .record-label {
    font-family: var(--font-body);
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0;
    margin-top: 6px;
    line-height: 1.35;
    font-weight: 500;
  }

  .exo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .exo-item {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70px;
  }
  .exo-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    color: var(--gold-deep);
    letter-spacing: -0.02em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .exo-label {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 6px;
    text-align: center;
  }

  /* Ségrégation km par discipline */
  .typed-km-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .typed-km-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .typed-km-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typed-km-emoji {
    font-size: 18px;
    line-height: 1;
  }
  .typed-km-label {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    flex: 1;
  }
  .typed-km-count {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .typed-km-track {
    height: 10px;
    background: var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .typed-km-fill {
    height: 100%;
    background: var(--type-color);
    border-radius: 5px;
    transition: width 0.4s ease-out;
  }
  .typed-km-value {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .typed-km-value strong {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 15px;
    color: var(--type-color);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    margin-right: 2px;
  }
  .typed-km-meta {
    color: var(--ink-soft);
    font-weight: 500;
    margin-left: 4px;
  }

  /* Chart km par mois */
  .km-chart-wrap {
    width: 100%;
    margin: 4px 0;
  }
  .km-chart-svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .chart-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Milestones temporels */
  .milestones-card {
    background: linear-gradient(135deg, var(--paper-elev) 0%, var(--gold-bg) 100%);
    border: 1.5px solid var(--gold);
  }
  .milestones-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .milestones-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 64px;
    color: var(--gold-deep);
    letter-spacing: -0.04em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .milestones-num-label {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 6px;
  }
  .milestone-achieved {
    padding: 12px 14px;
    background: var(--paper);
    border-radius: 10px;
    border-left: 3px solid var(--gold);
    margin-bottom: 10px;
  }
  .milestone-achieved-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .milestone-achieved-desc {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    margin-top: 4px;
    font-style: italic;
  }
  .milestone-next {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: center;
    padding: 8px 0;
    line-height: 1.4;
  }
  .milestones-track {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 8px 0;
    position: relative;
  }
  .milestones-track::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 8px;
    right: 8px;
    height: 1.5px;
    background: var(--line);
    z-index: 0;
  }
  .milestone-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    transition: all 0.2s;
  }
  .milestone-dot.done {
    background: var(--gold);
    border-color: var(--gold);
  }
  .milestone-dot.next {
    background: var(--paper);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-halo, rgba(201,164,78,0.25));
  }
  .milestone-dot-week {
    font-family: var(--font-body);
    font-size: 8px;
    font-weight: 700;
    color: var(--ink);
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .milestone-dot.done .milestone-dot-week { color: var(--gold-deep); }

  /* Records hero */
  .records-card {
    background: linear-gradient(180deg, var(--paper-elev) 0%, var(--paper) 100%);
  }
  .records-highlight {
    display: flex;
    justify-content: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .record-hero {
    text-align: center;
  }
  .record-hero-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 56px;
    color: var(--gold-deep);
    letter-spacing: -0.04em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
    display: inline;
  }
  .record-hero-unit {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    color: var(--gold-deep);
    letter-spacing: -0.01em;
    margin-left: 4px;
    display: inline;
    font-variation-settings: var(--display-strong);
  }
  .record-hero-label {
    font-family: var(--font-body);
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0;
    text-transform: none;
    font-weight: 600;
    margin-top: 8px;
  }
  .record-item.highlight {
    background: var(--gold-bg);
    border-color: var(--gold);
  }
  .record-item.highlight .record-num {
    color: var(--gold-deep);
    font-size: 28px;
  }
  .steps-detail-count {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .steps-detail-list {
    padding: 4px 0;
    max-height: 320px;
    overflow-y: auto;
  }
  .step-line {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    gap: 10px;
    font-size: 13px;
  }
  .step-line.rest {
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-family: var(--font-body);
    font-weight: 500;
    padding-top: 3px;
    padding-bottom: 3px;
  }
  .step-line-num {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 700;
    min-width: 22px;
  }
  .step-line-name {
    flex: 1;
    color: var(--ink);
  }
  .step-line-info {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  /* CTA */
  .cta-btn {
    width: 100%;
    padding: 18px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
    transition: transform 0.1s;
  }
  .cta-btn:active { transform: scale(0.98); }
  .cta-btn.gold { background: var(--gold); color: var(--ink); }
  .cta-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); }

  /* ============ CARDIO CHOICE ============ */
  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .choice-card {
    padding: 22px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: left;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
    position: relative;
  }
  .choice-card:active { transform: scale(0.99); background: var(--paper-elev); }
  .choice-name {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.95;
    font-variation-settings: var(--display-max);
    margin-bottom: 12px;
    color: var(--ink);
  }
  .choice-target {
    display: flex;
    gap: 16px;
  }
  .choice-target-item {}
  .choice-target-val {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
    color: var(--ink);
  }
  .choice-target-val .unit { font-size: 11px; color: var(--ink-faint); }
  .choice-target-lbl {
    font-family: var(--font-body);
    font-size: 9px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  /* ============ RUNNING VIEW ============ */
  .running-view {
    padding-top: calc(12px + var(--safe-top));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .run-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .run-quit, .run-pause {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 100px;
    border: 1px solid var(--line);
  }
  .run-pause { background: var(--paper-elev); color: var(--ink); border: none; }
  .run-pause.paused { background: var(--gold-bg); color: var(--gold-deep); }
  .run-total {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .run-progress {
    display: flex;
    gap: 2px;
    margin-bottom: 32px;
    height: 3px;
  }
  .run-progress-slot {
    flex: 1;
    background: var(--line);
    border-radius: 2px;
  }
  .run-progress-slot.done { background: var(--gold); }
  .run-progress-slot.current { background: var(--ink); }
  .run-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .run-step-context {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
  }
  .run-step-name {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.045em;
    text-align: center;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .run-step-sub {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 0.04em;
  }
  .run-timer { text-align: center; margin-bottom: 26px; }
  .run-timer-value {
    font-family: var(--font-display);
    font-size: 100px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.065em;
    font-variation-settings: var(--display-max);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .run-timer.rest .run-timer-value { color: var(--pine); }
  .run-timer.warmup .run-timer-value { color: var(--gold-deep); }
  .run-timer-bar {
    width: 100%;
    max-width: 240px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin: 16px auto 0;
    overflow: hidden;
  }
  .run-timer-bar-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.3s linear;
  }
  .run-timer.rest .run-timer-bar-fill { background: var(--pine); }
  .run-timer.warmup .run-timer-bar-fill { background: var(--gold); }
  .run-cues {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 22px;
  }
  .run-cues-list { list-style: none; padding: 0; }
  .run-cues-list li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 16px;
    position: relative;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .run-cues-list li:last-child { margin-bottom: 0; }
  .run-cues-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 8px;
    height: 2px;
    background: var(--gold);
    border-radius: 1px;
  }
  .run-next {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .run-next span { color: var(--ink-soft); }
  .run-action-btn {
    width: 100%;
    padding: 20px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
  }
  .run-action-btn:active { background: var(--gold); color: var(--ink); }
  .run-action-btn.done { background: var(--gold); color: var(--ink); }
  .run-action-btn.skip {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    padding: 12px;
    font-size: 11px;
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-variation-settings: normal;
  }

  /* ============ CARDIO STATS ============ */
  .stats-view { padding-top: 20px; }
  .stats-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.045em;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
  }
  .stats-sub {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 0.04em;
  }
  .stats-input-group { margin-bottom: 14px; }
  .stats-input-label {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .stats-input-label .target { color: var(--gold-deep); }
  .stats-input {
    width: 100%;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .stats-input:focus { outline: none; border-color: var(--gold); background: var(--gold-bg); }
  .stats-verdict {
    padding: 18px 20px;
    border-radius: 14px;
    margin: 20px 0;
  }
  .stats-verdict.above { background: rgba(31, 82, 52, 0.10); color: var(--pine); border: 1px solid rgba(31, 82, 52, 0.20); }
  .stats-verdict.on-target { background: var(--gold-bg); color: var(--gold-deep); border: 1px solid var(--gold-light); }

    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    background: var(--paper-alt);
    border-bottom: 2px solid var(--line-softer);
    margin: 0 -16px 0;
  }
  .v58-statusbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .v58-ring {
    width: 52px;
    height: 52px;
    position: relative;
    flex-shrink: 0;
    aspect-ratio: 1 / 1;
  }
  .v58-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .v58-ring circle { fill: none; stroke-width: 5; }
  .v58-ring .track { stroke: var(--line-softer); }
  .v58-ring .fill { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 138; transition: stroke-dashoffset 0.5s ease; }
  .v58-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .v58-statusbar-info-lab {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .v58-statusbar-info-val {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-top: 2px;
    color: var(--ink);
  }
  .v58-statusbar-info-val b { color: var(--accent-deep); font-weight: 800; }
  .v58-statusbar-phase { text-align: right; }
  .v58-statusbar-phase-lab {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .v58-statusbar-phase-val {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 800;
    color: var(--accent-deep);
    letter-spacing: -0.01em;
    margin-top: 2px;
  }

  /* Focus card : la prochaine séance mise en avant */
  .v58-focus-wrap {
    margin: 20px 0 12px;
  }
  .v58-focus-eyebrow {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-body);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .v58-focus-eyebrow b { color: var(--ink); font-weight: 700; }
  .v58-focus-card {
    background: var(--ink);
    color: var(--paper);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .v58-focus-card:active { transform: scale(0.98); }
  .v58-focus-card-tag {
    padding: 10px 18px 0;
  }
  .v58-focus-card-tag-pill {
    display: inline-block;
    padding: 5px 11px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
  }
  .v58-focus-card-body {
    padding: 12px 18px 18px;
  }
  .v58-focus-card-cat {
    font-family: var(--font-body);
    font-size: 12px;
    color: rgba(250, 246, 236, 0.75);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .v58-focus-card-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin-bottom: 8px;
  }
  .v58-focus-card-desc {
    font-family: var(--font-body);
    font-size: 13.5px;
    color: rgba(250, 246, 236, 0.85);
    margin-bottom: 16px;
    line-height: 1.45;
    font-weight: 400;
  }
  .v58-focus-card-attrs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(250, 246, 236, 0.2);
    margin-bottom: 16px;
  }
  .v58-focus-card-attr-lab {
    font-family: var(--font-body);
    font-size: 10px;
    color: rgba(250, 246, 236, 0.7);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .v58-focus-card-attr-val {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .v58-focus-card-cta {
    display: block;
    width: 100%;
    padding: 14px 0;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    border-radius: 6px;
  }
  .v58-focus-card-cta:active { transform: scale(0.98); }

  .v58-focus-alt {
    margin-top: 10px;
    padding: 11px 14px;
    background: var(--paper-elev);
    border: 1px dashed var(--line-soft);
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    cursor: pointer;
    font-weight: 500;
  }
  .v58-focus-alt b { color: var(--ink); font-weight: 700; }
  .v58-focus-alt:active { transform: scale(0.98); }

  /* Week overview : ta semaine par jour */
  .v58-week-overview {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 2px solid var(--line-softer);
  }
  .v58-week-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .v58-week-title-main {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.015em;
  }
  .v58-week-title-sub {
    font-family: var(--font-body);
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .v58-week-title-sub b { color: var(--success); font-weight: 700; }
  .v58-day-row {
    display: grid;
    grid-template-columns: 88px 1fr auto;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line-softer);
    align-items: center;
    cursor: pointer;
  }
  .v58-day-row:last-child { border: none; }
  .v58-day-name {
    font-family: var(--font-body);
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .v58-day-name.today { color: var(--accent-deep); font-weight: 700; }
  .v58-day-content {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .v58-day-content-icon { font-size: 15px; flex-shrink: 0; }
  .v58-day-content-name {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .v58-day-content-name.done { text-decoration: line-through; color: var(--muted); }
  .v58-day-content-name.rest { color: var(--muted); font-style: italic; }
  .v58-day-status {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    flex-shrink: 0;
  }
  .v58-day-status.done { color: var(--success); }
  .v58-day-status.next { color: var(--accent-deep); }

  /* ============================================================
     V62 · Refonte Séances (Approche A) + Exercices (Approche B)
     ============================================================ */

  /* --- Status bar Séances (variante avec ring compteur mois) --- */
  .v62-status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    background: var(--paper-alt);
    border-top: 2px solid var(--line-softer);
    border-bottom: 2px solid var(--line-softer);
    margin: 8px 0 0;
  }
  .v62-sb-left { display: flex; align-items: center; gap: 12px; }
  .v62-sb-info-lab {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .v62-sb-info-val {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .v62-sb-info-val b { color: var(--accent-deep); font-weight: 800; }
  .v62-sb-right { text-align: right; }
  .v62-sb-right-lab {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .v62-sb-right-val {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    color: var(--accent-deep);
    letter-spacing: -0.015em;
    margin-top: 2px;
  }

  /* --- Filter pills v62 --- */
  .v62-filters {
    padding: 14px 22px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .v62-filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .v62-filter-row::-webkit-scrollbar { display: none; }
  .v62-pill {
    padding: 8px 12px;
    border: 1.5px solid var(--line-soft);
    background: var(--paper);
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
  }
  .v62-pill:hover { border-color: var(--ink); color: var(--ink); }
  .v62-pill.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 700;
  }
  .v62-pill.accent {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 700;
  }
  .v62-type-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
  }
  .v62-type-dot.cardio     { background: #1F5234; }
  .v62-type-dot.renfo      { background: #B23A1F; }
  .v62-type-dot.discipline { background: #243757; }
  .v62-type-dot.freestyle  { background: #5A5245; }
  .v62-type-dot.all        { background: var(--muted); }
  .v62-type-dot.etirement  { background: #1F5234; }

  /* --- Section title v62 --- */
  .v62-section-title {
    padding: 20px 22px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .v62-section-title-main {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .v62-section-title-sub {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  /* --- Type badge monogramme (remplace emoji) --- */
  .v62-type-badge {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--paper);
    text-align: center;
  }
  .v62-type-badge.cardio     { background: #1F5234; }
  .v62-type-badge.renfo      { background: #B23A1F; }
  .v62-type-badge.discipline { background: #243757; }
  .v62-type-badge.freestyle  { background: #5A5245; }

  /* --- Week group (grouped by week) --- */
  .v62-week-group {
    padding: 0 22px;
    margin-bottom: 18px;
  }
  .v62-week-header {
    background: var(--ink);
    color: var(--paper);
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .v62-week-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }
  .v62-week-mini-ring {
    width: 36px;
    height: 36px;
    position: relative;
    flex-shrink: 0;
    aspect-ratio: 1/1;
  }
  .v62-week-mini-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    display: block;
  }
  .v62-week-mini-ring circle { fill: none; stroke-width: 4; }
  .v62-week-mini-ring .track { stroke: rgba(250, 246, 236, 0.15); }
  .v62-week-mini-ring .fill  { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 106; }
  .v62-week-mini-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--paper);
  }
  .v62-week-name {
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.1;
  }
  .v62-week-dates {
    font-family: var(--font-body);
    font-size: 10.5px;
    color: rgba(250, 246, 236, 0.72);
    font-weight: 500;
    margin-top: 2px;
  }
  .v62-week-stats {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  /* --- Session row v62 --- */
  .v62-session-row {
    background: var(--paper);
    border: 1.5px solid var(--line-soft);
    border-radius: 8px;
    padding: 11px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .v62-session-row:hover { border-color: var(--ink); transform: translateX(2px); }
  .v62-session-row.substituted {
    border-color: var(--accent);
    background: #FFFCEB;
  }
  .v62-session-body { flex: 1; min-width: 0; }
  .v62-session-day {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .v62-session-title {
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .v62-session-meta {
    font-family: var(--font-body);
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .v62-session-score {
    background: var(--paper-alt);
    border: 1.5px solid var(--line-soft);
    padding: 4px 9px;
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: -0.01em;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .v62-session-score.high {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .v62-session-score.done {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
    letter-spacing: 0.03em;
  }

  /* --- Empty state ---*/
  .v62-empty {
    padding: 32px 22px;
    text-align: center;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 13px;
  }

  /* --- Placeholders images --- */
  /* --- Placeholder fallback (v64 : blanc pur, sans motif ni label) --- */
  .v62-img-placeholder {
    background: var(--paper);
    display: block;
  }
  .v62-img-placeholder::after { content: none; }
  .v62-img-placeholder.no-label::after { content: none; }
  .v62-img-placeholder.dark {
    background: rgba(250, 246, 236, 0.06);
  }

  /* --- Exercices Hero --- */
  .v62-hero {
    padding: 22px 22px 14px;
  }
  .v62-hero-eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .v62-hero-title {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.02;
  }
  .v62-hero-sub {
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--text-body);
    margin-top: 10px;
    line-height: 1.5;
  }

  /* --- Custom sessions focus cards (Exercices) --- */
  .v62-custom-list { padding: 0 22px; margin-bottom: 6px; }
  .v62-custom-focus-card {
    background: var(--ink);
    color: var(--paper);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.12s;
    width: 100%;
    text-align: left;
    font: inherit;
    border: none;
  }
  .v62-custom-focus-card:active { transform: scale(0.98); }
  .v62-custom-thumb {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(250, 246, 236, 0.06);
    display: block;
    position: relative;
  }
  .v62-custom-thumb.empty {
    background: rgba(250, 246, 236, 0.05);
  }
  .v62-custom-body { flex: 1; min-width: 0; }
  .v62-custom-tag {
    font-family: var(--font-body);
    font-size: 10.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 2px;
    letter-spacing: 0.04em;
  }
  .v62-custom-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .v62-custom-meta {
    font-family: var(--font-body);
    font-size: 11px;
    color: rgba(250, 246, 236, 0.72);
    margin-top: 3px;
  }
  .v62-custom-arrow {
    color: var(--accent);
    font-size: 20px;
    font-weight: 800;
    font-family: var(--font-display);
    flex-shrink: 0;
  }
  .v62-custom-add {
    background: var(--paper);
    border: 1.5px dashed var(--line-soft);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.15s;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .v62-custom-add:hover { border-color: var(--ink); border-style: solid; }
  .v62-custom-add-plus {
    width: 24px;
    height: 24px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    line-height: 1;
  }
  .v62-custom-add-text {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .v62-custom-add-text b { font-weight: 800; }

  /* --- Cat tabs (Exercices) --- */
  .v62-cat-tabs {
    padding: 12px 22px 10px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .v62-cat-tabs::-webkit-scrollbar { display: none; }
  .v62-cat-tab {
    padding: 9px 12px;
    border-radius: 7px;
    background: var(--paper);
    border: 1.5px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.15s;
    line-height: 1;
  }
  .v62-cat-tab.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 700;
  }
  .v62-cat-tab-count {
    font-family: var(--font-display);
    font-size: 10.5px;
    background: var(--line-softer);
    color: var(--muted);
    padding: 1.5px 5px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .v62-cat-tab.active .v62-cat-tab-count {
    background: var(--accent);
    color: var(--on-accent);
  }

  /* --- Exercices grid 2 cols (Approche B) --- */
  .v62-exo-grid {
    padding: 4px 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .v62-exo-grid-tile {
    background: var(--paper);
    border: 1.5px solid var(--line-soft);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;

  window.__bootErrors = [];
  window.addEventListener('error', function(e) {
    window.__bootErrors.push({
      type: 'error',
      message: e.message || String(e.error),
      file: e.filename,
      line: e.lineno,
      col: e.colno,
      stack: e.error && e.error.stack ? e.error.stack : ''
    });
    showBootError();
  });
  window.addEventListener('unhandledrejection', function(e) {
    window.__bootErrors.push({
      type: 'promise',
      message: e.reason && e.reason.message ? e.reason.message : String(e.reason),
      stack: e.reason && e.reason.stack ? e.reason.stack : ''
    });
    showBootError();
  });
  function showBootError() {
    var el = document.getElementById('boot-fallback');
    if (!el) {
      // Boot-fallback déjà supprimé (app démarrée) → créer un overlay inline
      el = document.createElement('div');
      el.id = 'runtime-error-overlay';
      el.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 20px; background: rgba(255,255,255,0.98); max-height: 60vh; overflow-y: auto; border-bottom: 3px solid #B23A1F;';

      return '<strong>#' + (i+1) + ' [' + e.type + ']</strong> ' + (e.message || '?') +
             (e.file ? '\n@ ' + e.file + ':' + e.line + ':' + e.col : '') +
             (e.stack ? '\n' + e.stack.split('\n').slice(0, 3).join('\n') : '');
    }).join('\n\n');

  }
  setTimeout(function() {
    var el = document.getElementById('boot-fallback');
    if (el && el.parentNode) {
      // Si le fallback est toujours là après 5s, quelque chose n'a pas démarré
      if (window.__bootErrors.length === 0) {
        window.__bootErrors.push({ type: 'timeout', message: 'App did not start after 5 seconds' });

// Sédentaire OU durée >= 18 mois OU âge 60+ → Phase P préfixe automatique
function shouldAddPhaseP() {
  const p = state.settings && state.settings.profile;
  if (!p) return false;
  if (p.sportStatus === 'sedentaire') return true;
  if ((p.duration || 0) >= 18) return true;
  const age = p.ageBucket || p.age;
  if (age === '60+' || (typeof age === 'number' && age >= 60)) return true;
  return false;
}

// Retourne la structure de phases correcte pour ce user (avec Phase P préfixée si applicable)
// Chaque phase est enrichie avec weekStart calculé, phaseIndex1 (1-based)
// v77 · Family-aware : utilise la doctrine courante (Expert ou Confirmé)
function getExpertPhaseStructure() {
  const doctrine = getCurrentDoctrine();
  if (!doctrine) return null;
  const p = state.settings.profile;
  const duration = p.duration || 18;
  const base = doctrine.structures[duration] || doctrine.structures[Object.keys(doctrine.structures).sort((a,b) => b - a)[0]];
  const withPP = shouldAddPhaseP() ? [doctrine.phaseP, ...base] : base;
  // Calculer weekStart cumulatif
  let cursor = 1;
  return withPP.map(ph => {
    const enriched = { ...ph, weekStart: cursor };
    cursor += ph.weeksCount;
    return enriched;
  });
}

// Résout la cible cardio (Expert ou Confirmé selon programme actif) pour un subtype donné
// Applique le modulateur profileCoeff (déjà utilisé par le legacy CARDIO_TARGETS Proxy)
function getExpertV73CardioTarget(subtype) {
  const doctrine = getCurrentDoctrine();
  if (!doctrine) return null;
  const info = getExpertV72PhaseInfo();
  if (!info) return null;
  const phaseId = info.phase.id;
  const base = doctrine.cardioTargets[phaseId] && doctrine.cardioTargets[phaseId][subtype];
  if (!base) return null;
  const c = (typeof profileCoeff === 'function') ? profileCoeff() : 1;
  return {
    km: Math.round(base.km * c * 10) / 10,
    deniv: Math.round(base.deniv * c),
    pace: base.pace,
    paceLabel: (typeof paceStr === 'function') ? paceStr(base.pace) : `${Math.floor(base.pace)}:${String(Math.round((base.pace - Math.floor(base.pace)) * 60)).padStart(2,'0')}/km`,
    duration: Math.round(base.duration * c),
    paceType: 'EF'
  };
}

// Retourne le sport de référence du profil (défaut course)
function currentSportReference() {
  const p = state.settings && state.settings.profile;
  return (p && p.sportReference) || 'course';
}

// Retourne le FTP du profil s'il est renseigné, null sinon
function currentFTP() {
  const p = state.settings && state.settings.profile;
  return (p && p.ftp && p.ftp > 0) ? p.ftp : null;
}

function findSportType(sportId) {
  return SPORT_TYPES.find(s => s.id === sportId) || SPORT_TYPES[0];
}

// Convertit une cible cardio (base course) vers le sport choisi
// target = { km, deniv, duration, pace, paceLabel, paceType } (résultat de getExpertV73CardioTarget)
// sport = 'course' | 'velo' | 'velo-int'
// Retourne un objet target enrichi avec sport + valeurs converties + displayLabel adapté
function convertTargetToSport(target, sport, ftp) {
  if (!target) return null;
  const sportId = sport || 'course';
  const conv = SPORT_CONVERSIONS[sportId] || SPORT_CONVERSIONS['course'];
  if (sportId === 'course') {
    return { ...target, sport: 'course', sportEmoji: '🏃' };
  }
  if (sportId === 'velo') {
    return {
      ...target,
      km: Math.round(target.km * conv.km * 10) / 10,
      deniv: target.deniv,
      duration: target.duration,
      pace: null, // pace min/km non applicable au vélo
      paceLabel: target.km > 0 ? `~${Math.round((target.km * conv.km) / (target.duration / 60))} km/h` : 'RPE 4-6',
      paceType: 'RPE',
      sport: 'velo',
      sportEmoji: '🚴'
    };
  }
  if (sportId === 'velo-int') {
    // Détermine zone principale selon subtype (SL = Z2, cardio courte peaking = Z3)
    // Pour v82 : Z2 par défaut, l'user ajuste avec RPE
    const wattEstimate = ftp ? Math.round(ftp * 0.7) : null;
    return {
      km: null,
      deniv: null,
      duration: target.duration,
      pace: null,
      paceLabel: wattEstimate ? `Z2 · ~${wattEstimate} W (70% FTP ${ftp})` : 'Z2 · RPE 4-6 · résistance forte',
      paceType: 'ZONE',
      zoneLabel: 'Z2 Endurance',
      zoneRPE: '4-6',
      wattTarget: wattEstimate,
      sport: 'velo-int',
      sportEmoji: '🚲'
    };
  }
  return { ...target, sport: 'course', sportEmoji: '🏃' };
}

function isExpertV72Program() {
  // v77 · Devient family-aware : retourne true pour Expert ou Confirmé
  return getCurrentProgramFamily() !== null;
}

function getExpertV72CurrentWeek() {
  if (!isExpertV72Program()) return null;
  // Fallback en cascade : startDate → createdAt du profil → semaine 1
  let startDateStr = state.settings && state.settings.startDate;
  if (!startDateStr) startDateStr = state.settings && state.settings.profile && state.settings.profile.createdAt;
  if (!startDateStr) return 1;
  const start = new Date(startDateStr);
  if (isNaN(start.getTime())) return 1;
  const now = new Date();
  const diffMs = now - start;
  if (diffMs < 0) return 1;
  const weekIdx = Math.floor(diffMs / (7 * 24 * 60 * 60 * 1000)) + 1;
  return Math.max(1, weekIdx);
}

function getExpertV72PhaseInfo() {
  if (!isExpertV72Program()) return null;
  const week = getExpertV72CurrentWeek();
  if (!week) return null;
  const phases = getExpertPhaseStructure();
  if (!phases || !phases.length) return null;
  let phase = null, phaseIdx = -1;
  for (let i = 0; i < phases.length; i++) {
    const p = phases[i];
    const endWeek = p.weekStart + p.weeksCount - 1;
    if (week >= p.weekStart && week <= endWeek) { phase = p; phaseIdx = i; break; }
  }
  if (!phase) {
    // Après la fin du programme, on reste sur la dernière phase
    phase = phases[phases.length - 1];
    phaseIdx = phases.length - 1;
  }
  const weekInPhase = Math.max(1, Math.min(phase.weeksCount, week - phase.weekStart + 1));
  // Sous-phase pic/taper/course
  // - Si hasSubPhaseCourse + hasSubPhaseTaper : dernière sem = course, avant-dernière = taper, reste = pic
  // - Si hasSubPhaseTaper seulement : 2 dernières sem = taper, reste = pic
  // - Sinon : pas de sous-phase
  let subPhase = null;
  const wLeft = phase.weeksCount - weekInPhase; // 0 = dernière sem
  if (phase.hasSubPhaseCourse && wLeft === 0) {
    subPhase = 'course';
  } else if (phase.hasSubPhaseTaper && phase.hasSubPhaseCourse && wLeft === 1) {
    subPhase = 'taper';
  } else if (phase.hasSubPhaseTaper && !phase.hasSubPhaseCourse && wLeft <= 1) {
    subPhase = 'taper';
  } else if (phase.hasSubPhaseTaper || phase.hasSubPhaseCourse) {
    subPhase = 'pic';
  }
  return {
    phase, phaseIdx,
    phaseIndex1: phaseIdx + 1,
    totalPhases: phases.length,
    week, weekInPhase,
    totalWeeksInPhase: phase.weeksCount,
    subPhase
  };
}

function ensureUserSkills() {
  if (!state.userSkills || typeof state.userSkills !== 'object') state.userSkills = {};
}

function refreshStaleSkills() {
  ensureUserSkills();
  const now = Date.now();
  Object.keys(state.userSkills).forEach(id => {
    const s = state.userSkills[id];
    if (s && s.status === 'done' && s.updatedAt && (now - s.updatedAt) > EXPERT_V72_SKILL_STALE_MS) {
      s.status = 'stale';
    }
  });
}

function getUserSkillStatus(skillId) {
  ensureUserSkills();
  refreshStaleSkills();
  return (state.userSkills[skillId] && state.userSkills[skillId].status) || 'todo';
}

function toggleSkillStatus(skillId) {
  ensureUserSkills();
  const current = state.userSkills[skillId] || { status: 'todo', updatedAt: 0 };
  let nextStatus;
  if (current.status === 'todo') nextStatus = 'progress';
  else if (current.status === 'progress') nextStatus = 'done';
  else if (current.status === 'done') nextStatus = 'todo';
  else if (current.status === 'stale') nextStatus = 'done'; // rafraîchir = revalider
  else nextStatus = 'todo';
  state.userSkills[skillId] = { status: nextStatus, updatedAt: Date.now() };
  saveState();
  render();
}

function getExpertV72SkillsProgress() {
  ensureUserSkills();
  refreshStaleSkills();
  let done = 0, staleCount = 0;
  EXPERT_V72_SKILLS.forEach(s => {
    const st = state.userSkills[s.id] && state.userSkills[s.id].status;
    if (st === 'done') done++;
    else if (st === 'stale') { done++; staleCount++; }
  });
  return { done, total: EXPERT_V72_SKILLS.length, staleCount };
}

function currentPhase() {
  // Manual override takes priority
  if (state.settings && state.settings.manualPhase) return state.settings.manualPhase;
  const now = new Date();
  if (now < new Date(2026, 9, 1)) return 'phase-0';
  if (now < new Date(2027, 1, 1)) return 'phase-1';
  if (now < new Date(2027, 4, 1)) return 'phase-2';
  return 'phase-3';
}
function phaseLabel(p) {
  return { 'phase-0': 'Phase 0 · Reprise', 'phase-1': 'Phase 1 · Développement', 'phase-2': 'Phase 2 · Spécifique', 'phase-3': 'Phase 3 · Terrain' }[p] || p;
}
function phaseShort(p) {
  return { 'phase-0': 'Ph.0', 'phase-1': 'Ph.1', 'phase-2': 'Ph.2', 'phase-3': 'Ph.3' }[p] || p;
}

function getWeekId(d) {
  d = d || new Date();
  const target = new Date(d.valueOf());
  const dayNr = (target.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  const weekNum = 1 + Math.ceil((firstThursday - target) / 604800000);
  return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
}
function getMondayOfWeek(d) {
  d = new Date(d.valueOf());
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function shortWeekLabel(weekId) {
  return weekId.split('-W')[1] || weekId;
}

// Retourne la clé normalisée d'un exercice, ou null si non mappé
function normalizeExerciseName(name) {
  if (!name || typeof name !== 'string') return null;
  let n = name.toLowerCase().trim();
  // Retire les suffixes " G", " D", " g", " d" (planche latérale G → planche latérale)
  n = n.replace(/\s+[gd]$/i, '');
  // Retire les suffixes " · série X/Y" ou similaires
  n = n.replace(/\s*·.*$/, '');
  return n;
}

function getExerciseData(name) {
  const key = normalizeExerciseName(name);
  return key ? (EXERCISES[key] || null) : null;
}

// Retourne le HTML pour l'illustration d'un exo (ou chaîne vide si pas dispo)
// L'attribut onerror gère le cas où le fichier est mappé mais pas encore présent
function renderIllustration(name, size) {
  const data = getExerciseData(name);
  if (!data || !data.illu) return '';
  const cls = size === 'large' ? 'exercise-illu large' : (size === 'small' ? 'exercise-illu small' : 'exercise-illu');
  return `<img src="./illustrations/${data.illu}.webp" class="${cls}" alt="" onerror="this.style.display='none'; this.parentElement && this.parentElement.classList.add('no-illu');" />`;
}

function getExerciseDesc(name) {
  const data = getExerciseData(name);
  return data ? data.desc : '';
}

  return p.programOptions.cardioObjective || p.programOptions.marathonObjective || defaultObjective(p.programId);
}

function marathonObjective() { return cardioObjective(); }

// Résout la cible d'une session cardio d'après son subtype et la phase
function resolveMarathonTarget(subtype, phase) {
  const p = state.settings && state.settings.profile;
  if (!p) return null;
  let target = null;
  // v77 · Expert et Confirmé : cibles dérivées de leur doctrine via getCurrentDoctrine
  if (getCurrentProgramFamily()) {
    target = getExpertV73CardioTarget(subtype);
  }
  if (!target) {
    const prog = findProgram(p.programId);
    if (!prog || !prog.cardioTargets) return null;
    const base = prog.cardioTargets[phase] && prog.cardioTargets[phase][subtype];
    if (!base) return null;
    const paces = pacesForProgram(p.programId);
    const obj = cardioObjective();
    const paceTable = paces[obj] || Object.values(paces)[0];
    const pace = paceTable[base.paceType] || paceTable.EF;
    target = {
      ...base,
      pace,
      paceTargetName: base.paceType,
      paceLabel: paceStr(pace)
    };
  }
  // v82 · Applique la conversion sport de référence (course → vélo × 3 km / vélo intérieur zone)
  if (target) {
    return convertTargetToSport(target, currentSportReference(), currentFTP());
  }
  return null;
}

// Formate une allure décimale en "min:sec/km"
function paceStr(pace) {
  if (!pace) return '–';
  const m = Math.floor(pace);
  const s = Math.round((pace - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}/km`;
}

// Coefficients de modulation par profil
const SPORT_STATUS_COEFF = {
  sedentaire: 0.60,
  occasionnel: 0.80,
  regulier: 1.00,
  entraine: 1.15
};

// Modulateur âge selon doctrine v2 · buckets 25-40 référence
function ageCoeff(age) {
  if (!age) return 1.0;
  if (age < 25) return 1.05;
  if (age < 40) return 1.0;   // référence
  if (age < 50) return 0.95;
  if (age < 60) return 0.90;
  return 0.80;
}

// Modulateur profil selon doctrine v2 (Sédentaire ×0.65 / Occasionnel ×1.0 / Régulier ×1.15 / Athlétique ×1.30)
function profileCoeffV2(status) {
  const map = { sedentaire: 0.65, occasionnel: 1.0, regulier: 1.15, entraine: 1.30, athletique: 1.30 };
  return map[status] || 1.0;
}

// Composé profil × âge avec plafond doctrine (min 0.55, max 1.30)
function composedProfileAge(status, age) {
  const c = profileCoeffV2(status) * ageCoeff(age);
  return Math.max(0.55, Math.min(1.30, c));
}

// Fréquence hebdo cible selon statut sportif
const FREQ_TARGET = {
  sedentaire: 2,
  occasionnel: 2,
  regulier: 3,
  entraine: 4
};

// Retourne le coefficient combiné âge + statut du profil
function profileCoeff() {
  const p = state.settings && state.settings.profile;
  if (!p) return 1.0;
  const status = p.sportStatus || 'regulier';
  return (SPORT_STATUS_COEFF[status] || 1.0) * ageCoeff(p.age);
}

// Cibles cardio calculées dynamiquement à partir du baseline × coefficient profil
// Les métriques d'intensité (pace, kmh, watts, rpe) ne sont PAS modulées : elles reflètent
// une qualité d'effort physiologique (allure Zone 2, etc.) attendue à toute condition.
const CARDIO_TARGETS = new Proxy({}, {
  get(_, type) {
    if (!CARDIO_TARGETS_BASE[type]) return undefined;
    return new Proxy({}, {
      get(_, phase) {
        const base = CARDIO_TARGETS_BASE[type][phase];
        if (!base) return undefined;
        const c = profileCoeff();
        return {
          duration: Math.round(base.duration * c),
          km: Math.round(base.km * c * 10) / 10,
          deniv: Math.round(base.deniv * c),
          pace: base.pace,     // min/km course, non modulé
          kmh: base.kmh,       // km/h vélo, non modulé
          watts: base.watts,   // W cible vélo int, non modulé
          rpe: base.rpe        // RPE cible vélo int, non modulé
        };
      }
    });
  }
});

// Modulation renfo : ajuste séries × reps + durée gainage selon le statut
function moduleSets(baseSets) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseSets;
  const s = p.sportStatus || 'regulier';
  if (s === 'sedentaire') return Math.max(2, baseSets - 1);
  if (s === 'occasionnel') return baseSets;
  if (s === 'regulier') return baseSets;
  if (s === 'entraine') return baseSets + 1;
  return baseSets;
}
function moduleReps(baseReps) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseReps;
  const s = p.sportStatus || 'regulier';
  const factor = { sedentaire: 0.65, occasionnel: 0.85, regulier: 1.0, entraine: 1.25 }[s] || 1.0;
  return Math.max(4, Math.round(baseReps * factor));
}
function moduleTime(baseSec) {
  const p = state.settings && state.settings.profile;
  if (!p) return baseSec;
  const s = p.sportStatus || 'regulier';
  const factor = { sedentaire: 0.65, occasionnel: 0.85, regulier: 1.0, entraine: 1.2 }[s] || 1.0;
  return Math.max(10, Math.round(baseSec * factor / 5) * 5);
}

// Applique la modulation profil aux steps d'une séance (reps + gainage time)
// Retourne une copie modifiée
function moduleSessionSteps(steps) {
  const p = state.settings && state.settings.profile;
  if (!p || !steps) return steps;
  const s = p.sportStatus || 'regulier';
  if (s === 'regulier') return steps; // baseline, pas de modulation
  return steps.map(step => {
    if (step.type === 'rest' || !step.label) return step;
    // Ne module que les steps qui font partie du "corps de séance" (label = circuit/série/…)
    // pas l'échauffement, les étirements etc.
    const isCore = /circuit|série|round|corps/i.test(step.label);
    if (!isCore) return step;
    const copy = { ...step };
    // Reps : format "X reps" ou "X / jambe" ou "X / côté" — on module le premier nombre
    if (step.type === 'reps' && typeof step.reps === 'string') {
      copy.reps = step.reps.replace(/^(\d+)/, (m, n) => moduleReps(parseInt(n)));
    }
    // Time : gainage/wall sit/planche — on module la durée
    if (step.type === 'time' && step.duration) {
      copy.duration = moduleTime(step.duration);
    }
    return copy;
  });
}

// Applique la modulation au nombre de tours/séries à l'affichage du plan (Renfo A: 4×12 → 5×15 ou 3×10)
function moduleSetsLabel(label) {
  const p = state.settings && state.settings.profile;
  if (!p) return label;
  const s = p.sportStatus || 'regulier';
  if (s === 'regulier') return label;
  return label.replace(/(\d+)\s*[×x]\s*(\d+)/g, (m, sets, reps) => {
    const modSets = moduleSets(parseInt(sets));
    const modReps = moduleReps(parseInt(reps));
    return `${modSets} × ${modReps}`;
  });
}

  'phase-2': { km: 0.30, vertical: 0.45, pace: 0.25 },
  'phase-3': { km: 0.20, vertical: 0.55, pace: 0.25 }
};

function cardioTarget(type) { return CARDIO_TARGETS[type][currentPhase()]; }

//  MARATHON — Builders de séance par subtype
// ============================================================

// Séance EF (Endurance Fondamentale) marathon
function buildMarathonEF(subtype) {
  const phase = currentPhase();
  const t = resolveMarathonTarget(subtype || 'ef', phase);
  if (!t) return null;
  const paceLabel = t.paceLabel;
  const durationMin = Math.round(t.km * t.pace);
  return {
    id: 'marathon-ef',
    focus: 'Cardio · EF',
    focusClass: 'cardio',
    title: 'Endurance Fondamentale',
    duration: `${durationMin} min`,
    durationMin,
    target: { duration: durationMin, km: t.km, deniv: t.deniv, pace: t.pace },
    type: 'course',
    subtype: 'ef',
    intro: `Le pilier du marathon. ${t.km} km en Zone 2, allure ${paceLabel}. Conversation possible tout du long. Trop lent = c'est bien.`,
    plan: [
      { head: 'Échauffement', items: [{ n: 'Marche rapide + montées de genoux', t: '5 min' }] },
      { head: 'Corps', items: [{ n: `${t.km} km à allure EF (${paceLabel})`, t: `${durationMin} min` }] },
      { head: 'Récup', items: [{ n: 'Marche + respiration', t: '3 min' }] }
    ],
    steps: [
      { type: 'time', name: 'Échauffement', duration: 300, label: 'échauffement',
        cues: ['Marche rapide 2 min', 'Rotations chevilles + hanches', 'Montées de genoux légères'] },
      { type: 'time', name: `Course EF · ${paceLabel}`, duration: durationMin * 60, label: 'endurance',
        cues: [`Cible : ${t.km} km à ${paceLabel}`, 'Conversation possible', 'Cadence ~170-180 pas/min', 'Nez qui respire']  },
      { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
        cues: ['Décélération progressive', 'Marche 2 min', 'Étirements légers'] }
    ]
  };
}

// Séance Seuil marathon (blocs à allure marathon)
function buildMarathonSeuil() {
  const phase = currentPhase();
  const t = resolveMarathonTarget('seuil', phase);
  if (!t) return null;
  const paceLabel = t.paceLabel;
  const durTotal = t.durationTotal || 45;
  // Phase 1 : 2×15 min · Phase 3 : 2×10 min
  const blocDuree = phase === 'phase-3' ? 10 : 15;
  return {
    id: 'marathon-seuil',
    focus: 'Cardio · Seuil',
    focusClass: 'cardio',
    title: 'Seuil · allure marathon',
    duration: `${durTotal} min`,
    durationMin: durTotal,
    target: { duration: durTotal, km: t.km, deniv: t.deniv, pace: t.pace },
    type: 'course',
    subtype: 'seuil',
    intro: `Deux blocs de ${blocDuree} min à allure marathon (${paceLabel}). Développe la capacité à tenir cette allure sur la durée.`,
    plan: [
      { head: 'Échauffement · 10 min', items: [{ n: 'Course lente montée en régime', t: '10 min' }] },
      { head: 'Corps', items: [
        { n: `Bloc 1 · ${blocDuree} min à ${paceLabel}`, t: `${blocDuree} min` },
        { n: 'Récup trot', t: '3 min' },
        { n: `Bloc 2 · ${blocDuree} min à ${paceLabel}`, t: `${blocDuree} min` }
      ] },

      { type: 'time', name: 'Échauffement progressif', duration: 600, label: 'échauffement',
        cues: ['Départ très lent 3 min', 'Progressivement plus rapide', 'Termine à allure EF'] },
      { type: 'time', name: `Bloc 1 · Seuil ${paceLabel}`, duration: blocDuree * 60, label: 'seuil',
        cues: [`Cible : ${paceLabel}`, 'Rythme soutenu difficile', 'Respiration ample mais contrôlée', 'Foulée engagée'] },
      { type: 'time', name: 'Récup trot', duration: 180, label: 'récup active',
        cues: ['Trot très souple', 'Respiration profonde', 'Ne t\'arrête pas'] },
      { type: 'time', name: `Bloc 2 · Seuil ${paceLabel}`, duration: blocDuree * 60, label: 'seuil',
        cues: ['Même allure que bloc 1', 'Reste concentré sur la foulée', 'Termine fort'] },
      { type: 'time', name: 'Retour au calme', duration: 300, label: 'récup',
        cues: ['Trot très lent', 'Décélération progressive', 'Marche 1 min finale'] }

  };
}

// Séance VMA marathon (fractionné court)
function buildMarathonVMA() {
  const phase = currentPhase();
  const t = resolveMarathonTarget('vma', phase);
  if (!t) return null;
  const paceLabel = t.paceLabel;
  const durTotal = t.durationTotal || 60;
  // 6 × 1000m à allure VMA avec 2 min récup
  const nbBlocs = 6;
  const blocDuree = Math.round(t.pace * 60); // 1000m à allure VMA (ex: 4:00 = 240s)
  const recupDuree = 120;
  const stepsBlocs = [];
  for (let i = 1; i <= nbBlocs; i++) {
    stepsBlocs.push({ type: 'time', name: `Bloc ${i}/${nbBlocs} · 1000 m à VMA`, duration: blocDuree, label: 'VMA',
      cues: [`Cible : ${paceLabel}`, 'Rythme rapide, effort haut', 'Foulée dynamique', 'Reste régulier'] });
    if (i < nbBlocs) {
      stepsBlocs.push({ type: 'time', name: `Récup trot`, duration: recupDuree, label: 'récup active',
        cues: ['Trot très lent', 'Prépare le prochain bloc'] });
    }
  }
  return {
    id: 'marathon-vma',
    focus: 'Cardio · VMA',
    focusClass: 'cardio',
    title: 'VMA · 6 × 1000 m',
    duration: `${durTotal} min`,
    durationMin: durTotal,
    target: { duration: durTotal, km: t.km, deniv: t.deniv, pace: t.pace },
    type: 'course',
    subtype: 'vma',
    intro: `Fractionné VMA. Six blocs de 1000 m à allure ${paceLabel}. Développe la capacité aérobie maximale.`,
    plan: [
      { head: 'Échauffement · 15 min', items: [{ n: 'Course progressive + gammes', t: '15 min' }] },
      { head: 'Corps · 6 × 1000 m', items: [{ n: `6 blocs à ${paceLabel} · récup 2 min trot`, t: `~30 min` }] },
      { head: 'Retour · 10 min', items: [{ n: 'Trot souple', t: '10 min' }] }
    ],
    steps: [
      { type: 'time', name: 'Échauffement + gammes', duration: 900, label: 'échauffement',
        cues: ['Course lente 10 min', 'Gammes athlétiques 3 min (talons-fesses, montées genoux)', 'Accélérations progressives 2 min'] },
      ...stepsBlocs,
      { type: 'time', name: 'Retour au calme', duration: 600, label: 'récup',
        cues: ['Trot très lent 5 min', 'Marche 3 min', 'Étirements 2 min'] }
    ]
  };
}

// Séance Sortie Longue marathon
function buildMarathonSL(subtype) {
  const phase = currentPhase();
  const st = subtype || (phase === 'phase-2' ? 'sl-am' : 'sl');
  const t = resolveMarathonTarget(st, phase);
  if (!t) return null;
  const paceLabel = t.paceLabel;
  const durationMin = Math.round(t.km * t.pace);
  const hasAM = st === 'sl-am';
  // Structure SL-AM (Phase 2) : EF puis AM en fin
  if (hasAM) {
    const paces = MARATHON_PACES[marathonObjective()] || MARATHON_PACES['4h'];
    const amPaceLabel = paceStr(paces.AM);
    // 75 min EF + 45 min AM
    const efMin = 75, amMin = 45;
    return {
      id: 'marathon-sl-am',
      focus: 'Cardio · SL avec AM',
      focusClass: 'cardio',
      title: 'Sortie longue avec allure marathon',
      duration: `${efMin + amMin + 10} min`,
      durationMin: efMin + amMin + 10,
      target: { duration: durationMin, km: t.km, deniv: t.deniv, pace: t.pace },
      type: 'course',
      subtype: 'sl-am',
      intro: `${t.km} km au total. ${efMin} min à allure EF puis ${amMin} min à allure marathon (${amPaceLabel}) sur jambes lourdes. Séance clé du marathon.`,
      plan: [
        { head: 'Échauffement', items: [{ n: 'Course très souple', t: '10 min' }] },
        { head: 'Corps', items: [
          { n: `Phase EF · ${efMin} min à ${paceLabel}`, t: `${efMin} min` },
          { n: `Phase AM · ${amMin} min à ${amPaceLabel}`, t: `${amMin} min` }
        ] }
      ],
      steps: [
        { type: 'time', name: 'Départ très souple', duration: 600, label: 'échauffement',
          cues: ['Allure très facile', 'Trouve ton rythme', 'Bois régulièrement à partir de 30 min'] },
        { type: 'time', name: `EF · ${paceLabel}`, duration: efMin * 60, label: 'endurance',
          cues: [`Cible : ${paceLabel}`, 'Conversation possible', 'Anticipe le changement de rythme', 'Alimentation : gel/barre à 60 min'] },
        { type: 'time', name: `Passage AM · ${amPaceLabel}`, duration: amMin * 60, label: 'allure marathon',
          cues: [`Cible : ${amPaceLabel} sur jambes lourdes`, 'Reste régulier', 'C\'est ici que se joue le marathon', 'Termine fort'] }
      ]
    };
  }
  // SL classique
  return {
    id: 'marathon-sl',
    focus: 'Cardio · SL',
    focusClass: 'cardio',
    title: 'Sortie longue',
    duration: `${durationMin + 8} min`,
    durationMin: durationMin + 8,
    target: { duration: durationMin, km: t.km, deniv: t.deniv, pace: t.pace },
    type: 'course',
    subtype: 'sl',
    intro: `${t.km} km à allure ${paceLabel}. Le pilier du marathon. Habitue le corps à durer.`,
    plan: [
      { head: 'Échauffement', items: [{ n: 'Départ très souple', t: '5 min' }] },
      { head: 'Corps', items: [{ n: `${t.km} km à ${paceLabel}`, t: `${durationMin} min` }] },
      { head: 'Retour', items: [{ n: 'Marche + étirements', t: '3 min' }] }
    ],
    steps: [
      { type: 'time', name: 'Départ très souple', duration: 300, label: 'échauffement',
        cues: ['Allure très facile', 'Trouve ton rythme confortable', 'Hydratation prête'] },
      { type: 'time', name: `Course longue · ${paceLabel}`, duration: durationMin * 60, label: 'endurance longue',
        cues: [`Cible : ${paceLabel}`, 'Conversation possible', 'Bois toutes les 20 min si +45 min', 'Gel/collation à 60 min si +90 min'] },
      { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
        cues: ['Marche 2 min', 'Étirements chaîne postérieure', 'Récupération active'] }
    ]
  };
}

// ============================================================
//  CARDIO MÉDICAL — Séances Zone 1 / Zone 2 avec RPE cible
// ============================================================
// Cible : durée + km cibles depuis cardioTargets du programme + RPE cible dans la note
function buildMedicalCardio(subtype) {
  const p = state.settings && state.settings.profile;
  const prog = p ? findProgram(p.programId) : null;
  const phase = currentPhase();
  const t = (prog && prog.cardioTargets && prog.cardioTargets[phase] && prog.cardioTargets[phase][subtype]) || null;
  if (!t) return null;

  const duration = t.duration || 20;
  const km = t.km || 2;
  const isZone1 = subtype === 'zone1';
  const rpeLabel = isZone1 ? 'RPE 3-4' : 'RPE 4-5';
  const zoneLabel = isZone1 ? 'Zone 1' : 'Zone 2';
  const note = t.note || '';

  return {
    id: 'cardio-medical-' + subtype,
    focus: `Cardio · ${zoneLabel}`,
    focusClass: 'cardio',
    title: `Cardio ${zoneLabel} · ${rpeLabel}`,
    duration: `${duration + 5} min`,
    durationMin: duration + 5,
    target: { duration, km, deniv: t.deniv || 0 },
    type: 'course',
    subtype,
    intro: `${duration} min à ${rpeLabel}. Objectif : ${km} km${t.deniv ? ' avec ' + t.deniv + 'm D+' : ''}. ${note}`,
    plan: [
      { head: 'Échauffement', items: [{ n: 'Marche/vélo progressif', t: '3 min' }] },
      { head: 'Corps', items: [{ n: `${km} km à ${rpeLabel}`, t: `${duration} min` }] },
      { head: 'Retour', items: [{ n: 'Marche lente + respiration', t: '2 min' }] }
    ],
    steps: [
      { type: 'time', name: 'Échauffement doux', duration: 180, label: 'échauffement',
        cues: ['Marche lente 1 min', 'Rythme progressif', 'Prépare le corps sans forcer', 'Respiration nasale possible'] },
      { type: 'time', name: `${zoneLabel} · ${rpeLabel}`, duration: duration * 60, label: 'endurance',
        cues: [
          `Cible : ${km} km${t.deniv ? ' avec ' + t.deniv + 'm D+' : ''}`,
          isZone1 ? 'Respiration nasale ou légère' : 'Respiration profonde, conversation possible',
          note || 'Reste sous ton seuil de fatigue',
          isZone1 ? 'Stop si essoufflement anormal' : 'Adapte au ressenti'
        ] },
      { type: 'time', name: 'Retour au calme', duration: 120, label: 'récup',
        cues: ['Décélère progressivement', 'Marche 1 min', 'Respiration profonde 4-6', 'Ramène FC à la normale'] }
    ]
  };
}

function buildCardioSession(type, subtype) {
  // Route marathon et similaires vers les builders spécifiques si subtype fourni
  if (subtype) {
    if (subtype === 'ef') return buildMarathonEF('ef');
    if (subtype === 'seuil') return buildMarathonSeuil();
    if (subtype === 'vma') return buildMarathonVMA();
    if (subtype === 'sl' || subtype === 'sl-am') return buildMarathonSL(subtype);
    if (subtype === 'zone1' || subtype === 'zone2') return buildMedicalCardio(subtype);
    if (subtype === 'course') return buildWellnessCardio(subtype);
  }
  const t = cardioTarget(type);
  const isVelo = type === 'velo' || type === 'velo-int';
  const durationSec = t.duration * 60;
  const warmup = { type: 'time', name: 'Échauffement', duration: 300, label: 'échauffement',
    cues: isVelo ? ['Résistance très faible', 'Cadence 80-90 tr/min', 'Monte progressivement le cardiaque']
                 : ['Marche rapide 2 min', 'Rotations chevilles + hanches', 'Montées de genoux légères'] };
  const body = { type: 'time', name: isVelo ? 'Vélo zone 2' : 'Course zone 2', duration: durationSec, label: 'endurance',
    cues: isVelo ? ['Résistance moyenne', 'Cadence 80-90 tr/min', 'Conversation possible']
                 : ['Nez qui respire, conversation possible', 'Cadence ~170-180 pas/min', 'Trop lent = c\'est bien'] };
  const cooldown = { type: 'time', name: 'Retour au calme', duration: 180, label: 'récup',
    cues: isVelo ? ['Résistance très faible', 'Cadence libre', 'Descente cardiaque progressive']
                 : ['Décélération progressive', 'Respiration profonde', 'Marche pas courue'] };
  return {
    id: type,
    focus: isVelo ? 'Cardio · Vélo' : 'Cardio · Course',
    focusClass: 'cardio',
    title: isVelo ? 'Vélo zone 2' : 'Course zone 2',
    duration: `${t.duration + 8} min`,
    durationMin: t.duration + 8,
    target: t,
    type: type,
    intro: isVelo ? 'Moteur aérobie sans casser les articulations.' : 'Le moteur qu\'on construit lentement.',
    plan: [
      { head: 'Échauffement', items: [{ n: warmup.name, t: '5 min' }] },
      { head: 'Corps', items: [{ n: body.name, t: `${t.duration} min` }] },
      { head: 'Récup', items: [{ n: cooldown.name, t: '3 min' }] }
    ],
    steps: [warmup, body, cooldown]
  };
}

function getWeekRenfoIdx() {
  const ref = new Date(2026, 6, 27);
  const now = new Date();
  const diffDays = Math.floor((now - ref) / (1000 * 60 * 60 * 24));
  const weekNum = Math.floor(diffDays / 7);
  return ((weekNum % RENFO_ROTATION.length) + RENFO_ROTATION.length) % RENFO_ROTATION.length;
}
function getCurrentRenfo() { return RENFO_ROTATION[getWeekRenfoIdx()]; }

function findGenericRenfo(level) {
  return GENERIC_RENFO_BY_LEVEL[level] || GENERIC_RENFO_BY_LEVEL['occasionnel'];
}

function openGenericRenfo() {
  const level = (state.settings.profile && state.settings.profile.sportStatus) || 'occasionnel';
  const s = findGenericRenfo(level);
  state.sessionKind = 'bonus'; // utilise le flow bonus (compte comme renfo dans les stats)
  state.sessionId = s.id;
  state.currentGenericRenfo = s;
  state.view = 'preview';
  render();
}

// v63 · Ouvre le choix des 4 renfo vanilla par niveau
function openGenericRenfoChoice() {
  state.view = 'generic-renfo-choice';
  window.scrollTo({ top: 0 });
  render();
}

// v63 · Ouvre un renfo vanilla d'un niveau explicite (choisi par l'utilisateur)
function openGenericRenfoByLevel(level) {
  const s = findGenericRenfo(level);
  if (!s) return;
  state.sessionKind = 'bonus';
  state.sessionId = s.id;
  state.currentGenericRenfo = s;
  state.view = 'preview';
  window.scrollTo({ top: 0 });
  render();
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Cervin 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --bg: #FFFFFF;
    --paper: #FAFAF7;
    --paper-elev: #F2EFE9;
    --paper-warm: #F9F5EC;
    --ink: #0A0908;
    --ink-soft: #55524D;
    --ink-faint: #A19E97;
    --line: rgba(10, 9, 8, 0.10);
    --line-strong: rgba(10, 9, 8, 0.20);

    --gold: #C9A44E;
    --gold-light: #E4C77F;
    --gold-deep: #8B6D2F;
    --gold-bg: #FAF3E0;
    --gold-glow: rgba(201, 164, 78, 0.5);
    --gold-halo: rgba(201, 164, 78, 0.25);

    /* Session accents kept for subtle differentiation */
    --rust: #B23A1F;
    --pine: #1F5234;
    --indigo: #243757;

    /* Section backgrounds (subtly colored, premium feel) */
    --section-cardio: #F4F1EA;   /* ivory */
    --section-renfo: #F6EFE8;    /* linen warm */
    --section-stats: #F0EFEA;    /* pale ash */
    --section-milestone: #FCF6E5; /* soft honey */
    --section-boxe: #F5ECE7;     /* soft rust */
    --section-medical: #EDF2ED;  /* pale pine */

    --font-display: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --display-max: "opsz" 96, "wdth" 100, "wght" 800;
    --display-strong: "opsz" 60, "wdth" 100, "wght" 700;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  html { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(24px + var(--safe-bottom));
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    -webkit-appearance: none;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ============ STICKY TOP BAR (persistent counter) ============ */
  .top-sticky {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 20;
    padding-top: calc(10px + var(--safe-top));
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 -18px 0;
    padding-left: 18px;
    padding-right: 18px;
    border-bottom: 1px solid var(--line);
  }
  .top-sticky-left { display: flex; align-items: center; gap: 10px; }
  .top-brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .top-brand-dot { color: var(--gold); }
  .top-back {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 100px;
    background: var(--paper-elev);
  }
  .top-back:active { background: var(--line); }
  .top-counter {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .top-counter-dots {
    display: flex;
    gap: 4px;
  }
  .top-counter-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--line-strong);
  }
  .top-counter-dot.done { background: var(--ink); border-color: var(--ink); }
  .top-counter.full .top-counter-dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px var(--gold-halo); }
  .top-counter-frac {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .top-counter-frac span { color: var(--ink-faint); font-size: 12px; }
  .top-counter.full .top-counter-frac { color: var(--gold-deep); }
  .top-counter.full .top-counter-frac span { color: var(--gold); }

  /* ============ TAB BAR (bottom nav) ============ */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding-bottom: var(--safe-bottom);
    z-index: 30;
    max-width: 560px;
    margin: 0 auto;
  }
  .tab-btn {
    padding: 10px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-faint);
    transition: color 0.15s;
  }
  .tab-btn.active { color: var(--ink); }
  .tab-icon {
    font-size: 20px;
    line-height: 1;
    font-family: var(--font-display);
    font-weight: 800;
  }
  .tab-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .has-tabbar { padding-bottom: calc(66px + var(--safe-bottom)); }

  /* ============ PHASE SELECTOR ============ */
  .phase-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .phase-btn {
    padding: 10px 4px;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-soft);
    text-align: center;
    transition: all 0.15s;
  }
  .phase-btn:active { transform: scale(0.97); }
  .phase-btn.active {
    background: var(--gold-bg);
    border-color: var(--gold);
    color: var(--gold-deep);
    box-shadow: 0 0 12px var(--gold-halo);
  }
  .phase-btn-num {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 800;
    display: block;
    margin-bottom: 2px;
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.02em;
  }
  .phase-btn.active .phase-btn-num { color: var(--gold-deep); }
  .phase-mode-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 8px;
    letter-spacing: 0.04em;
  }
  .phase-reset {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: underline;
    margin-top: 6px;
  }

  /* ============ TOP BAR ============ */
  .top-bar {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.035em;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .brand-dot { color: var(--gold); }
  .phase-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    background: var(--paper-elev);
    border-radius: 100px;
  }
  .phase-chip-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold-glow);
    animation: pulse-dot 2.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.15); }
  }
  .phase-chip-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn:active { color: var(--gold-deep); }

  /* ============ HERO ============ */
  .hero {
    padding: 14px 0 22px;
  }
  .hero-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .hero-counter {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 12px;
  }
  .hero-num {
    font-family: var(--font-display);
    font-size: 92px;
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.055em;
    line-height: 0.85;
    color: var(--ink);
  }
  .hero-num.complete { color: var(--gold); }
  .hero-denom {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: var(--ink-faint);
  }
  .hero-caption {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  /* ============ WEEKLY OVERVIEW (SEMAINIER) ============ */
  .week-strip-wrap {
    margin: 8px 0 24px;
    padding: 14px 4px 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .week-strip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .week-strip-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .week-strip-hint {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .week-strip {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .week-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
    padding: 6px 0;
    border-radius: 8px;
  }
  .week-cell.current { background: var(--paper-warm); }
  .week-cell-dots {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    z-index: 2;
  }
  .week-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--line-strong);
  }
  .week-dot.done {
    background: var(--ink);
    border-color: var(--ink);
  }
  /* Sessions optionnelles (discipline libre) : plus petites et discrètes */
  .week-dot.optional {
    width: 5px;
    height: 5px;
    border: 1px dashed var(--line-strong);
    opacity: 0.75;
  }
  .week-dot.optional.done {
    background: var(--gold);
    border: 1.5px solid var(--gold);
    opacity: 1;
  }
  .week-cell.full {
    position: relative;
  }
  .week-cell.full .week-dot {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold-glow), 0 0 8px 2px var(--gold-halo);
    animation: gold-radiate 3s ease-in-out infinite;
  }
  .week-cell.full::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    background: radial-gradient(circle, var(--gold-halo) 0%, transparent 65%);
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
    animation: gold-pulse 3s ease-in-out infinite;
  }
  @keyframes gold-radiate {
    0%, 100% { box-shadow: 0 0 0 1px var(--gold-glow), 0 0 8px 2px var(--gold-halo); }
    50% { box-shadow: 0 0 0 2px var(--gold-glow), 0 0 14px 3px var(--gold-halo); }
  }
  @keyframes gold-pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }
  .week-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }
  .week-cell.current .week-label { color: var(--ink); font-weight: 700; }
  .week-cell.full .week-label { color: var(--gold-deep); font-weight: 700; }
  .week-cell.before-start { opacity: 0.3; }
  .week-cell.before-start .week-dot { border-style: dashed; }

  /* ============ SECTION TITLE ============ */
  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 30px 0 14px;
    padding: 16px 0 12px;
    border-top: 2px solid var(--ink);
  }
  .section-title-text {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variation-settings: var(--display-max);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title-text::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 22px;
    background: var(--gold);
    border-radius: 3px;
  }

  /* Nouvelle version proéminente pour la section stats intégrée */
  .section-title-main {
    display: flex;
    flex-direction: column;
    margin: 32px 0 16px;
    padding: 20px 0 14px;
    border-top: 2px solid var(--ink);
    position: relative;
  }
  .section-title-main-bar {
    position: absolute;
    top: -2px;
    left: 0;
    width: 40px;
    height: 4px;
    background: var(--gold);
    border-radius: 0 0 2px 2px;
  }
  .section-title-main-text {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-variation-settings: var(--display-max);
    line-height: 1;
  }
  .section-title-main-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 6px;
  }

  /* Stats collapsibles dans le Cockpit */
  .stat-collapse {
    margin: 10px 0;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--paper-elev);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-collapse.open {
    border-color: var(--gold);
  }
  .stat-collapse.section-cardio { background: var(--section-cardio); }
  .stat-collapse.section-renfo { background: var(--section-renfo); }
  .stat-collapse.section-stats { background: var(--section-stats); }
  .stat-collapse.section-milestone { background: var(--section-milestone); }
  .stat-collapse-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    gap: 10px;
    transition: background 0.15s;
  }
  .stat-collapse-header:active { background: rgba(0,0,0,0.03); }
  .stat-collapse-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    flex: 1;
  }
  .stat-collapse-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    background: var(--paper);
    padding: 4px 8px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    border: 1px solid var(--gold);
  }
  .stat-collapse-chevron {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    font-weight: 700;
    transition: transform 0.2s;
  }
  .stat-collapse-body {
    padding: 8px 16px 18px;
    border-top: 1px solid var(--line);
    animation: statOpen 0.2s ease-out;
  }
  @keyframes statOpen {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stat-empty-inline {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    padding: 12px;
    text-align: center;
    font-style: italic;
    line-height: 1.5;
  }

  /* ============ SESSION ROWS (minimalist tiles) ============ */
  .session-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 26px;
  }
  .session-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    width: 100%;
    text-align: left;
    transition: background 0.15s, transform 0.1s;
  }
  .session-row:active { transform: scale(0.99); background: var(--paper-elev); }
  .session-row-marker {
    width: 3px;
    height: 42px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .session-row.cardio .session-row-marker { background: var(--rust); }
  .session-row.renfo .session-row-marker { background: var(--pine); }
  .session-row.boxe .session-row-marker { background: var(--indigo); }
  .session-row.done { background: var(--gold-bg); border-color: var(--gold-light); }
  .session-row.done .session-row-marker { background: var(--gold); }

  .session-row-body { flex: 1; min-width: 0; }
  .session-row-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .session-row.done .session-row-tag { color: var(--gold-deep); }
  .session-row-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 21px;
    letter-spacing: -0.03em;
    line-height: 1.1;
    font-variation-settings: var(--display-strong);
    margin-bottom: 2px;
    color: var(--ink);
  }
  .session-row-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .session-row-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .session-row.done .session-row-status { color: var(--gold-deep); }
  .session-row-arrow {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-faint);
    font-weight: 900;
  }

  /* ============ LIBRARY ============ */
  .library-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 24px;
  }
  .lib-tile {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    transition: background 0.15s;
  }
  .lib-tile:active { background: var(--paper-elev); }
  .lib-tile-count {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    color: var(--gold-deep);
    letter-spacing: -0.03em;

  /* ============ JOURNEY ============ */
  .journey {
    margin-top: 16px;
    padding: 16px 4px 8px;

  }
  .journey-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }
  .journey-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    margin: 0 12px;
  }
  .journey-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
  }
  .journey-dot {
    width: 7px; height: 7px;
    background: var(--line-strong);
    border-radius: 50%;
  }
  .journey-node.active .journey-dot {
    width: 10px; height: 10px;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold-glow);
  }
  .journey-node.summit .journey-dot {
    width: 0; height: 0;
    background: transparent;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 9px solid var(--ink-faint);
    border-radius: 0;
  }
  .journey-node.summit.active .journey-dot { border-bottom-color: var(--gold); }
  .journey-node-label {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .journey-node.active .journey-node-label { color: var(--gold-deep); }
  .journey-track {
    position: absolute;
    top: 3px;
    left: 4px;
    right: 4px;
    height: 1px;
    background: var(--line);
    z-index: 1;
  }
  .journey-track-fill {
    height: 100%;
    background: var(--gold);
    opacity: 0.6;
  }

  /* ============ PREVIEW ============ */
  .preview-hero { padding: 12px 0 20px; }
  .preview-focus-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 100px;
    margin-bottom: 12px;
    background: var(--paper-elev);
    color: var(--ink-soft);
  }
  .preview-focus-tag.cardio { background: rgba(178, 58, 31, 0.10); color: var(--rust); }
  .preview-focus-tag.renfo { background: rgba(31, 82, 52, 0.10); color: var(--pine); }
  .preview-focus-tag.bonus { background: var(--gold-bg); color: var(--gold-deep); }
  .preview-focus-tag.stretching { background: rgba(36, 55, 87, 0.10); color: var(--indigo); }
  .preview-title {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .preview-intro-short {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 20px;
    max-width: 480px;
  }
  .preview-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .preview-metric {
    background: var(--paper);
    padding: 14px 12px;
  }
  .preview-metric-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
    color: var(--ink);
    margin-bottom: 4px;
  }
  .preview-metric-val .unit { font-size: 12px; color: var(--ink-faint); font-weight: 700; }
  .preview-metric-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .target-box {
    background: var(--gold-bg);
    border: 1px solid var(--gold-light);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .target-box-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .target-box-metrics { display: flex; gap: 16px; }
  .target-box-metric { flex: 1; }
  .target-box-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    color: var(--gold-deep);
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .target-box-val .unit { font-size: 12px; opacity: 0.7; }
  .target-box-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--gold-deep);
    opacity: 0.8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 4px;
  }

  .plan-block { margin-bottom: 24px; }
  .plan-section { margin-bottom: 10px; }
  .plan-section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .plan-section-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .plan-section-line { flex: 1; height: 1px; background: var(--line); }
  .plan-items {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px 0;
  }
  .plan-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ============ FULL STEPS DETAIL ============ */
  .steps-detail {
    background: var(--paper-elev);
    border-radius: 12px;
    padding: 4px 0;
    margin-bottom: 24px;
  }
  .steps-detail-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .steps-detail-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }

  /* ============ ILLUSTRATION EXERCICE ============ */
  .exercise-illu {
    display: block;
    margin: 0 auto 8px;
    width: 200px;
    height: 200px;
    max-width: 100%;
    object-fit: contain;
    /* Blend blanc de l'image sur fond crème pour intégration propre */
    mix-blend-mode: multiply;
    /* Fade-out du bas de l'image pour effacer proprement le trait de sol MJ */
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 82%, transparent 96%);
    mask-image: linear-gradient(to bottom, black 0%, black 82%, transparent 96%);
  }
  .exercise-illu.large {
    width: 260px;
    height: 260px;
    margin-bottom: 12px;
  }
  .exercise-illu.small {
    width: 130px;
    height: 130px;
    margin-bottom: 6px;
  }

  /* ============ REST SCREEN (écran de repos enrichi) ============ */
  .rest-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 0 24px;
  }
  .rest-timer-wrap {
    margin-bottom: 20px;
    padding: 20px 24px;
    background: var(--paper-elev);
    border-radius: 16px;
    border: 1px solid var(--line);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    min-width: 180px;
  }
  .rest-timer-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .rest-timer-value {
    font-family: var(--font-display);
    font-size: 62px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-max);
    letter-spacing: -0.04em;
    line-height: 0.9;
  }
  .rest-timer-bar {
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 10px;
  }
  .rest-timer-bar-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.4s linear;
  }

  .rest-next-header {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .rest-next-name {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 4px;
  }
  .rest-next-info {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .rest-next-desc {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    max-width: 340px;
    margin: 0 auto;
    font-weight: 500;
  }
  .rest-next-final {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink-faint);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.02em;
    margin-top: 20px;
  }

  /* ============ DISCIPLINE GRID ============ */
  .discipline-intro {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 6px 0 22px;
    font-weight: 500;
  }
  .discipline-cat-header {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin: 22px 4px 10px;
  }
  /* Section blocks with headers */
  .discipline-section {
    margin: 20px 0;
  }
  .discipline-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: var(--gold-bg);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .discipline-section-muted .discipline-section-header {
    background: var(--paper-elev);
  }
  .discipline-section-badge {
    color: var(--gold-deep);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
  }
  .discipline-section-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    flex: 1;
  }
  .discipline-section-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .discipline-others-header {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin: 30px 4px 12px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .discipline-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--gold-bg);
    border: 1.5px dashed var(--gold);
    border-radius: 12px;
    margin: 20px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.02em;
    line-height: 1.5;
  }
  .discipline-hint-icon {
    color: var(--gold-deep);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
  }

  .discipline-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .discipline-card {
    position: relative;
    background: var(--paper-elev);
    border-radius: 20px;
    padding: 20px 16px 18px;
    border: 1px solid var(--line);
    transition: opacity 0.2s, transform 0.15s;
    min-height: 130px;
    overflow: hidden;
  }
  .discipline-card.muted {
    opacity: 0.55;
    background: var(--paper);
    border: 1px dashed var(--line-strong);
  }
  .discipline-card.muted:hover { opacity: 0.85; }
  .discipline-card-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 6px;
    background: transparent;
    border: none;
    padding: 0;
    width: 100%;
    cursor: pointer;
  }
  .discipline-card-btn:active { transform: scale(0.97); }
  .discipline-star {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    font-size: 18px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 6px;
    line-height: 1;
    z-index: 2;
    transition: color 0.15s, transform 0.15s;
  }
  .discipline-star.active { color: var(--gold-deep); }
  .discipline-star:hover { transform: scale(1.2); }
  .discipline-star:active { transform: scale(0.9); }
  .discipline-card-icon {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--gold-deep);
    line-height: 1;
    margin-bottom: 6px;
    font-variation-settings: var(--display-strong);
  }
  .discipline-card-title {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    line-height: 1.15;
  }
  .discipline-card-cat {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-top: 8px;
  }
  .onb-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--line-strong);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: transparent;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: auto;
  }
  .onb-check.checked {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--paper);
  }
  .discipline-card-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-top: auto;
  }

  /* ============ ONBOARDING ============ */
  .onb-view {
    min-height: 100vh;
    padding: calc(20px + var(--safe-top)) 4px calc(20px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
  }
  .onb-progress-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    padding: 0 14px;
  }
  .onb-progress {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .onb-progress-dot {
    height: 4px;
    flex: 1;
    background: var(--line);
    border-radius: 2px;
    transition: background 0.25s;
  }
  .onb-progress-dot.done { background: var(--gold); }
  .onb-progress-dot.active { background: var(--ink); }
  .onb-cancel-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line-strong);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .onb-cancel-btn:active { transform: scale(0.95); }
  .onb-cancel-btn:hover { background: var(--gold-bg); border-color: var(--gold); }
  .onb-cancel-icon {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .onb-cancel-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink);
  }
  .onb-head {
    padding: 0 14px;
    margin-bottom: 22px;
  }
  .onb-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .onb-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
    font-variation-settings: var(--display-max);
    margin-bottom: 10px;
  }
  .onb-intro {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.55;
    font-weight: 500;
  }
  .onb-body { padding: 0 14px; flex: 1; }
  .onb-footer {
    padding: 20px 14px 0;
    display: flex;
    gap: 10px;
  }
  .onb-btn {
    padding: 15px 20px;
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.01em;
    transition: transform 0.15s, opacity 0.15s;
  }
  .onb-btn:active { transform: scale(0.98); }
  .onb-btn.primary {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
  }
  .onb-btn.primary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .onb-btn.secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }

  /* Discipline cards */
  .onb-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .onb-choice {
    background: var(--paper-elev);

    line-height: 1;
    flex-shrink: 0;
  }
  .onb-choice-body { flex: 1; min-width: 0; }
  .onb-choice-title {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    line-height: 1.15;
    margin-bottom: 2px;
  }
  .onb-choice-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .onb-choice-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-deep);
    background: var(--gold-bg);
    padding: 3px 7px;
    border-radius: 6px;
    font-weight: 700;
    margin-top: 6px;
    display: inline-block;
  }
  .onb-choice.locked .onb-choice-badge {
    background: rgba(0,0,0,0.05);
    color: var(--ink-faint);
  }

  /* Durations pills */
  .onb-duration-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .onb-duration-pill {
    padding: 14px 20px;
    border-radius: 100px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.01em;
    transition: all 0.15s;
  }
  .onb-duration-pill:active { transform: scale(0.96); }
  .onb-duration-pill.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* Medical warning */
  .onb-warning {
    background: rgba(178, 58, 31, 0.05);
    border: 1.5px solid var(--rust);
    border-radius: 16px;
    padding: 18px 18px 16px;
    margin-bottom: 20px;
  }
  .onb-warning-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rust);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .onb-warning-body {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    line-height: 1.55;
    font-weight: 500;
  }
  .onb-warning-body strong { font-weight: 700; }
  .onb-warning-body ul { padding-left: 20px; margin-top: 8px; }
  .onb-warning-body li { margin-top: 4px; }
  .onb-warning-check {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 14px;
    border-radius: 12px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    cursor: pointer;
    transition: all 0.15s;
  }
  .onb-warning-check.checked {
    background: var(--gold-bg);
    border-color: var(--gold);
  }
  .onb-warning-check-box {
    width: 22px; height: 22px;
    border: 2px solid var(--ink-faint);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    color: transparent;
  }
  .onb-warning-check.checked .onb-warning-check-box {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink);
  }
  .onb-warning-check-label {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    line-height: 1.4;
    font-weight: 500;
  }

  /* Profile form */
  .onb-form { display: flex; flex-direction: column; gap: 16px; }
  .onb-field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .onb-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
    box-sizing: border-box;
  }
  .onb-input:focus { border-color: var(--gold); outline: none; }
  .onb-input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .onb-status-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .onb-status-pill {
    padding: 12px 10px;
    border-radius: 12px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
    transition: all 0.15s;
  }
  .onb-status-pill:active { transform: scale(0.96); }
  .onb-status-pill.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .onb-status-pill-sub {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    opacity: 0.7;
    margin-top: 3px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .onb-textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    box-sizing: border-box;
    resize: vertical;
    min-height: 80px;
    font-weight: 500;
  }

  /* Recap */
  .onb-recap-item {
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .onb-recap-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .onb-recap-value {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .onb-recap-value-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-top: 2px;
  }

  /* ============ REWARDS / BADGES (collapse/expand) ============ */
  .rewards-summary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 10px 0 0;
  }
  .rewards-box {
    background: var(--paper-elev);
    border-radius: 20px;
    padding: 18px 16px 14px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 4px;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    position: relative;
  }
  .rewards-box:active { transform: scale(0.98); }
  .rewards-box.expanded {
    background: var(--gold-bg);
    border-color: var(--gold);
    box-shadow: 0 0 12px var(--gold-halo);
  }
  .rewards-box-num {
    font-family: var(--font-display);
    font-size: 46px;
    font-weight: 800;
    color: var(--gold-deep);
    font-variation-settings: var(--display-max);
    letter-spacing: -0.03em;
    line-height: 0.9;
  }
  .rewards-box-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-top: 4px;
  }
  .rewards-box-tier {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    width: 100%;
  }
  .rewards-box.expanded .rewards-box-tier { border-top-color: var(--gold); }
  .rewards-box-tier-icon {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--gold-deep);
    font-variation-settings: var(--display-strong);
    letter-spacing: 0.03em;
  }
  .rewards-box-tier-label {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .rewards-box-tier-empty {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .rewards-box-chevron {
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    line-height: 1;
    transition: transform 0.2s, color 0.2s;
  }
  .rewards-box.expanded .rewards-box-chevron {
    color: var(--gold-deep);
    transform: rotate(180deg);
  }

  .rewards-detail {
    margin-top: 12px;
    background: var(--paper-elev);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 0 16px var(--gold-halo);
    animation: rewards-expand 0.28s ease;
  }
  @keyframes rewards-expand {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .rewards-detail-head {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 14px;
  }
  .rewards-detail-tier {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .rewards-detail-tier:first-of-type { border-top: none; padding-top: 0; }
  .rewards-detail-tier-icon {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--gold-deep);
    font-variation-settings: var(--display-strong);
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1;
  }
  .rewards-detail-tier.locked .rewards-detail-tier-icon { color: var(--ink-faint); opacity: 0.5; }
  .rewards-detail-tier-body { min-width: 0; }
  .rewards-detail-tier-label {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    line-height: 1.1;
  }
  .rewards-detail-tier.locked .rewards-detail-tier-label { color: var(--ink-soft); opacity: 0.65; }
  .rewards-detail-tier-desc {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1.35;
    margin-top: 2px;
  }
  .rewards-detail-tier-status {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .rewards-detail-tier-status.unlocked { background: var(--gold-bg); color: var(--gold-deep); }
  .rewards-detail-tier-status.next { background: rgba(31,82,52,0.08); color: var(--pine); }
  .rewards-detail-tier-status.locked { background: transparent; color: var(--ink-faint); }

  /* ============ VÉLO INTÉRIEUR MODES ============ */
  .vi-mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0 20px;
  }
  .vi-mode-tab {
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    text-align: left;
    transition: all 0.15s;
    cursor: pointer;
  }
  .vi-mode-tab:active { transform: scale(0.97); }
  .vi-mode-tab.active {
    background: var(--gold-bg);
    border-color: var(--gold);
    box-shadow: 0 0 10px var(--gold-halo);
  }
  .vi-mode-tab-icon {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 800;
    color: var(--gold-deep);
    line-height: 1;
    flex-shrink: 0;
    width: 26px;
    text-align: center;
    font-variation-settings: var(--display-strong);
  }
  .vi-mode-tab-body { flex: 1; min-width: 0; }
  .vi-mode-tab-label {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.1;
    font-variation-settings: var(--display-strong);
  }
  .vi-mode-tab-sub {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    font-weight: 500;
    line-height: 1.3;
    margin-top: 2px;
  }
  .stats-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1.5;
    margin: 8px 4px 12px;
    padding: 10px 12px;
    background: var(--gold-bg);
    border-radius: 10px;
    border-left: 3px solid var(--gold);
  }

  /* ============ UNIVERS ============ */
  .univers-subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .univers-empty {
    text-align: center;
    padding: 60px 20px;
  }
  .univers-empty-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: -0.02em;
    font-variation-settings: var(--display-strong);
    margin-bottom: 8px;
  }
  .univers-empty-sub {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .univers-cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 20px;
    margin: 12px 0;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
  }
  .univers-cta:active { transform: scale(0.98); }
  .univers-cta-body { flex: 1; }
  .univers-cta-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .univers-cta-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.02em;
    font-variation-settings: var(--display-strong);
    line-height: 1.1;
  }
  .univers-cta-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }
  .univers-cta-arrow {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--gold);
    font-weight: 700;
    margin-left: 16px;
  }

  .univers-counters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0 20px;
  }
  .uc-item {
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
  }
  .uc-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 32px;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .uc-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 6px;
  }

  .univers-card {
    background: var(--paper-elev);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin: 12px 0;
  }
  /* Section variants — chaque bloc a sa teinte pour meilleur contraste visuel */
  .univers-card:has(.uni-card-title:contains('Km par')),
  .univers-card.section-cardio { background: var(--section-cardio); border-color: rgba(139, 109, 47, 0.15); }
  .univers-card.section-renfo { background: var(--section-renfo); border-color: rgba(178, 58, 31, 0.12); }
  .univers-card.section-stats { background: var(--section-stats); border-color: var(--line-strong); }
  .univers-card.section-milestone { background: var(--section-milestone); border-color: rgba(201, 164, 78, 0.3); }
  .univers-card.section-medical { background: var(--section-medical); border-color: rgba(31, 82, 52, 0.15); }
  .univers-card.section-boxe { background: var(--section-boxe); border-color: rgba(178, 58, 31, 0.15); }
  .uni-card-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .uni-card-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 16px;
    background: var(--gold);
    border-radius: 2px;
  }
  .section-cardio .uni-card-title::before { background: var(--ink); }
  .section-renfo .uni-card-title::before { background: var(--rust); }
  .section-milestone .uni-card-title::before { background: var(--gold-deep); }
  .section-medical .uni-card-title::before { background: var(--pine); }
  .section-boxe .uni-card-title::before { background: var(--rust); }
  .uni-card-note {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 12px;
    line-height: 1.5;
  }

  .slot-bar-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .slot-bar-row {
    display: grid;
    grid-template-columns: 80px 1fr 40px;
    align-items: center;
    gap: 12px;
  }
  .slot-bar-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .slot-bar-track {
    height: 8px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .slot-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease-out;
  }
  .slot-bar-fill.cardio { background: var(--ink); }
  .slot-bar-fill.renfo { background: var(--gold-deep); }
  .slot-bar-fill.boxe { background: var(--rust, #a04530); }
  .slot-bar-value {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    text-align: right;
    font-variation-settings: var(--display-strong);
  }

  .uni-day-chart, .uni-month-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 100px;
    padding: 0 4px;
    gap: 6px;
  }
  .uni-day-col, .uni-month-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .uni-day-bar-wrap, .uni-month-bar-wrap {
    width: 100%;
    height: 70%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .uni-day-bar, .uni-month-bar {
    width: 100%;
    background: var(--line-strong);
    border-radius: 3px 3px 0 0;
    transition: height 0.4s ease-out;
    min-height: 2px;
  }
  .uni-day-col.best .uni-day-bar { background: var(--gold); }
  .uni-day-label, .uni-month-label {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .uni-day-col.best .uni-day-label { color: var(--gold-deep); }
  .uni-day-val {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    margin-top: 2px;
    font-variation-settings: var(--display-strong);
  }

  .records-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .record-item {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .record-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .record-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 6px;
    line-height: 1.3;
  }

  .exo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .exo-item {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70px;
  }
  .exo-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    color: var(--gold-deep);
    letter-spacing: -0.02em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .exo-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 6px;
    text-align: center;
  }

  /* Ségrégation km par discipline */
  .typed-km-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .typed-km-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .typed-km-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typed-km-emoji {
    font-size: 18px;
    line-height: 1;
  }
  .typed-km-label {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    flex: 1;
  }
  .typed-km-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .typed-km-track {
    height: 10px;
    background: var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .typed-km-fill {
    height: 100%;
    background: var(--type-color);
    border-radius: 5px;

  .typed-km-value {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .typed-km-value strong {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 15px;
    color: var(--type-color);
    letter-spacing: -0.01em;
    font-variation-settings: var(--display-strong);
    margin-right: 2px;
  }
  .typed-km-meta {
    color: var(--ink-soft);
    font-weight: 500;
    margin-left: 4px;
  }

  /* Chart km par mois */
  .km-chart-wrap {
    width: 100%;
    margin: 4px 0;
  }
  .km-chart-svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .chart-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Milestones temporels */
  .milestones-card {
    background: linear-gradient(135deg, var(--paper-elev) 0%, var(--gold-bg) 100%);
    border: 1.5px solid var(--gold);
  }
  .milestones-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .milestones-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 64px;
    color: var(--gold-deep);
    letter-spacing: -0.04em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
  }
  .milestones-num-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 6px;
  }
  .milestone-achieved {
    padding: 12px 14px;
    background: var(--paper);
    border-radius: 10px;
    border-left: 3px solid var(--gold);
    margin-bottom: 10px;
  }
  .milestone-achieved-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .milestone-achieved-desc {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    margin-top: 4px;
    font-style: italic;
  }
  .milestone-next {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: center;
    padding: 8px 0;
    line-height: 1.4;
  }
  .milestones-track {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 8px 0;
    position: relative;
  }
  .milestones-track::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 8px;
    right: 8px;
    height: 1.5px;
    background: var(--line);
    z-index: 0;
  }
  .milestone-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    transition: all 0.2s;
  }
  .milestone-dot.done {
    background: var(--gold);
    border-color: var(--gold);
  }
  .milestone-dot.next {
    background: var(--paper);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-halo, rgba(201,164,78,0.25));
  }
  .milestone-dot-week {
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 700;
    color: var(--ink);
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .milestone-dot.done .milestone-dot-week { color: var(--gold-deep); }

  /* Records hero */
  .records-card {
    background: linear-gradient(180deg, var(--paper-elev) 0%, var(--paper) 100%);
  }
  .records-highlight {
    display: flex;
    justify-content: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .record-hero {
    text-align: center;
  }
  .record-hero-num {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 56px;
    color: var(--gold-deep);
    letter-spacing: -0.04em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
    display: inline;
  }
  .record-hero-unit {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    color: var(--gold-deep);
    letter-spacing: -0.01em;
    margin-left: 4px;
    display: inline;
    font-variation-settings: var(--display-strong);
  }
  .record-hero-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 8px;
  }
  .record-item.highlight {
    background: var(--gold-bg);
    border-color: var(--gold);
  }
  .record-item.highlight .record-num {
    color: var(--gold-deep);
    font-size: 28px;
  }
  .steps-detail-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .steps-detail-list {
    padding: 4px 0;
    max-height: 320px;
    overflow-y: auto;
  }
  .step-line {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    gap: 10px;
    font-size: 13px;
  }
  .step-line.rest {
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding-top: 3px;
    padding-bottom: 3px;
  }
  .step-line-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 700;
    min-width: 22px;
  }
  .step-line-name {
    flex: 1;
    color: var(--ink);
  }
  .step-line-info {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  /* CTA */
  .cta-btn {
    width: 100%;
    padding: 18px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
    transition: transform 0.1s;
  }
  .cta-btn:active { transform: scale(0.98); }
  .cta-btn.gold { background: var(--gold); color: var(--ink); }
  .cta-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); }

  /* ============ CARDIO CHOICE ============ */
  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .choice-card {
    padding: 22px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: left;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
    position: relative;
  }
  .choice-card:active { transform: scale(0.99); background: var(--paper-elev); }
  .choice-name {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.95;
    font-variation-settings: var(--display-max);
    margin-bottom: 12px;
    color: var(--ink);
  }
  .choice-target {
    display: flex;
    gap: 16px;
  }
  .choice-target-item {}
  .choice-target-val {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
    color: var(--ink);
  }
  .choice-target-val .unit { font-size: 11px; color: var(--ink-faint); }
  .choice-target-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  /* ============ RUNNING VIEW ============ */
  .running-view {
    padding-top: calc(12px + var(--safe-top));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .run-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .run-quit, .run-pause {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 100px;
    border: 1px solid var(--line);
  }
  .run-pause { background: var(--paper-elev); color: var(--ink); border: none; }
  .run-pause.paused { background: var(--gold-bg); color: var(--gold-deep); }
  .run-total {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .run-progress {
    display: flex;
    gap: 2px;
    margin-bottom: 32px;
    height: 3px;
  }
  .run-progress-slot {
    flex: 1;
    background: var(--line);
    border-radius: 2px;
  }
  .run-progress-slot.done { background: var(--gold); }
  .run-progress-slot.current { background: var(--ink); }
  .run-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .run-step-context {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
  }
  .run-step-name {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.045em;
    text-align: center;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .run-step-sub {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 0.04em;
  }
  .run-timer { text-align: center; margin-bottom: 26px; }
  .run-timer-value {
    font-family: var(--font-display);
    font-size: 100px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.065em;
    font-variation-settings: var(--display-max);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .run-timer.rest .run-timer-value { color: var(--pine); }
  .run-timer.warmup .run-timer-value { color: var(--gold-deep); }
  .run-timer-bar {
    width: 100%;
    max-width: 240px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin: 16px auto 0;
    overflow: hidden;
  }
  .run-timer-bar-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.3s linear;
  }
  .run-timer.rest .run-timer-bar-fill { background: var(--pine); }
  .run-timer.warmup .run-timer-bar-fill { background: var(--gold); }
  .run-cues {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 22px;
  }
  .run-cues-list { list-style: none; padding: 0; }
  .run-cues-list li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 16px;
    position: relative;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .run-cues-list li:last-child { margin-bottom: 0; }
  .run-cues-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 8px;
    height: 2px;
    background: var(--gold);
    border-radius: 1px;
  }
  .run-next {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .run-next span { color: var(--ink-soft); }
  .run-action-btn {
    width: 100%;
    padding: 20px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
  }
  .run-action-btn:active { background: var(--gold); color: var(--ink); }
  .run-action-btn.done { background: var(--gold); color: var(--ink); }
  .run-action-btn.skip {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    padding: 12px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-variation-settings: normal;
  }

  /* ============ CARDIO STATS ============ */
  .stats-view { padding-top: 20px; }
  .stats-title {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.045em;
    margin-bottom: 6px;
    font-variation-settings: var(--display-max);
  }
  .stats-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 0.04em;
  }
  .stats-input-group { margin-bottom: 14px; }
  .stats-input-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .stats-input-label .target { color: var(--gold-deep); }
  .stats-input {
    width: 100%;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
  }
  .stats-input:focus { outline: none; border-color: var(--gold); background: var(--gold-bg); }
  .stats-verdict {
    padding: 18px 20px;
    border-radius: 14px;
    margin: 20px 0;
  }
  .stats-verdict.above { background: rgba(31, 82, 52, 0.10); color: var(--pine); border: 1px solid rgba(31, 82, 52, 0.20); }
  .stats-verdict.on-target { background: var(--gold-bg); color: var(--gold-deep); border: 1px solid var(--gold-light); }
  .stats-verdict.below { background: rgba(178, 58, 31, 0.08); color: var(--rust); border: 1px solid rgba(178, 58, 31, 0.20); }
  .stats-verdict-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 4px;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .stats-verdict-desc {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
    margin-top: 6px;
  }

  /* ============ CARDIO SCORE BREAKDOWN ============ */
  .cardio-score {
    background: var(--paper-elev);
    border-radius: 16px;
    padding: 18px;
    margin: 14px 0 12px;
    border: 1px solid var(--line);
  }
  .cardio-score-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .cardio-score-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .cardio-score-phase {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .cardio-score-main {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 6px 0 14px;
    flex-wrap: wrap;
  }
  .cardio-score-num {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-max);
    letter-spacing: -0.03em;
    line-height: 0.9;
  }
  .cardio-score-num.above { color: var(--pine); }
  .cardio-score-num.on-target { color: var(--gold-deep); }
  .cardio-score-num.below { color: var(--rust); }
  .cardio-score-unit {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .cardio-score-verdict {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 6px;
  }
  .cardio-score-verdict.above { background: rgba(31,82,52,0.10); color: var(--pine); }
  .cardio-score-verdict.on-target { background: var(--gold-bg); color: var(--gold-deep); }
  .cardio-score-verdict.below { background: rgba(178,58,31,0.08); color: var(--rust); }
  .cardio-score-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .cardio-sub { text-align: center; }
  .cardio-sub-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .cardio-sub-weight {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-left: 4px;
  }
  .cardio-sub-val {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 2px 0;
  }
  .cardio-sub-val span { font-size: 11px; color: var(--ink-faint); font-weight: 600; }

  .cardio-net {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper-elev);
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid var(--line);
  }
  .cardio-net-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .cardio-net-hint {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    margin-top: 3px;
    text-transform: none;
  }
  .cardio-net-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: right;
  }
  .cardio-net-val span {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  /* ============ STATS PAGE (progression graphs) ============ */
  .stats-page-title {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.045em;
    margin: 8px 0 6px;
    font-variation-settings: var(--display-max);
  }
  .stats-page-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 24px;

// Retourne la clé normalisée d'un exercice, ou null si non mappé
function normalizeExerciseName(name) {
  if (!name || typeof name !== 'string') return null;
  let n = name.toLowerCase().trim();
  // Retire les suffixes " G", " D", " g", " d" (planche latérale G → planche latérale)
  n = n.replace(/\s+[gd]$/i, '');
  // Retire les suffixes " · série X/Y" ou similaires
  n = n.replace(/\s*·.*$/, '');
  return n;
}

function getExerciseData(name) {
  const key = normalizeExerciseName(name);
  return key ? (EXERCISES[key] || null) : null;
}

// Retourne le HTML pour l'illustration d'un exo (ou chaîne vide si pas dispo)
// L'attribut onerror gère le cas où le fichier est mappé mais pas encore présent
function renderIllustration(name, size) {
  const data = getExerciseData(name);
  if (!data || !data.illu) return '';
  const cls = size === 'large' ? 'exercise-illu large' : (size === 'small' ? 'exercise-illu small' : 'exercise-illu');
  return `<img src="./illustrations/${data.illu}.webp" class="${cls}" alt="" onerror="this.style.display='none'; this.parentElement && this.parentElement.classList.add('no-illu');" />`;
}

function getExerciseDesc(name) {
  const data = getExerciseData(name);
  return data ? data.desc : '';
}

// Helpers catalogue
function getAllPrograms() {
  const all = [];
  Object.entries(PROGRAMS_CATALOG).forEach(([discId, disc]) => {
    disc.programs.forEach(p => all.push({ ...p, disciplineId: discId, discipline: disc }));
  });
  return all;
}
function findProgram(programId) {
  return getAllPrograms().find(p => p.id === programId) || null;
}
function findDiscipline(disciplineId) {
  return PROGRAMS_CATALOG[disciplineId] || null;
}

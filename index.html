<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0908">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Programme quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #FFFFFF;
    --paper-deep: #F4F4F2;
    --paper-card: #FFFFFF;
    --ink: #0A0908;
    --ink-soft: #4A4845;
    --ink-faint: #8C8985;
    --line: rgba(10, 9, 8, 0.14);
    --line-soft: rgba(10, 9, 8, 0.07);

    --rust: #B23A1F;
    --rust-deep: #6E1F0E;
    --rust-bg: #FBEAE3;

    --pine: #1F5234;
    --pine-deep: #133320;
    --pine-bg: #E5F0E5;

    --indigo: #243757;
    --indigo-deep: #131F36;
    --indigo-bg: #E2E6EE;

    --amber: #7A4A0A;
    --amber-bg: #F8EAD0;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  @media (prefers-color-scheme: dark) {
    /* Forme stays light by design — no dark mode override */
  }

  html { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(40px + var(--safe-bottom));
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ============ HEADER ============ */
  .top-bar {
    padding-top: calc(18px + var(--safe-top));
    padding-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.025em;
    font-variation-settings: "opsz" 144;
  }
  .brand-dot {
    color: var(--rust);
  }
  .brand-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ============ DAY PICKER ============ */
  .day-picker {
    position: sticky;
    top: 0;
    background: var(--paper);
    background: linear-gradient(to bottom, var(--paper) 80%, transparent);
    padding: 6px 0 16px;
    z-index: 10;
    margin: 0 -20px;
    padding-left: 20px;
    padding-right: 20px;
  }
  .day-pills {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-pill {
    appearance: none;
    background: var(--paper-deep);
    border: 1px solid transparent;
    color: var(--ink-soft);
    padding: 10px 4px 9px;
    border-radius: 10px;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    text-align: center;
    line-height: 1.1;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    letter-spacing: 0.02em;
  }
  .day-pill .day-num {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .day-pill:active { transform: scale(0.96); }
  .day-pill.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .day-pill.active .day-num { color: var(--paper); opacity: 0.6; }
  .day-pill.today:not(.active) {
    border-color: var(--rust);
    color: var(--rust);
  }

  /* ============ DAY HERO ============ */
  .day-hero {
    padding: 14px 0 20px;
    border-bottom: 0.5px solid var(--line);
    margin-bottom: 18px;
  }
  .day-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .day-name {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variation-settings: "opsz" 144;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .day-theme {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .day-meta {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .meta-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .meta-value {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ============ SECTIONS ============ */
  .section {
    margin-bottom: 28px;
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--line-soft);
  }
  .section-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 100;
  }
  .section-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* ============ EXERCISE / STRETCH CARDS ============ */
  .card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 14px 12px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .card-icon {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 10px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-icon.effort { background: var(--rust-bg); }
  .card-icon.recup { background: var(--pine-bg); }
  .card-icon.mind { background: var(--indigo-bg); }
  .card-icon.warm { background: var(--amber-bg); }
  .card-icon svg { width: 100%; height: 100%; display: block; }
  .card-body { flex: 1; min-width: 0; }
  .card-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .card-name {
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .card-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 500;
  }
  .card-tag.effort { background: var(--rust-bg); color: var(--rust-deep); }
  .card-tag.recup { background: var(--pine-bg); color: var(--pine-deep); }
  .card-tag.mind { background: var(--indigo-bg); color: var(--indigo-deep); }
  .card-cues {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .card-cues li {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding-left: 14px;
    position: relative;
    margin-bottom: 2px;
  }
  .card-cues li::before {
    content: "·";
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--ink-faint);
    font-weight: 700;
  }

  /* ============ WARMUP STRIP ============ */
  .warm-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 4px;
  }
  .warm-cell {
    background: var(--amber-bg);
    border-radius: 10px;
    padding: 10px 8px 9px;
    text-align: center;
    color: var(--amber);
  }
  .warm-cell-icon {
    width: 28px;
    height: 28px;
    margin: 0 auto 5px;
  }
  .warm-cell-icon svg { width: 100%; height: 100%; display: block; }
  .warm-cell-name {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.2;
    margin-bottom: 2px;
    color: var(--ink);
  }
  .warm-cell-time {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
  }

  /* ============ CIRCUIT BANNER ============ */
  .circuit-banner {
    background: var(--rust-bg);
    border-radius: 10px;
    padding: 9px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--rust-deep);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
  }
  .circuit-banner strong { font-weight: 600; }

  /* ============ MENTAL CARD ============ */
  .mental-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .mental-head {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
  }
  .mental-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--indigo-bg);
    padding: 4px;
  }
  .mental-icon svg { width: 100%; height: 100%; }
  .mental-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.015em;
    font-variation-settings: "opsz" 100;
  }
  .mental-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
  }
  .protocol-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .protocol-stat {
    background: var(--indigo-bg);
    border-radius: 8px;
    padding: 9px 6px 8px;
    text-align: center;
  }
  .protocol-num {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    color: var(--indigo-deep);
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.02em;
  }
  .protocol-label {
    font-size: 10px;
    color: var(--indigo);
    margin-top: 3px;
    line-height: 1.2;
  }
  .breath-cycle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .breath-half {
    padding: 10px 12px;
    border-radius: 8px;
  }
  .breath-in { background: var(--indigo-bg); color: var(--indigo-deep); }
  .breath-out { background: var(--amber-bg); color: var(--amber); }
  .breath-action { font-size: 13px; font-weight: 500; margin-bottom: 1px; }
  .breath-detail { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; }
  .mental-tips {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .mental-tips li {
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding-left: 14px;
    position: relative;
    margin-bottom: 2px;
  }
  .mental-tips li::before {
    content: "·";
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--ink-faint);
    font-weight: 700;
  }

  /* ============ APNEA ROW ============ */
  .apnea {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--paper-deep);
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .apnea-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--paper-card);
    padding: 4px;
    flex-shrink: 0;
  }
  .apnea-icon svg { width: 100%; height: 100%; }
  .apnea-body { flex: 1; }
  .apnea-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .apnea-status.recommended { color: var(--rust); }
  .apnea-text {
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--ink-soft);
  }

  /* ============ FOOTER ============ */
  .footer {
    margin-top: 36px;
    padding: 20px 0;
    border-top: 0.5px solid var(--line-soft);
    text-align: center;
  }
  .footer-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  /* ============ INSTALL HINT ============ */
  .install-hint {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 100;
  }
  .install-hint.show { display: inline-flex; }
  .install-hint button {
    background: none;
    border: none;
    color: var(--paper);
    opacity: 0.6;
    cursor: pointer;
    font-size: 14px;
    padding: 0 0 0 4px;
  }

  /* ============ TRANSITIONS ============ */
  .day-content {
    animation: fade-in 0.25s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* iPhone Safari home-screen full-screen styling */
  @supports (padding: max(0px)) {
    .top-bar { padding-top: max(18px, calc(env(safe-area-inset-top) + 8px)); }
  }
</style>
</head>
<body>

<div class="app">

  <header class="top-bar">
    <div class="brand">Shaolin One<span class="brand-dot">.</span></div>
    <div class="brand-meta" id="today-label">Programme</div>
  </header>

  <nav class="day-picker">
    <div class="day-pills" id="day-pills"></div>
  </nav>

  <main id="day-content"></main>

  <footer class="footer">
    <p class="footer-text">Programme personnalisé · 20 min/jour<br>Lecture hors-ligne · v1.0</p>
  </footer>

</div>

<div class="install-hint" id="install-hint">
  <span id="install-msg">Ajoute à l'écran d'accueil pour une expérience app</span>
  <button onclick="document.getElementById('install-hint').classList.remove('show')">×</button>
</div>

<script>
// ============================================================
//  DATA — All 7 days
// ============================================================
const days = [
  {
    id: 'lun',
    name: 'Lundi',
    num: '01',
    theme: 'Pecs, épaules, triceps',
    duration: '20 min',
    focus: 'Push',
    warmup: [
      { name: 'Jumping jacks', time: '1 min', icon: 'jumping-jacks' },
      { name: 'Rotations épaules', time: '1 min', icon: 'shoulder-rotation' },
      { name: 'Mobilité poignets', time: '1 min', icon: 'wrist-mobility' }
    ],
    circuit: {
      meta: '3 tours · ~20 sec récup entre exos · ~3 min/tour',
      exercises: [
        {
          name: 'Pompes', tag: '12 reps', icon: 'pushup',
          cues: [
            'Mains largeur d\'épaules, gainage actif, corps en ligne droite',
            'Descente contrôlée 2 sec, poitrine à hauteur des poings',
            'Sur les genoux la première semaine si besoin'
          ]
        },
        {
          name: 'Développé militaire haltères', tag: '12 reps · 5 kg', icon: 'overhead-press',
          cues: [
            'Départ haltères au niveau des épaules, paumes vers l\'avant',
            'Pousse à la verticale, sans verrouiller les coudes',
            'Gainage abdo, ne cambre pas le bas du dos'
          ]
        },
        {
          name: 'Élévations latérales', tag: '15 reps · 2 kg', icon: 'lateral-raise',
          cues: [
            'Coudes légèrement fléchis, monte jusqu\'à hauteur d\'épaule',
            'Tempo lent : 1 sec montée, 2 sec descente',
            'Ne balance pas le buste pour t\'aider'
          ]
        },
        {
          name: 'Dips sur chaise', tag: '10 reps', icon: 'dips',
          cues: [
            'Mains sur le rebord, doigts pointant vers l\'avant',
            'Coudes à 90°, bassin proche du siège',
            'Trop dur : pieds rapprochés. Trop facile : jambes tendues'
          ]
        },
        {
          name: 'Mountain climbers', tag: '30 sec', icon: 'mountain-climbers',
          cues: [
            'Position planche stable, mains sous les épaules',
            'Alterne les genoux vers la poitrine, rythme rapide',
            'Bassin bas, gainage permanent'
          ]
        }
      ]
    },
    stretches: [
      { name: 'Pectoraux contre mur', tag: '1 min · 30 sec/côté', icon: 'pec-stretch',
        cues: ['Avant-bras contre un mur, coude à hauteur d\'épaule', 'Avance le buste, tourne le torse à l\'opposé', 'Sensation dans le pec, jamais dans l\'épaule'] },
      { name: 'Deltoïde postérieur (cross-body)', tag: '1 min · 30 sec/bras', icon: 'cross-body',
        cues: ['Bras tendu en travers de la poitrine', 'Tire au niveau du coude, pas du poignet', 'Garde l\'épaule basse'] },
      { name: 'Triceps overhead', tag: '1 min · 30 sec/bras', icon: 'triceps-overhead',

    mental: { type: 'coherence', duration: '2 min (plus efficace 5 min)' },
    apnea: { status: 'optional', text: 'Pas de synergie particulière avec une séance push. À privilégier les soirs après cardio (mardi) ou boxe (vendredi). Si tu y tiens lundi, fais-le simplement avant le coucher.' }
  },

  {
    id: 'mar',
    name: 'Mardi',
    num: '02',
    theme: 'HIIT cardio & core',
    duration: '20 min',
    focus: 'Cardio',
    warmup: [
      { name: 'Montées de genoux', time: '1 min', icon: 'high-knees' },
      { name: 'Talons-fesses', time: '1 min', icon: 'heel-kicks' },
      { name: 'Rotations bassin', time: '1 min', icon: 'hip-rotation' }
    ],
    circuit: {
      meta: '3 blocs Tabata · 4 min chacun · 8 × (20 sec effort / 10 sec repos)',
      exercises: [
        {
          name: 'Bloc 1 · Cardio', tag: '4 min', icon: 'tabata-cardio',
          cues: [
            'Burpees · squats sautés · high knees · shadow boxing',
            'Un exercice par cycle de 30 sec, on tourne sur les 4 min',
            'Intensité max sur les 20 sec, vraiment max'
          ]
        },
        {
          name: 'Bloc 2 · Core', tag: '4 min', icon: 'tabata-core',
          cues: [
            'Planche · russian twists 5 kg · mountain climbers · leg raises',
            'Même format Tabata, on tourne sur les 4 exos',
            'Gainage actif partout, qualité avant vitesse'
          ]
        },
        {
          name: 'Bloc 3 · Boxe', tag: '4 min', icon: 'shadow-box',
          cues: [
            'Shadow boxing libre, intensité max, jeu de jambes constant',

          ]
        }
      ]
    },
    stretches: [
      { name: 'Posture de l\'enfant', tag: '1 min', icon: 'child-pose',

const dayNames = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const dayIds = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];

function getCurrentDayId() {
  return dayIds[new Date().getDay()];
}

function renderPicker(activeId) {
  const todayId = getCurrentDayId();
  const pills = document.getElementById('day-pills');
  const order = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
  pills.innerHTML = order.map(id => {
    const day = days.find(d => d.id === id);
    const isActive = id === activeId ? 'active' : '';
    const isToday = id === todayId ? 'today' : '';
    const short = day.name.slice(0, 3);
    return `<button class="day-pill ${isActive} ${isToday}" data-id="${id}">
      <span>${short}</span><span class="day-num">${day.num}</span>
    </button>`;
  }).join('');
  pills.querySelectorAll('.day-pill').forEach(b => {
    b.addEventListener('click', () => {
      renderDay(b.dataset.id);
    });
  });
}

            <span class="section-num">04 ·</span>
            <span class="section-title">Mental</span>
          </div>
          <span class="section-time">${day.mental.duration}</span>
        </div>
        ${renderMental(day.mental.type)}
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <span class="section-num">05 ·</span>
            <span class="section-title">Apnée</span>
          </div>
          <span class="section-time">bonus du soir</span>
        </div>
        <div class="apnea">
          <div class="apnea-icon">${icons['apnea-icon']}</div>
          <div class="apnea-body">
            <div class="apnea-status ${day.apnea.status === 'recommended' ? 'recommended' : ''}">${day.apnea.status === 'recommended' ? 'Recommandé ce soir' : 'Facultatif ce soir'}</div>
            <div class="apnea-text">${day.apnea.text}</div>
          </div>
        </div>
      </section>
    </article>
  `;

  document.getElementById('day-content').innerHTML = html;
  renderPicker(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderMental(type) {
  const proto = mentalProtocols[type] || mentalProtocols.coherence;
  return `
    <div class="mental-card">
      <div class="mental-head">
        <div class="mental-icon" style="color: var(--indigo-deep);">${icons[type] || icons.coherence}</div>
        <div>
          <div class="mental-title">${proto.title}</div>
          <div class="mental-sub">${proto.sub}</div>
        </div>
      </div>
      <div class="protocol-grid">
        ${proto.stats.map(s => `
          <div class="protocol-stat">
            <div class="protocol-num">${s.num}</div>
            <div class="protocol-label">${s.label}</div>
          </div>
        `).join('')}
      </div>
      <div class="breath-cycle">
        <div class="breath-half breath-in">
          <div class="breath-action">${proto.breath.in}</div>
          <div class="breath-detail">${proto.breath.inDetail}</div>
        </div>
        <div class="breath-half breath-out">
          <div class="breath-action">${proto.breath.out}</div>
          <div class="breath-detail">${proto.breath.outDetail}</div>
        </div>
      </div>
      <ul class="mental-tips">
        ${proto.tips.map(t => `<li>${t}</li>`).join('')}
      </ul>
    </div>
  `;
}

// ============================================================
//  INIT
// ============================================================
function setTodayLabel() {
  const todayId = getCurrentDayId();
  const day = days.find(d => d.id === todayId);
  document.getElementById('today-label').textContent = day ? day.focus.toUpperCase() : 'PROGRAMME';
}

function init() {
  setTodayLabel();
  const initialId = getCurrentDayId();
  const exists = days.find(d => d.id === initialId);
  renderDay(exists ? initialId : 'lun');

  // Show iOS install hint if not standalone
  setTimeout(() => {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (isIOS && !isStandalone && !sessionStorage.getItem('hint-shown')) {
      const hint = document.getElementById('install-hint');
      document.getElementById('install-msg').innerHTML = 'Partager → Sur l\'écran d\'accueil';
      hint.classList.add('show');
      sessionStorage.setItem('hint-shown', '1');
      setTimeout(() => hint.classList.remove('show'), 8000);
    }
  }, 2000);

  // Register service worker for offline
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

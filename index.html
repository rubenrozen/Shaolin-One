<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shaolin One">
<title>Shaolin One · Cervin 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --bg: #FFFFFF;
    --paper: #FAFAF7;
    --paper-elev: #F2EFE9;
    --paper-warm: #F9F5EC;
    --ink: #0A0908;
    --ink-soft: #55524D;
    --ink-faint: #A19E97;
    --line: rgba(10, 9, 8, 0.10);
    --line-strong: rgba(10, 9, 8, 0.20);

    --gold: #C9A44E;
    --gold-light: #E4C77F;
    --gold-deep: #8B6D2F;
    --gold-bg: #FAF3E0;
    --gold-glow: rgba(201, 164, 78, 0.5);
    --gold-halo: rgba(201, 164, 78, 0.25);

    /* Session accents kept for subtle differentiation */
    --rust: #B23A1F;
    --pine: #1F5234;
    --indigo: #243757;

    --font-display: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --display-max: "opsz" 96, "wdth" 100, "wght" 800;
    --display-strong: "opsz" 60, "wdth" 100, "wght" 700;

    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }

  html { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(24px + var(--safe-bottom));
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    -webkit-appearance: none;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ============ TOP BAR ============ */
  .top-bar {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.035em;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .brand-dot { color: var(--gold); }
  .phase-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    background: var(--paper-elev);
    border-radius: 100px;
  }
  .phase-chip-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold-glow);
    animation: pulse-dot 2.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.15); }
  }
  .phase-chip-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn {
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .back-btn:active { color: var(--gold-deep); }

  /* ============ HERO ============ */
  .hero {
    padding: 14px 0 22px;
  }
  .hero-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .hero-counter {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 12px;
  }
  .hero-num {
    font-family: var(--font-display);
    font-size: 92px;
    font-weight: 900;
    font-variation-settings: var(--display-max);
    letter-spacing: -0.055em;
    line-height: 0.85;
    color: var(--ink);
  }
  .hero-num.complete { color: var(--gold); }
  .hero-denom {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 900;
    font-variation-settings: var(--display-strong);
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: var(--ink-faint);
  }
  .hero-caption {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  /* ============ WEEKLY OVERVIEW (SEMAINIER) ============ */
  .week-strip-wrap {
    margin: 8px 0 24px;
    padding: 14px 4px 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .week-strip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .week-strip-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .week-strip-hint {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .week-strip {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .week-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
    padding: 6px 0;
    border-radius: 8px;
  }
  .week-cell.current { background: var(--paper-warm); }
  .week-cell-dots {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    z-index: 2;
  }
  .week-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--line-strong);
  }
  .week-dot.done {
    background: var(--ink);
    border-color: var(--ink);
  }
  .week-cell.full {
    position: relative;
  }
  .week-cell.full .week-dot {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold-glow), 0 0 8px 2px var(--gold-halo);
    animation: gold-radiate 3s ease-in-out infinite;
  }
  .week-cell.full::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    background: radial-gradient(circle, var(--gold-halo) 0%, transparent 65%);
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
    animation: gold-pulse 3s ease-in-out infinite;
  }
  @keyframes gold-radiate {
    0%, 100% { box-shadow: 0 0 0 1px var(--gold-glow), 0 0 8px 2px var(--gold-halo); }
    50% { box-shadow: 0 0 0 2px var(--gold-glow), 0 0 14px 3px var(--gold-halo); }
  }
  @keyframes gold-pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }
  .week-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }
  .week-cell.current .week-label { color: var(--ink); font-weight: 700; }
  .week-cell.full .week-label { color: var(--gold-deep); font-weight: 700; }
  .week-cell.before-start { opacity: 0.3; }
  .week-cell.before-start .week-dot { border-style: dashed; }

  /* ============ SECTION TITLE ============ */
  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 0 12px;
  }
  .section-title-text {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }

  /* ============ SESSION ROWS (minimalist tiles) ============ */
  .session-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 26px;
  }
  .session-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    width: 100%;
    text-align: left;
    transition: background 0.15s, transform 0.1s;
  }
  .session-row:active { transform: scale(0.99); background: var(--paper-elev); }
  .session-row-marker {
    width: 3px;
    height: 42px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .session-row.cardio .session-row-marker { background: var(--rust); }
  .session-row.renfo .session-row-marker { background: var(--pine); }
  .session-row.boxe .session-row-marker { background: var(--indigo); }
  .session-row.done { background: var(--gold-bg); border-color: var(--gold-light); }
  .session-row.done .session-row-marker { background: var(--gold); }

  .session-row-body { flex: 1; min-width: 0; }
  .session-row-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .session-row.done .session-row-tag { color: var(--gold-deep); }
  .session-row-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 21px;
    letter-spacing: -0.03em;
    line-height: 1.1;
    font-variation-settings: var(--display-strong);
    margin-bottom: 2px;
    color: var(--ink);
  }
  .session-row-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .session-row-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .session-row.done .session-row-status { color: var(--gold-deep); }
  .session-row-arrow {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-faint);
    font-weight: 900;
  }

  /* ============ LIBRARY ============ */
  .library-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 24px;
  }
  .lib-tile {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    transition: background 0.15s;
  }
  .lib-tile:active { background: var(--paper-elev); }
  .lib-tile-count {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    color: var(--gold-deep);
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
    margin-bottom: 8px;
  }
  .lib-tile-title {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink);
  }

  /* ============ JOURNEY ============ */
  .journey {
    margin-top: 16px;
    padding: 16px 4px 8px;
    border-top: 1px solid var(--line);
  }
  .journey-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }
  .journey-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    margin: 0 12px;
  }
  .journey-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
  }
  .journey-dot {
    width: 7px; height: 7px;
    background: var(--line-strong);
    border-radius: 50%;
  }
  .journey-node.active .journey-dot {
    width: 10px; height: 10px;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold-glow);
  }
  .journey-node.summit .journey-dot {
    width: 0; height: 0;
    background: transparent;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 9px solid var(--ink-faint);
    border-radius: 0;
  }
  .journey-node.summit.active .journey-dot { border-bottom-color: var(--gold); }
  .journey-node-label {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .journey-node.active .journey-node-label { color: var(--gold-deep); }
  .journey-track {
    position: absolute;
    top: 3px;
    left: 4px;
    right: 4px;
    height: 1px;
    background: var(--line);
    z-index: 1;
  }
  .journey-track-fill {
    height: 100%;
    background: var(--gold);
    opacity: 0.6;
  }

  /* ============ PREVIEW ============ */
  .preview-hero { padding: 12px 0 20px; }
  .preview-focus-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 100px;
    margin-bottom: 12px;
    background: var(--paper-elev);
    color: var(--ink-soft);
  }
  .preview-focus-tag.cardio { background: rgba(178, 58, 31, 0.10); color: var(--rust); }
  .preview-focus-tag.renfo { background: rgba(31, 82, 52, 0.10); color: var(--pine); }
  .preview-focus-tag.bonus { background: var(--gold-bg); color: var(--gold-deep); }
  .preview-focus-tag.stretching { background: rgba(36, 55, 87, 0.10); color: var(--indigo); }
  .preview-title {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
    font-variation-settings: var(--display-max);
    color: var(--ink);
  }
  .preview-intro-short {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 20px;
    max-width: 480px;
  }
  .preview-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .preview-metric {
    background: var(--paper);
    padding: 14px 12px;
  }
  .preview-metric-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variation-settings: var(--display-strong);
    color: var(--ink);
    margin-bottom: 4px;
  }
  .preview-metric-val .unit { font-size: 12px; color: var(--ink-faint); font-weight: 700; }
  .preview-metric-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .target-box {
    background: var(--gold-bg);
    border: 1px solid var(--gold-light);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .target-box-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .target-box-metrics { display: flex; gap: 16px; }
  .target-box-metric { flex: 1; }
  .target-box-val {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    color: var(--gold-deep);
    letter-spacing: -0.03em;
    font-variation-settings: var(--display-strong);
    line-height: 1;
  }
  .target-box-val .unit { font-size: 12px; opacity: 0.7; }
  .target-box-lbl {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--gold-deep);
    opacity: 0.8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 4px;
  }

  .plan-block { margin-bottom: 24px; }
  .plan-section { margin-bottom: 10px; }
  .plan-section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .plan-section-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .plan-section-line { flex: 1; height: 1px; background: var(--line); }
  .plan-items {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px 0;
  }
  .plan-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ============ FULL STEPS DETAIL ============ */
  .steps-detail {
    background: var(--paper-elev);
    border-radius: 12px;
    padding: 4px 0;
    margin-bottom: 24px;
  }
  .steps-detail-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .steps-detail-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .steps-detail-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .steps-detail-list {
    padding: 4px 0;
    max-height: 320px;
    overflow-y: auto;
  }
  .step-line {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    gap: 10px;
    font-size: 13px;
  }
  .step-line.rest {
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding-top: 3px;
    padding-bottom: 3px;
  }
  .step-line-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 700;
    min-width: 22px;
  }
  .step-line-name {
    flex: 1;
    color: var(--ink);
  }
  .step-line-info {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  /* CTA */
  .cta-btn {
    width: 100%;
    padding: 18px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    font-variation-settings: var(--display-strong);
    transition: transform 0.1s;
  }
  .cta-btn:active { transform: scale(0.98); }
  .cta-btn.gold { background: var(--gold); color: var(--ink); }
  .cta-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); }

  /* ============ CARDIO CHOICE ============ */
  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .choice-card {
    padding: 22px 20px;

//  STATE + PERSISTENCE
// ============================================================
const STORAGE_KEY = 'shaolin-one-state-v3';

const state = {
  view: 'home',
  sessionId: null,
  sessionKind: null,
  lexiqueId: null,
  boxeRatingInDialog: 4,
  user: null,
  authChecked: false,
  authMode: 'signin', // 'signin' | 'signup'
  syncStatus: 'offline', // 'offline' | 'syncing' | 'synced' | 'error'
  lastSyncedAt: null,
  loginMessage: null,
  timer: { running: false, paused: false, stepIdx: 0, stepElapsed: 0, totalElapsed: 0, intervalId: null },
  settings: { startDate: null },
  week: {
    id: getWeekId(),
    monday: getMondayOfWeek(new Date()).toISOString().slice(0, 10),
    boxe: { done: false, note: '', score: 0 },
    cardio: { done: false, type: null, duration: null, km: null, deniv: null },
    renfo: { done: false, variantId: null },
    bonusCount: 0
  },
  weekHistory: [],
  cardioHistory: [],
  wakeLock: null,
  audioCtx: null
};

function freshWeek(now) {
  now = now || new Date();
  return {
    id: getWeekId(now),
    monday: getMondayOfWeek(now).toISOString().slice(0, 10),
    boxe: { done: false, note: '', score: 0 },
    cardio: { done: false, type: null, duration: null, km: null, deniv: null },
    renfo: { done: false, variantId: null },
    bonusCount: 0
  };
}

function archiveIfNewWeek() {
  const nowId = getWeekId();
  if (state.week.id !== nowId) {
    // Archive the previous week
    state.weekHistory.push({ ...state.week });
    // Reset to fresh
    state.week = freshWeek();
    saveState();
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);

    if (saved.week) {
      // Ensure structure has all fields (migration)
      state.week = {
        id: saved.week.id || getWeekId(),
        monday: saved.week.monday || getMondayOfWeek(new Date()).toISOString().slice(0, 10),
        boxe: { done: false, note: '', score: 0, ...(saved.week.boxe || {}) },
        cardio: { done: false, type: null, duration: null, km: null, deniv: null, ...(saved.week.cardio || {}) },
        renfo: { done: false, variantId: null, ...(saved.week.renfo || {}) },
        bonusCount: saved.week.bonusCount || 0
      };
    }
    state.weekHistory = saved.weekHistory || [];
    state.cardioHistory = saved.cardioHistory || [];
    if (saved.settings) state.settings = { ...state.settings, ...saved.settings };
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory,
      settings: state.settings
    }));
  } catch (e) {}
  // Also push to Supabase (fire-and-forget)
  if (sb && state.user) {
    pushCurrentWeekToRemote();
  }
}

async function pushCurrentWeekToRemote() {
  if (!sb || !state.user) return;
  try {
    state.syncStatus = 'syncing';
    const { error } = await sb.from('week_state').upsert({
      user_id: state.user.id,
      week_id: state.week.id,
      data: state.week,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,week_id' });
    if (error) throw error;
    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync push failed:', e.message);
    state.syncStatus = 'error';
  }
}

async function pushCardioHistoryEntry(entry) {
  if (!sb || !state.user) return;
  try {
    await sb.from('cardio_history').insert({
      user_id: state.user.id,
      date: entry.date,
      week_id: entry.weekId,
      type: entry.type,
      duration: entry.duration,
      km: entry.km,
      deniv: entry.deniv,
      phase: entry.phase
    });
  } catch (e) { console.warn('Cardio history push failed:', e.message); }
}

async function syncPull() {
  if (!sb || !state.user) return;
  state.syncStatus = 'syncing';
  try {
    // Fetch all week_state rows
    const { data: weeks, error: weeksErr } = await sb.from('week_state')
      .select('week_id, data, updated_at')
      .order('week_id', { ascending: true });
    if (weeksErr) throw weeksErr;

    // Fetch cardio history
    const { data: cardio, error: cardioErr } = await sb.from('cardio_history')
      .select('*')
      .order('date', { ascending: true });
    if (cardioErr) throw cardioErr;

    // Merge weeks: for current week, use most recent; for past weeks, prefer remote
    const currentId = state.week.id;
    const remoteMap = new Map(weeks.map(w => [w.week_id, w]));

    // Update current week if remote is newer or if local is empty
    const remoteCurrent = remoteMap.get(currentId);
    if (remoteCurrent) {
      state.week = { ...state.week, ...remoteCurrent.data, id: currentId };
    }

    // Rebuild weekHistory from remote (past weeks only)
    const history = [];
    for (const w of weeks) {
      if (w.week_id !== currentId) {
        history.push({ ...w.data, id: w.week_id });
      }
    }
    // Also keep any local-only history not on remote (edge case)
    for (const localWeek of state.weekHistory) {
      if (localWeek.id !== currentId && !remoteMap.has(localWeek.id)) {
        history.push(localWeek);
        // Push it to remote
        try {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: localWeek.id,
            data: localWeek,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        } catch (e) { console.warn('Backfill push failed:', e.message); }
      }
    }
    state.weekHistory = history.sort((a, b) => a.id.localeCompare(b.id));

    // Cardio history: use remote as source of truth
    state.cardioHistory = (cardio || []).map(c => ({
      date: c.date, weekId: c.week_id, type: c.type,
      duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
    }));

    // Persist merged state locally
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      week: state.week,
      weekHistory: state.weekHistory,
      cardioHistory: state.cardioHistory
    }));

    // If local week has changes not on remote (updated more recently), push it
    if (!remoteCurrent) await pushCurrentWeekToRemote();

    state.syncStatus = 'synced';
    state.lastSyncedAt = new Date().toISOString();
  } catch (e) {
    console.warn('Sync pull failed:', e.message);
    state.syncStatus = 'error';
  }
}

function countDoneInWeek(w) {
  let c = 0;
  if (w.boxe && w.boxe.done) c++;
  if (w.cardio && w.cardio.done) c++;
  if (w.renfo && w.renfo.done) c++;
  return c;
}
function countDone() { return countDoneInWeek(state.week); }

// ============================================================
//  AUDIO + WAKE
// ============================================================
function ensureAudio() {
  if (!state.audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) state.audioCtx = new AC(); } catch (e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}
function beep(freq = 660, duration = 0.18) {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    const now = state.audioCtx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.stop(now + duration + 0.05);
  } catch (e) {}
}
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
function signalTransition() { beep(660, 0.15); setTimeout(() => beep(880, 0.2), 180); vibrate([120, 60, 180]); }
function signalCountdown() { beep(440, 0.08); vibrate(60); }
function signalComplete() { beep(660, 0.15); setTimeout(() => beep(880, 0.15), 180); setTimeout(() => beep(1100, 0.3), 360); vibrate([200, 80, 200, 80, 400]); }
async function requestWakeLock() { if ('wakeLock' in navigator) { try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } }
function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release().catch(()=>{}); state.wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.timer.running) requestWakeLock(); });

// ============================================================
//  TIMER
// ============================================================
function getCurrentSession() {
  if (state.sessionKind === 'stretching') return STRETCHING;
  if (state.sessionKind === 'bonus') return BONUS.find(b => b.id === state.sessionId);
  if (state.sessionKind === 'cardio') return buildCardioSession(state.sessionId);
  if (state.sessionKind === 'renfo') return RENFO_ROTATION.find(r => r.id === state.sessionId);
  return null;
}
function activeSteps() { const s = getCurrentSession(); return s ? s.steps : []; }
function currentStep() { return activeSteps()[state.timer.stepIdx]; }

function startTimer() {
  ensureAudio(); requestWakeLock();
  state.timer.running = true; state.timer.paused = false;
  state.timer.stepIdx = 0; state.timer.stepElapsed = 0; state.timer.totalElapsed = 0;
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(tick, 1000);
  render();
}
function tick() {
  if (!state.timer.running || state.timer.paused) return;
  state.timer.totalElapsed += 1;
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    state.timer.stepElapsed += 1;
    const remaining = step.duration - state.timer.stepElapsed;
    if (remaining <= 3 && remaining > 0) signalCountdown();
    if (state.timer.stepElapsed >= step.duration) { advance(); return; }
  }
  updateTimerUI();
}
function togglePause() { state.timer.paused = !state.timer.paused; render(); }
function advance() {
  signalTransition();
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function skipStep() {
  state.timer.stepIdx += 1; state.timer.stepElapsed = 0;
  if (state.timer.stepIdx >= activeSteps().length) { completeSession(); return; }
  render();
}
function completeSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false;
  releaseWakeLock(); signalComplete();
  if (state.sessionKind === 'cardio') { state.view = 'cardio-stats'; render(); return; }
  if (state.sessionKind === 'renfo') {
    state.week.renfo.done = true;
    state.week.renfo.variantId = state.sessionId;
    saveState();
  }
  if (state.sessionKind === 'bonus') {
    state.week.bonusCount = (state.week.bonusCount || 0) + 1;
    saveState();
  }
  state.view = 'complete';
  render();
}
function quitSession() {
  if (state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null; state.timer.running = false; state.timer.paused = false;
  releaseWakeLock();
  state.view = 'home'; render();
}

function computeVerdict(type, duration, km, deniv) {
  const t = CARDIO_TARGETS[type][currentPhase()];
  const durPct = (duration / t.duration) * 100;
  const kmPct = (km / t.km) * 100;
  const overall = (durPct + kmPct) / 2;
  let cls, title, desc;
  if (overall >= 100) { cls = 'above'; title = 'Au-dessus'; desc = `${Math.round(overall)}% de la cible · continue`; }
  else if (overall >= 85) { cls = 'on-target'; title = 'Dans la cible'; desc = `${Math.round(overall)}% de la cible · tu progresses`; }
  else { cls = 'below'; title = 'En-dessous'; desc = `${Math.round(overall)}% de la cible · c'est le début, ça vient`; }
  return { cls, title, desc };
}

// ============================================================
//  STATS COMPUTATION
// ============================================================
function getRecentWeeks(n = 8) {
  // Returns last N weeks with current week last, filling in empty weeks
  const now = new Date();
  const currentMonday = getMondayOfWeek(now);
  const startDate = state.settings.startDate ? new Date(state.settings.startDate) : null;
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) {
    const monday = new Date(currentMonday);
    monday.setDate(monday.getDate() - i * 7);
    const wkId = getWeekId(monday);
    const beforeStart = startDate ? (monday < startDate) : false;
    let wk;
    if (wkId === state.week.id) {
      wk = state.week;
    } else {
      wk = state.weekHistory.find(w => w.id === wkId);
    }
    if (!wk) {
      wk = { id: wkId, monday: monday.toISOString().slice(0, 10), boxe: {done: false, score: 0}, cardio: {done: false}, renfo: {done: false}, bonusCount: 0, empty: true };
    }
    wk.beforeStart = beforeStart;
    weeks.push(wk);
  }
  return weeks;
}

async function saveStartDate() {
  const input = document.getElementById('start-date-input');
  const date = input && input.value || null;
  state.settings.startDate = date;
  saveState();
  if (sb && state.user) {
    try {
      await sb.auth.updateUser({ data: { startDate: date } });
    } catch (e) { console.warn('Failed to sync startDate:', e.message); }
  }
  render();
}

function filterActiveWeeks(weeks) {
  return weeks.filter(w => !w.beforeStart);
}

function computeBoxeStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const scores = activeWeeks.map(w => w.boxe && w.boxe.done ? (w.boxe.score || 3) : 0);
  const target = activeWeeks.map(() => 4);
  const total = scores.filter(s => s > 0).length;
  const withScores = scores.filter(s => s > 0);
  const avgScore = withScores.length ? (withScores.reduce((a, b) => a + b, 0) / withScores.length).toFixed(1) : '–';
  return { scores, target, total, avgScore, n: activeWeeks.length };
}

function computeCardioStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const pcts = activeWeeks.map(w => {
    if (!w.cardio || !w.cardio.done) return 0;
    const t = CARDIO_TARGETS[w.cardio.type][currentPhase()];
    const durPct = (w.cardio.duration / t.duration) * 100;
    const kmPct = (w.cardio.km / t.km) * 100;
    return Math.min(150, (durPct + kmPct) / 2);
  });
  const target = activeWeeks.map(() => 100);
  const totalDone = pcts.filter(p => p > 0).length;
  const totalMin = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.duration || 0) : 0), 0);
  const totalKm = activeWeeks.reduce((sum, w) => sum + (w.cardio && w.cardio.done ? (w.cardio.km || 0) : 0), 0);
  return { pcts, target, totalDone, totalMin, totalKm, n: activeWeeks.length };
}

function computeRenfoStats(weeks) {
  const activeWeeks = filterActiveWeeks(weeks);
  const counts = activeWeeks.map(w => (w.renfo && w.renfo.done ? 1 : 0) + (w.bonusCount || 0));
  const target = activeWeeks.map(() => 1);
  const totalRenfo = activeWeeks.filter(w => w.renfo && w.renfo.done).length;
  const totalBonus = activeWeeks.reduce((sum, w) => sum + (w.bonusCount || 0), 0);
  return { counts, target, totalRenfo, totalBonus, n: activeWeeks.length };
}

// ============================================================
//  SVG LINE CHART
// ============================================================
function drawLineChart(actualData, targetData, opts = {}) {
  const { width = 400, height = 100, minY = 0 } = opts;
  let maxY = opts.maxY;
  if (maxY === undefined) {
    const allVals = [...actualData, ...targetData];
    maxY = Math.max(...allVals, 1) * 1.15;
  }
  const padding = 6;
  const chartW = width - padding * 2;
  const chartH = height - padding * 2;
  const range = maxY - minY;
  const n = actualData.length;
  if (n === 0) return '';

  const xScale = (i) => padding + (n === 1 ? chartW/2 : (i / (n - 1)) * chartW);
  const yScale = (v) => padding + chartH - ((v - minY) / range) * chartH;

  const targetPath = targetData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const actualPath = actualData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  const areaPath = `${actualPath} L ${xScale(n - 1)} ${yScale(minY)} L ${xScale(0)} ${yScale(minY)} Z`;

  const points = actualData.map((v, i) => {
    if (v === 0 && i < n - 1) return ''; // skip zero points except last (current) week
    return `<circle cx="${xScale(i)}" cy="${yScale(v)}" r="3" fill="#C9A44E"/>`;
  }).join('');

  return `
    <svg class="stat-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gold-grad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#C9A44E" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#C9A44E" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#gold-grad)"/>
      <path d="${targetPath}" stroke="#A19E97" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
      <path d="${actualPath}" stroke="#C9A44E" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      ${points}
    </svg>`;
}

// ============================================================
function fmtDuration(sec) {
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return s > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${m} min`;
  }
  return `${sec}s`;
}

function renderStepsDetail(session) {
  if (!session.steps || !session.steps.length) return '';
  const nbActive = session.steps.filter(s => s.type !== 'rest').length;
  let stepNum = 0;
  const linesHTML = session.steps.map(s => {
    if (s.type === 'rest') {
      return `<div class="step-line rest">↓ repos ${s.duration}s</div>`;
    }
    stepNum++;
    let info = '';
    if (s.type === 'reps') info = s.reps || '';
    else if (s.type === 'time') info = fmtDuration(s.duration);
    return `
      <div class="step-line">
        <div class="step-line-num">${String(stepNum).padStart(2,'0')}</div>
        <div class="step-line-name">${s.name}</div>
        <div class="step-line-info">${info}</div>
      </div>`;
  }).join('');
  return `
    <div class="steps-detail">
      <div class="steps-detail-head">
        <div class="steps-detail-title">Toutes les étapes</div>
        <div class="steps-detail-count">${nbActive} exercices</div>
      </div>
      <div class="steps-detail-list">
        ${linesHTML}
      </div>
    </div>`;
}

// ============================================================
//  RENDER — RUNNING
// ============================================================
function renderRunning() {
  const steps = activeSteps();
  const step = currentStep();
  if (!step) return renderComplete();

  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalStr = `${totalMin}:${String(totalSec).padStart(2, '0')}`;

  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  let viewClass = 'exercise';
  if (step.type === 'rest') viewClass = 'rest';
  else if (step.label === 'échauffement' || step.label === 'préparation') viewClass = 'warmup';

  let timerHTML = '', actionHTML = '', stepNameHTML = '', stepSubHTML = '', contextHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    contextHTML = `<div class="run-step-context">Repos</div>`;
    stepNameHTML = `<div class="run-step-name">Récup</div>`;
    const next = steps[state.timer.stepIdx + 1];
    stepSubHTML = `<div class="run-step-sub">Prochain · ${next ? (next.name || 'Fin') : 'Fin'}</div>`;
    timerHTML = `
      <div class="run-timer rest">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    timerHTML = `
      <div class="run-timer ${viewClass}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}</div>`;
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `<div class="run-cues"><ul class="run-cues-list">${step.cues.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
  }
  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running-view ${viewClass}">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>
      <div class="run-progress">${progressHTML}</div>
      <div class="run-content">
        ${contextHTML}${stepNameHTML}${stepSubHTML}${timerHTML}${cuesHTML}${nextPreview}
      </div>
      ${actionHTML}
    </div>`;
}
function askQuit() { confirmDialog('Quitter la séance ?', 'La séance ne sera pas validée.', quitSession, 'Quitter', true); }
function updateTimerUI() {
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-timer-bar-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

// ============================================================
//  AUTH
// ============================================================
async function initAuth() {
  if (!sb) { state.authChecked = true; return; }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      state.user = session.user;
      state.syncStatus = 'syncing';
      // Sync startDate from user_metadata if present
      if (session.user.user_metadata && session.user.user_metadata.startDate) {
        state.settings.startDate = session.user.user_metadata.startDate;
      }
    }
  } catch (e) { console.warn('Auth check failed:', e.message); }
  state.authChecked = true;

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Arriving via reset password email link
      state.view = 'reset-password-form';
      state.loginMessage = null;
      render();
      return;
    }
    if (event === 'SIGNED_IN' && session) {
      state.user = session.user;
      state.loginMessage = null;
      // Sync startDate from user_metadata
      if (session.user.user_metadata && session.user.user_metadata.startDate) {
        state.settings.startDate = session.user.user_metadata.startDate;
      }
      // Don't auto-navigate if user is in the middle of a password reset flow
      if (state.view === 'reset-password-form' || state.view === 'reset-password-done') return;
      await syncPull();
      state.view = 'home';
      render();
    }
    if (event === 'SIGNED_OUT') {
      state.user = null;
      state.syncStatus = 'offline';
      state.view = 'login';
      render();
    }
  });
}

async function signInPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Connexion…' };
  render();
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    // onAuthStateChange handles navigation to home
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function signUpPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  if (password.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Création du compte…' };
  render();
  try {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      // Instant sign-in (email confirmation disabled in Supabase)
      // onAuthStateChange handles it
    } else {
      state.loginMessage = { type: 'success', text: 'Compte créé. Confirme ton email dans ta boîte, puis reviens te connecter. Ou désactive "Confirm email" dans Supabase Auth.' };
      render();
    }
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function toggleAuthMode() {
  state.authMode = state.authMode === 'signin' ? 'signup' : 'signin';
  state.loginMessage = null;
  render();
}

async function sendResetLink() {
  const emailEl = document.getElementById('reset-email');
  const email = (emailEl && emailEl.value || '').trim();
  if (!email) {
    state.loginMessage = { type: 'error', text: 'Entre ton email' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Envoi du lien…' };
  render();
  try {
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) throw error;
    state.loginMessage = {
      type: 'success',
      text: 'Lien envoyé à ' + email + '. Clique-le depuis ta boîte mail — ça ouvrira ton navigateur pour définir un nouveau mot de passe, puis reviens dans cette app.'
    };
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function updatePasswordAndFinish() {
  const pwdEl = document.getElementById('new-password');
  const newPassword = pwdEl && pwdEl.value || '';
  if (!newPassword || newPassword.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Mise à jour…' };
  render();
  try {
    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) throw error;
    // Clean URL hash so refreshing doesn't retrigger recovery flow
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    state.loginMessage = null;
    state.view = 'reset-password-done';
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function openResetPassword() {
  state.view = 'reset-request';
  state.loginMessage = null;
  render();
}

async function signOut() {
  if (!sb) return;
  try { await sb.auth.signOut(); } catch (e) {}
}

function skipAuth() {
  // Continue in local-only mode
  state.user = null;
  state.view = 'home';
  render();
}

async function manualSync() {
  if (!sb || !state.user) return;
  await syncPull();
  render();
}

function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    week: state.week,
    weekHistory: state.weekHistory,
    cardioHistory: state.cardioHistory
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shaolin-one-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport() { document.getElementById('import-file').click(); }

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.week) state.week = data.week;
      if (data.weekHistory) state.weekHistory = data.weekHistory;
      if (data.cardioHistory) state.cardioHistory = data.cardioHistory;
      saveState();
      if (sb && state.user) {
        // Backfill all weeks to remote
        for (const w of [...state.weekHistory, state.week]) {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: w.id,
            data: w,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        }
        for (const c of state.cardioHistory) {
          await sb.from('cardio_history').insert({
            user_id: state.user.id,
            date: c.date, week_id: c.weekId, type: c.type,
            duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
          }).select().maybeSingle().catch(()=>{});
        }
      }
      alert('Import terminé.');
      render();
    } catch (err) { alert('Import raté : ' + err.message); }
  };
  reader.readAsText(file);
}

// ============================================================
//  DISPATCH
// ============================================================
function render() {
  const app = document.getElementById('app');
  let html;
  switch (state.view) {
    case 'login': html = renderLogin(); break;
    case 'reset-request': html = renderResetRequest(); break;
    case 'reset-password-form': html = renderResetPasswordForm(); break;
    case 'reset-password-done': html = renderResetPasswordDone(); break;
    case 'account': html = renderAccount(); break;
    case 'home': html = renderHome(); break;
    case 'stats': html = renderStats(); break;
    case 'cardio-choice': html = renderCardioChoice(); break;
    case 'cardio-stats': html = renderCardioStats(); break;
    case 'cardio-recap': html = renderCardioRecap(); break;
    case 'preview': html = renderPreview(); break;
    case 'running': html = renderRunning(); break;
    case 'complete': html = renderComplete(); break;
    case 'bonus-list': html = renderBonusList(); break;
    case 'lexique-list': html = renderLexiqueList(); break;
    case 'lexique-detail': html = renderLexiqueDetail(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  loadState();
  archiveIfNewWeek();

  // Check if we're arriving via password recovery link BEFORE anything else
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const isRecoveryLink = hash.includes('type=recovery') || search.includes('type=recovery');

  if (SUPABASE_ENABLED && sb) {
    await initAuth();

    if (isRecoveryLink) {
      // Force reset password form regardless of session state
      state.view = 'reset-password-form';
      render();
    } else if (state.user) {
      // Show home immediately with local data, then pull remote in background
      render();
      await syncPull();
      render();
    } else {
      // Not signed in — show login
      state.view = 'login';
      render();
    }
  } else {
    // Supabase not configured, local-only mode
    render();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', init);

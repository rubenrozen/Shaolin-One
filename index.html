// Parse "3 × 12" ou "3 × 12/j" ou "10" en total de reps
function parseReps(str) {
  if (!str) return 0;
  const clean = String(str).replace(/,/g, '.');
  const perSide = /\/j|\/côté|\/side/i.test(clean);
  const setsReps = clean.match(/(\d+)\s*[×x]\s*(\d+)/);
  if (setsReps) {
    const total = parseInt(setsReps[1]) * parseInt(setsReps[2]);
    return perSide ? total * 2 : total;
  }
  const single = clean.match(/^(\d+)/);
  if (single) {
    const n = parseInt(single[1]);
    return perSide ? n * 2 : n;
  }
  return 0;
}

// Regarde le nom d'un step et retourne la catégorie d'exo (ou null)
function categorizeExercise(name) {
  if (!name) return null;
  const n = name.toLowerCase();
  if (/(pomp[eé]|push[- ]?up|dips)/.test(n)) return 'pompes';
  if (/squat/.test(n)) return 'squats';
  if (/fente|lunge/.test(n)) return 'fentes';
  if (/(bridge|hip thrust|glute)/.test(n)) return 'bridges';
  if (/rowing|rameur|tirage|row/.test(n)) return 'rows';
  if (/(burpee|burpe)/.test(n)) return 'burpees';
  if (/mountain climber/.test(n)) return 'mountain';
  if (/(pallof|dead ?bug|bird ?dog|superman)/.test(n)) return 'core';
  return null;
}

// Résout le template complet d'une session renfo terminée
function resolveRenfoTemplate(session) {
  if (!session || session.slot !== 'renfo' || !session.done) return null;
  const RENFO_MAP = {
    'marathon': RENFO_MARATHON, 'marathon-leger': RENFO_MARATHON_LEGER,
    'fondation': RENFO_FONDATION, 'hypertrophie': RENFO_HYPERTROPHIE,
    'force-max': RENFO_FORCE_MAX, 'mobilite-posture': RENFO_MOBILITE_POSTURE,
    'medical-leger': RENFO_MEDICAL_LEGER, 'wellness': RENFO_WELLNESS,
    'post-covid': RENFO_POST_COVID, 'apres-cancer': RENFO_APRES_CANCER,
    'cardio-readapt': RENFO_CARDIO_READAPT, 'ortho': RENFO_ORTHO,
    'chronic': RENFO_CHRONIC, 'reprise': RENFO_REPRISE,
    'perte-poids': RENFO_PERTE_POIDS, 'maintenance': RENFO_MAINTENANCE,
    'combat-competition': RENFO_COMBAT_COMPETITION
  };
  if (session.subtype && RENFO_MAP[session.subtype]) return RENFO_MAP[session.subtype];
  // Fallback rotation Cervin
  const variantId = (session.data && session.data.variantId) || null;
  if (variantId) return RENFO_ROTATION.find(r => r.id === variantId);
  return null;
}

// Extrait les compteurs d'exos d'une séance renfo terminée
function countExercisesInSession(session) {
  const template = resolveRenfoTemplate(session);
  if (!template || !template.steps) return {};
  const counts = {};
  let gainageSec = 0;
  template.steps.forEach(step => {
    if (step.type === 'reps' && step.reps) {
      const cat = categorizeExercise(step.name);
      if (cat) {
        counts[cat] = (counts[cat] || 0) + parseReps(step.reps);
      }
    } else if (step.type === 'time' && step.label && /gainage/i.test(step.label)) {
      gainageSec += (step.duration || 0);
    }
  });
  if (gainageSec > 0) counts.gainageSec = gainageSec;
  return counts;
}

// Détermine si le programme actuel a du cardio dans son template
function programHasCardio() {
  const p = state.settings && state.settings.profile;
  if (!p) return true;
  const prog = findProgram(p.programId);
  if (!prog || !prog.weeklyTemplate) return true;
  return Object.values(prog.weeklyTemplate).some(phase =>
    Array.isArray(phase) && phase.some(item => item.slot === 'cardio')
  );
}

// Détermine si le programme actuel a du renfo dans son template
function programHasRenfo() {
  const p = state.settings && state.settings.profile;
  if (!p) return true;
  const prog = findProgram(p.programId);
  if (!prog || !prog.weeklyTemplate) return true;
  return Object.values(prog.weeklyTemplate).some(phase =>
    Array.isArray(phase) && phase.some(item => item.slot === 'renfo')
  );
}

// Détecte si le programme actuel est un programme médical
function isMedicalProgram() {
  const p = state.settings && state.settings.profile;
  return !!(p && p.disciplineId === 'medical');
}

// Retourne les milestones temporels depuis le démarrage du programme
function getProgramMilestones() {
  const p = state.settings && state.settings.profile;
  if (!p || !p.createdAt) return null;
  const start = new Date(p.createdAt);
  const now = new Date();
  const daysSince = Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
  const weeksSince = Math.floor(daysSince / 7);
  const milestones = [
    { week: 1, label: 'Première semaine', desc: 'Le plus dur, c\'est de commencer.' },
    { week: 3, label: 'Trois semaines', desc: 'L\'habitude commence à s\'installer.' },
    { week: 6, label: 'Six semaines', desc: 'Le corps s\'adapte, l\'énergie revient.' },
    { week: 12, label: 'Trois mois', desc: 'Une transformation profonde s\'opère.' },
    { week: 24, label: 'Six mois', desc: 'Tu ne fais plus semblant. C\'est ta vie.' },
    { week: 52, label: 'Un an', desc: 'Une année de discipline. Une nouvelle version de toi.' }
  ];
  const achieved = milestones.filter(m => weeksSince >= m.week);
  const next = milestones.find(m => weeksSince < m.week);
  const lastAchieved = achieved.length > 0 ? achieved[achieved.length - 1] : null;
  return { daysSince, weeksSince, achieved, next, lastAchieved, milestones };
}

// Fonction principale : agrège toutes les stats de l'utilisateur
function aggregateUniversStats() {
  const weeks = allValidWeeks();
  const historyByWeek = {};
  (state.cardioHistory || []).forEach(e => {
    if (!e.weekId) return;
    if (!historyByWeek[e.weekId]) historyByWeek[e.weekId] = [];
    historyByWeek[e.weekId].push(e);
  });

  const allCardio = [];
  weeks.forEach(w => {
    const wid = w.id;
    const wMonday = w.monday || null;
    const hist = historyByWeek[wid] || [];
    let histIdx = 0;
    (w.sessions || []).forEach(s => {
      if (s.slot !== 'cardio' || !s.done) return;
      const data = s.data || {};
      // Cherche entry cardioHistory correspondant (par type si possible)
      const matchByType = hist.find(h => h.type === data.type && !h.__matched);
      const match = matchByType || hist[histIdx];
      if (match) { match.__matched = true; histIdx++; }
      allCardio.push({
        date: (match && match.date) || wMonday,
        weekId: wid,
        type: data.type || (match && match.type) || 'course',
        duration: parseFloat(data.duration) || (match ? parseFloat(match.duration) : 0) || 0,
        km: parseFloat(data.km) || (match ? parseFloat(match.km) : 0) || 0,
        deniv: parseFloat(data.deniv) || (match ? parseFloat(match.deniv) : 0) || 0,
        extraData: data.extraData || (match ? match.extraData : null),
        phase: match ? match.phase : null
      });
    });
  });
  // Nettoyage flag temporaire
  (state.cardioHistory || []).forEach(e => delete e.__matched);

  // Totaux cardio globaux
  const totalKm = allCardio.reduce((a, e) => a + (e.km || 0), 0);
  const totalDeniv = allCardio.reduce((a, e) => a + (e.deniv || 0), 0);
  const totalCardioMin = allCardio.reduce((a, e) => a + (e.duration || 0), 0);

  // Ségrégation par type
  const byType = {
    course:     { km: 0, deniv: 0, duration: 0, count: 0, label: 'Course', emoji: '🏃', color: 'var(--ink)' },
    velo:       { km: 0, deniv: 0, duration: 0, count: 0, label: 'Vélo ext.', emoji: '🚴', color: 'var(--gold-deep)' },
    'velo-int': { km: 0, deniv: 0, duration: 0, count: 0, label: 'Vélo int.', emoji: '🚲', color: 'var(--rust, #a04530)' }
  };
  allCardio.forEach(e => {
    const t = byType[e.type] || byType.course;
    t.km += e.km || 0;
    t.deniv += e.deniv || 0;
    t.duration += e.duration || 0;
    t.count++;
  });

  // Km parcourus par mois × type (pour courbes)
  const now = new Date();
  const monthLabels = [];
  const monthKeys = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    monthKeys.push(ym);
    monthLabels.push(['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()]);
  }
  const kmByMonthType = { course: [], velo: [], 'velo-int': [] };
  monthKeys.forEach(k => {
    Object.keys(kmByMonthType).forEach(t => kmByMonthType[t].push(0));
  });
  allCardio.forEach(e => {
    if (!e.date) return;
    const ym = e.date.slice(0, 7);
    const idx = monthKeys.indexOf(ym);
    if (idx < 0) return;
    const t = e.type in kmByMonthType ? e.type : 'course';
    kmByMonthType[t][idx] += e.km || 0;
  });

  // Totaux sessions
  let totalSessions = 0;
  const bySlot = { cardio: 0, renfo: 0, discipline: 0 };
  weeks.forEach(w => {
    (w.sessions || []).forEach(s => {
      if (s.done) {
        totalSessions++;
        bySlot[s.slot] = (bySlot[s.slot] || 0) + 1;
      }
    });
  });

  // Répartition jours de la semaine (Lun-Dim)
  const byDay = [0, 0, 0, 0, 0, 0, 0];
  const dayLabels = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  allCardio.forEach(e => {
    if (e.date) {
      const d = new Date(e.date);
      const js = d.getDay();
      const idx = js === 0 ? 6 : js - 1;
      byDay[idx]++;
    }
  });
  const maxByDay = Math.max(...byDay, 1);
  const bestDayIdx = byDay.indexOf(Math.max(...byDay));

  // Activité par mois (12 derniers mois)
  const monthValues = new Array(12).fill(0);
  allCardio.forEach(e => {
    if (!e.date) return;
    const idx = monthKeys.indexOf(e.date.slice(0, 7));
    if (idx >= 0) monthValues[idx]++;
  });
  const maxByMonth = Math.max(...monthValues, 1);

  // Records
  const maxDuration = Math.max(0, ...allCardio.map(e => e.duration || 0));
  const maxKm = Math.max(0, ...allCardio.map(e => e.km || 0));
  const maxDeniv = Math.max(0, ...allCardio.map(e => e.deniv || 0));

  // Streak actuel
  const orderedWeeks = [...weeks].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
  let currentStreak = 0;
  for (let i = orderedWeeks.length - 1; i >= 0; i--) {
    const w = orderedWeeks[i];
    const requiredDone = countRequiredDoneInWeek(w);
    const requiredCount = (w.sessions || []).filter(s => !s.optional).length;
    if (requiredCount > 0 && requiredDone >= requiredCount) currentStreak++;
    else break;
  }

  // Compteurs d'exos
  const exos = {};
  weeks.forEach(w => {
    (w.sessions || []).forEach(s => {
      if (s.slot === 'renfo' && s.done) {
        const counts = countExercisesInSession(s);
        for (const key in counts) {
          exos[key] = (exos[key] || 0) + counts[key];
        }
      }
    });
  });

  return {
    totalSessions, totalKm, totalDeniv, totalCardioMin,
    byType, kmByMonthType, monthKeys, monthLabels,
    bySlot, byDay, dayLabels, maxByDay, bestDayIdx,
    monthValues, maxByMonth,
    maxDuration, maxKm, maxDeniv, currentStreak,
    exos, allCardio
  };
}

// Formatage helpers
function fmtNum(n) {
  n = Math.round(n);
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
  return String(n);
}
function fmtHours(min) {
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  if (h === 0) return `${m}min`;
  return `${h}h${m > 0 ? String(m).padStart(2,'0') : ''}`;
}
function fmtSec(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  if (m === 0) return `${s}s`;
  return `${m}min${s > 0 ? String(s).padStart(2,'0') : ''}`;
}

function renderKmProgressionChart(s) {
  const series = [
    { key: 'course', label: 'Course', emoji: '🏃', color: 'var(--ink)', stroke: '#1a1a1a' },
    { key: 'velo', label: 'Vélo ext.', emoji: '🚴', color: 'var(--gold-deep)', stroke: '#8B6D2F' },
    { key: 'velo-int', label: 'Vélo int.', emoji: '🚲', color: 'var(--rust)', stroke: '#a04530' }
  ];
  // Max Y sur toutes séries confondues
  const allValues = series.flatMap(sr => s.kmByMonthType[sr.key] || []);
  const maxY = Math.max(1, ...allValues);
  const anyData = allValues.some(v => v > 0);
  if (!anyData) return '';

  const W = 320, H = 140, padL = 24, padR = 8, padT = 8, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = s.monthLabels.length;
  const stepX = n > 1 ? chartW / (n - 1) : 0;
  const scaleY = (v) => padT + chartH - (v / maxY) * chartH;

  // Grille horizontale (3 lignes)
  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + chartH * (1 - f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${f === 0 ? '0' : '3 3'}"/>`;
  }).join('');

  // Axe Y labels
  const yLabels = [maxY, maxY/2, 0].map((v, i) => {
    const y = padT + chartH * (i * 0.5);
    return `<text x="${padL - 6}" y="${y + 3}" font-family="var(--font-body)" font-size="9" fill="var(--ink-soft)" text-anchor="end">${Math.round(v)}</text>`;
  }).join('');

  // X labels (mois)
  const xLabels = s.monthLabels.map((lbl, i) => {
    const x = padL + i * stepX;
    return `<text x="${x}" y="${H - 6}" font-family="var(--font-body)" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${lbl}</text>`;
  }).join('');

  // Une ligne par série
  const lines = series.map(sr => {
    const values = s.kmByMonthType[sr.key] || [];
    if (values.every(v => v === 0)) return '';
    const pts = values.map((v, i) => `${padL + i * stepX},${scaleY(v)}`).join(' ');
    const dots = values.map((v, i) => v > 0 ? `<circle cx="${padL + i * stepX}" cy="${scaleY(v)}" r="3" fill="${sr.stroke}"/>` : '').join('');
    return `<polyline points="${pts}" fill="none" stroke="${sr.stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  const legend = series.map(sr => {
    const total = (s.kmByMonthType[sr.key] || []).reduce((a, b) => a + b, 0);
    if (total === 0) return '';
    return `<div class="chart-legend-item"><span class="chart-legend-dot" style="background: ${sr.stroke}"></span><span>${sr.emoji} ${sr.label}</span></div>`;
  }).join('');

  return `
    <div class="univers-card">
      <div class="uni-card-title">Kilomètres par mois</div>
      <div class="km-chart-wrap">
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="km-chart-svg">
          ${gridLines}
          ${yLabels}
          ${lines}
          ${xLabels}
        </svg>
      </div>
      <div class="chart-legend">${legend}</div>
    </div>`;
}

  const n = s.monthLabels.length;

  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + chartH * (1 - f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${f === 0 ? '0' : '3 3'}"/>`;

  }).join('');
  const lines = series.map(sr => {

// v59 · Programme = semainier + progression + configuration programme (ex-partie "Programme" du Cockpit)
function renderProgramme() {
  const N = 8;
  const weeks = getRecentWeeks(N);
  const boxe = computeBoxeStats(weeks);
  const cardio = computeCardioStats(weeks);
  const renfo = computeRenfoStats(weeks);
  const hasAnyData = boxe.total > 0 || cardio.totalDone > 0 || renfo.totalRenfo > 0 || renfo.totalBonus > 0;

  const boxeChart = drawLineChart(boxe.scores, boxe.target, { maxY: 5.5 });
  const cardioChart = drawLineChart(cardio.pcts, cardio.target, { maxY: 130 });
  const renfoChart = drawLineChart(renfo.counts, renfo.target, { maxY: Math.max(3, Math.max(...renfo.counts, 0) + 1) });

  // Semainier — dots des sessions du template
  const currentId = state.week.id;
  const target = weeklyTarget();
  const weekCellsHTML = weeks.map(w => {
    if (!w.sessions) w = migrateOldWeek(w);
    const requiredDone = countRequiredDoneInWeek(w);
    const requiredCount = (w.sessions || []).filter(s => !s.optional).length;
    const isFull = requiredCount > 0 && requiredDone >= requiredCount && !w.beforeStart;
    const isCurrent = w.id === currentId;
    const beforeStart = !!w.beforeStart;
    const sessions = w.sessions || [];
    const sorted = [...sessions].sort((a, b) => (a.optional ? 1 : 0) - (b.optional ? 1 : 0));
    const dots = sorted.map(s => {
      const doneSlot = !beforeStart && s.done;
      const optCls = s.optional ? 'optional' : '';
      return `<div class="week-dot ${doneSlot ? 'done' : ''} ${optCls}"></div>`;
    }).join('');
    return `
      <div class="week-cell ${isFull ? 'full' : ''} ${isCurrent ? 'current' : ''} ${beforeStart ? 'before-start' : ''}">
        <div class="week-cell-dots">${dots}</div>
        <div class="week-label">S${shortWeekLabel(w.id)}</div>
      </div>`;
  }).join('');

  // Phase selector
  const phase = currentPhase();
  const isManual = !!(state.settings && state.settings.manualPhase);
  const phaseBtns = ['phase-0', 'phase-1', 'phase-2', 'phase-3'].map((p, i) => `
    <button class="phase-btn ${p === phase ? 'active' : ''}" onclick="savePhase('${p}')">

      ${['Reprise', 'Dévt', 'Spéc.', 'Terrain'][i]}

  const scopeLabel = state.settings.startDate
    ? `Depuis le ${new Date(state.settings.startDate).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' })} · ${boxe.n} sem`

        </div>
        <div class="stat-figures">
          <div class="stat-figure">
            <div class="stat-figure-val">${boxe.total}<span class="unit"> / ${boxe.n}</span></div>

          <div class="stat-figure">

      <div class="stat-block">

            <div class="choice-target-item"><div class="choice-target-val" style="font-size: 14px;">${tVi.wattTarget ? '~' + tVi.wattTarget + ' W' : 'RPE ' + (tVi.zoneRPE || '4-6')}</div><div class="choice-target-lbl">${tVi.wattTarget ? 'Watts' : 'RPE'}</div></div>
          </div>
        </button>
      </div>
    </div>`;
}

// ============================================================
//  RENDER — PREVIEW
// ============================================================
function fmtDuration(sec) {
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return s > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${m} min`;
  }
  return `${sec}s`;
}

function renderStepsDetail(session) {
  if (!session.steps || !session.steps.length) return '';
  const nbActive = session.steps.filter(s => s.type !== 'rest').length;
  let stepNum = 0;
  const linesHTML = session.steps.map(s => {
    if (s.type === 'rest') {
      return `<div class="step-line rest">↓ repos ${s.duration}s</div>`;
    }
    stepNum++;
    let info = '';
    if (s.type === 'reps') info = s.reps || '';
    else if (s.type === 'time') info = fmtDuration(s.duration);
    return `
      <div class="step-line">
        <div class="step-line-num">${String(stepNum).padStart(2,'0')}</div>
        <div class="step-line-name">${s.name}</div>
        <div class="step-line-info">${info}</div>
      </div>`;
  }).join('');
  return `
    <div class="steps-detail">
      <div class="steps-detail-head">
        <div class="steps-detail-title">Toutes les étapes</div>
        <div class="steps-detail-count">${nbActive} exercices</div>
      </div>
      <div class="steps-detail-list">
        ${linesHTML}
      </div>
    </div>`;
}

// ============================================================
//  RENDER — RUNNING
// ============================================================
function renderRunning() {
  const steps = activeSteps();
  const step = currentStep();
  if (!step) return renderComplete();

  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalStr = `${totalMin}:${String(totalSec).padStart(2, '0')}`;

  const progressHTML = steps.map((_, i) => {
    let cls = '';
    if (i < state.timer.stepIdx) cls = 'done';
    else if (i === state.timer.stepIdx) cls = 'current';
    return `<div class="run-progress-slot ${cls}"></div>`;
  }).join('');

  let viewClass = 'exercise';
  if (step.type === 'rest') viewClass = 'rest';
  else if (step.label === 'échauffement' || step.label === 'préparation') viewClass = 'warmup';

  let timerHTML = '', actionHTML = '', stepNameHTML = '', stepSubHTML = '', contextHTML = '', illuHTML = '';

  if (step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);

    // Trouve le prochain step non-rest pour l'aperçu
    let next = null;
    for (let i = state.timer.stepIdx + 1; i < steps.length; i++) {
      if (steps[i].type !== 'rest') { next = steps[i]; break; }
    }

    // Rendu spécifique complet pour la vue rest (bypass le layout standard)
    const nextIllu = next ? renderIllustration(next.name, 'large') : '';
    const nextDesc = next ? getExerciseDesc(next.name) : '';
    const nextInfo = next
      ? (next.type === 'reps' ? next.reps : (next.type === 'time' ? `${next.duration} s` : ''))
      : '';
    const nextLabel = next && next.label ? next.label : '';

    const restContent = `
      <div class="rest-screen">
        <div class="rest-timer-wrap">
          <div class="rest-timer-label">Repos</div>
          <div class="rest-timer-value run-timer-value">${timeStr}</div>
          <div class="rest-timer-bar"><div class="rest-timer-bar-fill run-timer-bar-fill" style="width:${pct}%"></div></div>
        </div>
        ${next ? `
          <div class="rest-next-header">Prochain exercice</div>
          ${nextIllu}
          <div class="rest-next-name">${next.name}</div>
          ${nextInfo || nextLabel ? `<div class="rest-next-info">${nextInfo}${nextInfo && nextLabel ? ' · ' : ''}${nextLabel}</div>` : ''}
          ${nextDesc ? `<div class="rest-next-desc">${nextDesc}</div>` : ''}
        ` : `<div class="rest-next-final">Séance presque bouclée.</div>`}
      </div>`;

    return `
      <div class="view running-view rest">
        <div class="run-top">
          <button class="run-quit" onclick="askQuit()">← Quitter</button>
          <div class="run-total">${totalStr}</div>
          <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
            ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
          </button>
        </div>
        <div class="run-progress">${progressHTML}</div>
        <div class="run-content">
          ${restContent}
        </div>
        <button class="run-action-btn skip" onclick="skipStep()">Passer le repos →</button>
      </div>`;
  }
  else if (step.type === 'time') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    illuHTML = renderIllustration(step.name);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    timerHTML = `
      <div class="run-timer ${viewClass}">
        <div class="run-timer-value">${timeStr}</div>
        <div class="run-timer-bar"><div class="run-timer-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    actionHTML = `<button class="run-action-btn skip" onclick="skipStep()">Passer →</button>`;
  }
  else if (step.type === 'reps') {
    if (step.label) contextHTML = `<div class="run-step-context">${step.label}</div>`;
    illuHTML = renderIllustration(step.name);
    stepNameHTML = `<div class="run-step-name">${step.name}</div>`;
    stepSubHTML = `<div class="run-step-sub">${step.reps || ''}</div>`;
    actionHTML = `<button class="run-action-btn done" onclick="advance()">✓ Fait</button>`;
  }

  let cuesHTML = '';
  if (step.cues && step.cues.length) {
    cuesHTML = `<div class="run-cues"><ul class="run-cues-list">${step.cues.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
  }
  let nextPreview = '';
  if (step.type === 'reps') {
    const next = steps[state.timer.stepIdx + 1];
    if (next) {
      const nextLabel = next.type === 'rest' ? `Repos ${next.duration}s` : (next.name + (next.reps ? ` · ${next.reps}` : ''));
      nextPreview = `<div class="run-next">Prochain · <span>${nextLabel}</span></div>`;
    }
  }

  return `
    <div class="view running-view ${viewClass}">
      <div class="run-top">
        <button class="run-quit" onclick="askQuit()">← Quitter</button>
        <div class="run-total">${totalStr}</div>
        <button class="run-pause ${state.timer.paused ? 'paused' : ''}" onclick="togglePause()">
          ${state.timer.paused ? '▶ Reprendre' : '⏸ Pause'}
        </button>
      </div>
      <div class="run-progress">${progressHTML}</div>
      <div class="run-content">
        ${contextHTML}${illuHTML}${stepNameHTML}${stepSubHTML}${timerHTML}${cuesHTML}${nextPreview}
      </div>
      ${actionHTML}
    </div>`;
}
function askQuit() { confirmDialog('Quitter la séance ?', 'La séance ne sera pas validée.', quitSession, 'Quitter', true); }
function updateTimerUI() {
  const step = currentStep();
  if (!step) return;
  if (step.type === 'time' || step.type === 'rest') {
    const remaining = step.duration - state.timer.stepElapsed;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const pct = Math.min(100, (state.timer.stepElapsed / step.duration) * 100);
    const valEl = document.querySelector('.run-timer-value');
    const fillEl = document.querySelector('.run-timer-bar-fill');
    if (valEl) valEl.textContent = timeStr;
    if (fillEl) fillEl.style.width = pct + '%';
  }
  const totalMin = Math.floor(state.timer.totalElapsed / 60);
  const totalSec = state.timer.totalElapsed % 60;
  const totalEl = document.querySelector('.run-total');
  if (totalEl) totalEl.textContent = `${totalMin}:${String(totalSec).padStart(2, '0')}`;
}

function renderCardioScoreCard(c) {
  const r = computeCardioScore(c.type, c.duration, c.km, c.deniv, c.extraData);
  const phase = currentPhase();
  // Label intensité selon type et mode
  let paceLabel = 'Allure', paceValue = '–';
  if (c.type === 'course' && r.pace) {
    paceValue = `${Math.floor(r.pace)}:${String(Math.round((r.pace % 1) * 60)).padStart(2,'0')}/km`;
  } else if (c.type === 'velo' && r.speedKmh) {
    paceValue = `${r.speedKmh.toFixed(1)} km/h`;
  } else if (c.type === 'velo-int' && c.extraData) {
    const m = c.extraData.mode;
    if (m === 'watts' && c.extraData.watts) { paceLabel = 'Puissance'; paceValue = `${c.extraData.watts} W`; }
    else if (m === 'rpe' && c.extraData.rpe) { paceLabel = 'Ressenti'; paceValue = `${c.extraData.rpe}/10 RPE`; }
    else if (r.speedKmh) paceValue = `${r.speedKmh.toFixed(1)} km/h`;
  }
  return `
    <div class="cardio-score">
      <div class="cardio-score-head">
        <div class="cardio-score-title">Score composite pondéré</div>
        <div class="cardio-score-phase">${phaseShort(phase)}</div>
      </div>
      <div class="cardio-score-main">
        <div class="cardio-score-num ${r.cls}">${r.score}</div>
        <div class="cardio-score-unit">%</div>
        <div class="cardio-score-verdict ${r.cls}">${r.title}</div>
      </div>
      <div class="cardio-score-breakdown">
        <div class="cardio-sub">
          <div class="cardio-sub-label">Distance<span class="cardio-sub-weight">${Math.round(r.weights.km*100)}%</span></div>
          <div class="cardio-sub-val">${r.sVol}<span>%</span></div>
        </div>
        <div class="cardio-sub">
          <div class="cardio-sub-label">Vertical<span class="cardio-sub-weight">${Math.round(r.weights.vertical*100)}%</span></div>
          <div class="cardio-sub-val">${r.sVert}<span>%</span></div>
        </div>
        <div class="cardio-sub">
          <div class="cardio-sub-label">Allure<span class="cardio-sub-weight">${Math.round(r.weights.pace*100)}%</span></div>
          <div class="cardio-sub-val">${r.sPace}<span>%</span></div>
        </div>
      </div>
    </div>
    <div class="cardio-net">
      <div>
        <div class="cardio-net-label">${paceLabel} réalisée</div>
        <div class="cardio-net-hint">Info · déjà intégrée au score allure</div>
      </div>
      <div class="cardio-net-val">${paceValue}</div>
    </div>`;
}

function editCardioStats() {
  state.sessionId = state.week.cardio.type;
  state.sessionKind = 'cardio';
  state.view = 'cardio-stats';
  state.week.cardio.done = false;
  saveState(); render();
  setTimeout(() => {

function getFavoriteDisciplineIds() {
  const p = state.settings && state.settings.profile;
  return (p && p.favoriteDisciplineIds) || [];
}

function isDisciplineFavorite(id) {
  return getFavoriteDisciplineIds().includes(id);
}

function toggleDisciplineFavorite(id, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const p = state.settings && state.settings.profile;
  if (!p) return;
  const favs = p.favoriteDisciplineIds || [];
  const idx = favs.indexOf(id);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push(id);
  p.favoriteDisciplineIds = favs;
  saveState();
  // Sync profile to Supabase (fire-and-forget) so favorites survive refresh
  if (sb && state.user) {
    sb.auth.updateUser({ data: {
      startDate: state.settings.startDate,
      manualPhase: state.settings.manualPhase,
      profile: p
    }}).catch(e => console.warn('Failed to sync favorites:', e.message));
  }
  render();
}

function renderDiscipline() {
  // Group items by category
  const cats = {};
  LEXIQUE.forEach(l => {
    if (!cats[l.cat]) cats[l.cat] = [];
    cats[l.cat].push(l);
  });
  const catOrder = ['Respiration', 'Apnée', 'Froid', 'Mental'];

  const favIds = getFavoriteDisciplineIds();
  const hasFavorites = favIds.length > 0;

  // Séparer favoris et non-favoris
  const favorites = [];
  const others = {};
  catOrder.forEach(cat => {
    if (!cats[cat]) return;
    others[cat] = [];
    cats[cat].forEach(l => {
      if (favIds.includes(l.id)) favorites.push(l);
      else others[cat].push(l);
    });
  });

  const cardHTML = (l, isFav, isMuted) => `
    <div class="discipline-card ${isMuted ? 'muted' : ''}">
      <button class="discipline-star ${isFav ? 'active' : ''}" onclick="toggleDisciplineFavorite('${l.id}', event)" aria-label="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
        ${isFav ? '★' : '☆'}

      <button class="discipline-card-btn" onclick="goto('discipline-detail', {lexiqueId: '${l.id}'})">
        <div class="discipline-card-icon">${l.icon || '·'}</div>
        <div class="discipline-card-title">${l.title}</div>
        <div class="discipline-card-cat">${l.cat}</div>
      </button>
    </div>`;

  // Section favoris
  const favSection = hasFavorites ? `
    <div class="discipline-section">
      <div class="discipline-section-header">
        <span class="discipline-section-badge">★</span>
        <span class="discipline-section-title">Mes favoris</span>
        <span class="discipline-section-count">${favorites.length}</span>
      </div>
      <div class="discipline-grid">${favorites.map(l => cardHTML(l, true, false)).join('')}</div>
    </div>` : `
    <div class="discipline-hint">
      <span class="discipline-hint-icon">★</span>
      <span>Marque tes pratiques favorites en cliquant sur l'étoile pour les remonter ici.</span>
    </div>`;

  // Section autres catégories
  const otherSections = catOrder
    .filter(cat => others[cat] && others[cat].length)
    .map(cat => {
      const cardsHTML = others[cat].map(l => cardHTML(l, false, true)).join('');
      return `
        <div class="discipline-section discipline-section-muted">
          <div class="discipline-section-header">
            <span class="discipline-section-title">${cat}</span>
            <span class="discipline-section-count">${others[cat].length}</span>
          </div>
          <div class="discipline-grid">${cardsHTML}</div>
        </div>`;
    }).join('');

  const othersHeader = hasFavorites ? `
    <div class="discipline-others-header">Autres pratiques disponibles</div>` : '';

  return `
    <div class="view has-tabbar">
      ${renderTopBar()}
      <h1 class="stats-page-title" style="margin-top: 20px;">Discipline.</h1>
      <p class="discipline-intro">Souffle · apnée · froid · mental. Les pratiques qui te préparent à ce que le physique seul ne suffit pas à faire.</p>
      ${favSection}

async function initAuth() {
  if (!sb) { state.authChecked = true; return; }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      state.user = session.user;
      state.syncStatus = 'syncing';
      // Sync settings from user_metadata if present
      if (session.user.user_metadata) {
        if (session.user.user_metadata.startDate) state.settings.startDate = session.user.user_metadata.startDate;
        if (session.user.user_metadata.manualPhase) state.settings.manualPhase = session.user.user_metadata.manualPhase;
        if (session.user.user_metadata.profile) state.settings.profile = session.user.user_metadata.profile;
      }
    }
  } catch (e) { console.warn('Auth check failed:', e.message); }
  state.authChecked = true;

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Arriving via reset password email link
      state.view = 'reset-password-form';
      state.loginMessage = null;
      render();
      return;
    }
    if (event === 'SIGNED_IN' && session) {
      state.user = session.user;
      state.loginMessage = null;
      // Sync settings from user_metadata
      if (session.user.user_metadata) {
        if (session.user.user_metadata.startDate) state.settings.startDate = session.user.user_metadata.startDate;
        if (session.user.user_metadata.manualPhase) state.settings.manualPhase = session.user.user_metadata.manualPhase;
        if (session.user.user_metadata.profile) state.settings.profile = session.user.user_metadata.profile;
      }
      // Don't auto-navigate if user is in the middle of a password reset flow
      if (state.view === 'reset-password-form' || state.view === 'reset-password-done') return;
      await syncPull();
      state.view = state.settings.profile ? 'training' : 'onboarding';
      render();
    }
    if (event === 'SIGNED_OUT') {
      state.user = null;
      state.syncStatus = 'offline';
      state.view = 'login';
      render();
    }
  });
}

async function signInPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Connexion…' };
  render();
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    // onAuthStateChange handles navigation to home
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function signUpPassword() {
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = passwordEl && passwordEl.value || '';
  if (!email || !password) {
    state.loginMessage = { type: 'error', text: 'Email et mot de passe requis' };
    render();
    return;
  }
  if (password.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Création du compte…' };
  render();
  try {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      // Instant sign-in (email confirmation disabled in Supabase)
      // onAuthStateChange handles it
    } else {
      state.loginMessage = { type: 'success', text: 'Compte créé. Confirme ton email dans ta boîte, puis reviens te connecter. Ou désactive "Confirm email" dans Supabase Auth.' };
      render();
    }
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function toggleAuthMode() {
  state.authMode = state.authMode === 'signin' ? 'signup' : 'signin';
  state.loginMessage = null;

}

async function sendResetLink() {
  const emailEl = document.getElementById('reset-email');
  const email = (emailEl && emailEl.value || '').trim();
  if (!email) {
    state.loginMessage = { type: 'error', text: 'Entre ton email' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Envoi du lien…' };
  render();
  try {
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) throw error;
    state.loginMessage = {
      type: 'success',
      text: 'Lien envoyé à ' + email + '. Clique-le depuis ta boîte mail — ça ouvrira ton navigateur pour définir un nouveau mot de passe, puis reviens dans cette app.'
    };
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

async function updatePasswordAndFinish() {
  const pwdEl = document.getElementById('new-password');
  const newPassword = pwdEl && pwdEl.value || '';
  if (!newPassword || newPassword.length < 8) {
    state.loginMessage = { type: 'error', text: 'Mot de passe : 8 caractères minimum' };
    render();
    return;
  }
  state.loginMessage = { type: 'info', text: 'Mise à jour…' };
  render();
  try {
    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) throw error;
    // Clean URL hash so refreshing doesn't retrigger recovery flow
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    state.loginMessage = null;
    state.view = 'reset-password-done';
    render();
  } catch (e) {
    state.loginMessage = { type: 'error', text: 'Erreur : ' + e.message };
    render();
  }
}

function openResetPassword() {
  state.view = 'reset-request';
  state.loginMessage = null;

function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    week: state.week,
    weekHistory: state.weekHistory,
    cardioHistory: state.cardioHistory
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shaolin-one-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport() { document.getElementById('import-file').click(); }

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.week) state.week = attachLegacyAccessors(migrateOldWeek(data.week));
      if (data.weekHistory) state.weekHistory = data.weekHistory.map(w => migrateOldWeek(w));
      if (data.cardioHistory) state.cardioHistory = data.cardioHistory;
      saveState();
      if (sb && state.user) {
        // Backfill all weeks to remote
        for (const w of [...state.weekHistory, state.week]) {
          await sb.from('week_state').upsert({
            user_id: state.user.id,
            week_id: w.id,
            data: w,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,week_id' });
        }
        for (const c of state.cardioHistory) {
          await sb.from('cardio_history').insert({
            user_id: state.user.id,
            date: c.date, week_id: c.weekId, type: c.type,
            duration: c.duration, km: c.km, deniv: c.deniv, phase: c.phase
          }).select().maybeSingle().catch(()=>{});
        }
      }
      alert('Import terminé.');
      render();
    } catch (err) { alert('Import raté : ' + err.message); }
  };
  reader.readAsText(file);
}

// ============================================================
//  DISPATCH
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let html;
  try {
    switch (state.view) {
      case 'login': html = renderLogin(); break;
      case 'reset-request': html = renderResetRequest(); break;
      case 'reset-password-form': html = renderResetPasswordForm(); break;
      case 'reset-password-done': html = renderResetPasswordDone(); break;
      case 'account': html = renderAccount(); break;
      case 'onboarding': html = renderOnboarding(); break;
      case 'home':
      case 'training': html = renderTraining(); break;
      case 'sport-libre': html = renderSportLibre(); break;
      case 'seances': html = renderSeances(); break;
      case 'seance-detail': html = renderSeanceDetail(); break;
      case 'exercices': html = renderExercices(); break;
      case 'custom-bonus-builder': html = renderCustomBonusBuilder(); break;
      case 'custom-bonus-detail': html = renderCustomBonusDetail(); break;
      case 'stats':
      case 'cockpit':
      case 'programme': html = renderProgramme(); break;
      case 'reglages': html = renderReglages(); break;
      case 'univers': html = renderUnivers(); break;
      case 'cardio-choice': html = renderCardioChoice(); break;
      case 'generic-renfo-choice': html = renderGenericRenfoChoice(); break;
      case 'cardio-stats': html = renderCardioStats(); break;
      case 'cardio-recap': html = renderCardioRecap(); break;
      case 'preview': html = renderPreview(); break;
      case 'running': html = renderRunning(); break;
      case 'running-gps': html = renderRunningGPS(); break;
      case 'session-report': html = renderSessionReport(); break;
      case 'complete': html = renderComplete(); break;
      case 'bonus-list': html = renderBonusList(); break;
      case 'lexique-list':
      case 'discipline': html = renderDiscipline(); break;
      case 'lexique-detail':
      case 'discipline-detail': html = renderDisciplineDetail(); break;
      default: html = renderTraining();
    }
  } catch (e) {
    console.error('Render error:', e);
    html = `
      <div style="padding: 30px 20px; font-family: monospace; color: #B23A1F;">
        <h2 style="font-family: sans-serif; margin-bottom: 12px;">Erreur d'affichage</h2>
        <div style="background: #FFF7E0; border: 2px solid #C9A44E; padding: 14px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; line-height: 1.4; margin-bottom: 12px;">
<strong>Vue :</strong> ${state.view || '?'}
<strong>Message :</strong> ${(e && e.message) ? e.message : String(e)}
<strong>Stack :</strong>
${e && e.stack ? e.stack.split('\n').slice(0, 6).join('\n') : ''}
        </div>
        <button onclick="state.view='login'; state.user=null; localStorage.removeItem('shaolin-one-state-v3'); location.reload();" style="padding: 12px 20px; background: #B23A1F; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;">Reset complet (efface les données locales)</button>
        <button onclick="state.view='training'; render();" style="padding: 12px 20px; background: #C9A44E; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-left: 8px;">Retour Training</button>
      </div>`;
  }
  app.innerHTML = html;
  // Boot fallback cleanup — supprime le fallback de chargement s'il existe encore
  var bf = document.getElementById('boot-fallback');
  if (bf && bf.parentNode) bf.parentNode.removeChild(bf);
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  try {
    loadState();
  } catch (e) {
    console.error('loadState error:', e);
    document.getElementById('app').innerHTML = `<div style="padding: 30px; font-family: monospace; color: #B23A1F;"><h2>Erreur au chargement</h2><pre>${e.message}\n\n${e.stack}</pre><button onclick="localStorage.removeItem('shaolin-one-state-v3'); location.reload();" style="padding: 12px 20px; background: #B23A1F; color: white; border: none; border-radius: 8px;">Reset et recharger</button></div>`;
    return;
  }
  archiveIfNewWeek();

  // Check if we're arriving via password recovery link BEFORE anything else
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const isRecoveryLink = hash.includes('type=recovery') || search.includes('type=recovery');

  if (SUPABASE_ENABLED && sb) {
    await initAuth();

    if (isRecoveryLink) {
      // Force reset password form regardless of session state
      state.view = 'reset-password-form';
      render();
    } else if (state.user) {
      // Show training or onboarding depending on profile presence
      state.view = state.settings.profile ? 'training' : 'onboarding';
      render();
      await syncPull();
      // After syncPull, profile might have been loaded from remote — re-check
      if (state.view === 'onboarding' && state.settings.profile) state.view = 'training';
      render();
    } else {
      // Not signed in — show login
      state.view = 'login';
      render();
    }
  } else {
    // Supabase not configured, local-only mode
    state.view = state.settings.profile ? 'training' : 'onboarding';
    render();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // v70 · Programme la disparition du splash (min 2s, puis fade-out)
  scheduleSplashHide();
}

// v70 · Splash management
const V70_SPLASH_MIN_MS = 2000;
const _v70SplashStart = Date.now();
let _v70SplashHidden = false;
// v70 · Swap theme-color pour que la status bar iOS se fonde avec le ciel de la vidéo splash
const _v70ThemeColorMeta = document.querySelector('meta[name="theme-color"]');
const _v70DefaultThemeColor = _v70ThemeColorMeta ? _v70ThemeColorMeta.getAttribute('content') : '#FFFFFF';
if (_v70ThemeColorMeta) _v70ThemeColorMeta.setAttribute('content', '#5182A9');
function hideSplashNow() {
  if (_v70SplashHidden) return;
  _v70SplashHidden = true;
  const el = document.getElementById('v70-splash');
  if (!el) return;
  el.classList.add('fade-out');
  // Restaure le theme-color originel de l'app (blanc)
  if (_v70ThemeColorMeta) _v70ThemeColorMeta.setAttribute('content', _v70DefaultThemeColor);
  setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 600);
}
function scheduleSplashHide() {
  const elapsed = Date.now() - _v70SplashStart;
  const wait = Math.max(0, V70_SPLASH_MIN_MS - elapsed);
  setTimeout(hideSplashNow, wait);
}
// v70 · Force play la vidéo au premier tap si autoplay iOS a échoué
document.addEventListener('touchstart', () => {
  const v = document.getElementById('v70-splash-video');
  if (v && v.paused) v.play().catch(() => {});
}, { once: true, passive: true });
document.addEventListener('DOMContentLoaded', init);
</script>
